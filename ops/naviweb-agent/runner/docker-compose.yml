# 사용: runner.env 를 채운 뒤  docker compose up -d --build   (build context 는 ops/naviweb-agent)
services:
  runner:
    build: { context: .., dockerfile: runner/Dockerfile }
    env_file: runner.env
    restart: unless-stopped
    ipc: host
    cap_drop: [ALL]
    security_opt: ["seccomp=unconfined"]   # Chromium 샌드박스용(공식 playwright 이미지 권장 설정)
    mem_limit: 6g
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
volumes: { caddy_data: {} }
