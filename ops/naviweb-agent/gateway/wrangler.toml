name = "naviweb-agent-gateway"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
DEFAULT_PROVIDER = "claude"        # Gemma 4 31B 가 준비되면 "gemma" 로 바꾼다
CLAUDE_MODEL = "claude-haiku-5-5"
GEMMA_MODEL = "google/gemma-4-31B-it"
# 앞: Chrome 웹 스토어 확장(스토어 ID), 뒤: 개발용으로 폴더에서 불러온 확장.
ALLOWED_ORIGINS = "chrome-extension://bhmnnbmebjppofdboeinccngpeheongi,chrome-extension://akbbefbhbkkhnfonbmidpoclienkahjj"
# 나비웹 로그인 사용자 확인 주소(방문자 토큰으로 200 이 오면 로그인한 사용자). 이 주소가 맞는지 확인 필요 — 틀리면 방문자는 모두 거부된다(안전한 쪽).
AUTH_VERIFY_URL = "https://hondi-proxy.tensor-city.workers.dev/kmail/settings"
USER_DAILY_STEPS = "400"           # 사용자 1명이 하루에 쓸 수 있는 모델 호출 수

# 비밀값(대시보드 또는 wrangler secret put): AGENT_TOKEN, ANTHROPIC_API_KEY, GEMMA_BASE_URL, GEMMA_API_KEY
