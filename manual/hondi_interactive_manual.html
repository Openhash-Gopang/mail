아래에 “폰 카메라로 촬영하세요”라고 적혀 있습니다. (PC가 없으면 폰 Chrome 주소창에 <strong>naviweb.kr/install</strong>을 직접 입력하고 3단계로 가세요.)</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/apk-1-pc-qr.webp\" alt=\"설치 안내 QR 찾기\" loading=\"lazy\"><figcaption>PC 화면의 설치 QR</figcaption></figure>\n<h4>2단계. 폰 카메라로 QR 찍기</h4>\n<p>폰의 <strong>카메라</strong> 앱을 열어 QR을 비춥니다. 화면 아래에 <strong>다음으로 이동 · naviweb.kr/install…</strong> 띠가 뜨면 그 띠를 누르세요. 주소가 <strong>naviweb.kr</strong>로 시작하는지 꼭 확인합니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-2-camera-scan.webp\" alt=\"폰 카메라로 QR 찍기\" loading=\"lazy\"><figcaption>카메라가 QR을 읽고 주소를 보여 줍니다</figcaption></figure>\n<h4>3단계. 설치 안내 페이지에서 “앱 내려받기”</h4>\n<p><strong>나비웹 안드로이드 앱 설치</strong> 페이지가 열립니다. 노란색 <strong>앱 내려받기</strong>(naviweb.apk) 단추를 누르세요. 단추 아래에 같은 순서의 안내 5줄이 적혀 있으니 함께 보셔도 됩니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-3-install-page.webp\" alt=\"설치 안내 페이지에서 “앱 내려받기”\" loading=\"lazy\"><figcaption>설치 안내 페이지</figcaption></figure>\n<h4>4단계. “유해한 파일일 수도 있음” → 무시하고 다운로드</h4>\n<p>Chrome은 앱 파일(.apk)을 받을 때마다 이렇게 경고합니다. 파일 이름이 <strong>naviweb.apk</strong>, 출처가 <strong>naviweb.kr</strong>, 크기가 <strong>약 2.20MB</strong>인지 확인한 뒤 <strong>무시하고 다운로드</strong>를 누릅니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-4-download-warning.webp\" alt=\"“유해한 파일일 수도 있음”\" loading=\"lazy\"><figcaption>파일 이름·출처·크기를 확인하세요</figcaption></figure>\n<h4>5단계. 다운로드 완료 → 열기</h4>\n<p>위쪽에 <strong>다운로드 1개 완료</strong> 알림이 뜨면 오른쪽의 <strong>열기</strong>를 누릅니다. 알림이 사라졌다면 Chrome 오른쪽 위 ⋮ 메뉴의 <strong>다운로드</strong>에서 찾을 수 있습니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-5-download-done.webp\" alt=\"다운로드 완료\" loading=\"lazy\"><figcaption>다운로드 1개 완료</figcaption></figure>\n<h4>6단계. 받은 파일 누르기</h4>\n<p><strong>다운로드</strong> 목록의 맨 위에 <strong>naviweb.apk</strong>가 있습니다. 이 파일을 누르면 설치가 시작됩니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-6-downloads-list.webp\" alt=\"받은 파일 누르기\" loading=\"lazy\"><figcaption>다운로드 목록의 naviweb.apk</figcaption></figure>\n<h4>7단계. “이 출처의 앱을 설치할 수 없음” → 설정</h4>\n<p>처음 한 번은 “보안상의 이유로 현재 이 출처의 알 수 없는 앱을 휴대전화에 설치할 수 없습니다”라는 창이 뜹니다. <strong>설정</strong>을 누르세요. (<strong>취소</strong>를 누르면 설치가 진행되지 않습니다.)</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-7-chrome-blocked.webp\" alt=\"“이 출처의 앱을 설치할 수 없음”\" loading=\"lazy\"><figcaption>Chrome에 설치 권한이 없을 때 나오는 창</figcaption></figure>\n<h4>8단계. 이 출처에서 온 앱 설치 허용 켜기</h4>\n<p><strong>알 수 없는 앱 설치</strong> 화면에서 Chrome 아래의 <strong>“이 소스에서 가져온 앱 설치 허용”</strong> 스위치를 켭니다. 켜진 뒤 왼쪽 위 <strong>←</strong>(또는 폰의 뒤로 가기)로 6단계 화면으로 돌아가 naviweb.apk를 다시 누릅니다. <strong>설치를 마친 뒤에는 이 스위치를 다시 꺼 두시길 권합니다.</strong> (설정 → 앱 → Chrome → 알 수 없는 앱 설치)</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-8-allow-source.webp\" alt=\"이 출처에서 온 앱 설치 허용 켜기\" loading=\"lazy\"><figcaption>스위치를 켠 모습</figcaption></figure>\n<h4>9단계. “이 앱을 설치하시겠습니까?” → 설치</h4>\n<p>앱 이름이 <strong>나비웹</strong>(노랑 나비 아이콘)인지 보고 <strong>설치</strong>를 누릅니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-9-install-confirm.webp\" alt=\"“이 앱을 설치하시겠습니까?”\" loading=\"lazy\"><figcaption>설치 확인 창</figcaption></figure>\n<h4>10단계. Google Play 프로텍트 검사 중</h4>\n<p>Google Play 프로텍트가 앱을 <strong>검사</strong>합니다. 잠시 기다리세요. 여기서 <strong>“취소 및 설치 안함”</strong>을 누르지 않도록 조심하세요. 이 단추를 누르면 설치가 멈춥니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-10-protect-scanning.webp\" alt=\"Google Play 프로텍트 검사 중\" loading=\"lazy\"><figcaption>검사 중 화면</figcaption></figure>\n<h4>11단계. “유해한 앱 차단됨” — 가장 헷갈리는 곳</h4>\n<p>이 화면이 나와도 놀라지 마세요. 나비웹은 아직 Google이 평판을 기록하지 못한 <strong>새 앱(테스트 버전)</strong>이어서 나오는 경고입니다. 여기서 파란 <strong>확인</strong>을 누르면 설치가 <strong>끝나 버립니다</strong>. 대신 <strong>“세부정보 더보기”</strong>(글자 옆 ⌄)를 누르세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-11-protect-blocked.webp\" alt=\"“유해한 앱 차단됨” — 가장 헷갈리는 곳\" loading=\"lazy\"><figcaption>확인 단추가 아니라 “세부정보 더보기”를 누릅니다</figcaption></figure>\n<h4>12단계. “무시하고 설치하기”</h4>\n<p>세부정보가 펼쳐지면 <strong>확인</strong> 위에 <strong>무시하고 설치하기</strong>라는 작은 글자가 나타납니다. 이 글자를 누르세요. 파란 확인 단추가 아닙니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-12-protect-ignore.webp\" alt=\"“무시하고 설치하기”\" loading=\"lazy\"><figcaption>작은 글자 “무시하고 설치하기”를 누릅니다</figcaption></figure>\n<h4>13단계. 설치 완료 → 열기</h4>\n<p><strong>나비웹 앱이 설치되었습니다.</strong>라는 창에서 <strong>열기</strong>를 누르면 바로 실행됩니다. (<strong>완료</strong>는 창만 닫습니다.)</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-13-installed.webp\" alt=\"설치 완료\" loading=\"lazy\"><figcaption>설치 완료</figcaption></figure>\n<h4>14단계. 홈 화면의 나비웹 아이콘</h4>\n<p>폰 홈 화면(또는 앱 목록)에 노랑 나비 <strong>나비웹</strong> 아이콘이 생겼습니다. 앞으로는 이 아이콘으로 나비웹을 엽니다. 로그인이나 메일 확인 같은 절차 없이 바로 쓸 수 있습니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-14-home-icon.webp\" alt=\"홈 화면의 나비웹 아이콘\" loading=\"lazy\"><figcaption>앱 아이콘</figcaption></figure>\n<h4>15단계. 첫 화면과 알림 허용</h4>\n<p>앱을 열면 “○○님, 안녕하세요. 무엇을 도와드릴까요?”라는 인사와 함께 <strong>AI 비서 대화창</strong>이 나타납니다. 알림 허용 창이 뜨면 <strong>허용</strong>을 눌러 주세요. 그래야 새 메일·대화 알림이 옵니다. 이제 <a class=\"ch-link\" href=\"#\" data-goto=\"ch2\">「사람 찾기·호출하기」장</a>으로 넘어가면 됩니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/apk-15-first-chat.webp\" alt=\"첫 화면과 알림 허용\" loading=\"lazy\"><figcaption>설치 후 첫 화면</figcaption></figure>\n<h3>자주 겪는 문제</h3>\n<ul><li><strong>“확인”을 눌러 버렸어요.</strong> 설치가 중단된 것입니다. 6단계에서 naviweb.apk를 다시 눌러 9~12단계를 처음부터 하세요.</li><li><strong>“앱이 설치되지 않았습니다”라고 나와요.</strong> 예전 나비웹 앱이 남아 있어서입니다. 설정 → 앱에서 나비웹을 삭제한 뒤 다시 설치하세요.</li><li><strong>7단계 창이 안 나오고 “설치 허용”을 이미 켰어요.</strong> 정상입니다. 8단계는 건너뛰고 9단계로 가세요.</li><li><strong>회사·학교에서 받은 폰이에요.</strong> 관리자가 앱 설치를 막아 둔 경우가 있습니다. 이때는 PC에서 나비웹을 쓰거나, 폰 Chrome에서 나비웹을 열어 쓰세요.</li></ul>\n<div class=\"ch-note\">이 장은 테스트 버전 기준입니다. 앞으로 앱이 Google Play 등 스토어로 옮겨 가면 경고 화면(10~12단계)은 사라지고 스토어에서 “설치” 한 번으로 끝납니다.</div>","quiz":[{"q":"나비웹 앱 파일은 어디에서 받아야 하나요?","options":["naviweb.kr 공식 주소","문자로 받은 아무 링크","다른 사람이 보낸 파일"],"answer":0,"explain":"정답은 “naviweb.kr 공식 주소”입니다. 다른 곳에서 받은 앱 파일은 설치하지 마세요."},{"q":"“유해한 앱 차단됨” 화면에서 설치를 계속하려면?","options":["파란 확인 단추를 누른다","세부정보 더보기 → 무시하고 설치하기를 누른다","취소 및 설치 안함을 누른다"],"answer":1,"explain":"정답은 “세부정보 더보기 → 무시하고 설치하기”입니다. 파란 확인을 누르면 설치가 끝나 버립니다."},{"q":"예전에 설치한 나비웹 앱이 있다면?","options":["그냥 덮어쓴다","먼저 삭제하고 새로 설치한다","폰을 초기화한다"],"answer":1,"explain":"정답은 “먼저 삭제하고 새로 설치한다”입니다. 서명이 달라 덮어쓰기가 되지 않으며, 대화 기록은 삭제되지 않습니다."}],"updated":"2026-11-18"},{"tier":"beginner","title":"사람 찾기·호출하기","id":"ch2","body":"\n<div class=\"ch-hero\"><svg viewBox=\"0 0 400 180\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\">\n  <circle cx=\"200\" cy=\"90\" r=\"78\" fill=\"#eaf3fc\"/>\n  <g transform=\"translate(120,60)\">\n    <rect x=\"0\" y=\"0\" width=\"120\" height=\"30\" rx=\"15\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n    <circle cx=\"20\" cy=\"15\" r=\"6\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2.2\"/>\n    <line x1=\"24.5\" y1=\"19.5\" x2=\"29\" y2=\"24\" stroke=\"#0c6cc3\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n    <rect x=\"40\" y=\"10\" width=\"60\" height=\"10\" rx=\"3\" fill=\"#dbeafe\"/>\n  </g>\n  <g transform=\"translate(70,110)\">\n    <circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2.2\"/>\n    <circle cx=\"14\" cy=\"10\" r=\"4.5\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"1.8\"/>\n    <path d=\"M6 21c0-4 3.5-6 8-6s8 2 8 6\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n  </g>\n  <g transform=\"translate(280,110)\">\n    <circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#fff\" stroke=\"#188038\" stroke-width=\"2.2\"/>\n    <circle cx=\"14\" cy=\"10\" r=\"4.5\" fill=\"none\" stroke=\"#188038\" stroke-width=\"1.8\"/>\n    <path d=\"M6 21c0-4 3.5-6 8-6s8 2 8 6\" fill=\"none\" stroke=\"#188038\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n  </g>\n  <path d=\"M98 120 Q200 90 266 120\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/>\n</svg></div>\n<h2>사람 찾기·호출하기</h2>\n<p>나비는 여러분의 AI 비서끼리만 대화하는 게 아니라, <strong>다른 사람과 직접 연결</strong>할 수도 있습니다. 닉네임이나 @handle로 검색해서 대화를 시작해 보세요.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">검색창은 어디에 있나요?</div>\n  화면 상단(또는 메뉴)의 검색 아이콘을 누르면 검색창이 뜹니다. 닉네임 일부만 입력해도 비슷한 이름이 함께 검색됩니다.</div>\n</div>\n\n<h3>검색부터 연결까지 4단계</h3>\n<div class=\"step-list\">\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">① 검색어 입력</div><div class=\"step-desc\">닉네임 또는 @handle을 입력합니다. @가 붙으면 정확히 그 handle 하나만, 없으면 비슷한 닉네임까지 함께 찾아줍니다.</div></div>\n    </div>\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">② 상세 필터(선택)</div><div class=\"step-desc\">결과가 너무 많으면 '상세 필터'를 펼쳐 국가코드(예: KR)나 지역(예: 서울)으로 좁힐 수 있습니다.</div></div>\n    </div>\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">③ 결과 확인</div><div class=\"step-desc\">닉네임과 handle이 함께 나열됩니다. 본인은 검색 결과에서 자동으로 제외됩니다.</div></div>\n    </div>\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 17l-3-3a2 2 0 0 1 0-3l4-4a2 2 0 0 1 3 0l1 1\"/><path d=\"M13 21l7-7\"/><path d=\"M2 12l5 5\"/><path d=\"M9 20l-3-3\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">④ 연결 요청</div><div class=\"step-desc\">원하는 사람을 누르면 '연결 요청을 보내시겠습니까?' 확인창이 뜹니다. 동의하면 바로 대화가 시작됩니다.</div></div>\n    </div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"10\" r=\"3\"/><path d=\"M12 2a8 8 0 0 0-8 8c0 5.25 8 13 8 13s8-7.75 8-13a8 8 0 0 0-8-8z\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">필터는 왜 필요한가요?</div>\n  흔한 닉네임은 동명이인이 많을 수 있습니다. 국가·지역 필터로 좁히면 원하는 사람을 더 빠르게 찾을 수 있습니다.</div>\n</div>\n\n<div class=\"md-container tonal-error\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">연결 후에는?</div>\n  연결이 성사되면 메인 화면에서 그 사람과의 대화창이 열립니다. <a class=\"ch-link\" href=\"#\" data-goto=\"ch4\">「메시지 주고받기」장</a>에서 이어서 다룹니다.</div>\n</div>\n","quiz":[{"q":"검색어 앞에 @를 붙이면 어떻게 검색되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["더 많은 결과가 나온다","정확히 그 handle 하나만 검색된다","검색이 안 된다","국가별로 정렬된다"],"answer":1,"explain":"@가 붙으면 handle 정확 일치 검색이 되고, 없으면 닉네임·handle 부분 일치로 더 넓게 검색됩니다."},{"q":"검색 결과가 너무 많을 때 좁히는 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3\"/></svg>","options":["다시 로그인한다","상세 필터에서 국가·지역을 지정한다","앱을 재설치한다","방법이 없다"],"answer":1,"explain":"상세 필터를 펼쳐 국가코드나 지역을 입력하면 검색 범위를 좁힐 수 있습니다."},{"q":"검색 결과에 내 계정이 나오지 않는 이유는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>","options":["오류다","본인은 자동으로 결과에서 제외되기 때문","검색어를 잘못 입력해서","권한이 없어서"],"answer":1,"explain":"검색 로직이 내 handle과 일치하는 결과를 자동으로 걸러내므로, 본인은 목록에 뜨지 않습니다."}],"placeholder":false},{"tier":"beginner","title":"AI 비서 채팅 vs 다른 AI 호출","id":"ch3","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\">\n<rect x=\"20\" y=\"20\" width=\"160\" height=\"120\" rx=\"14\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"100\" cy=\"60\" r=\"18\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<rect x=\"40\" y=\"90\" width=\"120\" height=\"10\" rx=\"5\" fill=\"#bfe0fb\"/>\n<rect x=\"40\" y=\"106\" width=\"80\" height=\"10\" rx=\"5\" fill=\"#bfe0fb\"/>\n<text x=\"100\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0c6cc3\" font-weight=\"700\">내 AI 비서</text>\n<rect x=\"220\" y=\"20\" width=\"160\" height=\"120\" rx=\"14\" fill=\"#fef7e0\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<circle cx=\"300\" cy=\"60\" r=\"18\" fill=\"#fff\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<rect x=\"240\" y=\"90\" width=\"120\" height=\"10\" rx=\"5\" fill=\"#ffe9b3\"/>\n<rect x=\"240\" y=\"106\" width=\"80\" height=\"10\" rx=\"5\" fill=\"#ffe9b3\"/>\n<text x=\"300\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" fill=\"#b06000\" font-weight=\"700\">다른 AI(전문가·K-서비스)</text>\n</svg></div>\n<h2>AI 비서 채팅 vs 다른 AI 호출</h2>\n<p>나비 화면에는 항상 <strong>\"내 AI 비서\"</strong> 채팅창이 있습니다. 그런데 전문가 페르소나나 K-서비스를 부르면 새로운 화면(탭)이 열립니다. 이 둘은 왜 다른 화면일까요?</p>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">내 AI 비서란?</div>나만 알고 나에게 맞춰진 개인 비서입니다. 내가 쓸수록 내 습관과 맥락을 기억해 점점 똑똑해집니다(<a class=\"ch-link\" href=\"#\" data-goto=\"ch11\">「쓰면 쓸수록 똑똑해지는 나만의 AI 비서」장</a>에서 자세히 다룹니다).</div></div>\n<h3>두 화면이 하는 일이 다릅니다</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">내 AI 비서 채팅</div><div class=\"step-desc\">평소 대화, 일정, 메모, 다른 사람 연결 등 일상적인 요청을 처리합니다. 필요하면 이 비서가 알아서 전문가나 K-서비스를 대신 호출해주기도 합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">다른 AI 호출(전문가 페르소나)</div><div class=\"step-desc\">변호사, 세무사 같은 특정 분야 전문 AI와 1:1로 대화합니다. 내 AI 비서와는 별개의 대화 기록을 갖습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">다른 AI 호출(K-서비스)</div><div class=\"step-desc\">K-Law, K-Health처럼 정부·공공 성격의 AI 서비스입니다. 역시 별도 화면에서 진행됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">헷갈리기 쉬운 점</div>\"내 AI 비서에게 물어보면 되지 않나요?\" — 맞습니다. 실제로 내 비서에게 그냥 물어보면, 필요할 때 비서가 알아서 전문가·K-서비스를 연결해주기도 합니다. 다만 특정 전문가와 계속 대화를 이어가고 싶다면 직접 그 화면을 열어두는 게 더 편합니다.</div></div>\n\n<h3>직접 해 보기</h3>\n<p>입력창에 “김 교수님께 감사 편지 써 줘”(메일), “소유권이전등기 신청서 작성해 줘”(서류), “허리가 아파요”(전문가 상담), “오늘 할 일이 뭐지?”(비서가 직접 답)를 차례로 말해 보세요. 연결될 때 “○○로 연결했습니다”가 나옵니다.</p>\n<p><b>누구에게, 무엇을, 언제까지, 어떤 말투로</b>를 넣으면 더 정확합니다. 한 번에 다 말하지 않아도 부족한 부분은 비서가 되묻고, 마음이 바뀌면 그냥 말합니다.</p>\n<p>웹페이지 주소를 붙여 넣으면 내용을 읽어 반영합니다. 단 <b>로그인이 필요한 페이지는 읽을 수 없고</b> 하루에 열어 볼 수 있는 횟수에 한도가 있습니다. 받을 사람 주소는 <b>지어내지 않고</b> 확인된 것만 보여 줍니다.</p>\n<p>엉뚱한 곳으로 연결되면 칩의 <b>×</b>로 기본 비서로 돌아와 한 문장으로 다시 말합니다.</p>\n<p>직접 해 보기: 같은 질문(예: “임대차 계약을 끝낼 때 보증금은 어떻게 돌려받나요?”)을 나만의 AI 비서와 <b>전문가 AI ▾ → 변호사</b>에게 차례로 해 보고 답의 깊이와 안내 방식이 어떻게 다른지 비교한 뒤, 칩의 ×로 비서로 돌아오세요.</p>","quiz":[{"q":"내 AI 비서와 전문가 페르소나 채팅의 가장 큰 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>","options":["글자 크기","각각 별도의 화면(탭)과 대화 기록을 가진다","색깔만 다르다","차이가 없다"],"answer":1,"explain":"내 AI 비서와 전문가 페르소나·K-서비스는 서로 다른 화면에서, 서로 다른 대화 기록으로 진행됩니다."},{"q":"내가 원하는 전문가를 매번 직접 찾지 않아도 되는 이유는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg>","options":["전문가가 먼저 연락해서","내 AI 비서가 필요시 알아서 연결해줄 수 있어서","그런 기능은 없다","K-서비스가 대신 찾아줘서"],"answer":1,"explain":"내 AI 비서에게 그냥 요청하면, 필요한 경우 비서가 적절한 전문가나 K-서비스를 대신 호출해줄 수 있습니다."},{"q":"K-서비스는 어떤 성격의 AI인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg>","options":["개인 맞춤형 비서","정부·공공 성격의 서비스(K-Law, K-Health 등)","게임 AI","광고용 챗봇"],"answer":1,"explain":"K-서비스는 K-Law, K-Health, K-119처럼 정부·공공 영역의 전문 AI 서비스입니다."},{"q":"비서가 받을 사람의 주소를 찾지 못하면?","options":["비슷한 주소를 지어낸다","못 찾았다고 말하고 나에게 묻는다","메일을 자동 취소한다"],"answer":1,"explain":"정답은 “못 찾았다고 말하고 나에게 묻는다”입니다."},{"q":"요청이 정확해지려면?","options":["누구에게·무엇을·언제까지를 넣는다","한 단어만 말한다","길게 반복한다"],"answer":0,"explain":"정답은 “누구에게·무엇을·언제까지를 넣는다”입니다."},{"q":"웹페이지 내용을 못 읽는 경우는?","options":["한글 페이지","로그인이 필요한 페이지","짧은 주소"],"answer":1,"explain":"정답은 “로그인이 필요한 페이지”입니다."}],"placeholder":false,"updated":"2026-11-15"},{"tier":"beginner","title":"메시지 주고받기","id":"ch4","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:340px;display:block;margin:0 auto\">\n<rect x=\"40\" y=\"20\" width=\"180\" height=\"46\" rx=\"14\" fill=\"#eaf3fc\"/>\n<text x=\"130\" y=\"48\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0c6cc3\">안녕하세요!</text>\n<rect x=\"180\" y=\"80\" width=\"180\" height=\"46\" rx=\"14\" fill=\"#0c6cc3\"/>\n<text x=\"270\" y=\"108\" text-anchor=\"middle\" font-size=\"13\" fill=\"#fff\">네, 반갑습니다</text>\n</svg></div>\n<h2>메시지 주고받기</h2>\n<p>사람과의 대화든 AI와의 대화든, 메시지를 주고받는 방식은 동일합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"/><polygon points=\"22 2 15 22 11 13 2 9 22 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">메시지 입력·전송</div><div class=\"step-desc\">하단 입력창에 글을 쓰고 전송 버튼(또는 Enter)을 누릅니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">읽음·응답 표시</div><div class=\"step-desc\">상대(사람 또는 AI)가 메시지를 읽으면 표시가 바뀌고, 곧 답장이 도착합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">새 메시지 알림</div><div class=\"step-desc\">앱을 보고 있지 않을 때도 알림으로 새 메시지를 받을 수 있습니다(<a class=\"ch-link\" href=\"#\" data-goto=\"ch7\">「폰-PC 연동과 알림」장</a> 참고).</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">대화 기록은 어디로 가나요?</div>모든 대화는 PDV(개인 데이터 저장소)에 안전하게 기록됩니다 — <a class=\"ch-link\" href=\"#\" data-goto=\"ch12\">「PDV 기록」장</a>에서 자세히 다룹니다.</div></div>\n","quiz":[{"q":"메시지를 전송하는 기본적인 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"/><polygon points=\"22 2 15 22 11 13 2 9 22 2\"/></svg>","options":["음성으로만 가능","입력창에 쓰고 전송 버튼 또는 Enter","이메일로 전송","전송 방법이 없다"],"answer":1,"explain":"다른 메신저와 동일하게 입력창에 텍스트를 쓰고 전송하면 됩니다."},{"q":"앱을 보고 있지 않을 때 새 메시지는 어떻게 알 수 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg>","options":["알 수 없다","알림으로 받는다","문자로만 온다","매번 로그인해서 확인해야 한다"],"answer":1,"explain":"앱이 열려 있지 않아도 알림(Web Push)으로 새 메시지를 받을 수 있습니다."},{"q":"대화 기록은 어디에 저장되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>","options":["저장 안 됨","PDV(개인 데이터 저장소)","상대방 서버에만","USB에 직접"],"answer":1,"explain":"모든 대화는 PDV에 기록되어 필요할 때 다시 찾아볼 수 있습니다."}],"placeholder":false},{"tier":"beginner","title":"마이크·카메라·파일 첨부","id":"ch5","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 360 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"/><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></g><circle cx=\"300\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(282,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></g></svg></div>\n<h2>마이크·카메라·파일 첨부</h2>\n<p>텍스트 말고도 음성·사진·파일로 대화할 수 있습니다. 입력창 옆 세 아이콘을 확인해 보세요.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"/><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">마이크 — 음성으로 말하기</div><div class=\"step-desc\">버튼을 누르고 말하면 자동으로 글자로 바뀌어 전송됩니다. 손이 바쁠 때 유용합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">카메라 — 사진·영상 촬영</div><div class=\"step-desc\">바로 찍어서 보내거나, 갤러리에서 골라 보낼 수 있습니다. 영수증·서류 촬영에 자주 씁니다(<a class=\"ch-link\" href=\"#\" data-goto=\"ch20\">「나비마켓 판매자의 재무제표 자동 생성」장</a> 재무제표와 연결됩니다).</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">파일 첨부 — 문서 보내기</div><div class=\"step-desc\">PDF, 엑셀 등 파일을 첨부해 AI에게 분석을 요청할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 사진을 많이 쓰나요?</div>영수증이나 계약서를 찍어 보내면 AI가 내용을 읽어 정리해 줍니다 — 타이핑할 필요가 없습니다.</div></div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">전문가 AI 채팅의 첨부</div>전문가 AI 채팅에서는 <strong>PDF·DOCX·HWPX</strong> 파일의 글을 자동으로 읽어 서식을 파악합니다. 서류 양식을 첨부하면 AI가 그 양식에 맞춰 작성을 돕습니다.</div></div>","quiz":[{"q":"말로 요청하고 싶을 때 사용하는 버튼은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"/><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"/></svg>","options":["카메라","마이크","파일 첨부","전송"],"answer":1,"explain":"마이크 버튼을 누르고 말하면 음성이 자동으로 텍스트로 변환되어 전송됩니다."},{"q":"영수증을 정리해달라고 할 때 가장 편한 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></svg>","options":["일일이 타이핑","사진 찍어서 전송","전화로 설명","불가능하다"],"answer":1,"explain":"카메라로 영수증을 찍어 보내면 AI가 내용을 읽어 자동으로 정리해 줍니다."},{"q":"PDF나 엑셀 파일을 AI에게 분석시키려면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></svg>","options":["파일 첨부 버튼 이용","이메일로 별도 전송","불가능하다","프린트해서 전달"],"answer":0,"explain":"파일 첨부 버튼으로 문서를 직접 보내 분석을 요청할 수 있습니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"beginner","title":"나비 숫자 코드","id":"ch6","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><line x1=\"7\" y1=\"12\" x2=\"17\" y2=\"12\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></g></svg></div>\n<h2>나비 숫자 코드</h2>\n<p>내 나비 숫자 코드는 <strong>가입할 때 인증한 전화번호가 그대로</strong> 됩니다. 따로 정하지 않으며, 휴대폰은 <strong>00-뒷 8자리</strong>(예: 00-1234-5678), 유선전화는 지역번호를 넣은 10자리입니다. 내가 공개하기로 하기 전에는 다른 사람에게 보이지 않습니다.</p>\n<p>전화번호를 매번 타이핑하기 번거로울 때, 화면에 뜬 <strong>10자리 숫자 코드</strong>를 카메라로 찍기만 하면 됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">기존 기기에서 코드 표시</div><div class=\"step-desc\">이미 로그인된 화면에서 \"숫자 코드 보기\"를 누르면 10자리 코드가 뜹니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><line x1=\"7\" y1=\"12\" x2=\"17\" y2=\"12\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">새 기기에서 스캔</div><div class=\"step-desc\">새 기기의 카메라로 그 코드를 비추면 자동으로 전화번호가 채워집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">로그인 이어가기</div><div class=\"step-desc\">타이핑 없이 곧바로 <a class=\"ch-link\" href=\"#\" data-goto=\"ch7\">「폰-PC 연동과 알림」장</a>의 \"폰-PC 연동\" 절차로 넘어갑니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><line x1=\"7\" y1=\"12\" x2=\"17\" y2=\"12\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">QR코드와 다른가요?</div>예전엔 외부 QR 서비스를 썼지만, 지금은 나비가 자체 개발한 숫자 코드 방식을 씁니다 — 전화번호 정보가 외부로 나가지 않아 더 안전합니다.</div></div>\n","quiz":[{"q":"나비 숫자 코드는 몇 자리인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><line x1=\"7\" y1=\"12\" x2=\"17\" y2=\"12\"/></svg>","options":["4자리","10자리","16자리","자릿수 없음"],"answer":1,"explain":"나비 숫자 코드는 10자리 숫자로, 전화번호를 인코딩합니다."},{"q":"숫자 코드를 쓰는 목적은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg>","options":["보안을 낮추기 위해","전화번호 타이핑을 생략하기 위해","광고 표시용","알 수 없음"],"answer":1,"explain":"타이핑 없이 카메라 스캔만으로 전화번호를 빠르게 입력하기 위한 기능입니다."},{"q":"예전 QR 방식과 지금 방식의 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg>","options":["차이 없음","외부 QR 서비스 대신 자체 개발 방식을 사용해 더 안전함","QR이 더 빠름","지금은 코드가 없음"],"answer":1,"explain":"외부 QR 생성 서비스를 걷어내고 자체 인코딩 방식으로 바꿔 전화번호 정보가 외부로 나가지 않습니다."}],"placeholder":false},{"tier":"beginner","title":"폰-PC 연동과 알림","id":"ch7","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 360 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></g><circle cx=\"300\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(282,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></g></svg></div>\n<h2>폰-PC 연동과 알림</h2>\n<p>나비는 비밀번호가 없으므로, PC에서 로그인하려면 <strong>이미 등록된 폰이 승인</strong>해줘야 합니다. 이 승인은 알림(Web Push)으로 전달됩니다.</p>\n<p>PC에서 로그인하는 구체적인 방법은 <strong><a class=\"ch-link\" href=\"#\" data-goto=\"ch_pclogin\">「PC로 로그인하기」장</a></strong>에서 설명합니다. 이 장에서는 그 승인 알림이 <strong>제때, 크게</strong> 오도록 폰을 설정하는 방법과 알림 방식의 원리를 다룹니다.</p>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">알림이 왜 SMS가 아닌가요?</div>SMS는 통신사 신호가 필요하지만, 이 알림은 인터넷(Wi-Fi 포함)만 있으면 전달됩니다. SMS는 알림이 안 왔을 때만 쓰는 예비 수단입니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 코드 확인만으로는 부족한가요?</div>폰이 이미 잠금 해제된 채로 분실·도난되면, 코드 확인만으로는 그걸 쥔 사람이 진짜 주인인지 구분할 수 없습니다. 지문(또는 Face ID)까지 확인해야 실제로 등록된 지문과 일치하는 사람인지 검증됩니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">승인 요청에 제한 시간이 있나요?</div>예, 짧은 시간 안에 승인해야 합니다. 시간이 지나면 \"세션이 만료됐다\"는 안내가 뜨고 처음부터 다시 시도해야 합니다.</div></div>\n<h4>알림 소리가 작아서 못 들었다면</h4>\n<p>알림 소리와 진동의 세기는 나비웹(웹 앱)이 정할 수 없습니다. 안드로이드 8 이상에서는 <strong>폰이 이 사이트(naviweb.kr)의 알림 채널에 저장해 둔 설정</strong>을 따르기 때문에, 폰의 볼륨 버튼만으로는 크게 바뀌지 않을 수 있습니다. 한 번만 아래처럼 바꿔 두세요.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">① 알림을 길게 누르기</div><div class=\"step-desc\">로그인 알림(또는 나비웹 알림)이 오면 알림을 <strong>길게 눌러</strong> \"설정\"(톱니바퀴)을 엽니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">② 중요도·소리·진동 바꾸기</div><div class=\"step-desc\">중요도를 <strong>\"긴급(소리 및 팝업)\"</strong>으로 두고, 소리는 크고 또렷한 것으로 고르고, 진동을 켭니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">③ 한 번 바꾸면 계속 적용</div><div class=\"step-desc\">이 설정은 이후 나비웹 알림에 모두 적용됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-body\"><div class=\"mc-title\">메뉴 이름은 폰마다 다릅니다</div>제조사마다 화면과 이름이 조금씩 다릅니다. 무음·방해 금지 모드에서는 소리가 나지 않으며, 일부 폰은 벨소리 볼륨과 알림 볼륨이 하나로 묶여 있습니다. 소리를 놓쳤다면 PC에서 \"다시 입력\"으로 다시 요청하면 새 알림이 옵니다.</div></div>\n<h3>알림이 늦게 오거나 안 올 때 — 폰의 백그라운드 설정</h3>\n<p>안드로이드 폰은 배터리를 아끼려고 쓰지 않는 앱의 활동을 멈춰 두기도 합니다. 그러면 PC에서 보낸 승인 알림이 <strong>늦게 도착하거나 도착하지 않을 수</strong> 있습니다. 알림이 이상하게 늦다면 가장 먼저 아래 설정을 확인하세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:300px\"><img src=\"manual-img/android-background-allow.webp\" alt=\"백그라운드 앱 사용 설정 화면\" loading=\"lazy\"><figcaption>안드로이드 \"백그라운드 앱 사용\" 화면 — \"항상 허용\" 선택</figcaption></figure>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">① 설정 열기</div><div class=\"step-desc\">폰 설정 → 앱 → <strong>나비</strong> → 배터리(또는 백그라운드 앱 사용)로 들어갑니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">② \"항상 허용\" 선택</div><div class=\"step-desc\">\"항상 허용\"은 앱이 백그라운드에서도 실행되어 알림을 바로 받을 수 있게 합니다. \"허용 안 함\"이나 \"스마트 사용\"은 배터리는 아끼지만 알림이 늦어질 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-body\"><div class=\"mc-title\">제조사마다 메뉴 이름이 조금 다릅니다</div>위 화면은 안드로이드 폰의 한 예입니다. 메뉴 이름은 제조사마다 다를 수 있습니다. 화면에 안내된 것처럼 \"항상 허용\"을 선택하면 <strong>배터리 사용 시간이 다소 짧아질 수 있습니다.</strong> 나비를 앱으로 설치해 두었다면(<a class=\"ch-link\" href=\"#\" data-goto=\"ch9\">「설정 페이지 사용법」장</a> 참고) 폰의 앱 목록에서 \"나비\"를 찾아 이 설정을 열 수 있습니다.</div></div>\n","quiz":[{"q":"PC 로그인을 승인하는 주체는 누구인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg>","options":["PC 스스로","이미 등록된 폰","고객센터 직원","자동으로 승인됨"],"answer":1,"explain":"PC에서 로그인 시도가 있으면 등록된 폰에 알림이 가고, 그 폰에서 직접 승인해야 로그인이 완료됩니다."},{"q":"이 알림은 어떤 방식으로 전달되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg>","options":["SMS 문자","이메일","Web Push(인터넷 알림)","우편"],"answer":2,"explain":"Wi-Fi로도 정상 전달되는 Web Push 방식을 사용합니다. SMS는 예비 수단입니다."},{"q":"승인 요청을 너무 늦게 확인하면 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg>","options":["문제 없음","세션이 만료되어 처음부터 다시 시도해야 함","자동 승인됨","계정이 잠김"],"answer":1,"explain":"승인에는 제한 시간이 있어, 시간이 지나면 세션이 만료되고 재시도해야 합니다."}],"placeholder":false},{"tier":"beginner","title":"내 프로필 — 나만의 AI 웹페이지","id":"ch8","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></g></svg></div>\n<h2>내 프로필 — 나만의 AI 웹페이지</h2>\n<p>나비 가입자는 누구나 자신만의 공개 웹페이지를 갖습니다. 다른 사람이 여러분을 검색하면 이 페이지를 보게 됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">기본 정보</div><div class=\"step-desc\">닉네임, 소개, 연락 방법이 표시됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">나비 온도</div><div class=\"step-desc\">거래·평가에 따라 오르내리는 신뢰 지표가 함께 표시됩니다(당근마켓 온도와 같은 개념).</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">바로 대화 시작</div><div class=\"step-desc\">프로필을 본 사람이 버튼 하나로 바로 대화나 거래를 요청할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">나비 온도가 뭔가요?</div>36.5도에서 시작해 0~99도 사이를 오갑니다. 나비마켓에서 거래 후 리뷰를 받으면 온도가 변합니다. 자세한 건 <a class=\"ch-link\" href=\"#\" data-goto=\"ch20\">「나비마켓 판매자의 재무제표 자동 생성」장</a> 이후에서 다룹니다.</div></div>\n\n<h3>프로필 페이지 만들기와 공개 범위</h3>\n<p><b>설정 → 프로필</b>에서 나비와 대화하거나 <b>내 정보 항목</b>을 직접 채우면 <b>나의 프로필 웹페이지</b>가 만들어집니다. 미리보기가 대화에 따라 바뀌고 <b>나비로 정리</b>, <b>새 창으로 보기</b>, <b>HTML 저장</b>이 있습니다.</p>\n<p><b>공개 여부는 항목마다 내가 정합니다.</b> 개인 정보는 처음에는 <b>이름만 공개</b>이고 나머지는 비공개이며, 공개로 바꾼 항목만 페이지와 저장한 HTML에 들어갑니다. 나비는 주소·이메일·나이·성별을 먼저 묻지 않습니다.</p>\n<p><b>상품·서비스</b>를 추가하면 공개로 시작해 카드로 나옵니다(숨기려면 비공개로). 가격·재고는 내가 적은 값 그대로입니다. 이 페이지는 <b>주문·결제를 직접 받지 않으므로</b> 주문·예약·배송·방문 안내를 적거나 링크로 안내하고, 위치가 드러날 수 있는 길 안내·지도 링크는 비공개로 시작합니다.</p>\n<p>공개한 항목은 누구나 볼 수 있습니다. 집 주소·전화번호·가족 사항처럼 알려지면 곤란한 정보는 공개하지 마세요.</p>","quiz":[{"q":"나비 프로필 페이지는 누가 볼 수 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></svg>","options":["본인만","검색한 다른 사용자 누구나","관리자만","아무도 못 봄"],"answer":1,"explain":"나비 프로필은 공개 웹페이지로, 검색을 통해 다른 사용자가 볼 수 있습니다."},{"q":"나비 온도의 시작 값은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["0도","36.5도","99도","100도"],"answer":1,"explain":"당근마켓 온도와 같은 개념으로, 36.5도(사람 체온)에서 시작합니다."},{"q":"나비 온도는 무엇에 따라 변하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["매일 자동으로 오름","거래·평가 결과","앱 사용 시간","변하지 않음"],"answer":1,"explain":"나비마켓 거래 후 리뷰 등 평가에 따라 온도가 오르내립니다."},{"q":"개인 정보 항목의 처음 공개 상태는?","options":["모두 공개","이름만 공개, 나머지 비공개","모두 비공개"],"answer":1,"explain":"정답은 “이름만 공개, 나머지 비공개”입니다."},{"q":"공개 여부는 누가 정하나요?","options":["나비가 정한다","내가 항목마다 정한다","관리자가 정한다"],"answer":1,"explain":"정답은 “내가 항목마다 정한다”입니다."},{"q":"프로필 페이지가 직접 받지 않는 것은?","options":["소개 글","주문·결제","링크"],"answer":1,"explain":"정답은 “주문·결제”입니다."}],"placeholder":false,"updated":"2026-11-15"},{"tier":"beginner","title":"설정 페이지 사용법","id":"ch9","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"1\" y=\"5\" width=\"22\" height=\"14\" rx=\"7\"/><circle cx=\"16\" cy=\"12\" r=\"3\"/></g></svg></div>\n<h2>설정 페이지 사용법</h2>\n<p>대시보드의 \"비서 설정\" 탭에서 알림·개인정보·연동 기기 등을 관리합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"5\" width=\"22\" height=\"14\" rx=\"7\"/><circle cx=\"16\" cy=\"12\" r=\"3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">알림 켜기·끄기</div><div class=\"step-desc\">불필요한 알림 종류를 개별적으로 끌 수 있습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">로그인 기기 관리</div><div class=\"step-desc\">현재 로그인된 기기 목록을 보고, 낯선 기기가 있으면 로그아웃시킬 수 있습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">PDV 데이터 내보내기</div><div class=\"step-desc\">내 기록 전체를 다운로드할 수 있습니다 — <a class=\"ch-link\" href=\"#\" data-goto=\"ch12\">「PDV 기록」장</a>에서 이어집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">보안 설정 조정</div><div class=\"step-desc\">지문 인증을 요구하는 금액 기준이나 필수 여부를 여기서 직접 조정할 수 있습니다 — <a class=\"ch-link\" href=\"#\" data-goto=\"ch33\">「보안 설정 직접 조정하기」장</a>(고급)에서 자세히 다룹니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">낯선 기기가 보인다면?</div>즉시 \"관리\"에서 그 기기를 로그아웃시키고, 백업 키를 갖고 계신다면 재확인해 보세요.</div></div>\n<h3>앱으로 설치하기</h3>\n<p>설정의 \"앱 관리\"에서 <strong>앱으로 설치(PWA)</strong>를 누르면 아래와 같은 설치 창이 아래쪽에서 올라옵니다. 안내 문구는 <strong>\"폰 바탕화면에 나비웹 열기 아이콘 추가\"</strong> 한 줄입니다. 오른쪽의 <strong>설치</strong> 버튼을 누르면 됩니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:300px\"><img src=\"manual-img/pwa-install-sheet.webp?v=20261114\" alt=\"앱으로 설치 창\" loading=\"lazy\"><figcaption>설정 → 앱 관리 → 앱으로 설치(PWA)를 누르면 나타나는 설치 창</figcaption></figure>\n<p>설치를 마치면 \"바탕화면에 나비웹 바로가기 아이콘을 추가하였습니다.\"라는 안내가 1초 동안 보이고, 곧바로 나비의 첫 화면으로 돌아옵니다.</p>\n<h3>설치가 끝난 뒤 — 바탕화면의 나비 아이콘</h3>\n<p>폰 바탕화면(홈 화면)에 <strong>나비 아이콘</strong>이 생깁니다. 이 아이콘을 누르면 인터넷 주소창 없이 나비가 앱처럼 바로 열립니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:300px\"><img src=\"manual-img/home-screen-icon.webp?v=20261114\" alt=\"바탕화면에 추가된 나비 아이콘\" loading=\"lazy\"><figcaption>설치 후 폰 바탕화면에 생긴 나비 아이콘</figcaption></figure>\n<div class=\"md-container tonal-primary\"><div class=\"mc-body\"><div class=\"mc-title\">설치해 두면 좋은 점</div>나비를 홈 화면 앱으로 설치해 두면 승인 알림처럼 앱이 닫혀 있을 때 오는 알림을 받기 편합니다. 설치한 뒤에는 <a class=\"ch-link\" href=\"#\" data-goto=\"ch7\">「폰-PC 연동과 알림」장</a>의 \"백그라운드 앱 사용\" 설정도 함께 확인해 두세요.</div></div>\n","quiz":[{"q":"불필요한 알림을 줄이려면 어디서 설정하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"5\" width=\"22\" height=\"14\" rx=\"7\"/><circle cx=\"16\" cy=\"12\" r=\"3\"/></svg>","options":["설정 페이지의 알림 항목","앱 삭제 후 재설치","고객센터 문의만 가능","설정할 수 없음"],"answer":0,"explain":"설정 페이지에서 알림 종류별로 켜고 끌 수 있습니다."},{"q":"낯선 로그인 기기를 발견하면 어떻게 해야 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg>","options":["무시한다","설정에서 즉시 로그아웃시킨다","비밀번호를 바꾼다","앱을 삭제한다"],"answer":1,"explain":"설정의 로그인 기기 관리에서 즉시 해당 기기를 로그아웃 처리해야 합니다(나비는 비밀번호가 없으므로 비밀번호 변경은 해당되지 않습니다)."},{"q":"내 기록 전체를 다운로드하려면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg>","options":["불가능하다","설정 페이지의 PDV 내보내기","고객센터에 우편 요청","이메일로 요청"],"answer":1,"explain":"설정 페이지에서 PDV 데이터 내보내기 기능으로 내 기록 전체를 다운로드할 수 있습니다."}],"placeholder":false},{"tier":"beginner","title":"설정 메뉴 하나씩 보기 — 계정·PDV·서명·화면","id":"ch_settingsmenu","body":"<h2>설정 메뉴 하나씩 보기 — 계정·PDV·서명·화면</h2>\n<p>왼쪽 메뉴 맨 아래 톱니바퀴(또는 아이디 옆 ⋮). <b>계정</b>: 메일 아이디 바꾸기, 보내는 사람 표시(이름).</p>\n<p><b>프로필</b>: 나비와 대화하거나 항목을 채워 나의 프로필 웹페이지를 만듭니다. <b>PDV</b>: 이름·주소·연락처 등 내 정보를 이 기기에 보관합니다. <b>GDC</b>: 잔액과 사용량(1 GDC = 1원).</p>\n<p><b>서명</b>: 보내는 메일 끝에 자동으로 붙는 글(글자만, 1000자까지). <b>부재중 자동응답</b>: 켜 두면 @naviweb.kr이 아닌 주소에서 온 메일에 같은 사람에게 24시간에 한 번만 회신하고, 마지막 날 밤 11시 59분까지만 보냅니다.</p>\n<p><b>화면(스킨)</b>: 색상 6종, 메뉴(아이콘 레일 / 항상 펼침), 밀도, 단추·입력칸·카드 모양을 골라 내 취향대로 바꿉니다.</p>\n<p>설정도 말로 바꿀 수 있습니다(예: “메일 끝에 ‘홍길동 드림’ 서명이 들어가게 해 주세요”).</p>\n<p>메일 아이디(예: swift-heron-482)는 자동 배정됩니다. 설정 → 계정에서 바꿉니다: <b>3~30자</b>, 영문 소문자·숫자·하이픈·밑줄, 숫자만 불가, 사칭 우려 이름 불가, <b>30일에 3번</b>. 바꾸면 이전 아이디로는 받을 수 없습니다.</p>\n<p><b>보내는 이름</b>(40자, 서비스·기관으로 오해할 말 불가)을 정하면 받는 사람에게 “도 영민 &lt;주소&gt;”로 보입니다. 서명은 설정 → 서명에 적습니다.</p>","quiz":[{"q":"이름·주소 같은 내 정보를 보관하는 설정 탭은?","options":["PDV","GDC","서명"],"answer":0,"explain":"정답은 “PDV”입니다."},{"q":"부재중 자동응답은 같은 사람에게 얼마나 자주 가나요?","options":["메일마다","24시간에 한 번","한 달에 한 번"],"answer":1,"explain":"정답은 “24시간에 한 번”입니다."},{"q":"서명에는 무엇을 넣을 수 있나요?","options":["글자만 1000자까지","이미지","파일"],"answer":0,"explain":"정답은 “글자만 1000자까지”입니다."},{"q":"메일 아이디는 30일에 몇 번까지 바꿀 수 있나요?","options":["3번","무제한","1번"],"answer":0,"explain":"정답은 “3번”입니다."}],"updated":"2026-11-15"},{"tier":"beginner","title":"지갑과 백업 키 — 새 폰·새 기기에서 쓰기","id":"ch_wallet","body":"<h2>지갑과 백업 키 — 새 폰·새 기기에서 쓰기</h2>\n<p><b>폰에서 로그인</b>: 폰에서 <b>naviweb.kr/webapp</b>을 열고 전화번호 <b>뒷 8자리</b>를 입력한 뒤 <b>로그인</b>을 누르면 그 번호로 <b>인증번호 6자리 문자</b>가 옵니다. 안드로이드 Chrome은 문자를 읽어 <b>자동으로 입력</b>해 주므로 더 할 일이 없습니다. 자동으로 채워지지 않으면(아이폰 등) 인증번호 칸에 6자리를 직접 넣으세요. PC에서는 문자를 받을 수 없으므로 위의 <b>폰으로 승인받기</b>를 씁니다.</p><figure class=\"ch-shot\" style=\"max-width:300px\"><img src=\"manual-img/phone-login-1-sms.png\" alt=\"폰 로그인: 인증번호 입력 화면\" loading=\"lazy\"><figcaption>① 인증번호를 보냈습니다 — 문자가 오면 자동으로 입력됩니다</figcaption></figure>\n<p>처음 로그인하는 폰에는 내 <b>지갑(개인키)</b>이 없어서 <b>“이 기기에 저장된 지갑을 열 수 없습니다”</b> 안내가 뜹니다. 로그인은 끝난 상태이며, 이 폰에서 지갑을 쓰려면 아래 중 하나를 고릅니다. <b>다른 기기에서 이 지갑 가져오기</b>(지갑을 가진 다른 기기가 승인), <b>백업 키로 복구</b>, <b>이 기기에서 새로 시작</b>(이 폰에서 새 지갑을 만듭니다 — 이전 지갑의 데이터는 이어지지 않을 수 있으니 백업 키가 있으면 복구를 권합니다), <b>나중에</b>.</p><figure class=\"ch-shot\" style=\"max-width:300px\"><img src=\"manual-img/phone-login-2-wallet.png\" alt=\"처음 로그인하는 폰의 지갑 안내\" loading=\"lazy\"><figcaption>② 지갑 안내 — 네 가지 중 하나를 고릅니다</figcaption></figure>\n<p><b>백업 키로 복구</b>를 누르면 <b>백업 키(개인키, Base64URL)</b> 입력창이 나옵니다. 가입 때 받아 둔 키를 붙여 넣고 <b>확인</b>을 누르면 이 폰에서도 지갑을 쓸 수 있습니다. 백업 키는 서버에 사본이 없어 <b>잃어버리면 되찾을 방법이 없습니다</b>. 2026-11-13 이후 가입하면 가입 때 입력한 <b>이메일</b>로 인증을 거쳐 보내 드리며, 언제·어느 주소로 보냈는지는 나중에 물어보면 알려 드립니다.</p><figure class=\"ch-shot\" style=\"max-width:300px\"><img src=\"manual-img/phone-login-3-backupkey.png\" alt=\"백업 키 입력창\" loading=\"lazy\"><figcaption>③ 백업 키 입력 — 붙여 넣고 확인</figcaption></figure>\n<p><b>백업 키 저장하기</b>: 오른쪽 위 ⚙ 설정 → <b>백업 키</b>를 열면 <b>내 백업 키 내보내기</b> 칸에 키가 보입니다. <b>복사</b>를 누르면 공유 창이 뜨므로 비밀번호 관리자나 본인만 보는 메모에 붙여 넣어 보관하세요. 이 키를 아는 사람은 누구나 내 계정이 될 수 있으므로 <b>캡처하거나 다른 사람과 공유하지 마세요</b>. 나비는 이 키를 서버에 저장하지 않아 잃어버리면 되찾을 수 없습니다.</p><figure class=\"ch-shot\" style=\"max-width:420px\"><img src=\"manual-img/backup-key-1-export.png\" alt=\"설정 → 백업 키: 내 백업 키 내보내기와 복사 버튼\" loading=\"lazy\"><figcaption>① 설정 → 백업 키에서 <b>복사</b>를 누릅니다 (키는 화면에서 가렸습니다)</figcaption></figure><figure class=\"ch-shot\" style=\"max-width:360px\"><img src=\"manual-img/backup-key-2-copied.png\" alt=\"복사 후 공유 창\" loading=\"lazy\"><figcaption>② 복사되면 아래에 공유 창이 뜹니다 — 안전한 곳에 붙여 넣으세요</figcaption></figure>\n<p>다른 기기(새 폰 등)에서 내 계정의 지갑을 쓰려면 같은 화면 아래쪽 <b>다른 기기의 백업 키로 복구</b>에 보관해 둔 키를 붙여 넣고 <b>이 기기에 적용</b>을 누릅니다. 이 기기에 이미 있던 로컬 키는 <b>교체</b>되니, 쓰던 키를 따로 보관해 두었는지 먼저 확인하세요.</p>","quiz":[{"q":"처음 로그인한 폰에 “이 기기에 저장된 지갑을 열 수 없습니다”가 뜨면?","options":["계정이 삭제된 것이다","백업 키로 복구하거나 다른 기기에서 지갑을 가져온다","처음부터 다시 가입해야 한다"],"answer":1,"explain":"정답은 “백업 키로 복구하거나 다른 기기에서 지갑을 가져온다”입니다."},{"q":"백업 키는 어디에 보관해야 하나요?","options":["캡처해서 단체 대화방에 올린다","비밀번호 관리자 등 본인만 아는 안전한 곳","나비가 서버에 보관하므로 따로 보관하지 않는다"],"answer":1,"explain":"정답은 “비밀번호 관리자 등 본인만 아는 안전한 곳”입니다."}],"updated":"2026-11-15"},{"tier":"beginner","title":"도움말 · 나비웹 대화 패널 · 스마트폰","id":"ch_helpmenu","body":"<h2>도움말 · 나비웹 대화 패널 · 스마트폰</h2>\n<p><b>도움말</b>: <b>사용법</b>(나비 사용자 매뉴얼 · 질문·답변, 진행 상태는 이 브라우저에 저장)과 <b>Whitepaper</b>(나비 소개·사용 설명서·백서 전환).</p>\n<p>오른쪽 아래 <b>💬 나비웹 대화 패널</b>: 다른 사용자와의 1:1 대화·통화 요청을 받습니다. 닫기를 눌러도 숨기기만 해서 요청을 계속 받고, 요청이 오면 저절로 열립니다.</p>\n<p><b>이 패널의 AI는 화면마다 달라집니다. 지금 보는 화면과 관련된 AI가 맡아 인사하고 답합니다.</b> 기본 화면(홈·메일·나비 길잡이) → <b>나만의 AI 비서</b> · 서류를 쓰는 동안 → 그 서류 사이트의 <b>서류 비서</b> · 서류 제출 단계 → <b>제출 안내 AI</b> · 각종 기관·정부 AI·전문가 AI를 고르면 → 그 <b>기관 AI·전문가 AI</b> · 새 양식 만들기 → <b>양식 작성 AI</b> · 프로필 만들기 → <b>프로필 작성 AI</b>. 사용법 화면에서는 장마다 아래에 <b>사용법 도우미</b>가 따로 있어 그 장을 설명합니다.</p>\n<p>화면을 벗어나거나 칩의 <b>×</b>를 누르면 담당 AI는 다시 <b>나만의 AI 비서</b>로 돌아갑니다.</p>\n<p>naviweb.kr에 접속하면 컴퓨터는 컴퓨터 화면, 스마트폰은 대화 중심 화면이 자동으로 열립니다. 스마트폰에서는 대화·메일·업무가 되고, <b>서류 작성·서류 고치기·양식 만들기는 컴퓨터에서만</b> 됩니다.</p>","quiz":[{"q":"💬 패널의 닫기를 누르면?","options":["숨기기만 해서 대화 요청을 계속 받는다","로그아웃된다","대화가 삭제된다"],"answer":0,"explain":"정답은 “숨기기만 해서 대화 요청을 계속 받는다”입니다."},{"q":"서류 작성과 양식 만들기를 쓸 수 있는 곳은?","options":["컴퓨터 화면","스마트폰 화면만","둘 다 아니다"],"answer":0,"explain":"정답은 “컴퓨터 화면”입니다."},{"q":"서류를 쓰는 동안 💬 대화창에서 답하는 AI는?","options":["항상 같은 하나의 공용 AI","그 서류 사이트의 서류 비서","대화창은 꺼진다"],"answer":1,"explain":"정답은 “그 서류 사이트의 서류 비서”입니다."},{"q":"전문가 AI를 고른 뒤 칩의 ×를 누르면 💬 대화창의 AI는?","options":["나만의 AI 비서로 돌아간다","꺼진다","다른 전문가로 바뀐다"],"answer":0,"explain":"정답은 “나만의 AI 비서로 돌아간다”입니다."}],"updated":"2026-11-15"},{"tier":"beginner","id":"ch_howto_tab","title":"사용법 탭 쓰는 법 — 매뉴얼·영상·질문·답변","updated":"2026-11-15","body":"<h2>사용법 탭 쓰는 법 — 매뉴얼·영상·질문·답변</h2>\n<p><b>하는 일</b>: 왼쪽 메뉴 맨 아래 <b>사용법</b>을 누르면 이 매뉴얼이 열립니다. 위쪽 탭은 <b>나비 사용자 매뉴얼 · 질문·답변 · Openhash · Navi Pro</b>입니다. Openhash와 Navi Pro 탭은 준비 중입니다.</p>\n<h3>매뉴얼 읽기</h3>\n<ul><li>위의 <b>초급 · 중급 · 고급</b> 버튼을 누르면 그 단계의 장 목록이 오른쪽에서 열립니다. 장을 고르면 목록이 닫히고 그 장이 나옵니다. 같은 버튼을 다시 누르거나 바깥을 눌러도 닫힙니다.</li><li>맨 위의 진행 막대는 지금 보는 단계의 진행만 보여 줍니다.</li><li>장 끝의 퀴즈를 풀면 그 장이 완료로 표시되고, 단계를 마칠수록 나비 지식 온도가 올라갑니다.</li><li>일부 장 맨 위에는 설명 영상이 있습니다. 썸네일을 누르면 큰 화면으로 바뀝니다.</li></ul>\n<h3>궁금한 것 물어보기</h3>\n<ul><li>장 아래의 <b>사용법 도우미</b> 대화창에 물어보면 지금 보는 장을 알고 답합니다.</li><li>도우미 답이 부족하면 <b>질문·답변</b> 탭에서 관리자에게 질의할 수 있습니다.</li></ul>\n<p class=\"ch-note\">이 장은 현재 화면 구성을 보고 쓴 초안입니다.</p>","quiz":[{"q":"Openhash와 Navi Pro 탭의 현재 상태는?","options":["준비 중이다","유료다","삭제됐다"],"answer":0,"explain":"정답은 “준비 중이다”입니다."},{"q":"장 목록을 열려면?","options":["초급·중급·고급 버튼을 누른다","화면을 새로고침한다","메일을 보낸다"],"answer":0,"explain":"정답은 “초급·중급·고급 버튼을 누른다”입니다."}]},{"tier":"beginner","title":"나비웹 도우미 — 알림·안전장치·발송 한도","id":"ch_agentsafety","body":"<h2>나비웹 도우미 — 알림·안전장치·발송 한도</h2>\n<p>도우미를 처음 켜는 방법은 “나비웹 도우미 설치하기” 장에서 다뤘습니다. 여기서는 쓰는 중에 알아 둘 점을 정리합니다. 도우미는 연결되면 서류 화면에 “연결됨”이 보이고, 내가 가져오기를 누를 때 시작하며, 로그인·인증서·결제·승인은 항상 내가 직접 합니다. 비밀번호·공동인증서 비밀번호·주민등록번호는 맡기지 마세요.</p>\n<p>첨부서류는 <b>발급 기관 목록</b>으로 미리 분류해 두어, 정부24에서 받는 서류는 눌러서 1초 안에 정부24 사이트를 열고 로그인을 안내합니다. 법인등기처럼 이름 같은 입력이 필요한 서류는 인터넷등기소를 먼저 열어 로그인을 안내하는 동안 필요한 정보를 묻습니다. 한 번 “이 사이트 허용”을 하면 모든 사이트에서 도우미가 작동합니다.</p>\n<p><b>알림</b>: 앱 안 알림 외에 나비 길잡이 → 진행 중에서 <b>브라우저 알림</b>·<b>서버 알림</b>을 켤 수 있습니다. 같은 알림이 반복되지 않도록 하루 수에 상한이 있지만 기한 초과 같은 중요한 알림은 줄이지 않습니다.</p>\n<p><b>안전장치</b>: 대화로 보내는 메일은 최종 확인 후에만 나가고, 서류의 직접 쓴 칸은 지키며 되돌리기를 남기고, 번호류는 비서에게 보내지 않습니다.</p>\n<p><b>발송 한도</b>: 이번 1통을 포함한 최근 5일 평균이 하루 100통을 넘으면 초과분은 1통당 10 GDC가 부과됩니다(발송은 막히지 않음).</p>","quiz":[{"q":"발송 한도를 넘으면?","options":["발송이 막힌다","초과분에 1통당 10 GDC가 부과된다","계정이 삭제된다"],"answer":1,"explain":"정답은 “초과분에 1통당 10 GDC가 부과된다”입니다."},{"q":"도우미에게 맡기면 안 되는 것은?","options":["서류 제목","비밀번호·공동인증서 비밀번호","메일 주소 목록"],"answer":1,"explain":"정답은 “비밀번호·공동인증서 비밀번호”입니다."}],"updated":"2026-11-15"},{"tier":"beginner","title":"메일 메뉴 한눈에 보기","id":"ch_mailmenu","body":"<h2>메일 메뉴 한눈에 보기</h2>\n<p>나비웹의 메일은 <b>메일ID@naviweb.kr</b> 형태의 <b>개인 메일</b>입니다. 회사·학교 메일을 대신하지 않습니다.</p>\n<p><b>빠른 발송</b>: 받는 사람(주소 하나)·제목·내용을 적고 보내면 <b>확인 없이 그대로 즉시</b> 나갑니다. <b>편지쓰기</b>: 편집기로 직접 쓰기(임시저장·보내기·새로 쓰기). <b>Draft</b>: 임시저장한 글을 이어 쓰기.</p>\n<p><b>내 캠페인</b>: 여러 사람에게 보낸 메일 묶음을 검색하고 🔄 이어서 대화하기. <b>주소록</b>: 보낸 상대 자동 저장, 태그, 엑셀·CSV 업로드, 소속 기관 트리. <b>보낸메일함·받은메일함</b>: 최근 200건. <b>태그별 보관함</b>: 받은 메일의 라벨별 모음.</p>\n<p>메일 아이디·보내는 이름·서명·부재중 자동응답은 설정에서 정합니다. 이미 보낸 메일은 <b>되돌릴 수 없습니다</b>.</p>","quiz":[{"q":"확인 단계 없이 입력한 그대로 즉시 나가는 것은?","options":["빠른 발송","대화로 보내기","캠페인"],"answer":0,"explain":"정답은 “빠른 발송”입니다."},{"q":"나비웹 메일 주소의 모양은?","options":["이름@회사.co.kr","메일ID@naviweb.kr","전화번호@hondi.net"],"answer":1,"explain":"정답은 “메일ID@naviweb.kr”입니다."},{"q":"보낸메일함과 받은메일함은 최근 몇 건까지 보여 주나요?","options":["10건","200건","무제한"],"answer":1,"explain":"정답은 “200건”입니다."}],"updated":"2026-11-15"},{"tier":"beginner","title":"K-Mail 첫걸음 — 말 한마디로 메일 보내기","id":"ch_kmail_basic","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"></path><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"></path><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"></line></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"></path><polyline points=\"22 6 12 13 2 6\"></polyline></g></svg></div>\n<h2>K-Mail 첫걸음 — 말 한마디로 메일 보내기</h2>\n<p>나비 가입자는 누구나 자신만의 메일 주소(<code>&lt;메일 아이디&gt;@naviweb.kr</code>)를 자동으로 갖습니다. 이메일 앱을 따로 켤 필요 없이, 내 AI 비서에게 말하는 것만으로 메일을 보낼 수 있습니다.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"></path><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"></path><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"></line></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">가장 쉬운 사용법</div>\"OOO한테 회의 시간 물어보는 메일 보내줘\"처럼 말하면, K-Mail이 제목과 본문을 알아서 채워 보여줍니다. <a class=\"ch-link\" href=\"#\" data-goto=\"ch5\">「마이크·카메라·파일 첨부」장</a>에서 다룬 마이크 버튼으로 말해도 똑같이 동작합니다.</div>\n</div>\n\n<h3>세 단계면 끝입니다</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"></path><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"></path><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"></line></svg></div><div class=\"step-body\"><div class=\"step-title\">① 누구에게, 무슨 내용인지 말하기</div><div class=\"step-desc\">받는 사람의 이메일 주소나 이름, 그리고 어떤 내용을 보내고 싶은지 자연어로 말합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"></path><polyline points=\"22 6 12 13 2 6\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">② 초안 확인</div><div class=\"step-desc\">AI가 만든 제목·본문 초안이 화면에 뜹니다. 마음에 안 들면 \"더 짧게 써줘\"처럼 다시 요청할 수 있습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 보내기</div><div class=\"step-desc\">확인 후 \"보내줘\"라고 말하면 바로 발송됩니다.</div></div></div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"></path><polyline points=\"22 6 12 13 2 6\"></polyline></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">보낸 사람은 어떻게 되나요?</div>메일을 보낸 상대는 자동으로 내 주소록에 등록됩니다 — 다음에 또 보낼 때 이름만 말해도 찾아줍니다.</div>\n</div>\n\n<h3>연습해 보기 — 첫 메일 보내기</h3>\n<p>받는 사람은 <b>내 다른 메일 주소</b>로 하세요. 입력창에 “이번 주 금요일 오후 3시에 팀 회의가 있다고 (내 다른 주소)에 알려 주세요.”처럼 적습니다.</p>\n<p>비서가 메일로 이어 주고 누구에게·왜·제목과 본문 초안을 확인한 뒤 <b>최종 확인</b>(받는 사람·제목·본문·시각)을 보여 줍니다. 괜찮으면 “네, 보내 주세요”, 고칠 곳이 있으면 “제목을 ‘금요일 회의 안내’로 바꿔 주세요”.</p>\n<p><b>내가 확인한 뒤에만</b> 나갑니다. 비서가 확인 없이 보내려 해도 서버가 막고 “아직 발송하지 않았습니다”라고 알립니다. 보낸 뒤 <b>메일 → 보낸메일함</b>에서 확인합니다.</p>\n<p><b>빠른 발송</b>은 확인 단계가 없고 주소 하나만 넣을 수 있습니다. <b>편지쓰기</b>는 직접 쓰는 편집기이며 파일은 한 개당 25MB까지입니다. 보낸 메일은 되돌릴 수 없습니다.</p>","quiz":[{"q":"K-Mail로 메일을 보내는 가장 쉬운 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"></path></svg>","options":["이메일 앱을 따로 설치","내 AI 비서에게 말로 요청","HTML 코드를 직접 작성","불가능함"],"answer":1,"explain":"\"OOO한테 메일 보내줘\"처럼 말하면 K-Mail이 초안부터 발송까지 처리합니다."},{"q":"나비 가입자의 메일 주소는 어떻게 정해지나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"></path><polyline points=\"22 6 12 13 2 6\"></polyline></svg>","options":["직접 아이디를 만들어야 함","내 GUID 기반으로 자동 생성됨","가입 시 이메일을 따로 입력해야 함","메일 주소가 없음"],"answer":1,"explain":"가입자는 누구나 <내 GUID>@hondi.kr 형태의 메일 주소를 자동으로 갖습니다."},{"q":"K-Mail로 메일을 보낸 상대는 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"></circle><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"></line></svg>","options":["기록되지 않음","자동으로 주소록에 등록됨","삭제됨","매번 다시 입력해야 함"],"answer":1,"explain":"보낸 상대는 자동으로 주소록에 등록되어, 다음번엔 이름만 말해도 찾을 수 있습니다."},{"q":"대화로 보내는 메일이 실제로 나가는 때는?","options":["요청하자마자","최종 확인 후 내가 보내라고 한 뒤","10분 뒤 자동으로"],"answer":1,"explain":"정답은 “최종 확인 후 내가 보내라고 한 뒤”입니다."},{"q":"보냈는지 확인하는 곳은?","options":["보낸메일함","주소록","설정"],"answer":0,"explain":"정답은 “보낸메일함”입니다."},{"q":"편지쓰기에서 파일은 한 개당 최대?","options":["25MB","8MB","1GB"],"answer":0,"explain":"정답은 “25MB”입니다."}],"placeholder":false,"updated":"2026-11-15"},{"tier":"beginner","title":"서류 메뉴와 서류 화면","id":"ch_docmenu","body":"<h2>서류 메뉴와 서류 화면</h2>\n<p><b>서류 작성</b>(찾아 열기) · <b>Draft</b>(쓰다 나간 서류: 요청문과 받아 둔 작성본 Word 파일이 남고 입력칸까지는 복원되지 않음) · <b>작성한 서류</b>(작성 완료로 저장한 것) · <b>내 서류함</b>(자주 쓰는 양식·내가 만든 양식·올려 둔 양식).</p>\n<p>서류 분야: 전체 · 제주 행정 · 법률 · 세무·회계 · 병원·의원 · 특허·상표 · 감정평가 · 학교. 분야별 사이트의 서류 비서가 맡습니다.</p>\n<p>서류 화면은 네 가지가 함께 일합니다: <b>입력창</b>(서류 고르기) · <b>서류 화면</b>(칸을 눌러 직접 고침) · <b>💬 나비웹 대화창</b>(서류 비서와 대화) · <b>PDV</b>(내 정보 자동 입력, 보관).</p>\n<p>서류 화면 버튼: <b>작성 완료로 저장</b> · 제출 결과 예상 · <b>PDF / MS-Word</b> · <b>전달</b>(메일에 첨부) · <b>제출</b>(나비웹이 대신 접수하지 않고 단계별로 안내) · 📎(양식·자료 올리기, 첨부 4개·파일당 8MB 이하).</p>\n<p><b>잘못된 점·없는 서류 알리기</b>: 서류 화면의 <b>문제 알리기</b>·<b>서류 요청</b> 버튼, 첨부서류 옆 <b>⚑</b>(“이 서류는 다른 기관에서 발급해요”), 또는 대화창에 “<b>신고:</b> …”·“<b>서류 요청:</b> …”·“<b>제안:</b> …”으로 시작해 말하면 됩니다. 비서에게 “그건 정부24가 아니에요”라고 말해도 알림 창이 미리 채워져 열리며, <b>내가 보내기를 눌러야</b> 전송됩니다. 이름·번호 같은 개인정보는 자동으로 지우고 익명으로 전달하며, 하루 10건까지 보낼 수 있습니다.</p>\n<p>비서가 만든 서류는 <b>초안</b>입니다. 날짜·금액·당사자 이름은 직접 확인하세요.</p>","quiz":[{"q":"“작성 완료로 저장”한 서류가 보관되는 곳은?","options":["작성한 서류","Draft","보낸메일함"],"answer":0,"explain":"정답은 “작성한 서류”입니다."},{"q":"서류 화면의 “제출” 버튼은 무엇을 하나요?","options":["나비웹이 대신 접수한다","제출 방법을 단계별로 안내한다","서류를 삭제한다"],"answer":1,"explain":"정답은 “제출 방법을 단계별로 안내한다”입니다."},{"q":"서류 화면에서 질문하고 말로 고치는 곳은?","options":["나비웹 대화창(💬)","위쪽 바","주소록"],"answer":0,"explain":"정답은 “나비웹 대화창(💬)”입니다."},{"q":"첨부서류의 발급 기관이 틀렸을 때 알리는 방법이 아닌 것은?","options":["첨부서류 옆 ⚑ 누르기","대화창에 “신고: …” 쓰기","개인정보를 포함해 관리자에게 전화하기"],"answer":2,"explain":"정답은 “개인정보를 포함해 관리자에게 전화하기”입니다."}],"updated":"2026-11-15"},{"tier":"beginner","title":"나비 길잡이와 업무 — 메뉴와 첫 과제","id":"ch_guidecase","body":"<h2>나비 길잡이와 업무 — 메뉴와 첫 과제</h2>\n<p><b>나비 길잡이</b>: 누르면 입력창이 <b>과제 대화창</b>이 되고 그 아래에 <b>과제 계획서</b>가 대화에 따라 실시간으로 만들어집니다. 할 일의 <b>체크 칸</b>과 진행률 막대가 있고, 고치기·복사·파일로 받기·삭제 버튼이 있습니다.</p>\n<p>하위 메뉴 <b>진행 중</b>은 아직 끝내지 않은 과제, <b>완료한 과제</b>는 끝낸 과제 목록입니다. 마감이 다가오면 알려 줍니다.</p>\n<p><b>업무(Case)</b>는 나비 길잡이 화면 위쪽의 탭으로 오갑니다. 사건·거래·행사 한 건을 시작부터 종료·보관까지 기록하는 곳입니다. <b>맡은 일</b>(내가 서비스를 제공하는 쪽) · <b>맡긴 일</b>(내가 전문가에게 맡김) · <b>나 홀로</b>(상대 없이 나 자신의 일 — 끝나지 않은 일은 진행 중, 끝난 일은 완료 탭).</p>\n<p>나비 길잡이는 <b>계획</b>을, 업무는 <b>기록과 상대와의 합의</b>를 맡습니다. 같은 사람이 건마다 다른 역할을 할 수 있습니다.</p>\n<p><b>나비 길잡이</b>를 누르고 과제를 말합니다(예: “다음 달 동네 책 모임을 준비하고 싶어요”). 몇 번의 대화(보통 3회 안팎) 안에 <b>과제 계획서</b> 초안이 만들어지고, 마감일을 말하면 반영됩니다.</p>\n<p>할 일을 마칠 때마다 <b>체크 칸</b>을 눌러 진행률을 올립니다. 다음 메시지부터 나비 길잡이가 그 상태를 보고 답합니다. 끝나면 <b>완료한 과제</b>로 옮겨지고, 진행 중 화면에서 브라우저·서버 알림을 켤 수 있습니다.</p>\n<p><b>나비 길잡이 → 진행 중 탭 → 나 홀로 일의 ＋ 새 일</b>에서 제목과 종류(사건·건 / 거래 / 행사)를 정합니다. 나 홀로는 상대가 없어 바로 <b>진행 중</b>입니다. <b>진행 기록</b>에 메모를, <b>소통 이력</b>에 소통을 누가·누구와·언제·어디서·어떻게·무엇을·왜(6하원칙)로 남깁니다.</p>\n<p><b>기한</b>(예: 답변서 제출 2026-11-20)을 넣으면 비서가 7일 전·1일 전·당일에 알립니다. 내가 입력한 날짜 기준이며 법정 기한을 계산해 주지는 않습니다.</p>","quiz":[{"q":"나비 길잡이가 만들어 주는 것은?","options":["과제 계획서","메일 서명","가상 판결문"],"answer":0,"explain":"정답은 “과제 계획서”입니다."},{"q":"상대 없이 나 자신의 일(나 홀로)은 나비 길잡이의 어느 탭에 나오나요?","options":["맡은 일","맡긴 일","진행 중·완료"],"answer":2,"explain":"정답은 “진행 중·완료”입니다."},{"q":"“진행 중”에는 어떤 과제가 있나요?","options":["아직 끝내지 않은 과제","삭제한 과제","완료한 과제"],"answer":0,"explain":"정답은 “아직 끝내지 않은 과제”입니다."},{"q":"기한 알림은 언제 오나요?","options":["7일 전·1일 전·당일","매일","한 번도 안 옴"],"answer":0,"explain":"정답은 “7일 전·1일 전·당일”입니다."},{"q":"계획서의 진행률은 어떻게 바꾸나요?","options":["체크 칸을 누른다","자동으로만 바뀐다","바꿀 수 없다"],"answer":0,"explain":"정답은 “체크 칸을 누른다”입니다."}],"updated":"2026-11-15"},{"tier":"beginner","title":"K-Clean 첫걸음 — 사진 한 장으로 환경 신고하기","id":"ch_kclean_basic","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(38,38)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"6\" width=\"20\" height=\"16\" rx=\"3\"></rect><path d=\"M8 6l2-3h4l2 3\"></path><circle cx=\"12\" cy=\"14\" r=\"4\"></circle></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(162,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M9 11l3 3L22 4\"></path><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"></path></g></svg></div>\n<h2>K-Clean 첫걸음 — 사진 한 장으로 환경 신고하기</h2>\n<p>해변에 떠밀려온 쓰레기, 무단 투기 현장, 오염된 하천을 봤을 때 어디에 신고해야 할지 몰라 그냥 지나친 적 있나요? K-Clean은 <strong>사진 한 장과 몇 마디 말만으로</strong> 신고가 접수되는 나비의 환경 신고 AI 비서입니다.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"></line><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"></line></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">가장 쉬운 사용법</div>내 AI 비서에게 \"쓰레기 신고할게\" \"여기 해양 오염 신고해줘\"처럼 말하거나, 환경 관련 사진을 그냥 전송하기만 해도 K-Clean이 자동으로 열립니다. <a class=\"ch-link\" href=\"#\" data-goto=\"ch6\">「나비 숫자 코드」장</a>에서 다룬 나비 숫자 코드로 바로 들어갈 수도 있습니다.</div>\n</div>\n\n<h3>세 단계면 끝입니다</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"></path><circle cx=\"12\" cy=\"13\" r=\"4\"></circle></svg></div><div class=\"step-body\"><div class=\"step-title\">① 현장 사진 찍기</div><div class=\"step-desc\">신고하려는 현장을 폰 카메라로 찍거나, 이미 찍어둔 사진을 K-Clean 채팅창에 첨부합니다. 위치 정보(GPS)는 AI 비서가 자동으로 함께 전달하므로 주소를 직접 입력할 필요가 없습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"></path></svg></div><div class=\"step-body\"><div class=\"step-title\">② 한 줄 설명 (선택)</div><div class=\"step-desc\">\"해변에 그물이랑 스티로폼이 많이 밀려왔어요\"처럼 짧게 상황을 덧붙이면 더 정확하게 접수됩니다. 아무 말 없이 사진만 보내도 K-Clean이 내용을 알아서 분석합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 접수번호 확인</div><div class=\"step-desc\">\"RPT-2026-0000\" 같은 접수번호가 발급되면 신고 완료입니다. 이 번호로 언제든 처리 상황을 다시 조회할 수 있습니다.</div></div></div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"></path><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"></line><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"></line></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">로그인 없이도 신고할 수 있나요?</div>나비에 로그인돼 있지 않아도 신고 자체는 접수됩니다. 다만 로그인한 상태로 신고하면 내 접수 목록에서 처리 현황을 계속 확인할 수 있고, <a class=\"ch-link\" href=\"#\" data-goto=\"ch12\">「PDV 기록」장</a>에서 다루는 PDV 기록에도 남습니다.</div>\n</div>","quiz":[{"q":"K-Clean 신고에 최소한 필요한 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["서류 작성과 방문","현장 사진 한 장(설명은 선택)","사업자등록증","전화 통화"],"answer":1,"explain":"사진 한 장만 보내도 K-Clean이 내용을 분석해 접수합니다. 한 줄 설명은 선택입니다."},{"q":"신고할 위치(주소)는 어떻게 전달되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["반드시 직접 입력한다","AI 비서가 위치정보(GPS)를 자동으로 함께 전달한다","우편번호만 입력한다","위치는 전달되지 않는다"],"answer":1,"explain":"위치정보는 AI 비서가 자동으로 전달하므로 주소를 직접 입력할 필요가 없습니다."},{"q":"접수번호는 어디에 쓰나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["처리 상황을 다시 조회할 때","결제할 때","로그아웃할 때","쓸 곳이 없다"],"answer":0,"explain":"접수번호로 언제든 처리 상황을 조회할 수 있습니다."}],"updated":"2026-10-24"},{"tier":"intermediate","title":"사람과 사람의 대화, AI와 AI의 대화","id":"ch10","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:380px;display:block;margin:0 auto\">\n<circle cx=\"70\" cy=\"60\" r=\"26\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/><circle cx=\"150\" cy=\"60\" r=\"26\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<line x1=\"96\" y1=\"60\" x2=\"124\" y2=\"60\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/>\n<text x=\"110\" y=\"45\" text-anchor=\"middle\" font-size=\"10\" fill=\"#64748b\">느림</text>\n<text x=\"110\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"#334155\" font-weight=\"600\">사람 ↔ 사람</text>\n<circle cx=\"290\" cy=\"60\" r=\"26\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2\"/><circle cx=\"370\" cy=\"60\" r=\"26\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2\"/>\n<line x1=\"316\" y1=\"60\" x2=\"344\" y2=\"60\" stroke=\"#f59e0b\" stroke-width=\"2.5\"/>\n<text x=\"330\" y=\"45\" text-anchor=\"middle\" font-size=\"10\" fill=\"#b06000\">빛의 속도</text>\n<text x=\"330\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"#334155\" font-weight=\"600\">AI ↔ AI</text>\n</svg></div>\n<h2>사람과 사람의 대화, AI와 AI의 대화</h2>\n<p>사람끼리 대화하면 오해가 생기기도 하고 시간이 걸립니다. 반면 나비의 AI 비서끼리는 정보를 빠르고 정확하게 주고받습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">사람 ↔ 사람</div><div class=\"step-desc\">말투·감정·타이밍에 따라 전달이 느려지거나 오해가 생길 수 있습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">AI ↔ AI</div><div class=\"step-desc\">내 AI 비서가 상대의 AI 비서와 직접 조율해, 예를 들어 약속 시간 잡기 같은 일을 몇 초 만에 끝냅니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">그럼 사람 대 사람 대화는 필요 없나요?</div>아닙니다. 중요한 결정이나 감정적 교류는 여전히 사람이 직접 하는 게 좋습니다. AI ↔ AI는 반복적이고 사무적인 조율을 대신해주는 것입니다.</div></div>\n","quiz":[{"q":"AI와 AI 사이의 대화가 가진 장점은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg>","options":["더 감정적이다","빠르고 정확하게 정보를 주고받는다","항상 사람보다 느리다","불가능하다"],"answer":1,"explain":"AI끼리는
