l=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">K-Mail끼리도 대화할 수 있습니다</div><a class=\"ch-link\" href=\"#\" data-goto=\"ch10\">「사람과 사람의 대화, AI와 AI의 대화」장</a>에서 다룬 \"AI와 AI의 대화\"가 여기서도 적용됩니다 — 상대방도 K-Mail을 쓴다면, 사람이 며칠씩 주고받던 일정 조율을 K-Mail끼리 직접 여러 차례 주고받아 훨씬 빠르게 끝낼 수 있습니다.</div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">관리자용 공문 시스템과는 다릅니다</div>정부 공문을 다루는 gov-mail(hondi.org)은 관리자 전용으로 완전히 별개 시스템입니다 — K-Mail은 개인 사용자를 위한 메일 비서입니다.</div></div>","quiz":[{"q":"K-Mail로 메일을 보내는 기본적인 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>","options":["메일 앱을 따로 설치","자연어로 요청하면 AI가 초안·발송 처리","직접 HTML 코드 작성","불가능함"],"answer":1,"explain":"'누구누구한테 메일 보내줘'처럼 자연어로 요청하면 K-Mail이 초안부터 발송까지 처리합니다."},{"q":"K-Mail로 보낸 상대는 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["기록되지 않음","자동으로 주소록에 등록됨","삭제됨","별도 승인 필요"],"answer":1,"explain":"메일을 보낸 상대는 자동으로 주소록에 등록되어 이후 검색·재사용할 수 있습니다."},{"q":"상대방도 K-Mail을 쓸 때 벌어지는 일은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>","options":["아무 차이 없음","K-Mail끼리 직접 여러 차례 주고받으며 조율 속도가 빨라짐","오류가 발생함","메일이 차단됨"],"answer":1,"explain":"11장의 AI-AI 대화 원리처럼, K-Mail끼리 직접 조율해 사람이 며칠 걸리던 일을 빠르게 끝낼 수 있습니다."}],"updated":"2026-11-15"},{"tier":"intermediate","title":"K-Job — 구직 활동을 실행하는 AI","id":"ch_kjob","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></g></svg></div><h2>K-Job — 구직 활동을 실행하는 AI</h2><p>K-Job은 \"이직하고 싶다\"는 목표가 이미 구직 활동으로 확정된 뒤, 실제 지원서 작성·연습까지 실행하는 AI입니다. 설명만 하고 끝내지 않고 실제 초안·기록을 만들어냅니다.</p><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">K-Plan과의 관계</div>K-Plan은 \"이직이 지금 타당한 선택인지\"부터 따지는 상위 계획 AI이고, K-Job은 그 목표가 확정된 뒤의 실행 담당입니다 — K-Plan 없이 K-Job을 바로 불러도 동작합니다.</div></div><h3>사용 흐름</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 채용 공고 전달</div><div class=\"step-desc\">지원하고 싶은 공고나 요청을 K-Job에게 전달합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"/><polyline points=\"22 6 12 13 2 6\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 지원서 초안·연습</div><div class=\"step-desc\">자기소개서·이력서 초안을 만들고, 필요하면 면접 연습까지 진행합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 결과를 기록하고 배웁니다</div><div class=\"step-desc\">서류·면접 결과가 PDV(<a class=\"ch-link\" href=\"#\" data-goto=\"ch12\">「PDV 기록」장</a>)에 기록되면, 무엇이 잘못됐는지(문서 설계·표현·외부 변수) 자동으로 분석해 다음 지원에 반영합니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">내 경험이 다른 사람에게도 도움이 됩니다</div>이 분석에서 나온 교훈은 이름·회사명 등 개인 식별 정보를 뺀 채 패턴만 모아, 다른 사용자의 K-Job도 참고할 수 있는 공용 학습 자료로 쌓입니다.</div></div><h3>지금 되는 것과 아직 없는 것</h3><p>부분 가동 입니다. 이력서·자기소개서 초안 작성과 모의 면접은 쓸 수 있습니다.</p><ul><li>내가 알려 준 사실만으로 씁니다. 없는 경력·자격·성과를 지어내지 않고, 합격을 보장하는 말도 하지 않습니다.</li><li>채용 사이트에 자동으로 지원서를 제출하는 기능은 아직 없습니다.</li><li>실시간 채용 공고 수집·매칭, 영상 면접 분석(표정·목소리)도 아직 없습니다.</li><li>구직자 개인용이라 사업주 쪽 채용·인사·노무 대행은 하지 않습니다.</li></ul><p class=\"ch-note\">이 장 끝부분은 job.naviweb.kr 소개 화면(2026년 11월 15일)을 읽고 보탰습니다. 로그인 후 실행 화면은 아직 확인하지 못했습니다.</p>","quiz":[{"q":"K-Job과 K-Plan의 관계는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/></svg>","options":["완전히 같은 서비스","K-Plan은 목표 타당성 검토, K-Job은 확정된 목표의 실행 담당","K-Job이 K-Plan의 상위 개념","서로 무관함"],"answer":1,"explain":"K-Plan 없이도 K-Job은 단독으로 동작하며, 이미 구직으로 확정된 목표를 실제로 실행합니다."},{"q":"서류·면접 결과가 기록되면 K-Job이 하는 일은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["아무것도 안 함","결과를 자동 분석해 다음 지원에 반영","기록을 삭제함","다른 서비스로 이관"],"answer":1,"explain":"결과가 PDV에 기록되면 문서 설계·표현·외부 변수 중 무엇이 문제였는지 자동 분석해 재발을 막습니다."},{"q":"K-Job의 학습 결과가 다른 사용자에게도 도움이 되는 방식은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["개인정보를 그대로 공유","이름·회사명을 뺀 비식별 패턴으로 공용 저장소에 축적","공유되지 않음","유료 판매"],"answer":1,"explain":"개인 식별 정보를 제외한 비식별화된 패턴만 집단 학습 저장소에 쌓여 다른 사용자의 K-Job도 참고할 수 있습니다."}],"updated":"2026-11-15"},{"tier":"intermediate","title":"여러 K-서비스, 한 번의 로그인으로","id":"ch_ksso","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></g></svg></div><h2>여러 K-서비스, 한 번의 로그인으로</h2><p>K-Law·K-Plan·K-Mail처럼 각자 전용 화면(klaw.naviweb.kr, plan.naviweb.kr, mail.naviweb.kr)을 가진 K-서비스들은, 한 번만 로그인하면 <strong>세션을 서로 공유</strong>합니다.</p><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 따로 로그인 안 해도 되나요?</div>공용 인증 모듈(k-service-auth-client.js)이 여러 K-서비스 사이의 로그인 상태를 공유합니다 — K-Law에서 이미 로그인했다면 K-Mail로 넘어가도 다시 인증할 필요가 없습니다.</div></div><h3>동작 방식</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 아무 K-서비스에서 먼저 로그인</div><div class=\"step-desc\">어느 K-서비스든 첫 화면은 로그인 없이 열리고, 실제 기능을 쓰려는 순간 인증을 요구합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 다른 K-서비스로 이동</div><div class=\"step-desc\">다른 K-서비스 화면으로 넘어가도 이미 인증된 상태가 그대로 유지됩니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 로그아웃도 함께</div><div class=\"step-desc\">한 곳에서 로그아웃하면 공유된 세션 전체가 함께 종료됩니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">모든 K-서비스가 대상은 아닙니다</div>이 공유 인증은 klaw.naviweb.kr·plan.naviweb.kr·mail.naviweb.kr처럼 전용 서브도메인을 가진 K-서비스 사이에 적용됩니다. 대시보드 안에서 곧바로 열리는 K-서비스는 애초에 대시보드 로그인을 그대로 씁니다.</div></div>","quiz":[{"q":"K-Law에서 로그인한 뒤 K-Mail로 이동하면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></svg>","options":["다시 로그인해야 함","이미 인증된 상태가 유지됨","자동으로 로그아웃됨","이동이 불가능함"],"answer":1,"explain":"공용 인증 모듈이 세션을 공유해 여러 K-서비스 사이를 다시 로그인 없이 오갈 수 있습니다."},{"q":"한 K-서비스에서 로그아웃하면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>","options":["그 서비스만 로그아웃되고 나머지는 유지","공유된 세션 전체가 함께 종료","아무 변화 없음","계정이 삭제됨"],"answer":1,"explain":"세션을 공유하는 구조라, 한 곳에서 로그아웃하면 공유된 세션 전체가 함께 끝납니다."},{"q":"이 통합 로그인이 적용되는 대상은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["나비의 모든 화면 예외 없이","전용 서브도메인을 가진 K-서비스들 사이","전문가 페르소나 채팅만","해당 없음"],"answer":1,"explain":"klaw.hondi.net·plan.hondi.net·mail.hondi.net처럼 전용 서브도메인을 가진 K-서비스 사이에 적용됩니다."}],"updated":"2026-11-15"},{"tier":"intermediate","title":"의견 보내기 — 제안·질문 페이지와 법률 검토 탭","id":"ch_suggest","quiz":[{"q":"제안·질문 게시판에는 어떤 글이 기록되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["입력한 모든 글","대화로 의도를 확인한 제안·질문","관리자가 쓴 글만","기록되지 않는다"],"answer":1,"explain":"대화로 의도가 확인된 제안·질문만 기록됩니다."},{"q":"어떤 입력 방식을 고를지 모르겠다면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["\"자동 구분\"","쓸 수 없다","\"관리자\"","\"삭제\""],"answer":0,"explain":"자동 구분이 제안인지 질문인지 알아서 가려 줍니다."},{"q":"법률 검토 탭의 결과는 무엇을 대체할 수 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["인간 변호사 자문을 완전히 대체한다","참고용이며 인간 변호사 자문을 대체할 수 없다","판결을 대신한다","세금을 대신 낸다"],"answer":1,"explain":"참고용이며 인간 변호사 자문을 대체할 수 없습니다."}],"body":"<h2>의견 보내기 — 제안·질문 페이지와 법률 검토 탭</h2><p>전문가 페이지 위쪽 버튼으로 <strong>제안·질문 페이지</strong>를 열 수 있습니다. 불편한 점, 바라는 기능, 궁금한 점을 대화로 남기는 곳입니다.</p><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 입력 방식 고르기</div><div class=\"step-desc\">\"자동 구분\", \"제안\", \"질문\" 중에서 고릅니다. 모르겠으면 자동 구분이면 됩니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② AI와 대화</div><div class=\"step-desc\">AI가 말씀하신 의도를 대화로 확인합니다. 질문에는 최신 개발 현황을 담은 저장소 요약을 바탕으로 답합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 게시판 확인</div><div class=\"step-desc\">대화로 의도가 확인된 제안·질문만 게시판에 기록되며, 최신 글이 위에 옵니다. 전체/제안/질문으로 걸러 볼 수 있습니다.</div></div></div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">법률 검토 탭</div>전문가 페이지에서 \"법률 검토\" 모드로 전환하면, 해당 직역의 업무와 서류를 법령 관점에서 AI와 점검할 수 있습니다. 화면에는 <strong>참고용이며 인간 변호사 자문을 대체할 수 없다</strong>는 안내가 함께 표시됩니다.</div></div>","updated":"2026-10-24"},{"tier":"intermediate","title":"K-Clean 신고 처리 — 사진·동영상에서 조치까지","id":"ch_kclean_report","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:260px;display:block;margin:0 auto\"><circle cx=\"50\" cy=\"70\" r=\"42\" fill=\"#eaf3fc\"/><g transform=\"translate(32,52)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"0\" y=\"4\" width=\"36\" height=\"26\" rx=\"3\"></rect><circle cx=\"18\" cy=\"17\" r=\"7\"></circle></g><circle cx=\"120\" cy=\"70\" r=\"42\" fill=\"#fef7e0\"/><g transform=\"translate(102,52)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"></path><path d=\"M6 10h12M6 15h8\"></path></g><circle cx=\"190\" cy=\"70\" r=\"42\" fill=\"#e6f4ea\"/><g transform=\"translate(172,52)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"></path><polyline points=\"8 12 11 15 16 9\"></polyline></g></svg></div>\n<h2>K-Clean 신고 처리 — 사진·동영상에서 조치까지</h2>\n<p>K-Clean이 다른 신고 채널과 다른 점은, 신고를 접수만 하고 끝나는 게 아니라 <strong>담당 기관이 실제로 조치하도록 끝까지 추적</strong>한다는 것입니다. 사진·동영상 한 건이 어떻게 공식 처리 절차로 바뀌는지 살펴보겠습니다.</p>\n\n<h3>1) AI가 현장을 읽습니다</h3>\n<p>업로드한 사진(정지영상은 물론, 동영상의 대표 프레임도 함께)을 Gemini Vision 기반 이미지 분석 AI가 확인해 다음을 자동으로 뽑아냅니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z\"></path><circle cx=\"12\" cy=\"10\" r=\"3\"></circle></svg></div><div class=\"step-body\"><div class=\"step-title\">위치</div><div class=\"step-desc\">사진의 GPS 태그(EXIF)와 신고 시점의 AI 비서 위치정보를 대조해 정확한 지점을 특정합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"></rect><path d=\"M3 9h18M9 21V9\"></path></svg></div><div class=\"step-body\"><div class=\"step-title\">종류·규모</div><div class=\"step-desc\">해양 쓰레기·불법 투기·산림 훼손·오염 폐수 등 종류를 분류하고, 사진 속 면적·부피로 대략적인 규모를 추정합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"></path><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"></line><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"></line></svg></div><div class=\"step-body\"><div class=\"step-title\">긴급도</div><div class=\"step-desc\">기름 유출처럼 확산 위험이 있는 경우 \"긴급\"으로 자동 표시해 우선 처리 대상이 되도록 합니다.</div></div></div>\n</div>\n\n<h3>2) 서류가 자동으로 만들어집니다</h3>\n<p>분석 결과를 바탕으로 K-Clean이 <strong>환경신고서</strong>와, 필요한 경우 <strong>수거 견적서</strong>를 자동으로 작성합니다. 사람이 서식을 채우지 않아도 담당 기관 실무자가 바로 검토할 수 있는 형태로 정리됩니다.</p>\n\n<h3>3) 담당 기관에 배정되고, 상태가 추적됩니다</h3>\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"></path><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"></path></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">\"신고하고 끝\"이 아닙니다</div>신고 건은 <code>접수 → 처리중 → 완료</code> 순으로 상태가 관리되고, 내 접수번호로 언제든 지금 어느 단계인지 확인할 수 있습니다. 오래 방치된 건은 담당 부서에 다시 알리는 방식으로 실제 조치를 강제합니다 — 신고서를 접수해두고 잊혀지는 걸 막는 것이 K-Clean의 핵심입니다.</div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"></line><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"></line></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">동영상도 되나요?</div>동영상은 대표 장면을 정지영상으로 뽑아 같은 방식으로 분석합니다. 물이 흘러가는 방향이나 투기 순간처럼 사진 한 장으로는 안 보이는 정황을 설명에 함께 적어주면 분석 정확도가 올라갑니다.</div>\n</div>","quiz":[{"q":"K-Clean이 다른 신고 채널과 다른 점은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["접수만 하고 끝낸다","담당 기관이 실제로 조치하도록 끝까지 추적한다","신고자가 직접 수거한다","동영상만 받는다"],"answer":1,"explain":"접수 후에도 상태를 추적하고 방치된 건은 담당 부서에 다시 알립니다."},{"q":"\"긴급\"으로 자동 표시되는 대표적인 경우는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["쓰레기가 1개일 때","기름 유출처럼 확산 위험이 있을 때","낮에 찍은 사진일 때","로그인하지 않았을 때"],"answer":1,"explain":"확산 위험이 있는 경우는 긴급으로 표시해 우선 처리 대상이 됩니다."},{"q":"K-Clean이 자동으로 작성하는 서류는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["환경신고서(필요시 수거 견적서)","세금계산서","여권","계약서 일체"],"answer":0,"explain":"분석 결과로 환경신고서를, 필요하면 수거 견적서를 자동 작성합니다."}],"updated":"2026-10-24"},{"tier":"intermediate","id":"ch_pay","title":"코드로 결제하고 결제받기","updated":"2026-11-15","body":"<h2>코드로 결제하고 결제받기</h2>\n<p><b>하는 일</b>: 나비 코드(10자리 숫자)로 GDC를 주고받습니다. 카드 수수료가 없고 GDC 지갑 간 직접 이체입니다.</p>\n<h3>결제하기(사는 사람)</h3>\n<ul><li><b>코드로 결제</b> 화면에서 판매자의 <b>나비 코드(10자리)</b>를 입력합니다.</li><li><b>결제 금액(GDC)</b>과 <b>품목/메모</b>를 적고 <b>결제하기</b>를 누릅니다.</li></ul>\n<h3>결제받기(파는 사람)</h3>\n<ul><li><b>결제받기</b> 화면에 내 코드가 나타납니다. 이 코드를 손님께 보여 주면 GDC로 결제받을 수 있습니다.</li><li>코드를 불러오는 중이면 잠시 기다리세요.</li></ul>\n<h3>알아 둘 점</h3>\n<ul><li>금액은 보내기 전에 한 번 더 확인하세요. 잘못 보낸 이체를 되돌리는 방법은 이 장에서 확인되지 않았습니다.</li><li>나비 코드가 무엇인지는 “나비 숫자 코드” 장을 보세요.</li></ul>\n<p class=\"ch-note\">이 장은 pay-code.html·receive-payment.html 화면 문구를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"판매자에게 코드로 결제할 때 입력하는 것은?","options":["판매자의 나비 코드(10자리 숫자)","판매자의 카드 번호","판매자의 주민등록번호"],"answer":0,"explain":"정답은 “판매자의 나비 코드(10자리 숫자)”입니다."},{"q":"코드로 결제받을 때 카드 수수료는?","options":["카드 수수료가 붙는다","없다 — GDC 지갑 간 직접 이체다","금액의 절반이다"],"answer":1,"explain":"정답은 “없다 — GDC 지갑 간 직접 이체다”입니다."}]},{"tier":"intermediate","id":"ch_schedule_group","title":"일정 관리와 모임","updated":"2026-11-15","body":"<h2>일정 관리와 모임</h2>\n<p><b>하는 일</b>: 개인 일정을 적어 두고, 관심사로 모임을 만들어 참여합니다.</p>\n<h3>일정 관리</h3>\n<ul><li><b>제목</b>, <b>일시</b>, <b>메모(선택)</b>를 적고 <b>일정 추가</b>를 누릅니다.</li><li>“개인 일정을 등록하고 관리하세요.”라고 안내됩니다.</li></ul>\n<h3>모임</h3>\n<ul><li><b>모임 이름</b>, <b>카테고리</b>, <b>소개(선택)</b>를 적고 <b>모임 만들기</b>를 누릅니다.</li><li><b>알고리즘 자동 매칭은 아직 없습니다.</b> 사용자가 직접 만든 모임 목록입니다.</li><li>참여한 뒤의 실제 대화는 나비 채팅으로 이어갑니다.</li></ul>\n<p class=\"ch-note\">이 장은 schedule.html·community.html 화면 문구를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"모임 기능에서 알고리즘 자동 매칭은?","options":["있다","아직 없다 — 사용자가 직접 만든 모임 목록이다","유료로만 있다"],"answer":1,"explain":"정답은 “아직 없다 — 사용자가 직접 만든 모임 목록이다”입니다."},{"q":"일정을 추가할 때 꼭 적지 않아도 되는 칸은?","options":["제목","일시","메모"],"answer":2,"explain":"정답은 “메모”입니다. 메모는 선택 사항입니다."}]},{"tier":"intermediate","id":"ch_consent_perm","title":"내 정보를 보겠다는 요청 — 조회 동의와 권한 설정","updated":"2026-11-15","body":"<h2>내 정보를 보겠다는 요청 — 조회 동의와 권한 설정</h2>\n<p><b>하는 일</b>: 어떤 서비스가 내 데이터 금고(PDV)를 보겠다고 하면 <b>PDV 조회 동의</b> 화면이 뜹니다. 카메라·마이크·위치는 <b>권한 설정</b>에서 허용합니다.</p>\n<h3>PDV 조회 동의</h3>\n<ul><li>화면에 <b>요청 서비스</b>, <b>조회 범위</b>, <b>조회 기간</b>이 보입니다. 세 가지를 읽고 판단하세요.</li><li><b>동의하고 계속하기</b> 또는 <b>거부</b>를 고릅니다. 모르는 서비스이거나 범위가 넓으면 거부하세요.</li><li>“문제가 발생했습니다”가 보이면 요청 정보를 불러오지 못한 것입니다. 동의하지 말고 요청한 서비스에 다시 시도해 달라고 하세요.</li></ul>\n<h3>권한 설정</h3>\n<ul><li><b>카메라</b>(나비 코드 스캔, 신원 확인) · <b>마이크</b>(AI 비서 음성 입력) · <b>위치</b>(주변 서비스 탐색)를 허용합니다. 처음에는 “대기” 상태입니다.</li><li><b>권한 허용하기</b>를 누르거나 <b>나중에</b>를 고를 수 있습니다.</li><li>화면 안내에 따르면 권한은 이 기기에만 저장되며 나비 서버로 전송되지 않습니다.</li></ul>\n<p class=\"ch-note\">이 장은 consent.html·permission.html 화면 문구를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"PDV 조회 동의 화면에서 확인할 세 가지는?","options":["요청 서비스 · 조회 범위 · 조회 기간","비밀번호 · 이름 · 주소","금액 · 날짜 · 장소"],"answer":0,"explain":"정답은 “요청 서비스 · 조회 범위 · 조회 기간”입니다."},{"q":"마이크 권한은 무엇에 쓰이나요?","options":["AI 비서 음성 입력","나비 코드 스캔","주변 서비스 탐색"],"answer":0,"explain":"정답은 “AI 비서 음성 입력”입니다. 카메라는 코드 스캔·신원 확인, 위치는 주변 서비스 탐색입니다."}]},{"tier":"intermediate","id":"ch_watch","title":"불법행위 신고 정리와 K-Watch","updated":"2026-11-15","body":"<h2>불법행위 신고 정리와 K-Watch</h2>\n<p><b>하는 일</b>: 목격한 부당함을 정리해 신고로 이어 줍니다. 신고 정리 화면은 K-Watch로 통합될 예정이며, K-Watch는 <b>부분 가동</b> 중입니다.</p>\n<h3>지금 쓸 수 있는 것 — 불법행위 신고 정리</h3>\n<ul><li><b>유형</b>을 고릅니다: 교통법규위반 · 바가지 요금 · 불법 주정차 · 기타.</li><li><b>장소(선택)</b>와 <b>내용</b>을 적고 <b>정리하기</b>를 누릅니다.</li><li>나비는 관공서에 직접 신고를 접수하지 않습니다. 정리한 내용을 가지고 실제 접수는 <b>안전신문고</b>에서 직접 진행하세요.</li></ul>\n<h3>K-Watch가 하려는 일</h3>\n<ul><li>강도·절도뿐 아니라 쓰레기, 도로 위 동물 사체, 배기가스가 심한 차량, 고객 차별처럼 부당·불법·편법·오염·파손으로 분류되는 사건이 대상입니다.</li><li>흐름: 신고 내용 파악(K-Intent) → 대응 기관 선정(K-Compose) → 접수(K-Execute) → 결과 정리(K-Deliver) → 기록과 진행 상황 공개(K-Report).</li><li>K-Police는 대화 중 본인의 위험 신호를 감지해 신고하고, K-Watch는 제3자로서 목격한 사건을 다룹니다.</li></ul>\n<h3>정직한 한계(준비 중)</h3>\n<ul><li>기관 시스템에 <b>자동으로 접수하는 연동은 아직 없습니다</b>. 접수 서식 작성과 안내까지입니다.</li><li>기관이 공개하지 않은 처리 결과를 추정해 알려주지 않습니다.</li><li>신고 대상자의 신원을 확인하거나 특정하지 않습니다. 이는 관할 기관의 몫입니다.</li></ul>\n<p class=\"ch-note\">이 장은 watch.naviweb.kr 소개 화면(2026년 11월 15일)을 읽고 쓴 글입니다. 지갑으로 로그인한 뒤의 실행 화면은 아직 확인하지 못해, 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"나비의 불법행위 신고 정리가 직접 해 주지 않는 것은?","options":["신고 내용 정리","관공서에 신고 접수","유형 분류"],"answer":1,"explain":"정답은 “관공서에 신고 접수”입니다. 실제 접수는 안전신문고에서 직접 합니다."},{"q":"K-Watch가 다루는 사건은?","options":["본인의 위험 신호만","제3자로서 목격한 부당·불법·편법·오염·파손 사건","민사 소송만"],"answer":1,"explain":"정답은 “제3자로서 목격한 부당·불법·편법·오염·파손 사건”입니다."}]},{"tier":"intermediate","id":"ch_ksearch","title":"K-Search — 사람·AI 비서·상품 찾기","updated":"2026-11-15","body":"<h2>K-Search — 사람·AI 비서·상품 찾기</h2>\n<p><b>하는 일</b>: 나비 안의 모든 검색을 맡는 하나뿐인 검색 에이전트입니다. 사람·AI 비서를 찾는 일부터 K-Market이 맡기는 판매자·상품 탐색까지 합니다. 검색 핵심 기능은 가동 중이고 일부 후속 기능은 구현 중입니다(<b>부분 가동</b>).</p>\n<h3>어떻게 찾나</h3>\n<ul><li>키워드와 유형(주소·직업·닉네임·핸들·GDC 보유 여부·신뢰도 등)으로 범위를 좁힙니다.</li><li>“이 사람이 맞습니까?”를 스스로 판단하고, 확신이 없으면 추측하지 않고 되묻습니다.</li><li>결과가 없으면 지어내지 않고 솔직하게 안내합니다.</li></ul>\n<h3>지켜지는 원칙</h3>\n<ul><li>실제로 조회한 결과만 돌려줍니다. 비슷한 후보가 둘 이상이면 임의로 고르지 않고 되묻거나 후보를 보여 줍니다.</li><li>내 취향·이력·관계 정보는 검색당하는 사람에게 보이지 않습니다. 공개 프로필 범위 안에서만 검색합니다.</li><li>정식 서명 계정인지 미청구 임시 프로필인지 구분해서 알려 줍니다.</li></ul>\n<h3>준비 중</h3>\n<ul><li>미청구 프로필 자동 생성 같은 일부 후속 기능은 아직 구현 중입니다.</li></ul>\n<p class=\"ch-note\">이 장은 search.naviweb.kr 소개 화면(2026년 11월 15일)을 읽고 쓴 글입니다. 지갑으로 로그인한 뒤의 실행 화면은 아직 확인하지 못해, 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"후보가 둘 이상으로 비슷할 때 K-Search는?","options":["아무나 하나를 골라 준다","임의로 고르지 않고 되묻거나 후보를 보여 준다","검색을 중단한다"],"answer":1,"explain":"정답은 “임의로 고르지 않고 되묻거나 후보를 보여 준다”입니다."},{"q":"내 취향·이력 정보는 검색당하는 사람에게?","options":["보인다","보이지 않는다 — 공개 프로필 범위 안에서만 검색한다","관리자에게만 보인다"],"answer":1,"explain":"정답은 “보이지 않는다 — 공개 프로필 범위 안에서만 검색한다”입니다."}]},{"tier":"intermediate","id":"ch_plan_pricing","title":"플랜 고르기와 업그레이드 (준비 중)","updated":"2026-11-15","quiz":[{"q":"플랜(요금제)과 전문가 인증·구독의 현재 상태는?","options":["이미 결제할 수 있다","준비 중이다","폐지됐다"],"answer":1,"explain":"정답은 “준비 중이다”입니다."},{"q":"이 장은 언제 채워지나요?","options":["확정된 금액과 화면이 생기면","매달 자동으로","채워지지 않는다"],"answer":0,"explain":"정답은 “확정된 금액과 화면이 생기면”입니다."}],"body":"<h2>플랜 고르기와 업그레이드 (준비 중)</h2>\n<p>이 장은 아직 쓸 수 없습니다. 요금제와 구독은 확정되기 전이라 화면과 금액을 확인한 뒤에 쓰겠습니다.</p>\n<ul><li>전문가 인증과 구독은 <b>준비 중</b>입니다.</li><li>확정된 금액과 화면이 생기면 이 장에 플랜 비교, 업그레이드 방법, 결제 방법을 채웁니다.</li></ul>\n<p class=\"ch-note\">초안 자리 표시 장입니다.</p>"},{"tier":"intermediate","id":"ch_kestate","title":"K-Estate — 부동산 가치평가·매물 찾기 (초안 단계)","updated":"2026-11-15","body":"<h2>K-Estate — 부동산 가치평가·매물 찾기</h2>\n<p><b>하는 일</b>: 부동산 가치를 국가·지역·개별 3단계로 나눠 계산하는 평가 엔진입니다. 감정평가법의 조정 순서(시점수정 → 지역요인 비교 → 개별요인 비교)를 따릅니다. AI는 출처와 조회일이 붙은 원자료만 모으고, 계수·불확실성·권리 차감의 실제 계산은 정해진 코드가 합니다.</p>\n<h3>지금 해 볼 수 있는 것(소개 화면 기준)</h3>\n<ul><li><b>물건 등록</b>: 대화로 매물 정보(면적·층·관리비·주차·희망 가격, 나중에 알면 곤란할 수 있는 사항)를 순서대로 채웁니다. 가격이 적정한지는 판단하지 않고 말한 그대로 기록합니다. 정리된 내용이 실제 매물로 자동 게시되지는 않으므로, 복사해서 담당자에게 전달하세요.</li><li><b>물건 검색</b>: 지역·건물 형태·가격대를 말하면 AI가 웹에서 찾은 매물만 출처·조회일과 함께 나열합니다. 가격 평가나 “좋은 매물” 추천은 하지 않습니다. 로그인 없이 써 볼 수 있습니다.</li></ul>\n<h3>알아 둘 점</h3>\n<ul><li>소개 화면에 “초안 단계”라고 표시되어 있습니다. 3단계 평가 부분은 아직 이용자에게 서빙되지 않는다고 적혀 있습니다.</li><li>결과가 이상하면 조건을 다르게 말해 다시 시도하세요.</li></ul>\n<p class=\"ch-note\">이 장은 estate 저장소 소개 화면 문구(2026-11-15 기준)를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-Estate의 물건 검색이 하지 않는 것은?","options":["검색 결과 나열","가격 평가와 “좋은 매물” 추천","출처 표시"],"answer":1,"explain":"정답은 “가격 평가와 “좋은 매물” 추천”입니다."},{"q":"물건 등록으로 정리한 내용은?","options":["자동으로 매물로 게시된다","자동 게시되지 않으므로 복사해 담당자에게 전달한다","법원에 제출된다"],"answer":1,"explain":"정답은 “자동 게시되지 않으므로 복사해 담당자에게 전달한다”입니다."}]},{"tier":"intermediate","id":"ch_kcity","title":"K-City — 도시 설계 자문 (초안·준비 중)","updated":"2026-11-15","body":"<h2>K-City — 도시 설계 자문 (초안·준비 중)</h2>\n<p><b>하는 일</b>: 도시(읍·면·동 포함) 전체의 시민 복지 총합(주거·의료·교육·금융·교통·통신·레저 등)이 가장 좋아지는 시설의 조합(입지·규모·용량 배분)을 설계하는 서비스입니다.</p>\n<h3>현재 상태 — 준비 중</h3>\n<ul><li>저장소 기준으로 <b>초안(v0.1)</b>이며 아직 서비스 목록에 등록되지 않았고 라우팅에도 연결되지 않았습니다.</li><li>결과물은 <b>자문 설계안</b>입니다. 실제 인허가와 행정처분은 항상 해당 지자체·국가기관의 법적 권한입니다.</li><li>K-Democracy(시민 심의), K-JIT(장기 조달 예측)와의 연동은 앞으로 점검할 일로 적혀 있습니다.</li></ul>\n<p>서비스가 열리면 이 장에 화면과 쓰는 방법을 채웁니다.</p>\n<h3>소개 화면에서 확인한 것</h3><ul><li>city.naviweb.kr 첫 화면에 “초안(v0.1) 단계”라고 표시됩니다. 주거·의료·교육·금융·교통·통신·레저 7개 부문을 한꺼번에 계산합니다.</li><li>안 하나만 내지 않고, 예산·우선순위별로 대안을 2개 이상 나란히 비교한다고 적혀 있습니다.</li><li>하위 모듈로 도시정비(재개발·재건축)와 감정평가가 있습니다.</li><li>“설계안 요청하기”는 로그인·과금 흐름까지만 동작하고, 실제 AI 설계안 산출은 백엔드 연결 이후에 됩니다. 그래서 지금은 설계안을 받아 볼 수 없습니다.</li><li>부문별 가중치 모델은 초안 수준이고 아직 실측 검증이 없다고 밝혀 두었습니다.</li></ul><p class=\"ch-note\">이 장은 city.naviweb.kr 소개 화면(2026년 11월 15일)을 읽고 쓴 글입니다. 서비스가 열리면 화면과 쓰는 방법을 채웁니다.</p>","quiz":[{"q":"K-City의 결과물은?","options":["인허가 결정","자문 설계안","법원 결정"],"answer":1,"explain":"정답은 “자문 설계안”입니다. 실제 인허가는 지자체·국가기관이 합니다."},{"q":"K-City의 현재 상태는?","options":["정식 서비스 중","초안·준비 중","종료"],"answer":1,"explain":"정답은 “초안·준비 중”입니다."}]},{"tier":"intermediate","id":"ch_kplan","title":"K-Plan — 목표를 이루는 최선의 경로 찾기","updated":"2026-11-15","body":"<h2>K-Plan — 목표를 이루는 최선의 경로 찾기</h2>\n<p><b>하는 일</b>: 내가 이루고 싶은 목표를 내 데이터 금고(PDV)와 함께 보고 가장 좋은 방안을 찾는 계획 보조 AI입니다. 오늘 점심 메뉴부터 3년 안의 이직까지 같은 방식으로 다룹니다. 지갑 로그인이 필요하고 <b>부분 가동</b> 중입니다.</p>\n<h3>다른 서비스와 다른 점</h3>\n<ul><li>요청을 곧바로 실행하지 않고, 그 요청이 목표에 닿는 최선의 길인지부터 평가합니다.</li><li>계획이 정해진 뒤에도 끝나지 않고 계속 점검합니다.</li><li>K-Plan은 나를 대신하지 않습니다. 목표를 경로로 나누고 타당한지 검증하며 함께 다듬습니다. 최종 결정과 실행(발송·결제 등)은 항상 내 몫입니다.</li></ul>\n<h3>먼저 할 일</h3>\n<ul><li>K-Plan이 제일 먼저 하는 일은 내가 그 목표를 이룰 능력이 있는지 파악하는 것입니다. 능력이 없는 목표는 10배로 늘려도 달라지지 않는다고 안내합니다.</li><li>물리적으로 불가능하거나 터무니없는 목표는 계획 수립에 들어가기 전에 짚어 줍니다.</li></ul>\n<h3>아직 없는 것</h3><ul><li>담당자 연락처를 자동으로 찾아 확정하는 기능은 없습니다. 공공데이터나 내 금고에 없으면 직접 확인해야 합니다.</li><li>메일·공문은 초안까지만 쓰고 발송은 내가 합니다. 항공편·숙소 같은 결제도 내 승인이 필요합니다.</li><li>상대방이 실제로 어떻게 답할지 예측하지 않습니다. 답을 받은 뒤에 내가 알려 주어야 남은 계획을 고칩니다.</li></ul><p class=\"ch-note\">이 장은 plan.naviweb.kr 소개 화면(2026년 11월 15일)을 읽고 쓴 글입니다. 지갑으로 로그인한 뒤의 실행 화면은 아직 확인하지 못해, 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-Plan에서 최종 결정과 실행은 누가 하나요?","options":["K-Plan이 대신 한다","항상 사용자 몫이다","관리자가 한다"],"answer":1,"explain":"정답은 “항상 사용자 몫이다”입니다."},{"q":"K-Plan이 가장 먼저 하는 일은?","options":["결제","목표를 이룰 내 능력과 의도의 타당성 파악","메일 발송"],"answer":1,"explain":"정답은 “목표를 이룰 내 능력과 의도의 타당성 파악”입니다."}]},{"tier":"intermediate","id":"ch_kbiz","title":"K-Biz — 사업자 행정 대행","updated":"2026-11-15","body":"<h2>K-Biz — 사업자 행정 대행</h2>\n<p><b>하는 일</b>: 사업체를 운영하며 떠맡는 일 중 “행정”을 정리해 줍니다. 관할 부서를 확인하고 필요한 서류와 순서를 한 번에 하나씩 안내합니다. <b>부분 가동</b>입니다 — 상권 분석·리뷰 답글은 라이브, 서류 자동 작성은 앞으로의 일입니다.</p>\n<h3>다루는 일</h3>\n<ul><li><b>사업자 등록·법인 설립</b>: 사업자등록 → 위생교육 → 영업신고 → 소방시설 완비증명 → 원산지표시판 등록, 직원을 뽑으면 4대보험 성립신고까지. 순서가 꼬이면 접수가 안 됩니다.</li><li><b>산업재해 신고</b>: 사고 정황을 먼저 정리하고 어떤 기관에 어떤 순서로 신고할지 안내합니다. 법적 판단·과실 확정은 노무사·변호사 연결로 이어집니다.</li><li><b>특허·지재권 출원 안내</b>: 유사 선행 사례를 조회해 안내합니다.</li></ul>\n<h3>준비 중</h3>\n<ul><li>정부24·gdoc.go.kr·dpaper.kr 연동은 부분 구현입니다. dpaper.kr(전자문서지갑)은 정식 이용 신청 승인이 진행 중이라고 적혀 있습니다.</li></ul>\n<p class=\"ch-note\">이 장은 biz.naviweb.kr 소개 화면(2026년 11월 15일)을 읽고 쓴 글입니다. 지갑으로 로그인한 뒤의 실행 화면은 아직 확인하지 못해, 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-Biz가 대행하는 것은?","options":["장사(영업)","행정","대출"],"answer":1,"explain":"정답은 “행정”입니다."},{"q":"산업재해 신고에서 법적 판단과 과실 확정은?","options":["K-Biz가 확정한다","노무사·변호사 연결로 이어진다","자동으로 결정된다"],"answer":1,"explain":"정답은 “노무사·변호사 연결로 이어진다”입니다."}]},{"tier":"intermediate","id":"ch_ktelecom","title":"K-Telecom — 통신사 업무 안내","updated":"2026-11-15","body":"<h2>K-Telecom — 통신사 업무 안내</h2>\n<p><b>하는 일</b>: 휴대폰 요금제·인터넷/IPTV·유심·로밍·결합상품 같은 통신사 일을 대화로 파악해 절차를 안내합니다. 지갑 로그인이 필요하고 라이브로 운영 중이라고 표시됩니다.</p>\n<h3>다루는 일</h3>\n<ul><li>요금제 변경·조회, 결합상품, 통신사 멤버십 혜택 확인</li><li>인터넷·IPTV 신규설치·해지, 유심 재발급·개통, 공유기·인터넷 AS 신청</li><li>로밍 신청, 기기변경 예약, 통신요금 자동이체 등록, 스팸문자 신고 접수</li></ul>\n<h3>직접 해야 하는 것</h3>\n<ul><li>명의도용을 막으려고, 본인인증이 필요한 최종 실행(개통·명의변경·해지 등)은 내가 통신사 앱이나 대리점에서 직접 끝내야 합니다.</li><li>분실신고: 임시 정지 신청 절차는 바로 안내하지만 실제 정지(본인인증 필요)는 통신사 앱·고객센터(114 등)로 연결됩니다.</li><li>단말기 자체 구매(기기값 결제)는 K-Market 소관이고, 통신사 결합 프로그램형 기기변경은 K-Telecom 소관입니다.</li></ul>\n<p class=\"ch-note\">이 장은 telecom.naviweb.kr 소개 화면(2026년 11월 15일)을 읽고 쓴 글입니다. 지갑으로 로그인한 뒤의 실행 화면은 아직 확인하지 못해, 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"회선 개통·명의변경·해지 같은 최종 실행은?","options":["K-Telecom이 대신 한다","본인이 통신사 앱·대리점에서 직접 마친다","자동 처리된다"],"answer":1,"explain":"정답은 “본인이 통신사 앱·대리점에서 직접 마친다”입니다."},{"q":"단말기 자체를 사는 일은 어느 서비스 소관인가요?","options":["K-Market","K-Telecom","K-Plan"],"answer":0,"explain":"정답은 “K-Market”입니다."}]},{"tier":"intermediate","title":"나비로 — 법원·등기소·관공서에 내는 법률 서류","id":"ch_site_law","body":"<h2>나비로 — 법원·등기소·관공서에 내는 법률 서류</h2>\n<p><b>하는 일</b>: <a href=\"https://law.naviweb.kr\" target=\"_blank\" rel=\"noopener\">law.naviweb.kr</a>에서 법원·등기소·관공서에 내는 법률 서류를 한 화면에서 작성합니다. 서류 이름을 입력하면 서식이 바로 펼쳐지고, 작성 중인 내용은 Draft(초안)에 실시간으로 자동 저장됩니다. 별도의 저장 버튼은 필요 없습니다.</p>\n<h3>시작 전에</h3>\n<ul>\n<li>나비웹에 로그인한 상태여야 합니다(오른쪽 위에 내 이름이 보입니다). 로그인은 “가입하기”·“PC로 로그인하기” 장을 보세요.</li>\n<li>인적사항은 내 데이터 금고(PDV)에서 가져와 파란 칸으로 채워지고, 고칠 수 있습니다. 다른 사람의 서류를 쓸 때는 그 사람의 정보인지 꼭 확인하세요.</li>\n<li>첨부 파일을 올리려면 나비웹 도우미가 켜져 있어야 합니다(“나비웹 도우미 설치하기” 장).</li>\n</ul>\n<h3>화면 구성</h3>\n<ul>\n<li><b>첫 화면</b>: “2026년 11월 15일 현재, 11,289건의 민원 & 법원 서류를 작성합니다.”라는 문장과 입력창이 있고, 입력창에는 “예: 소유권이전등기 신청서, 답변서, 내용증명”처럼 예시가 보입니다. 서류 수는 날마다 늘어날 수 있습니다.</li>\n<li><b>왼쪽 메뉴</b>: 평소에는 아이콘만 보이고, 마우스를 올리면 <b>나비 플랫폼 · 홈 · 내 서류 목록 · 사용법 · 사이트의 특징</b> 글자가 함께 펼쳐집니다.</li>\n<li><b>머리말 오른쪽</b>: 국가(South Korea) · <b>제안</b> · 설정(톱니바퀴) · 사용자 이름. 머리말 오른쪽에 <b>K-Law</b> 버튼이 있습니다. 서류 수가 가장 많은 사이트로, 2026년 11월 15일 화면에는 11,289건이 표시됩니다.</li>\n<li><b>오른쪽 아래 💬 버튼</b>: 서류 비서와 대화하는 창을 엽니다.</li>\n</ul>\n<h3>서류 쓰는 순서</h3>\n<ul>\n<li>입력창에 서류 이름(예: 내용증명)을 입력합니다. 글자를 치는 즉시 서식이 펼쳐집니다.</li>\n<li>비슷한 서류가 있으면 서식 위의 버튼에서 고릅니다.</li>\n<li>엔터 키를 누르면 같은 화면에서 AI가 초안을 위에서부터 작성합니다.</li>\n<li>성명·주소·전화번호·이메일 같은 인적사항은 PDV에서 가져와 파란 칸으로 자동 입력됩니다. 틀리면 고치세요.</li>\n<li>남은 빈 칸을 채우면 <b>내 서류 목록</b>에 자동 저장됩니다. 서류 위·아래의 <b>제출 결과 예상</b>은 접수 결과를 미리 가늠해 보는 참고 기능이며, 실제 접수 결과를 보장하지 않습니다.</li>\n<li>다 쓴 서류는 <b>전달</b>(메일에 첨부) · <b>제출</b> · <b>내려받기</b>(PDF, MS-Word)로 이어갈 수 있습니다.</li>\n</ul>\n<h3>내 서류 목록 · 사용법 · 사이트의 특징 · 설정</h3>\n<ul>\n<li><b>내 서류 목록</b>: 내가 쓴 서류를 모아 보며 <b>시간순</b> 등으로 정렬합니다. 아직 쓴 서류가 없으면 “작성한 서류가 없습니다.”가 보입니다.</li>\n<li><b>사용법</b>: 오른쪽에서 열리는 5단계 안내(서류 이름 입력 · 서류 선택 · 엔터 키로 작성 시작 · 의뢰인 정보 자동 기입 · 빈 칸 입력과 저장)입니다.</li>\n<li><b>사이트의 특징</b>: 이 분야 서류를 한 곳에서 쓰고 제출 결과를 미리 볼 수 있다는 점, 화면 안내에 “국산 LLM과 국내 서버를 사용해 데이터가 해외로 나가지 않고, 데이터는 사용자의 데이터 금고에 저장하며 서버에는 저장하지 않는다”고 적혀 있다는 점, 페이지 이동 없이 한 화면에서 입력·작성·검토가 이루어진다는 점을 소개합니다.</li>\n<li><b>설정</b>(톱니바퀴): <b>화면 디자인</b>을 고릅니다 — A 글라스 · B 머티리얼 · C 에어리 · D 워크스페이스(기본) · E TDS 글라스.</li>\n</ul>\n<h3>안 될 때</h3>\n<ul>\n<li>서식이 안 뜨면 서류 이름을 조금 다르게(예: 더 짧게) 입력해 보세요.</li>\n<li>잘못된 서식·없는 서류는 사이트의 <b>제안</b> 버튼이나 서류 화면의 알림 기능으로 알려 주세요.</li>\n<li>이 사이트는 서류 작성을 돕는 도구입니다. 제출 전에 내용과 법적 효력은 담당 기관이나 전문가에게 확인하세요.</li>\n</ul>\n<p class=\"ch-note\">이 장은 2026-11-15 law.naviweb.kr 화면을 보고 쓴 초안입니다. 사용법·사이트의 특징 안내 문구는 나비 스쿨 화면에서 읽은 것이며, 직역 사이트들이 같은 틀을 쓰므로 사이트마다 서류 이름과 건수만 바뀝니다.</p>","quiz":[{"q":"나비로(law.naviweb.kr)의 첫 화면에서 서류를 찾는 방법은?","options":["입력창에 서류 이름을 입력한다","왼쪽 메뉴에서 서류 번호를 고른다","메일로 서류 이름을 보낸다"],"answer":0,"explain":"정답은 “입력창에 서류 이름을 입력한다”입니다. 이름을 치는 즉시 서식이 펼쳐집니다."},{"q":"작성 중인 서류는 어디에 저장되나요?","options":["저장 버튼을 눌러야 Draft에 저장된다","Draft(초안)에 실시간으로 자동 저장된다","저장되지 않고 닫으면 사라진다"],"answer":1,"explain":"정답은 “Draft(초안)에 실시간으로 자동 저장된다”입니다. 별도의 저장 버튼은 필요 없습니다."},{"q":"인적사항(성명·주소 등)은 어떻게 채워지나요?","options":["매번 직접 입력해야 한다","PDV에서 가져와 파란 칸으로 자동 입력되고 고칠 수 있다","서버가 몰래 채운다"],"answer":1,"explain":"정답은 “PDV에서 가져와 파란 칸으로 자동 입력되고 고칠 수 있다”입니다."}],"updated":"2026-11-15"},{"tier":"intermediate","title":"나비 특허 — 특허·상표 출원과 심사 대응 서류","id":"ch_site_ip","body":"<h2>나비 특허 — 특허·상표 출원과 심사 대응 서류</h2>\n<p><b>하는 일</b>: <a href=\"https://ip.naviweb.kr\" target=\"_blank\" rel=\"noopener\">ip.naviweb.kr</a>에서 특허·상표 출원과 심사 대응 서류를 한 화면에서 작성합니다. 서류 이름을 입력하면 서식이 바로 펼쳐지고, 작성 중인 내용은 Draft(초안)에 실시간으로 자동 저장됩니다. 별도의 저장 버튼은 필요 없습니다.</p>\n<h3>시작 전에</h3>\n<ul>\n<li>나비웹에 로그인한 상태여야 합니다(오른쪽 위에 내 이름이 보입니다). 로그인은 “가입하기”·“PC로 로그인하기” 장을 보세요.</li>\n<li>인적사항은 내 데이터 금고(PDV)에서 가져와 파란 칸으로 채워지고, 고칠 수 있습니다. 다른 사람의 서류를 쓸 때는 그 사람의 정보인지 꼭 확인하세요.</li>\n<li>첨부 파일을 올리려면 나비웹 도우미가 켜져 있어
