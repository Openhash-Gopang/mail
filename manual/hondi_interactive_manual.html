=\"10\" rx=\"5\" fill=\"#ffe9b3\"/>\n<rect x=\"240\" y=\"106\" width=\"80\" height=\"10\" rx=\"5\" fill=\"#ffe9b3\"/>\n<text x=\"300\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" fill=\"#b06000\" font-weight=\"700\">다른 AI(전문가·K-서비스)</text>\n</svg></div>\n<h2>AI 비서 채팅 vs 다른 AI 호출</h2>\n<p>나비 화면에는 항상 <strong>\"내 AI 비서\"</strong> 채팅창이 있습니다. 그런데 전문가 페르소나나 K-서비스를 부르면 새로운 화면(탭)이 열립니다. 이 둘은 왜 다른 화면일까요?</p>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">내 AI 비서란?</div>나만 알고 나에게 맞춰진 개인 비서입니다. 내가 쓸수록 내 습관과 맥락을 기억해 점점 똑똑해집니다(12장에서 자세히 다룹니다).</div></div>\n<h3>두 화면이 하는 일이 다릅니다</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">내 AI 비서 채팅</div><div class=\"step-desc\">평소 대화, 일정, 메모, 다른 사람 연결 등 일상적인 요청을 처리합니다. 필요하면 이 비서가 알아서 전문가나 K-서비스를 대신 호출해주기도 합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">다른 AI 호출(전문가 페르소나)</div><div class=\"step-desc\">변호사, 세무사 같은 특정 분야 전문 AI와 1:1로 대화합니다. 내 AI 비서와는 별개의 대화 기록을 갖습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">다른 AI 호출(K-서비스)</div><div class=\"step-desc\">K-Law, K-Health처럼 정부·공공 성격의 AI 서비스입니다. 역시 별도 화면에서 진행됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">헷갈리기 쉬운 점</div>\"내 AI 비서에게 물어보면 되지 않나요?\" — 맞습니다. 실제로 내 비서에게 그냥 물어보면, 필요할 때 비서가 알아서 전문가·K-서비스를 연결해주기도 합니다. 다만 특정 전문가와 계속 대화를 이어가고 싶다면 직접 그 화면을 열어두는 게 더 편합니다.</div></div>\n","quiz":[{"q":"내 AI 비서와 전문가 페르소나 채팅의 가장 큰 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>","options":["글자 크기","각각 별도의 화면(탭)과 대화 기록을 가진다","색깔만 다르다","차이가 없다"],"answer":1,"explain":"내 AI 비서와 전문가 페르소나·K-서비스는 서로 다른 화면에서, 서로 다른 대화 기록으로 진행됩니다."},{"q":"내가 원하는 전문가를 매번 직접 찾지 않아도 되는 이유는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg>","options":["전문가가 먼저 연락해서","내 AI 비서가 필요시 알아서 연결해줄 수 있어서","그런 기능은 없다","K-서비스가 대신 찾아줘서"],"answer":1,"explain":"내 AI 비서에게 그냥 요청하면, 필요한 경우 비서가 적절한 전문가나 K-서비스를 대신 호출해줄 수 있습니다."},{"q":"K-서비스는 어떤 성격의 AI인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg>","options":["개인 맞춤형 비서","정부·공공 성격의 서비스(K-Law, K-Health 등)","게임 AI","광고용 챗봇"],"answer":1,"explain":"K-서비스는 K-Law, K-Health, K-119처럼 정부·공공 영역의 전문 AI 서비스입니다."}],"placeholder":false},{"tier":"beginner","title":"메시지 주고받기","id":"ch4","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:340px;display:block;margin:0 auto\">\n<rect x=\"40\" y=\"20\" width=\"180\" height=\"46\" rx=\"14\" fill=\"#eaf3fc\"/>\n<text x=\"130\" y=\"48\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0c6cc3\">안녕하세요!</text>\n<rect x=\"180\" y=\"80\" width=\"180\" height=\"46\" rx=\"14\" fill=\"#0c6cc3\"/>\n<text x=\"270\" y=\"108\" text-anchor=\"middle\" font-size=\"13\" fill=\"#fff\">네, 반갑습니다</text>\n</svg></div>\n<h2>메시지 주고받기</h2>\n<p>사람과의 대화든 AI와의 대화든, 메시지를 주고받는 방식은 동일합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"/><polygon points=\"22 2 15 22 11 13 2 9 22 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">메시지 입력·전송</div><div class=\"step-desc\">하단 입력창에 글을 쓰고 전송 버튼(또는 Enter)을 누릅니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">읽음·응답 표시</div><div class=\"step-desc\">상대(사람 또는 AI)가 메시지를 읽으면 표시가 바뀌고, 곧 답장이 도착합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">새 메시지 알림</div><div class=\"step-desc\">앱을 보고 있지 않을 때도 알림으로 새 메시지를 받을 수 있습니다(9장 참고).</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">대화 기록은 어디로 가나요?</div>모든 대화는 PDV(개인 데이터 저장소)에 안전하게 기록됩니다 — 13장 \"PDV 기록\"에서 자세히 다룹니다.</div></div>\n","quiz":[{"q":"메시지를 전송하는 기본적인 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"/><polygon points=\"22 2 15 22 11 13 2 9 22 2\"/></svg>","options":["음성으로만 가능","입력창에 쓰고 전송 버튼 또는 Enter","이메일로 전송","전송 방법이 없다"],"answer":1,"explain":"다른 메신저와 동일하게 입력창에 텍스트를 쓰고 전송하면 됩니다."},{"q":"앱을 보고 있지 않을 때 새 메시지는 어떻게 알 수 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg>","options":["알 수 없다","알림으로 받는다","문자로만 온다","매번 로그인해서 확인해야 한다"],"answer":1,"explain":"앱이 열려 있지 않아도 알림(Web Push)으로 새 메시지를 받을 수 있습니다."},{"q":"대화 기록은 어디에 저장되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>","options":["저장 안 됨","PDV(개인 데이터 저장소)","상대방 서버에만","USB에 직접"],"answer":1,"explain":"모든 대화는 PDV에 기록되어 필요할 때 다시 찾아볼 수 있습니다."}],"placeholder":false},{"tier":"beginner","title":"마이크·카메라·파일 첨부","id":"ch5","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 360 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"/><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></g><circle cx=\"300\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(282,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></g></svg></div>\n<h2>마이크·카메라·파일 첨부</h2>\n<p>텍스트 말고도 음성·사진·파일로 대화할 수 있습니다. 입력창 옆 세 아이콘을 확인해 보세요.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"/><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">마이크 — 음성으로 말하기</div><div class=\"step-desc\">버튼을 누르고 말하면 자동으로 글자로 바뀌어 전송됩니다. 손이 바쁠 때 유용합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">카메라 — 사진·영상 촬영</div><div class=\"step-desc\">바로 찍어서 보내거나, 갤러리에서 골라 보낼 수 있습니다. 영수증·서류 촬영에 자주 씁니다(19장 재무제표와 연결됩니다).</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">파일 첨부 — 문서 보내기</div><div class=\"step-desc\">PDF, 엑셀 등 파일을 첨부해 AI에게 분석을 요청할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 사진을 많이 쓰나요?</div>영수증이나 계약서를 찍어 보내면 AI가 내용을 읽어 정리해 줍니다 — 타이핑할 필요가 없습니다.</div></div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">전문가 AI 채팅의 첨부</div>전문가 AI 채팅에서는 <strong>PDF·DOCX·HWPX</strong> 파일의 글을 자동으로 읽어 서식을 파악합니다. 서류 양식을 첨부하면 AI가 그 양식에 맞춰 작성을 돕습니다.</div></div>","quiz":[{"q":"말로 요청하고 싶을 때 사용하는 버튼은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"/><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"/></svg>","options":["카메라","마이크","파일 첨부","전송"],"answer":1,"explain":"마이크 버튼을 누르고 말하면 음성이 자동으로 텍스트로 변환되어 전송됩니다."},{"q":"영수증을 정리해달라고 할 때 가장 편한 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></svg>","options":["일일이 타이핑","사진 찍어서 전송","전화로 설명","불가능하다"],"answer":1,"explain":"카메라로 영수증을 찍어 보내면 AI가 내용을 읽어 자동으로 정리해 줍니다."},{"q":"PDF나 엑셀 파일을 AI에게 분석시키려면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></svg>","options":["파일 첨부 버튼 이용","이메일로 별도 전송","불가능하다","프린트해서 전달"],"answer":0,"explain":"파일 첨부 버튼으로 문서를 직접 보내 분석을 요청할 수 있습니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"beginner","title":"나비 숫자 코드","id":"ch6","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><line x1=\"7\" y1=\"12\" x2=\"17\" y2=\"12\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></g></svg></div>\n<h2>나비 숫자 코드</h2>\n<p>전화번호를 매번 타이핑하기 번거로울 때, 화면에 뜬 <strong>10자리 숫자 코드</strong>를 카메라로 찍기만 하면 됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">기존 기기에서 코드 표시</div><div class=\"step-desc\">이미 로그인된 화면에서 \"숫자 코드 보기\"를 누르면 10자리 코드가 뜹니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><line x1=\"7\" y1=\"12\" x2=\"17\" y2=\"12\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">새 기기에서 스캔</div><div class=\"step-desc\">새 기기의 카메라로 그 코드를 비추면 자동으로 전화번호가 채워집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">로그인 이어가기</div><div class=\"step-desc\">타이핑 없이 곧바로 9장의 \"폰-PC 연동\" 절차로 넘어갑니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><line x1=\"7\" y1=\"12\" x2=\"17\" y2=\"12\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">QR코드와 다른가요?</div>예전엔 외부 QR 서비스를 썼지만, 지금은 나비가 자체 개발한 숫자 코드 방식을 씁니다 — 전화번호 정보가 외부로 나가지 않아 더 안전합니다.</div></div>\n","quiz":[{"q":"나비 숫자 코드는 몇 자리인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><line x1=\"7\" y1=\"12\" x2=\"17\" y2=\"12\"/></svg>","options":["4자리","10자리","16자리","자릿수 없음"],"answer":1,"explain":"나비 숫자 코드는 10자리 숫자로, 전화번호를 인코딩합니다."},{"q":"숫자 코드를 쓰는 목적은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg>","options":["보안을 낮추기 위해","전화번호 타이핑을 생략하기 위해","광고 표시용","알 수 없음"],"answer":1,"explain":"타이핑 없이 카메라 스캔만으로 전화번호를 빠르게 입력하기 위한 기능입니다."},{"q":"예전 QR 방식과 지금 방식의 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg>","options":["차이 없음","외부 QR 서비스 대신 자체 개발 방식을 사용해 더 안전함","QR이 더 빠름","지금은 코드가 없음"],"answer":1,"explain":"외부 QR 생성 서비스를 걷어내고 자체 인코딩 방식으로 바꿔 전화번호 정보가 외부로 나가지 않습니다."}],"placeholder":false},{"tier":"beginner","title":"폰-PC 연동과 알림","id":"ch7","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 360 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></g><circle cx=\"300\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(282,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></g></svg></div>\n<h2>폰-PC 연동과 알림</h2>\n<p>나비는 비밀번호가 없으므로, PC에서 로그인하려면 <strong>이미 등록된 폰이 승인</strong>해줘야 합니다. 이 승인은 알림(Web Push)으로 전달됩니다.</p>\n<p>PC에서 로그인하는 구체적인 방법은 <strong>2장 \"PC로 로그인하기\"</strong>에서 설명합니다. 이 장에서는 그 승인 알림이 <strong>제때, 크게</strong> 오도록 폰을 설정하는 방법과 알림 방식의 원리를 다룹니다.</p>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">알림이 왜 SMS가 아닌가요?</div>SMS는 통신사 신호가 필요하지만, 이 알림은 인터넷(Wi-Fi 포함)만 있으면 전달됩니다. SMS는 알림이 안 왔을 때만 쓰는 예비 수단입니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 코드 확인만으로는 부족한가요?</div>폰이 이미 잠금 해제된 채로 분실·도난되면, 코드 확인만으로는 그걸 쥔 사람이 진짜 주인인지 구분할 수 없습니다. 지문(또는 Face ID)까지 확인해야 실제로 등록된 지문과 일치하는 사람인지 검증됩니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">승인 요청에 제한 시간이 있나요?</div>예, 짧은 시간 안에 승인해야 합니다. 시간이 지나면 \"세션이 만료됐다\"는 안내가 뜨고 처음부터 다시 시도해야 합니다.</div></div>\n<h4>알림 소리가 작아서 못 들었다면</h4>\n<p>알림 소리와 진동의 세기는 나비웹(웹 앱)이 정할 수 없습니다. 안드로이드 8 이상에서는 <strong>폰이 이 사이트(naviweb.kr)의 알림 채널에 저장해 둔 설정</strong>을 따르기 때문에, 폰의 볼륨 버튼만으로는 크게 바뀌지 않을 수 있습니다. 한 번만 아래처럼 바꿔 두세요.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">① 알림을 길게 누르기</div><div class=\"step-desc\">로그인 알림(또는 나비웹 알림)이 오면 알림을 <strong>길게 눌러</strong> \"설정\"(톱니바퀴)을 엽니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">② 중요도·소리·진동 바꾸기</div><div class=\"step-desc\">중요도를 <strong>\"긴급(소리 및 팝업)\"</strong>으로 두고, 소리는 크고 또렷한 것으로 고르고, 진동을 켭니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">③ 한 번 바꾸면 계속 적용</div><div class=\"step-desc\">이 설정은 이후 나비웹 알림에 모두 적용됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-body\"><div class=\"mc-title\">메뉴 이름은 폰마다 다릅니다</div>제조사마다 화면과 이름이 조금씩 다릅니다. 무음·방해 금지 모드에서는 소리가 나지 않으며, 일부 폰은 벨소리 볼륨과 알림 볼륨이 하나로 묶여 있습니다. 소리를 놓쳤다면 PC에서 \"다시 입력\"으로 다시 요청하면 새 알림이 옵니다.</div></div>\n<h3>알림이 늦게 오거나 안 올 때 — 폰의 백그라운드 설정</h3>\n<p>안드로이드 폰은 배터리를 아끼려고 쓰지 않는 앱의 활동을 멈춰 두기도 합니다. 그러면 PC에서 보낸 승인 알림이 <strong>늦게 도착하거나 도착하지 않을 수</strong> 있습니다. 알림이 이상하게 늦다면 가장 먼저 아래 설정을 확인하세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:300px\"><img src=\"manual-img/android-background-allow.webp\" alt=\"백그라운드 앱 사용 설정 화면\" loading=\"lazy\"><figcaption>안드로이드 \"백그라운드 앱 사용\" 화면 — \"항상 허용\" 선택</figcaption></figure>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">① 설정 열기</div><div class=\"step-desc\">폰 설정 → 앱 → <strong>나비</strong> → 배터리(또는 백그라운드 앱 사용)로 들어갑니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">② \"항상 허용\" 선택</div><div class=\"step-desc\">\"항상 허용\"은 앱이 백그라운드에서도 실행되어 알림을 바로 받을 수 있게 합니다. \"허용 안 함\"이나 \"스마트 사용\"은 배터리는 아끼지만 알림이 늦어질 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-body\"><div class=\"mc-title\">제조사마다 메뉴 이름이 조금 다릅니다</div>위 화면은 안드로이드 폰의 한 예입니다. 메뉴 이름은 제조사마다 다를 수 있습니다. 화면에 안내된 것처럼 \"항상 허용\"을 선택하면 <strong>배터리 사용 시간이 다소 짧아질 수 있습니다.</strong> 나비를 앱으로 설치해 두었다면(11장 참고) 폰의 앱 목록에서 \"나비\"를 찾아 이 설정을 열 수 있습니다.</div></div>\n","quiz":[{"q":"PC 로그인을 승인하는 주체는 누구인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg>","options":["PC 스스로","이미 등록된 폰","고객센터 직원","자동으로 승인됨"],"answer":1,"explain":"PC에서 로그인 시도가 있으면 등록된 폰에 알림이 가고, 그 폰에서 직접 승인해야 로그인이 완료됩니다."},{"q":"이 알림은 어떤 방식으로 전달되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg>","options":["SMS 문자","이메일","Web Push(인터넷 알림)","우편"],"answer":2,"explain":"Wi-Fi로도 정상 전달되는 Web Push 방식을 사용합니다. SMS는 예비 수단입니다."},{"q":"승인 요청을 너무 늦게 확인하면 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/></svg>","options":["문제 없음","세션이 만료되어 처음부터 다시 시도해야 함","자동 승인됨","계정이 잠김"],"answer":1,"explain":"승인에는 제한 시간이 있어, 시간이 지나면 세션이 만료되고 재시도해야 합니다."}],"placeholder":false},{"tier":"beginner","title":"내 프로필 — 나만의 AI 웹페이지","id":"ch8","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></g></svg></div>\n<h2>내 프로필 — 나만의 AI 웹페이지</h2>\n<p>나비 가입자는 누구나 자신만의 공개 웹페이지를 갖습니다. 다른 사람이 여러분을 검색하면 이 페이지를 보게 됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">기본 정보</div><div class=\"step-desc\">닉네임, 소개, 연락 방법이 표시됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">나비 온도</div><div class=\"step-desc\">거래·평가에 따라 오르내리는 신뢰 지표가 함께 표시됩니다(당근마켓 온도와 같은 개념).</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">바로 대화 시작</div><div class=\"step-desc\">프로필을 본 사람이 버튼 하나로 바로 대화나 거래를 요청할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">나비 온도가 뭔가요?</div>36.5도에서 시작해 0~99도 사이를 오갑니다. 나비마켓에서 거래 후 리뷰를 받으면 온도가 변합니다. 자세한 건 20장 이후에서 다룹니다.</div></div>\n","quiz":[{"q":"나비 프로필 페이지는 누가 볼 수 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></svg>","options":["본인만","검색한 다른 사용자 누구나","관리자만","아무도 못 봄"],"answer":1,"explain":"나비 프로필은 공개 웹페이지로, 검색을 통해 다른 사용자가 볼 수 있습니다."},{"q":"나비 온도의 시작 값은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["0도","36.5도","99도","100도"],"answer":1,"explain":"당근마켓 온도와 같은 개념으로, 36.5도(사람 체온)에서 시작합니다."},{"q":"나비 온도는 무엇에 따라 변하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["매일 자동으로 오름","거래·평가 결과","앱 사용 시간","변하지 않음"],"answer":1,"explain":"나비마켓 거래 후 리뷰 등 평가에 따라 온도가 오르내립니다."}],"placeholder":false},{"tier":"beginner","title":"설정 페이지 사용법","id":"ch9","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"1\" y=\"5\" width=\"22\" height=\"14\" rx=\"7\"/><circle cx=\"16\" cy=\"12\" r=\"3\"/></g></svg></div>\n<h2>설정 페이지 사용법</h2>\n<p>대시보드의 \"비서 설정\" 탭에서 알림·개인정보·연동 기기 등을 관리합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"5\" width=\"22\" height=\"14\" rx=\"7\"/><circle cx=\"16\" cy=\"12\" r=\"3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">알림 켜기·끄기</div><div class=\"step-desc\">불필요한 알림 종류를 개별적으로 끌 수 있습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">로그인 기기 관리</div><div class=\"step-desc\">현재 로그인된 기기 목록을 보고, 낯선 기기가 있으면 로그아웃시킬 수 있습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">PDV 데이터 내보내기</div><div class=\"step-desc\">내 기록 전체를 다운로드할 수 있습니다 — 13장에서 이어집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">보안 설정 조정</div><div class=\"step-desc\">지문 인증을 요구하는 금액 기준이나 필수 여부를 여기서 직접 조정할 수 있습니다 — 33장(고급)에서 자세히 다룹니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">낯선 기기가 보인다면?</div>즉시 \"관리\"에서 그 기기를 로그아웃시키고, 백업 키를 갖고 계신다면 재확인해 보세요.</div></div>\n<h3>앱으로 설치하기</h3>\n<p>설정의 \"앱 관리\"에서 <strong>앱으로 설치(PWA)</strong>를 누르면 아래와 같은 설치 창이 아래쪽에서 올라옵니다. 안내 문구는 <strong>\"폰 바탕화면에 나비웹 열기 아이콘 추가\"</strong> 한 줄입니다. 오른쪽의 <strong>설치</strong> 버튼을 누르면 됩니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:300px\"><img src=\"manual-img/pwa-install-sheet.webp?v=20261114\" alt=\"앱으로 설치 창\" loading=\"lazy\"><figcaption>설정 → 앱 관리 → 앱으로 설치(PWA)를 누르면 나타나는 설치 창</figcaption></figure>\n<p>설치를 마치면 \"바탕화면에 나비웹 바로가기 아이콘을 추가하였습니다.\"라는 안내가 1초 동안 보이고, 곧바로 나비의 첫 화면으로 돌아옵니다.</p>\n<h3>설치가 끝난 뒤 — 바탕화면의 나비 아이콘</h3>\n<p>폰 바탕화면(홈 화면)에 <strong>나비 아이콘</strong>이 생깁니다. 이 아이콘을 누르면 인터넷 주소창 없이 나비가 앱처럼 바로 열립니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:300px\"><img src=\"manual-img/home-screen-icon.webp?v=20261114\" alt=\"바탕화면에 추가된 나비 아이콘\" loading=\"lazy\"><figcaption>설치 후 폰 바탕화면에 생긴 나비 아이콘</figcaption></figure>\n<div class=\"md-container tonal-primary\"><div class=\"mc-body\"><div class=\"mc-title\">설치해 두면 좋은 점</div>나비를 홈 화면 앱으로 설치해 두면 승인 알림처럼 앱이 닫혀 있을 때 오는 알림을 받기 편합니다. 설치한 뒤에는 9장의 \"백그라운드 앱 사용\" 설정도 함께 확인해 두세요.</div></div>\n","quiz":[{"q":"불필요한 알림을 줄이려면 어디서 설정하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"5\" width=\"22\" height=\"14\" rx=\"7\"/><circle cx=\"16\" cy=\"12\" r=\"3\"/></svg>","options":["설정 페이지의 알림 항목","앱 삭제 후 재설치","고객센터 문의만 가능","설정할 수 없음"],"answer":0,"explain":"설정 페이지에서 알림 종류별로 켜고 끌 수 있습니다."},{"q":"낯선 로그인 기기를 발견하면 어떻게 해야 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg>","options":["무시한다","설정에서 즉시 로그아웃시킨다","비밀번호를 바꾼다","앱을 삭제한다"],"answer":1,"explain":"설정의 로그인 기기 관리에서 즉시 해당 기기를 로그아웃 처리해야 합니다(나비는 비밀번호가 없으므로 비밀번호 변경은 해당되지 않습니다)."},{"q":"내 기록 전체를 다운로드하려면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg>","options":["불가능하다","설정 페이지의 PDV 내보내기","고객센터에 우편 요청","이메일로 요청"],"answer":1,"explain":"설정 페이지에서 PDV 데이터 내보내기 기능으로 내 기록 전체를 다운로드할 수 있습니다."}],"placeholder":false},{"tier":"intermediate","title":"사람과 사람의 대화, AI와 AI의 대화","id":"ch10","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:380px;display:block;margin:0 auto\">\n<circle cx=\"70\" cy=\"60\" r=\"26\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/><circle cx=\"150\" cy=\"60\" r=\"26\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<line x1=\"96\" y1=\"60\" x2=\"124\" y2=\"60\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/>\n<text x=\"110\" y=\"45\" text-anchor=\"middle\" font-size=\"10\" fill=\"#64748b\">느림</text>\n<text x=\"110\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"#334155\" font-weight=\"600\">사람 ↔ 사람</text>\n<circle cx=\"290\" cy=\"60\" r=\"26\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2\"/><circle cx=\"370\" cy=\"60\" r=\"26\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2\"/>\n<line x1=\"316\" y1=\"60\" x2=\"344\" y2=\"60\" stroke=\"#f59e0b\" stroke-width=\"2.5\"/>\n<text x=\"330\" y=\"45\" text-anchor=\"middle\" font-size=\"10\" fill=\"#b06000\">빛의 속도</text>\n<text x=\"330\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"#334155\" font-weight=\"600\">AI ↔ AI</text>\n</svg></div>\n<h2>사람과 사람의 대화, AI와 AI의 대화</h2>\n<p>사람끼리 대화하면 오해가 생기기도 하고 시간이 걸립니다. 반면 나비의 AI 비서끼리는 정보를 빠르고 정확하게 주고받습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">사람 ↔ 사람</div><div class=\"step-desc\">말투·감정·타이밍에 따라 전달이 느려지거나 오해가 생길 수 있습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">AI ↔ AI</div><div class=\"step-desc\">내 AI 비서가 상대의 AI 비서와 직접 조율해, 예를 들어 약속 시간 잡기 같은 일을 몇 초 만에 끝냅니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">그럼 사람 대 사람 대화는 필요 없나요?</div>아닙니다. 중요한 결정이나 감정적 교류는 여전히 사람이 직접 하는 게 좋습니다. AI ↔ AI는 반복적이고 사무적인 조율을 대신해주는 것입니다.</div></div>\n","quiz":[{"q":"AI와 AI 사이의 대화가 가진 장점은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg>","options":["더 감정적이다","빠르고 정확하게 정보를 주고받는다","항상 사람보다 느리다","불가능하다"],"answer":1,"explain":"AI끼리는 오해 없이 빠른 속도로 정보를 주고받을 수 있습니다."},{"q":"사람과 사람의 대화에서 자주 생기는 문제는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>","options":["항상 완벽함","오해나 지연이 생길 수 있음","AI보다 항상 빠름","문제 없음"],"answer":1,"explain":"말투, 감정, 타이밍 등으로 오해나 지연이 생길 수 있습니다."},{"q":"중요한 결정은 누가 하는 것이 좋은가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>","options":["항상 AI가","사람이 직접","AI와 사람 둘 다 절대 안 됨","무작위로"],"answer":1,"explain":"중요한 결정이나 감정적 교류는 여전히 사람이 직접 하는 것이 좋습니다."}],"placeholder":false},{"tier":"intermediate","title":"쓰면 쓸수록 똑똑해지는 나만의 AI 비서","id":"ch11","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:340px;display:block;margin:0 auto\">\n<circle cx=\"70\" cy=\"100\" r=\"20\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"200\" cy=\"80\" r=\"30\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"340\" cy=\"55\" r=\"42\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n<path d=\"M40 130 L370 20\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-dasharray=\"4 4\" fill=\"none\"/>\n<text x=\"70\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#64748b\">1일차</text>\n<text x=\"200\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#64748b\">1개월</text>\n<text x=\"340\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#0c6cc3\" font-weight=\"700\">1년</text>\n</svg></div>\n<h2>쓰면 쓸수록 똑똑해지는 나만의 AI 비서</h2>\n<p>내 AI 비서는 대화가 쌓일수록 내 습관, 선호, 맥락을 점점 더 잘 이해하게 됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2v-1A2.5 2.5 0 0 0 17.5 7 2.5 2.5 0 0 0 14.5 2z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">기억이 쌓입니다</div><div class=\"step-desc\">과거 대화·PDV 기록을 참고해 다음 대화에서 더 정확한 답을 줍니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">점점 맞춤화됩니다</div><div class=\"step-desc\">반복되는 요청 패턴을 학습해 먼저 제안해주기도 합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">내 데이터는 내 것</div><div class=\"step-desc\">이 모든 학습은 내 PDV 안에서만 이뤄지며, 다른 사람 비서와 섞이지 않습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2v-1A2.5 2.5 0 0 0 17.5 7 2.5 2.5 0 0 0 14.5 2z\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">다른 AI 챗봇과 다른 점</div>일반 챗봇은 대화가 끝나면 기억을 잃지만, 내 AI 비서는 PDV에 계속 기록을 남겨 시간이 지날수록 더 정확해집니다.</div></div>\n","quiz":[{"q":"내 AI 비서가 똑똑해지는 원리는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2v-1A2.5 2.5 0 0 0 17.5 7 2.5 2.5 0 0 0 14.5 2z\"/></svg>","options":["소프트웨어 업데이트만으로","내 대화·PDV 기록이 쌓이기 때문","랜덤으로","불가능하다"],"answer":1,"explain":"쌓인 대화와 PDV 기록을 참고해 점점 더 맞춤화된 답을 줍니다."},{"q":"이 학습된 정보는 다른 사람과 공유되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>","options":["예, 모두와 공유됨","아니요, 내 PDV 안에서만 유지됨","공개 게시판에 올라감","알 수 없음"],"answer":1,"explain":"학습은 내 PDV 안에서만 이뤄지며 다른 사람 비서와 섞이지 않습니다."},{"q":"일반 챗봇과 내 AI 비서의 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2v-1A2.5 2.5 0 0 0 17.5 7 2.5 2.5 0 0 0 14.5 2z\"/></svg>","options":["차이 없음","일반 챗봇은 대화가 끝나면 기억을 잃지만 내 비서는 기록이 누적됨","일반 챗봇이 더 똑똑함","내 비서는 기록을 안 남김"],"answer":1,"explain":"PDV에 기록이 누적되어 시간이 지날수록 더 정확해지는 게 핵심 차이입니다."}],"placeholder":false},{"tier":"intermediate","title":"PDV 기록 — 내 데이터는 어디에 있는가","id":"ch12","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 120 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:120px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></g></svg></div>\n<h2>PDV 기록 — 내 데이터는 어디에 있는가</h2>\n<p>PDV(Private Data Vault, 개인 데이터 저장소)는 내 모든 대화·거래·기록이 안전하게 보관되는 나만의 금고입니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">내 것은 내 것</div><div class=\"step-desc\">PDV의 데이터는 나만 열람할 수 있고, 다른 사람이나 기업이 마음대로 가져갈 수 없습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">AI 비서가 참고합니다</div><div class=\"step-desc\">12장에서 다룬 “똑똑해지는 AI 비서”의 재료가 바로 이 PDV 기록입니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><circle cx=\"6\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"18\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">평생 쌓입니다</div><div class=\"step-desc\">오늘의 기록이 10년 뒤에도 그대로 남아 나의 역사가 됩니다(14장에서 이어집니다).</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">PDV를 내보낼 수 있나요?</div>네, 11장에서 다룬 설정 페이지에서 내 PDV 기록 전체를 다운로드할 수 있습니다.</div></div>\n","quiz":[{"q":"PDV는 무엇의 줄임말인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>","options":["Personal Data Vault","Public Data View","Private Digital Video","Personal Device Verification"],"answer":0,"explain":"PDV는 Private Data Vault, 개인 데이터 저장소입니다."},{"q":"PDV의 데이터는 누가 열람할 수 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>","options":["누구나","오직 나 자신","나비 직원 전체","광고주"],"answer":1,"explain":"PDV는 개인 소유의 저장소로, 본인만 열람할 수 있습니다."},{"q":"내 AI 비서가 똑똑해지는 재료는 무엇인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/></svg>","options":["광고 데이터","내 PDV 기록","다른 사람의 대화","임의의 데이터"],"answer":1,"explain":"12장에서 다뤘듯, AI 비서는 내 PDV 기록을 참고해 점점 맞춤화됩니다."}],"placeholder":false},{"tier":"intermediate","title":"PDV 거래명세서 — 사고팔면 양쪽 다 기록됩니다","id":"ch_pdv_trade_record","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\"><rect x=\"20\" y=\"30\" width=\"160\" height=\"110\" rx=\"14\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"75\" r=\"18\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2\"/><rect x=\"55\" y=\"105\" width=\"90\" height=\"10\" rx=\"5\" fill=\"#bfe0fb\"/><text x=\"100\" y=\"155\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0c6cc3\" font-weight=\"700\">구매자</text><rect x=\"220\" y=\"30\" width=\"160\" height=\"110\" rx=\"14\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2\"/><circle cx=\"300\" cy=\"75\" r=\"18\" fill=\"#fff\" stroke=\"#188038\" stroke-width=\"2\"/><rect x=\"255\" y=\"105\" width=\"90\" height=\"10\" rx=\"5\" fill=\"#bfe6c9\"/><text x=\"300\" y=\"155\" text-anchor=\"middle\" font-size=\"13\" fill=\"#188038\" font-weight=\"700\">판매자</text><line x1=\"180\" y1=\"85\" x2=\"220\" y2=\"85\" stroke=\"#f59e0b\" stroke-width=\"2.5\"/></svg></div>\n<h2>PDV 거래명세서 — 사고팔면 양쪽 다 기록됩니다</h2>\n<p>13장에서 다룬 PDV(개인 데이터 저장소)는 대화만 기록하는 게 아닙니다. 나비마켓·이체처럼 <strong>두 사람이 관여하는 거래</strong>가 성사되면, 구매자와 판매자 <strong>양쪽 모두의</strong> PDV에 6하원칙(누가·언제·어디서·무엇을·어떻게·왜) 거래명세서가 각자의 관점으로 남습니다.</p>\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">누가·언제·어디서·무엇을·어떻게·왜</div>같은 거래라도 구매자 쪽 기록은 \"무엇을 샀는지\", 판매자 쪽 기록은 \"무엇을 팔았는지\"로 관점이 다르게 남습니다 — 언제·어디서 일어난 거래인지는 양쪽이 똑같이 공유합니다.</div>\n</div>\n<h3>거래 하나, 기록 두 개</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"21\" r=\"1\"/><circle cx=\"20\" cy=\"21\" r=\"1\"/><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">구매자 쪽 기록</div><div class=\"step-desc\">\"무엇을 얼마에 샀는지\"가 내 PDV에 남습니다. 20장에서 다룰 재무제표의 지출(매입) 내역도 여기서 함께 시작됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">판매자 쪽 기록</div><div class=\"step-desc\">\"무엇을 얼마에 팔았는지\"가 판매자의 PDV에 똑같이 남습니다 — 예전에는 판매자 기록만 남고 구매자 기록이 비어 있던 시절도 있었지만, 지금은 항상 두 쪽 모두 기록됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">내 기록에 상대방 개인정보가 남나요?</div>아니요 — 상대방은 익명 식별자로만 표시됩니다. 내 PDV에는 내가 무엇을 하고 얼마를 주고받았는지만 남지, 상대의 신상정보가 담기지는 않습니다.</div>\n</div>\n","quiz":[{"q":"두 사람이 거래하면 6하원칙 기록은 누구에게 남나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>","options":["판매자에게만","구매자에게만","구매자·판매자 양쪽 모두","아무에게도 안 남음"],"answer":2,"explain":"거래가 성사되면 구매자·판매자 양쪽의 PDV에 각자 관점의 6하원칙 기록이 함께 남습니다."},{"q":"구매자 쪽 기록과 판매자 쪽 기록의 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["완전히 동일하다","무엇을 샀는지/팔았는지 관점만 다르다","판매자 기록만 진짜다","구매자 기록만 저장된다"],"answer":1,"explain":"언제·어디서 일어난 거래인지는 공유하지만, 무엇을 했는지(구매/판매)는 각자의 관점으로 따로 남습니다."},{"q":"내 PDV 거래 기록에 상대방의 개인정보가 그대로 담기나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["예, 이름과 연락처까지 저장됨","아니요, 익명 식별자로만 표시됨","선택적으로 공개 가능","확인할 방법이 없음"],"answer":1,"explain":"상대방은 익명 식별자로만 남고, 신상정보는 내 PDV 기록에 포함되지 않습니다."}],"placeholder":false},{"tier":"intermediate","title":"출생부터 평생, 기록의 가치","id":"ch13","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 120 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:120px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><circle cx=\"6\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"18\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/></g></svg></div>\n<h2>출생부터 평생, 기록의 가치</h2>\n<p>PDV는 태어난 순간부터 평생에 걸쳐 쌓일 수 있는 기록입니다. 시간이 지날수록 그 가치가 커집니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><circle cx=\"6\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"18\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">생애 전 구간</div><div class=\"step-desc\">출생, 학교, 취업, 결혼, 은퇴 등 각 시점의 기록이 하나로 이어집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5C2 13 7 16.5 12 21c2.13-1.9 4.09-3.6 5.71-5.2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">예: 의료 기록</div><div class=\"step-desc\">평생 쌓인 건강 기록이 있으면 새로운 병원에서도 정확한 진단에 도움이 됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"1\"/><line x1=\"9\" y1=\"8\" x2=\"9\" y2=\"8\"/><line x1=\"15\" y1=\"8\" x2=\"15\" y2=\"8\"/><line x1=\"9\" y1=\"13\" x2=\"9\" y2=\"13\"/><line x1=\"15\" y1=\"13\" x2=\"15\" y2=\"13\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">예: 신용·자산 기록</div><div class=\"step-desc\">20장 이후에서 다룰 신용 평가·대출도 이런 장기 기록을 바탕으로 자동화됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><circle cx=\"6\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"18\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">기록이 길수록 유리한가요?</div>예, 특히 신용 평가나 전문 서비스 이용 시 오래되고 일관된 기록일수록 더 정확한 판단이 가능합니다.</div></div>\n","quiz":[{"q":"PDV 기록은 언제부터 쌓일 수 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><circle cx=\"6\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"18\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/></svg>","options":["성인이 된 후부터","출생부터 평생","입사 후부터","기록 안 됨"],"answer":1,"explain":"PDV는 출생부터 평생에 걸쳐 쌓일 수 있는 개인 기록입니다."},{"q":"평생 의료 기록이 쌓이면 어떤 장점이 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5C2 13 7 16.5 12 21c2.13-1.9 4.09-3.6 5.71-5.2\"/></svg>","options":["장점 없음","새 병원에서도 정확한 진단에 도움","기록이 유출됨","비용이 더 든다"],"answer":1,"explain":"일관된 장기 의료 기록은 새로운 진료 시에도 정확한 판단에 도움이 됩니다."},{"q":"장기 기록이 도움이 되는 또 다른 분야는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"1\"/><line x1=\"9\" y1=\"8\" x2=\"9\" y2=\"8\"/><line x1=\"15\" y1=\"8\" x2=\"15\" y2=\"8\"/><line x1=\"9\" y1=\"13\" x2=\"9\" y2=\"13\"/><line x1=\"15\" y1=\"13\" x2=\"15\" y2=\"13\"/></svg>","options":["신용 평가·대출","날씨 예보","게임 점수","없음"],"answer":0,"explain":"20장 이후에서 다루는 신용 평가와 대출 자동화가 이런 장기 기록을 바탕으로 합니다."}],"placeholder":false},{"tier":"intermediate","title":"GDC 충전하기","id":"ch14","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></g></svg></div>\n<h2>GDC 충전하기</h2>\n<p>GDC(나비의 디지털 통화)는 <strong>계좌 입금</strong>으로 충전됩니다 — 카드 자동결제 같은 정기결제 수단은 없습니다. 신청 없이 바로 입금하는 방법이 가장 간단합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 입금자명에 전화번호 뒷자리 8자리</div><div class=\"step-desc\">신청서 작성 없이, 지정된 계좌로 바로 입금하면 됩니다 — 입금자명(보내는분)에 나비에 등록된 내 전화번호 뒷자리 8자리를 적습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 관리자가 은행 알림으로 확인</div><div class=\"step-desc\">입금이 되면 관리자 폰에 은행 자체 입금 알림이 옵니다. 관리자가 그 전화번호·금액으로 내 계정을 찾아 충전을 처리합니다 — 사람이 확인하는 단계라 즉시(밀리초 단위)는 아니지만, 별도 신청서를 미리 작성할 필요는 없습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ GDC 발행</div><div class=\"step-desc\">확인이 끝나면 입금액과 1:1 비율로 GDC가 지갑에 발행됩니다(예: 1,000원 = 1,000 GDC — 지금은 테스트 기간 기준이며 바뀔 수 있습니다).</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">충전 확인은 어디서?</div>대시보드 홈의 GDC 지갑 카드에서 잔액을 확인할 수 있습니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">미리 신청서를 쓰는 방법도 있나요?</div>네 — `charge.html`에서 먼저 신청해 매칭코드를 받은 뒤 입금하는 방법도 있습니다. 두 방법 다 결국 관리자 확인을 거쳐 GDC가 발행된다는 점은 같습니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">월 기본료나 구독료가 있나요?</div>아니요. 나비 이용은 <strong>쓴 만큼만 GDC 잔액에서 차감</strong>되는 종량제 하나입니다(16장에서 이어집니다). 충전은 지갑을 채우는 일일 뿐이고, 잔액이 <strong>1,000 GDC 이하</strong>로 내려가면 충전을 권하는 알림이 옵니다.</div></div>\n","quiz":[{"q":"GDC를 신청서 없이 바로 충전하려면 입금자명에 뭘 적어야 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg>","options":["아무거나 상관없음","내 전화번호 뒷자리 8자리","닉네임","주민등록번호"],"answer":1,"explain":"입금자명에 나비에 등록된 전화번호 뒷자리 8자리를 적어야 관리자가 은행 알림을 보고 내 계정을 정확히 찾을 수 있습니다."},{"q":"이 방식으로 입금하면 GDC가 어떻게 충전되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg>","options":["신청서 작성은 필요 없지만, 관리자가 은행 알림을 보고 확인해야 발행됨","아무도 확인 안 하고 즉시 자동 발행","1주일 뒤 일괄 처리","환불됨"],"answer":0,"explain":"미리 신청서를 쓸 필요는 없지만, 관리자가 은행 입금 알림을 직접 보고 확인하는 절차는 여전히 있습니다."},{"q":"GDC 충전과 별개로 매달 내는 기본료가 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg>","options":["있다 — 월 정액 요금제","없다 — 쓴 만큼만 잔액에서 차감된다","1년에 한 번만 낸다","충전할 때마다 수수료를 낸다"],"answer":1,"explain":"월 기본료·구독 요금제는 없습니다. 나비는 쓴 만큼만 GDC 잔액에서 차감하는 종량제이고, 잔액이 1,000 GDC 이하가 되면 충전 알림이 옵니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"intermediate","title":"GDC 사용하기 — 사용료와 사용자 간 결제","id":"ch15","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></g></svg></div>\n<h2>GDC 사용하기 — 사용료와 사용자 간 결제</h2>\n<p>GDC는 나비 이용료 지불뿐 아니라, <strong>사용자끼리 직접 주고받는 결제</strong>에도 쓰입니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">서비스 이용료 결제</div><div class=\"step-desc\">전문가 페르소나·K-서비스 이용 시 GDC가 자동 차감됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">사용자 간 결제</div><div class=\"step-desc\">나비마켓에서 물건을 사고팔 때도 GDC로 결제합니다 — 20장에서 이어집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">내역 확인</div><div class=\"step-desc\">대시보드에서 충전·사용 내역을 모두 확인할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">GDC는 현금과 같나요?</div>나비 생태계 안에서는 현금처럼 쓰이지만, 실제 환전이나 외부 사용에는 26장 \"수수료 없는 GDC 환전과 송금\"에서 다루는 규칙이 적용됩니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">결제할 때마다 지문을 확인하나요?</div>아니요 — 일정 금액 미만(기본 1만 원)은 매번 지문 없이 바로 결제됩니다. 그 금액을 넘어서는 결제만 지문(또는 Face ID)으로 한 번 더 확인합니다. 이 기준 금액은 설정에서 직접 조정할 수 있습니다 — 33장 \"보안 설정 직접 조정하기\"에서 다룹니다.</div></div>\n<h3>무료 사용량을 모두 썼다면</h3>\n<p>가입할 때 받은 무료 사용량(500원어치)을 모두 쓰고 GDC 잔액도 부족하면, 나비가 아래와 같이 알려 줍니다. <strong>GDC를 충전한 뒤 다시 이용</strong>하면 됩니다. 안내창의 <strong>\"내 GDC 잔액 확인하기\"</strong> 버튼으로 잔액을 확인할 수 있습니다(충전 방법은 15장 \"GDC 충전하기\" 참고).</p>\n<figure class=\"ch-shot\" style=\"max-width:320px\"><img src=\"manual-img/gdc-free-limit-used.webp?v=20261114\" alt=\"무료 사용량 소진 안내\" loading=\"lazy\"><figcaption>무료 사용량과 GDC 잔액이 모두 부족할 때 나비가 보여 주는 안내</figcaption></figure>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">얼마가 차감되나요?</div>사용한 만큼만 차감됩니다. 가입하면 <strong>테스트 기간에는 소액(100 GDC)의 무료 GDC</strong>가 먼저 지급되어 처음 써 보는 데 쓸 수 있습니다. 월 기본료는 없고, 잔액이 1,000 GDC 이하가 되면 충전 알림이 옵니다. 전문가용 AI의 연 구독은 아직 <strong>준비 중</strong>입니다(전문가 인증 장 참고).</div></div>","quiz":[{"q":"GDC로 결제할 수 없는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg>","options":["전문가 페르소나 이용료","K-서비스 이용료","나비마켓 거래","해당 없음(모두 가능)"],"answer":3,"explain":"GDC는 서비스 이용료와 사용자 간 거래 모두에 쓰일 수 있습니다."},{"q":"나비마켓에서의 결제 수단은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>","options":["현금만","신용카드만","GDC","포인트만"],"answer":2,"explain":"나비마켓의 거래도 GDC로 이뤄집니다."},{"q":"사용 내역은 어디서 확인하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg>","options":["확인 불가","대시보드","고객센터 전화","은행 앱"],"answer":1,"explain":"대시보드에서 충전·사용 내역을 모두 확인할 수 있습니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"intermediate","title":"전문가 페르소나 호출하기","id":"ch16","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5C2 13 7 16.5 12 21c2.13-1.9 4.09-3.6 5.71-5.2\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"1\"/><line x1=\"9\" y1=\"8\" x2=\"9\" y2=\"8\"/><line x1=\"15\" y1=\"8\" x2=\"15\" y2=\"8\"/><line x1=\"9\" y1=\"13\" x2=\"9\" y2=\"13\"/><line x1=\"15\" y1=\"13\" x2=\"15\" y2=\"13\"/></g></svg></div><h2>전문가 페르소나 호출하기</h2><p>변호사, 세무사, 회계사, 간호사, 건축사 등 수백 종의 전문 분야마다 AI 페이지가 있습니다. 이 AI들은 전문가를 대신하는 존재가 아니라, <strong>전문가와 소속 직원이 서류 작성 같은 업무를 대화로 진행하도록 돕는 보조 도구</strong>입니다.</p><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 분야 찾기</div><div class=\"step-desc\">원하는 직역(예: \"세무사\")을 검색하거나 목록에서 고릅니다. 직역 버튼을 누르면 그 직역 전용 페이지가 열립니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 페이지에서 서류 고르기</div><div class=\"step-desc\">직역별 서류 목록에서 작성할 서류를 고르거나, 목록에 없으면 직접 말해서 요청합니다. 자세한 사용법은 다음 장에서 다룹니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 대화로 서류 작성</div><div class=\"step-desc\">AI가 단계별로 묻고 채워 갑니다. 최종 확인과 서명은 항상 전문가 본인의 몫입니다.</div></div></div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">일반인용과 전문가용</div>직역에 따라 <strong>일반인용(신원 확인 없이 쓰는 안내)</strong>과 <strong>전문가용(전문가·직원의 업무 보조)</strong>이 나뉘어 있습니다. 전문가용은 면허 인증이 필요하며 지금은 준비 중입니다.</div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">\"상담\"이 아니라 \"서류 작성 보조\"입니다</div>법률·세무·의료처럼 자격 전문가의 업무는 AI가 대신하지 않습니다. AI는 서류 작성 같은 작업을 돕고, 판단·확인·서명은 전문가가 합니다. 교사·사회복지사처럼 상담 자체가 업무인 직역은 상담형으로 동작합니다.</div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">어떤 분야가 있나요?</div>법률, 회계, 세무, 의료·보건, 건축, 관광통역, 감정평가, 변리 등 매우 다양한 직역의 페이지가 준비되어 있습니다.</div></div>","quiz":[{"q":"전문가 페르소나를 찾는 첫 단계는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["바로 결제","분야 검색","회원 탈퇴","이메일 전송"],"answer":1,"explain":"원하는 전문 분야를 먼저 검색해서 찾습니다."},{"q":"전문가 페르소나로 다룰 수 있는 분야가 아닌 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5C2 13 7 16.5 12 21c2.13-1.9 4.09-3.6 5.71-5.2\"/></svg>","options":["법률","세무","의료","해당 없음(매우 다양함)"],"answer":3,"explain":"법률·회계·의료·건축 등 수백 종의 다양한 전문 분야를 다룹니다."},{"q":"전문가 페르소나 채팅은 내 AI 비서와 같은 화면인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>","options":["예, 완전히 같다","아니요, 별도 화면(5장 참고)","전문가 페르소나는 존재하지 않는다","항상 전화로만 가능"],"answer":1,"explain":"5장에서 다뤘듯 전문가 페르소나는 내 AI 비서와 별도의 화면에서 진행됩니다."},{"q":"전문가 페르소나 AI의 역할로 맞는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["전문가를 완전히 대체한다","전문가·직원의 서류 작성 등 업무를 대화로 보조한다","결제만 대신 처리한다","광고를 보여 준다"],"answer":1,"explain":"전문가 AI는 서류 작성 같은 작업을 돕는 보조 도구이고, 최종 확인과 서명은 전문가가 합니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"intermediate","title":"전문가 AI로 서류 쓰기 — 서류 목록과 서식 쌓기","id":"ch_expertdoc","quiz":[{"q":"목록에 없는 서류가 필요할 때는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["불가능하다","\"목록에 없는 서류\" 버튼으로 직접 요청하거나 양식을 첨부한다","고객센터에 전화한다","다른 직역 페이지를 쓴다"],"answer":1,"explain":"직접 요청하거나 양식을 첨부하면 AI가 파악해 작성을 돕습니다."},{"q":"내가 올린 서식은 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["나만 볼 수 있다","동의하면 해당 직역 페이지에 게시되어 다른 이용자도 쓸 수 있다","자동 삭제된다","관리자만 쓴다"],"answer":1,"explain":"동의 후 게시되어 다른 이용자가 첨부 없이 활용할 수 있습니다."},{"q":"완성된 서류의 최종 확인과 서명은 누가 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["AI","전문가 본인","이용자 중 아무나","결제 담당자"],"answer":1,"explain":"AI는 작성을 돕고, 최종 확인과 서명은 전문가가 합니다."}],"body":"<h2>전문가 AI로 서류 쓰기 — 서류 목록과 서식 쌓기</h2><p>전문가 AI 페이지는 질문에 답하는 창구가 아니라, <strong>전문가와 소속 직원이 서류를 대화로 작성하는 작업대</strong>입니다. 서류 작성 화면은 PC를 기본으로 하고, 모바일은 간단한 질의와 업무 지시에 알맞습니다.</p><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 직역 페이지 열기</div><div class=\"step-desc\">직역을 고르면 그 직역의 서류 목록이 있는 전용 페이지가 열립니다.</di
