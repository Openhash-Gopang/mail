\"9\" fill=\"#0c6cc3\"/><circle cx=\"200\" cy=\"30\" r=\"9\" fill=\"#0c6cc3\"/><circle cx=\"310\" cy=\"55\" r=\"9\" fill=\"#0c6cc3\"/>\n<circle cx=\"130\" cy=\"110\" r=\"9\" fill=\"#0c6cc3\"/><circle cx=\"260\" cy=\"115\" r=\"9\" fill=\"#0c6cc3\"/><circle cx=\"200\" cy=\"85\" r=\"9\" fill=\"#188038\"/>\n<line x1=\"90\" y1=\"50\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<line x1=\"200\" y1=\"30\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<line x1=\"310\" y1=\"55\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<line x1=\"130\" y1=\"110\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<line x1=\"260\" y1=\"115\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n</svg></div>\n<h2>Openhash — 서버 없는 인증</h2>\n<p>주민등록증이나 운전면허증처럼 위변조를 원천 차단하는 기술이 Openhash입니다. 특정 중앙 서버 하나에 의존하지 않고 데이터 무결성을 보장합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 분산 기록</div><div class=\"step-desc\">기록이 하나의 서버가 아니라 여러 지점에 분산 저장됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 위변조 방지</div><div class=\"step-desc\">한 곳의 기록만 몰래 바꿔서는 전체 무결성을 속일 수 없는 구조입니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 신뢰의 기반</div><div class=\"step-desc\">이 덕분에 PDV(<a class=\"ch-link\" href=\"#\" data-goto=\"ch12\">「PDV 기록」장</a>) 기록과 재무제표(<a class=\"ch-link\" href=\"#\" data-goto=\"ch20\">「나비마켓 판매자의 재무제표 자동 생성」장</a>)를 믿고 쓸 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">블록체인과 같은 건가요?</div>비슷한 \"분산·위변조 방지\" 철학을 공유하지만, 나비의 Openhash는 나비 생태계 안의 데이터 무결성 보장에 특화되어 있습니다.</div></div>\n","quiz":[{"q":"Openhash의 핵심 목적은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>","options":["속도 향상","데이터 위변조 방지","디자인 개선","광고 차단"],"answer":1,"explain":"주민등록증처럼 위변조를 원천 차단하는 신뢰 인프라입니다."},{"q":"Openhash는 어떻게 위변조를 막나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg>","options":["한 서버에 강력한 암호를 걸어서","여러 지점에 분산 기록해서","기록을 아예 안 남겨서","비밀번호로"],"answer":1,"explain":"하나의 중앙 서버가 아니라 여러 지점에 분산 기록해 한 곳만 조작해서는 무결성을 속일 수 없습니다."},{"q":"Openhash가 신뢰의 기반이 되는 예로 언급된 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>","options":["PDV 기록과 재무제표","날씨 예보","게임 점수","광고 노출수"],"answer":0,"explain":"PDV 기록과 재무제표의 신뢰성이 Openhash 위에서 보장됩니다."}],"placeholder":false},{"tier":"advanced","title":"K-Law 판결 예측 — 성능 평가 페이지 읽는 법","id":"ch_klawverdict","quiz":[{"q":"이 장의 수치를 어떻게 다뤄야 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["어디에나 인용해도 된다","자체 실험이며 제3자 검증이 없으므로 인용·이용하지 않는다","법원에 제출한다","광고에 쓴다"],"answer":1,"explain":"자체 실험 결과이며 제3자 검증을 거치지 않았습니다."},{"q":"성능 평가 시험의 방식으로 맞는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["익명화한 사건을 같은 지시문으로 여러 LLM에 입력해 실제 판결과 비교","변호사가 직접 판결","LLM마다 다른 지시문","웹 검색을 허용해 정답을 찾게 함"],"answer":0,"explain":"같은 지시문(웹 검색 금지)으로 입력해 실제 판결과 비교합니다."},{"q":"Agon은 무엇인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["K-Law와 같은 이름","원심 결과 은닉·공방·모범 판결문 채점을 쓰는 별도 방법론 체계","결제 수단","새 로고"],"answer":1,"explain":"K-Law와는 별개의 방법론 체계입니다."}],"body":"<h2>K-Law 판결 예측 — 성능 평가 페이지 읽는 법</h2><div class=\"md-container tonal-error\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">먼저 알아 둘 점</div>이 장의 모든 수치는 <strong>자체 실험 결과</strong>이며 제3자 검증을 거치지 않았고 일부는 초안입니다. 어떠한 용도로도 인용하거나 이용하지 마세요. 판결 예측은 법적 판단이나 자문이 아니며, 인간 전문가의 확인이 필요합니다.</div></div><h3>이름이 바뀐 이유</h3><p>예전의 \"가상 판결문\"은 실제 판결문 형식을 흉내 냈습니다. 지금은 <strong>\"판결 예측\"</strong>이라는 이름의 서술형 리포트로 바뀌었습니다. 주 이용자는 인간 변호사이고, 변호사가 AI의 1차 분석을 바탕으로 일하는 협업을 전제로 합니다.</p><h3>성능 평가 페이지는 이렇게 시험합니다</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 사건 준비</div><div class=\"step-desc\">최신 대법원 판례를 완전히 익명화해 사건 개요로 만듭니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 같은 지시문으로 입력</div><div class=\"step-desc\">대형 LLM과 중소형 오픈소스 LLM에 같은 지시문(웹 검색 금지)으로 넣습니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 실제 판결과 비교</div><div class=\"step-desc\">결론과 법리가 실제 판결과 얼마나 맞는지 채점합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">④ K-Law 적용 전후 비교</div><div class=\"step-desc\">K-Law를 적용했을 때 점수가 얼마나 오르는지 대형·중소형 그룹별로 봅니다.</div></div></div></div><h3>수치를 읽는 법</h3><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">일치도</div>대법원 공개 판례 300건으로 한 자체 시험에서 최초 평가 평균은 <strong>7.44/10(약 74%)</strong>이었습니다. 1·2심의 40~45%라는 수치는 대법원 공개 판례에 한정한 경향이며, 1·2심 판결 전반의 일치도는 훨씬 높습니다. 시험은 AI에게 불리한 조건(A4 1쪽 사건 개요, 웹 검색 차단)에서 했습니다.</div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">Agon</div>Agon은 원심 결과를 숨기고, 원고·피고 공방을 거치며, 모범 판결문으로 채점하는 별도의 방법론 체계입니다. K-Law(v15.x)와는 별개의 경로로 진행하며, 공개는 2027년 상반기로 예정되어 있습니다(변경될 수 있습니다).</div></div>","updated":"2026-10-24"},{"tier":"advanced","title":"MoTE란 무엇인가","id":"ch30","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:340px;display:block;margin:0 auto\">\n<rect x=\"30\" y=\"20\" width=\"140\" height=\"100\" rx=\"8\" fill=\"#fef7e0\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"40\" x2=\"150\" y2=\"40\" stroke=\"#b06000\" stroke-width=\"2\"/><line x1=\"50\" y1=\"55\" x2=\"150\" y2=\"55\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"70\" x2=\"150\" y2=\"70\" stroke=\"#b06000\" stroke-width=\"2\"/><line x1=\"50\" y1=\"85\" x2=\"120\" y2=\"85\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<text x=\"100\" y=\"112\" text-anchor=\"middle\" font-size=\"10\" fill=\"#b06000\">A4 약 50페이지</text>\n<line x1=\"185\" y1=\"70\" x2=\"230\" y2=\"70\" stroke=\"#94a3b8\" stroke-width=\"2\" marker-end=\"url(#a30)\"/>\n<defs><marker id=\"a30\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#94a3b8\"/></marker></defs>\n<circle cx=\"300\" cy=\"70\" r=\"45\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2.5\"/>\n<text x=\"300\" y=\"65\" text-anchor=\"middle\" font-size=\"11\" fill=\"#188038\" font-weight=\"700\">MoTE</text>\n<text x=\"300\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#188038\">비용 절감</text>\n</svg></div>\n<h2>MoTE란 무엇인가</h2>\n<p>K-Law가 법률 분석을 하려면 헌법·법률·판례 지침을 미리 읽혀둬야 하며, 그 분량은 A4 용지로 약 50페이지에 달합니다. <strong>MoTE는 이 비용을 구조적으로 줄이는 기술</strong>입니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">문제: 매번 다시 읽기</div><div class=\"step-desc\">AI가 질문마다 50페이지 분량의 참고자료를 새로 읽으면 비용과 에너지가 많이 듭니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">해결: MoTE</div><div class=\"step-desc\">핵심 지침을 효율적으로 재사용해 매번 처음부터 다시 읽지 않도록 구조화합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">효과: 이용료·에너지 절감</div><div class=\"step-desc\">이 절감분이 <a class=\"ch-link\" href=\"#\" data-goto=\"ch17\">「K-서비스 호출하기」장</a>·<a class=\"ch-link\" href=\"#\" data-goto=\"ch16\">「전문가 페르소나 호출하기」장</a>·<a class=\"ch-link\" href=\"#\" data-goto=\"ch17\">「K-서비스 호출하기」장</a>에서 다룬 K-서비스·전문가 페르소나 이용료를 낮추는 데 기여합니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 중요한가요?</div>MoTE 같은 구조적 효율화가 없다면 전문 지식이 필요한 AI 서비스의 비용이 훨씬 비싸질 수밖에 없습니다.</div></div>\n","quiz":[{"q":"MoTE가 해결하려는 문제는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/></svg>","options":["느린 인터넷 속도","매번 방대한 참고자료를 새로 읽어야 하는 비용 문제","디자인 문제","가입 절차 문제"],"answer":1,"explain":"K-Law 같은 서비스가 매번 A4 약 50페이지를 다시 읽어야 하는 비용 문제를 구조적으로 줄입니다."},{"q":"MoTE의 효과는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg>","options":["속도만 빨라짐","이용료·에너지 절감","기능이 줄어듦","보안 강화만"],"answer":1,"explain":"구조적으로 비용과 에너지를 절감시켜 이용료를 낮추는 데 기여합니다."},{"q":"MoTE의 절감 효과가 영향을 주는 서비스는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["K-서비스·전문가 페르소나 이용료","나비 온도","가입 절차","없음"],"answer":0,"explain":"절감된 비용이 K-서비스·전문가 페르소나 이용료를 낮추는 데 반영됩니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"advanced","title":"정부 없이 여권 발급이 가능할까?","id":"ch31","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;display:block;margin:0 auto\">\n<circle cx=\"200\" cy=\"80\" r=\"60\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<line x1=\"140\" y1=\"80\" x2=\"260\" y2=\"80\" stroke=\"#0c6cc3\" stroke-width=\"1.5\"/>\n<path d=\"M200 20a60 90 0 0 1 0 120\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"1.5\"/>\n<path d=\"M200 20a60 90 0 0 0 0 120\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"1.5\"/>\n<circle cx=\"200\" cy=\"80\" r=\"18\" fill=\"#fef7e0\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<text x=\"200\" y=\"86\" text-anchor=\"middle\" font-size=\"18\" fill=\"#b06000\" font-weight=\"700\">?</text>\n</svg></div>\n<h2>정부 없이 여권 발급이 가능할까?</h2>\n<p>여권은 전통적으로 국가만이 발급해왔습니다. 하지만 신원 확인·기록 관리를 기술로 대체할 수 있다면 어떨까요?</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">신원 확인의 핵심</div><div class=\"step-desc\">여권의 본질은 \"이 사람이 실제로 이 사람이다\"를 증명하는 것 — 나비의 가입·인증 구조(<a class=\"ch-link\" href=\"#\" data-goto=\"ch1\">「가입하기」장</a>)와 원리가 같습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">신뢰 인프라</div><div class=\"step-desc\">Openhash(<a class=\"ch-link\" href=\"#\" data-goto=\"ch29\">「Openhash」장</a>) 같은 위변조 방지 기술이 국가 발급 없이도 신뢰를 담보할 잠재력을 보여줍니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">현실적 한계</div><div class=\"step-desc\">다만 국경 통과·법적 효력은 각국 정부의 상호 인정이 필요해, 기술만으로 완전히 대체하긴 어렵습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">그래서 결론은?</div>기술적으로는 신원 증명이 가능하지만, 실제 여권 대체는 국제적 합의가 필요한 영역입니다 — <a class=\"ch-link\" href=\"#\" data-goto=\"ch32\">「나비로 구현하는 글로벌 전자 여권」장</a>에서 나비가 이 문제에 접근하는 방식을 다룹니다.</div></div>\n","quiz":[{"q":"여권의 본질적 기능은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>","options":["예쁜 디자인","신원 증명","사진 보관","여행 기록"],"answer":1,"explain":"여권의 핵심은 '이 사람이 실제로 이 사람이다'를 증명하는 신원 확인 기능입니다."},{"q":"나비의 어떤 기술이 신원 증명의 신뢰 기반이 될 수 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg>","options":["Openhash","GDC","나비마켓","전문가 페르소나"],"answer":0,"explain":"위변조 방지 기술인 Openhash가 신뢰의 기반이 될 잠재력을 보여줍니다."},{"q":"기술만으로 여권을 완전히 대체하기 어려운 이유는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg>","options":["기술이 부족해서","국경 통과 등에는 각국 정부의 상호 인정이 필요해서","비용이 너무 비싸서","보안이 약해서"],"answer":1,"explain":"법적 효력과 국경 통과는 국제적 합의가 필요한 영역이기 때문입니다."}],"placeholder":false},{"tier":"advanced","title":"나비로 구현하는 글로벌 전자 여권","id":"ch32","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:340px;display:block;margin:0 auto\">\n<rect x=\"130\" y=\"20\" width=\"140\" height=\"100\" rx=\"8\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n<circle cx=\"200\" cy=\"55\" r=\"16\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<line x1=\"150\" y1=\"90\" x2=\"250\" y2=\"90\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"70\" cy=\"70\" r=\"10\" fill=\"#188038\"/><circle cx=\"330\" cy=\"70\" r=\"10\" fill=\"#188038\"/><circle cx=\"200\" cy=\"140\" r=\"10\" fill=\"#188038\"/>\n<line x1=\"130\" y1=\"70\" x2=\"80\" y2=\"70\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n<line x1=\"270\" y1=\"70\" x2=\"320\" y2=\"70\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n<line x1=\"200\" y1=\"120\" x2=\"200\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n</svg></div>\n<h2>나비로 구현하는 글로벌 전자 여권</h2>\n<p><a class=\"ch-link\" href=\"#\" data-goto=\"ch31\">「정부 없이 여권 발급이 가능할까?」장</a>에서 살펴본 개념을 실제로 구현하면, 나비 계정 하나로 전 세계 어디서든 신원을 증명할 수 있는 형태가 됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"2\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><line x1=\"8\" y1=\"17\" x2=\"16\" y2=\"17\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 나비 신원 = 전자 여권의 기초</div><div class=\"step-desc\"><a class=\"ch-link\" href=\"#\" data-goto=\"ch_wallet\">「지갑과 백업 키」장</a>의 지갑 기반 신원이 여권 역할의 출발점이 됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② Openhash로 위변조 방지</div><div class=\"step-desc\"><a class=\"ch-link\" href=\"#\" data-goto=\"ch29\">「Openhash」장</a>의 분산 인증 기술이 여권 정보의 신뢰성을 보장합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 국가 간 상호 인정 확대</div><div class=\"step-desc\">각국 정부·기관이 나비 신원을 인정하는 범위가 넓어질수록 실제 여권처럼 쓰일 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"2\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><line x1=\"8\" y1=\"17\" x2=\"16\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">지금 당장 여권을 대체하나요?</div>아직은 아닙니다 — 이는 나비가 지향하는 방향이며, 각국의 제도적 인정이 함께 진행되어야 완성됩니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">전체 장을 완주하셨다면</div>축하합니다! 초급·중급·고급 전체 장을 모두 마치면 GDC 10,000T와 나비 온도 상승이 함께 반영됩니다.</div></div>\n","quiz":[{"q":"나비 전자 여권 구상의 출발점은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"2\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><line x1=\"8\" y1=\"17\" x2=\"16\" y2=\"17\"/></svg>","options":["지갑 기반 신원(1장)","나비마켓 거래","GDC 잔액","닉네임"],"answer":0,"explain":"1장에서 다룬 지갑 기반 신원이 전자 여권 구상의 기초가 됩니다."},{"q":"여권 정보의 신뢰성을 보장하는 기술은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg>","options":["Openhash","마이크 기능","숫자 코드","나비마켓"],"answer":0,"explain":"29장에서 다룬 Openhash의 분산 인증 기술이 신뢰성을 보장합니다."},{"q":"나비 전자 여권이 실제 여권처럼 쓰이려면 무엇이 필요한가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg>","options":["아무것도 필요 없음, 이미 완성됨","각국 정부·기관의 상호 인정 확대","앱 재설치","광고 시청"],"answer":1,"explain":"국가 간 상호 인정이 확대되어야 실제 여권처럼 통용될 수 있습니다."}],"placeholder":false},{"tier":"advanced","title":"보안 설정 직접 조정하기 — 문턱값과 유예","id":"ch33","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/></g></svg></div>\n<h2>보안 설정 직접 조정하기 — 문턱값과 유예</h2>\n<p><a class=\"ch-link\" href=\"#\" data-goto=\"ch7\">「폰-PC 연동과 알림」장</a>(폰-PC 연동)의 지문 확인, <a class=\"ch-link\" href=\"#\" data-goto=\"ch15\">「GDC 사용하기」장</a>(GDC 사용)의 결제 문턱값처럼, 나비는 지문 인증을 기본적으로 넓게 적용합니다. 다만 이 기준을 사용자가 직접 조정할 수 있고, <strong>조정 방향에 따라 처리 방식이 다릅니다.</strong></p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">조정할 수 있는 3가지</div>\n  ① GDC 개인 간 송금 시 지문을 요구하는 금액(기본 10만 원) ② K-서비스 결제 시 지문을 요구하는 금액(기본 1만 원, <a class=\"ch-link\" href=\"#\" data-goto=\"ch15\">「GDC 사용하기」장</a> 참고) ③ 다른 기기 로그인 승인 시 지문 필수 여부(기본 켜짐, <a class=\"ch-link\" href=\"#\" data-goto=\"ch7\">「폰-PC 연동과 알림」장</a> 참고). 모두 설정 페이지(<a class=\"ch-link\" href=\"#\" data-goto=\"ch9\">「설정 페이지 사용법」장</a>)에서 조정합니다.</div>\n</div>\n\n<h3>보안을 높이는 쪽 vs 낮추는 쪽</h3>\n<div class=\"step-list\">\n  <div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">낮은 금액으로, 지문 켜짐으로 — 즉시 적용</div><div class=\"step-desc\">문턱값을 낮추거나(더 자주 지문 요구) 지문 필수를 다시 켜는 건 보호를 강화하는 방향이라, 지갑 서명만으로 바로 반영됩니다.</div></div></div>\n  <div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">높은 금액으로, 지문 꺼짐으로 — 24시간 뒤 적용</div><div class=\"step-desc\">문턱값을 올리거나 지문 필수를 끄는 건 보호를 낮추는 방향입니다. 그 자리에서 지문 확인을 한 번 거친 뒤에도, 바로 적용되지 않고 <strong>24시간 뒤부터 적용</strong>됩니다.</div></div></div>\n  <div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">그 사이 다른 기기로 알림</div><div class=\"step-desc\">완화가 예약되면 등록된 다른 기기에도 알림이 갑니다. 본인이 요청한 게 아니라면, 적용되기 전까지 언제든 설정 화면에서 취소할 수 있습니다.</div></div></div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">왜 완화만 24시간이 걸리나요?</div>\n  누군가 잠깐이라도 내 폰을 손에 넣으면, 즉시 보안을 낮춰놓고 돌려줄 위험이 있습니다 — 그러면 원래 주인은 눈치도 못 챈 채 보호가 약해진 상태로 계속 지내게 됩니다. 강화는 그런 위험이 없어서 즉시 반영해도 안전하지만, 완화는 \"진짜 내가 원해서 낮추는 건지\" 확인할 시간이 필요합니다.</div>\n</div>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">지문을 못 쓰는 기기라면?</div>\n  지문·Face ID 센서가 없는 기기는 이 조정 자체를 켤 수 없습니다 — 대신 기본값(넓은 지문 적용)이 계속 유지됩니다. 지원 기기로 한 번이라도 로그인하면 그 계정 전체의 설정을 조정할 수 있습니다.</div>\n</div>","quiz":[{"q":"문턱값을 낮추는 것과 올리는 것 중, 즉시 적용되는 쪽은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg>","options":["낮추는 쪽(강화)","올리는 쪽(완화)","둘 다 즉시 적용","둘 다 24시간 걸림"],"answer":0,"explain":"보호를 강화하는 방향(문턱값을 낮추거나 지문을 다시 켜는 것)은 지갑 서명만으로 바로 반영됩니다."},{"q":"보호를 낮추는 조정을 하면 어떤 일이 함께 일어나나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg>","options":["아무 일도 없음","지문 확인 후 24시간 유예 + 다른 기기로 알림","즉시 계정이 잠김","자동으로 취소됨"],"answer":1,"explain":"지문 확인을 거친 뒤에도 24시간 뒤에야 적용되고, 그 사이 다른 등록 기기에 알림이 갑니다 — 본인이 요청한 게 아니면 취소할 수 있습니다."},{"q":"완화에 유예 시간을 두는 이유는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["시스템 속도 문제","폰을 잠깐 손에 넣은 사람이 몰래 보안을 낮춰버리는 걸 막기 위해","법적 의무라서","이유 없음"],"answer":1,"explain":"즉시 완화되면, 폰을 잠깐이라도 손에 넣은 사람이 보호 수준을 낮춰놓고 돌려줘도 원래 주인이 알아챌 수 없습니다. 유예 시간과 알림이 이걸 막습니다."}],"placeholder":false},{"tier":"advanced","title":"K-Mail 고급 — 주소록 대량 등록과 \"메일\" 탭 깊이 쓰기","id":"ch_kmail_advanced","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"9\" cy=\"21\" r=\"1\"></circle><circle cx=\"20\" cy=\"21\" r=\"1\"></circle><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path></g></svg></div>\n<h2>K-Mail 고급 — 주소록 대량 등록과 \"메일\" 탭 깊이 쓰기</h2>\n<p><a class=\"ch-link\" href=\"#\" data-goto=\"ch_kmail\">「K-Mail」장</a>에서 다룬 기본 사용법을 넘어, 수백 명 단위의 주소록을 한 번에 관리하고 편지쓰기·보관함까지 갖춘 전용 화면을 쓰는 방법입니다.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">CSV/엑셀로 수백 명 한 번에 등록</div>대화로 한 명씩 부르는 대신, 엑셀이나 CSV 파일을 그대로 업로드하면 AI 호출 없이 순수 등록 경로로 한 번에 처리됩니다 — 대화형 등록이 배치 크기에 걸려 실패하던 문제를 구조적으로 피합니다.</div>\n</div>\n\n<h3>등록되면서 자동으로 분류됩니다</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">① 파일 업로드</div><div class=\"step-desc\">이름·이메일·소속 열이 있는 CSV나 엑셀 파일을 그대로 올립니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"21\" r=\"1\"></circle><circle cx=\"20\" cy=\"21\" r=\"1\"></circle><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path></svg></div><div class=\"step-body\"><div class=\"step-title\">② 소속명으로 카테고리 자동분류</div><div class=\"step-desc\">\"대학교\"가 들어가면 교육, \"병원\"이 들어가면 의료, \"시청\"이 들어가면 행정 — 이런 식으로 소속명 키워드를 보고 카테고리를 결정적으로(무작위 아님) 채워줍니다. 애매하면 빈 값으로 남겨둡니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 중복은 자동으로 걸러짐</div><div class=\"step-desc\">이미 등록된 이메일은 대소문자가 달라도 중복으로 인식해 다시 만들지 않습니다.</div></div></div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"></rect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"></rect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"></rect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"></rect></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">주소록이 커지면 목록 대신 카테고리 요약</div>연락처가 수백~수천 건이 되면 전체를 한 번에 나열하는 대신, 카테고리별 건수 칩만 먼저 보여줍니다 — 원하는 카테고리를 눌러야 그 안의 목록이 열립니다. 검색창을 쓰면 카테고리와 무관하게 전체에서 바로 찾을 수 있습니다.</div>\n</div>\n\n<h3>\"메일\" 탭 — 전형적인 메일 클라이언트</h3>\n<p>편지쓰기·임시보관함·보낸메일함·받은메일함·태그별 보관함 다섯 개 화면을 갖춘 전용 탭입니다. 편지쓰기 본문은 굵게·목록 같은 서식을 지원하는 리치 텍스트 편집기이고, 받은메일함에서 메일에 라벨(태그)을 달면 태그별 보관함에서 모아볼 수 있습니다.</p>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"></path><polyline points=\"22 6 12 13 2 6\"></polyline></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">대화로 쓴 초안이 편집기로 넘어옵니다</div>\"새 캠페인\" 대화에서 K-Mail에게 메일을 써달라고 하고 \"초안으로 저장해줘\"라고 말하면, 그 제목·본문이 \"메일\" 탭 편지쓰기 화면에 그대로 채워집니다 — 대화와 편집기를 오가며 다듬을 수 있습니다.</div>\n</div>\n\n<h3>소속 기관 트리와 캠페인</h3>\n<p>연락처가 많으면 <b>소속 기관 트리</b>(학교 &gt; 대학 &gt; 제주대학교 &gt; 컴퓨터공학과)로 정리합니다. 소속이 빈 연락처는 <b>자동 분류 마법사</b>가 제안하지만 <b>바로 적용되지 않고</b> 검토·수정 후 한꺼번에 적용합니다.</p>\n<p>말로도 됩니다: “홍길동 님 연락처 찾아 주세요”, “방금 보낸 분들께 ‘세미나’ 태그를 붙여 주세요”, “중복된 연락처를 합쳐 주세요”.</p>\n<p><b>캠페인</b>(같은 목적으로 보내는 메일 묶음) 흐름: 목적 확인 → 받을 사람 찾기 → 주소록 반영 → 최종 확인 후 발송 → 답장 모으기(다이제스트) → 보고(응답률) → 종료. 추적 링크를 요청하면 누가 눌렀는지 알 수 있습니다. 연습은 <b>미리보기까지만</b> 하세요.</p>\n<p>메일을 보낸 상대는 자동으로 주소록에 저장되고, 이름·이메일·직업·소속·메모·관계·태그를 둘 수 있습니다.</p>","quiz":[{"q":"수백 명 단위의 주소록을 한 번에 등록하는 가장 안전한 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></svg>","options":["대화로 한 명씩 부르기","CSV/엑셀 파일 업로드","전화로 문의","불가능함"],"answer":1,"explain":"파일 업로드는 AI 대화를 거치지 않는 순수 등록 경로라, 대화형 등록이 배치 크기에 걸려 실패하던 문제를 구조적으로 피합니다."},{"q":"CSV 업로드 시 카테고리는 어떻게 채워지나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"21\" r=\"1\"></circle><circle cx=\"20\" cy=\"21\" r=\"1\"></circle><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path></svg>","options":["항상 무작위로 채워짐","소속명 키워드로 결정적으로 분류, 애매하면 빈 값","사람이 매번 직접 입력","카테고리 기능 없음"],"answer":1,"explain":"대학교, 병원, 시청 같은 키워드로 카테고리를 자동 분류하고, 판단이 애매하면 억지로 채우지 않고 빈 값으로 남깁니다."},{"q":"주소록이 아주 커지면 기본 화면에는 무엇이 보이나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"></rect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"></rect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"></rect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"></rect></svg>","options":["전체 목록이 한 번에 다 나열됨","카테고리별 건수 요약 칩","빈 화면","오류 메시지"],"answer":1,"explain":"전체를 한 번에 나열하는 대신 카테고리별 건수 칩을 먼저 보여주고, 칩을 눌러야 그 안의 목록이 열립니다."},{"q":"자동 분류 마법사의 제안은 언제 적용되나요?","options":["즉시","검토·수정한 뒤 한꺼번에 적용할 때","매일 밤 자동"],"answer":1,"explain":"정답은 “검토·수정한 뒤 한꺼번에 적용할 때”입니다."},{"q":"캠페인에서 여러 답장을 한데 모은 요약은?","options":["다이제스트","라벨","Draft"],"answer":0,"explain":"정답은 “다이제스트”입니다."}],"placeholder":false,"updated":"2026-11-15"},{"tier":"advanced","title":"K-Clean 비용 산정과 정산 — 수거업체·지자체 연동","id":"ch_kclean_settlement","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:260px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"70\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(38,48)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"22\" cy=\"22\" r=\"20\"></circle><path d=\"M22 12v20M17 16h7a3.5 3.5 0 0 1 0 7h-7a3.5 3.5 0 0 0 0 7h7\"></path></g><circle cx=\"180\" cy=\"70\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(158,48)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"6\" width=\"40\" height=\"30\" rx=\"3\"></rect><path d=\"M2 14h40M10 22h8\"></path></g></svg></div>\n<h2>K-Clean 비용 산정과 정산 — 수거업체·지자체 연동</h2>\n<p>신고가 실제 수거·정화로 이어지려면 \"누가 얼마에 처리할 것인가\"가 정해져야 합니다. K-Clean은 이 견적·배정·정산 과정도 시스템 안에서 처리합니다.</p>\n\n<h3>1) 수거 견적 산정</h3>\n<p>2단계에서 분석한 쓰레기 종류·규모를 바탕으로 K-Clean이 예상 수거 비용을 산정합니다. 인력·장비(필요시 드론 운용 포함)·운반 거리 등을 반영한 <strong>수거 견적서</strong>가 신고서와 함께 발급됩니다.</p>\n\n<h3>2) 수거업체 배정(dispatch)</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"3\" width=\"15\" height=\"13\"></rect><polygon points=\"16 8 20 8 23 11 23 16 16 16 16 8\"></polygon><circle cx=\"5.5\" cy=\"18.5\" r=\"2.5\"></circle><circle cx=\"18.5\" cy=\"18.5\" r=\"2.5\"></circle></svg></div><div class=\"step-body\"><div class=\"step-title\">① 담당 업체 매칭</div><div class=\"step-desc\">지역·처리 종류에 맞는 등록된 수거업체(또는 지자체 환경과 직영반)에 견적서와 함께 작업이 배정됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">② 담당자 승인</div><div class=\"step-desc\">지자체 담당 공무원이 견적을 확인·승인하면 처리 상태가 \"승인\"으로 바뀌고, 승인 시각과 확정 비용이 함께 기록됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"></path><polyline points=\"8 12 11 15 16 9\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 정산</div><div class=\"step-desc\">수거 완료가 확인되면 확정 비용을 기준으로 정산이 이뤄지고, 세전 소득(income_before_tax) 기준으로 기록이 남아 <a class=\"ch-link\" href=\"#\" data-goto=\"ch24\">「세금 계산·납부 자동화」장</a>에서 다루는 세금 계산 자동화와도 연결됩니다.</div></div></div>\n</div>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"></line><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"></line></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">담당 공무원·업체는 어디서 확인하나요?</div>지자체·수거업체 계정으로 로그인하면 배정된 신고 건 목록과 승인 대기 견적을 대시보드에서 바로 확인·승인할 수 있습니다. <a class=\"ch-link\" href=\"#\" data-goto=\"ch20\">「나비마켓 판매자의 재무제표 자동 생성」장</a>에서 다룬 재무제표 자동 생성과 같은 방식으로, 정산 내역이 각 업체의 매출 기록에도 자동 반영됩니다.</div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"></path><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"></line><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"></line></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">일반 신고자도 비용을 부담하나요?</div>아니요. 신고자는 비용을 내지 않습니다. 비용 산정·정산은 담당 기관과 수거업체 사이의 절차이며, 신고자는 접수번호로 처리 상태만 확인하면 됩니다.</div>\n</div>","quiz":[{"q":"일반 신고자는 수거 비용을 부담하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["예, 전액 부담","아니요, 신고자는 비용을 내지 않는다","절반만 부담","업체에 따라 다르다"],"answer":1,"explain":"비용 산정·정산은 담당 기관과 수거업체 사이의 절차입니다."},{"q":"수거 견적을 확인·승인하는 사람은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["신고자","지자체 담당 공무원","다른 이용자","아무도 승인하지 않는다"],"answer":1,"explain":"담당 공무원이 승인하면 처리 상태가 \"승인\"으로 바뀌고 확정 비용이 기록됩니다."},{"q":"정산 내역은 업체의 어디에 반영되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["반영되지 않는다","매출 기록(재무제표)에 자동 반영된다","개인 PDV에만 남는다","우편으로 통보된다"],"answer":1,"explain":"재무제표 자동 생성과 같은 방식으로 업체의 매출 기록에 반영됩니다."}],"updated":"2026-10-24"},{"tier":"advanced","title":"내 양식 만들기","id":"ch_formbuilder","body":"<h2>내 양식 만들기</h2>\n<p><b>서류 → 내 서류함 → ＋ 새 양식 만들기</b>를 누르면 화면 전체가 양식 만들기 페이지로 바뀝니다. 왼쪽은 <b>양식 캔버스</b>(양식 이름·<b>묶음</b>·항목 카드), 아래쪽 줄은 선택한 항목의 설정, 오른쪽 아래 <b>💬 양식 작성 SP</b> 대화창입니다. 컴퓨터에서만 됩니다.</p>\n<p>가장 빠른 길은 말로 만들기: “사무실 임대차 점검표 양식을 만들어 줘”라고 하면 SP가 <b>초안</b>을 만들고, “연락처 칸을 성명 뒤에 추가해 줘”, “특이사항을 맨 위로”, “비고 칸을 크게”처럼 고칩니다. 직접 하려면 <b>예시로 시작</b>(신청서·점검표·금액 확인서)이나 <b>항목 추가</b>, <b>묶음 추가</b>(최대 8개)를 씁니다.</p>\n<p>항목 종류: <b>짧은글 · 긴글(줄 2~12) · 날짜 · 금액(단위) · 선택(선택지를 쉼표로)</b>. 공통 설정: <b>필수</b>(*), <b>폭</b>(12칸 격자에서 3~12, 기본 6, 긴글은 12), <b>안내 문구</b>(80자). 오른쪽 모서리를 끌어 폭을, 긴글은 아래 모서리를 끌어 줄 수를 정합니다.</p>\n<p>키보드: Enter 이름 고치기 · Shift+방향키 크기 · Alt+↑↓ 이동 · Delete 삭제. <b>되돌리기</b>로 직전 변경을 취소하고, <b>저장</b>하면 <b>내 서류함 → 내가 만든 양식</b>에 들어가 서류 작성 화면에서 바로 쓸 수 있습니다.</p>\n<p>한 줄에 항목 하나, <b>#</b>으로 묶음을 시작하는 표기(예: “성명* | 짧은글”, “구분 | 선택:입금/출금”)를 SP도 씁니다. 이름 끝의 *는 필수입니다.</p>","quiz":[{"q":"새 양식을 가장 빠르게 만드는 방법은?","options":["💬 양식 작성 SP에게 만들 양식을 말로 설명한다","코드를 직접 짠다","메일로 요청한다"],"answer":0,"explain":"정답은 “💬 양식 작성 SP에게 만들 양식을 말로 설명한다”입니다."},{"q":"선택 항목의 선택지는 어떻게 적나요?","options":["쉼표로 구분","줄 수로","적지 않는다"],"answer":0,"explain":"정답은 “쉼표로 구분”입니다."},{"q":"저장한 내가 만든 양식은 어디에 들어가나요?","options":["내 서류함 → 내가 만든 양식","보낸메일함","주소록"],"answer":0,"explain":"정답은 “내 서류함 → 내가 만든 양식”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","title":"자동화 — 자동 삭제와 위임 규칙","id":"ch_automation","body":"<h2>자동화 — 자동 삭제와 위임 규칙</h2>\n<p>설정도 대화로 바꿉니다: “‘광고’ 표시가 있는 메일은 도착하면 바로 삭제해 주세요”, “다음 주 월요일 오전 9시까지 휴가 중이라고 자동으로 답장해 주세요”.</p>\n<p>자동 답장은 같은 사람에게 <b>24시간에 한 번만</b> 가고 끝나는 시각을 정하면 멈춥니다. 자동 삭제는 <b>되돌리기 어려우니</b> 처음에는 범위를 좁게 정하세요.</p>\n<p><b>위임 규칙</b>은 “이런 요청이면 내 확인 없이 알아서 답장해”라고 미리 허락해 두는 약속입니다. 편리하지만 나비웹이 나 대신 답장을 보내게 됩니다.</p>\n<p>처음에는 쓰지 말고 대화에 익숙해진 뒤에 만드세요. 규칙은 <b>구체적이고 좁게</b>(예: “재고가 있는 짜장면·짬뽕 주문이면 수락”) 쓰고, <b>금액·계약·확정적인 약속</b>이 걸린 일은 규칙 밖에 두세요. 규칙은 언제든 고치거나 지울 수 있으니 가끔 목록을 확인하세요.</p>","quiz":[{"q":"자동 삭제 규칙을 처음 만들 때는?","options":["범위를 넓게","범위를 좁게","모든 메일에"],"answer":1,"explain":"정답은 “범위를 좁게”입니다."},{"q":"위임 규칙 밖에 두어야 하는 일은?","options":["금액·계약·확정적인 약속이 걸린 일","안부 인사","회의 시간 안내"],"answer":0,"explain":"정답은 “금액·계약·확정적인 약속이 걸린 일”입니다."},{"q":"자동 답장은 같은 사람에게?","options":["24시간에 한 번","메일마다","한 번도 안 간다"],"answer":0,"explain":"정답은 “24시간에 한 번”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","title":"업무(Case) 심화 — 초대·상태·기록·점검","id":"ch_case_deep","body":"<h2>업무(Case) 심화 — 초대·상태·기록·점검</h2>\n<p>새 일은 <b>맡은 일 / 맡긴 일</b> 메뉴에서 <b>＋ 새 일</b>로 만들고 상대방 메일 주소를 적습니다(“만들면서 초대 메일을 바로 보내기”를 켜면 사건 제목은 메일에 넣지 않고 초대가 나갑니다). 초대 링크(naviweb.kr/i…)는 <b>14일</b> 유효하고, 초대받은 기기에는 <b>7일</b> 기억됩니다. 상대가 수락하면 아이디가 전달되고 서로의 <b>서명 키</b>를 교환합니다.</p>\n<p>상태 흐름: <b>제안됨 → 합의됨 → 진행 중 ↔ 보류 → 종료 협의 중 → 종료 → 보관</b>(거절됨·만료도 있음). 합의는 상대가 확인(서명)해야 완료되고, 나 홀로는 합의 없이 시작합니다. 종료는 한쪽이 요청하면 상대가 동의·이의·보류로 응답합니다.</p>\n<p><b>진행 기록</b>은 시간순으로 쌓이며 메모는 내부용이거나 <b>공유</b>로 표시한 것만 상대에게 보입니다. <b>소통 이력</b>은 6하원칙(대면은 장소 필수)이며 상대가 기록한 소통은 확인 요청을 받을 수 있습니다. 기록은 <b>이 기기에만</b> 저장되고 네트워크에는 <b>해시(지문)만</b> 남으며, 화면 위쪽에 “기록 무결성 확인됨/변조 의심”이 표시됩니다. 상대의 서명 키 지문은 전화나 대면으로 대조하면 가장 안전합니다.</p>\n<p><b>점검</b>: 합의·공유·종료 직전에 비서가 규칙을 확인합니다. 지문 미대조, 공유 내용에 번호류가 있는 경우는 <b>주의</b>(기본 선택은 보류, Esc도 보류), 미결제 청구서가 있는 종료는 <b>진행 불가</b>입니다. <b>통과해도 법적으로 문제없다는 뜻이 아니며</b>, “적용 규칙 없음”도 문제없다는 뜻이 아닙니다. 중요한 일은 사람 전문가와 상의하세요.</p>","quiz":[{"q":"업무 기록은 어디에 저장되나요?","options":["서버에 전부","이 기기에만 저장하고 네트워크에는 해시만","메일로 전송"],"answer":1,"explain":"정답은 “이 기기에만 저장하고 네트워크에는 해시만”입니다."},{"q":"점검 결과가 “통과”이면?","options":["법적으로 문제없다는 보증이다","점검 규칙 범위 안의 결과일 뿐 법적 보증이 아니다","자동 제출된다"],"answer":1,"explain":"정답은 “점검 규칙 범위 안의 결과일 뿐 법적 보증이 아니다”입니다."},{"q":"초대 링크의 유효기간은?","options":["14일","1시간","무제한"],"answer":0,"explain":"정답은 “14일”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_cns","title":"나비 지식 온도와 전문가 인증서(CNS)","body":"<h2>나비 지식 온도와 전문가 인증서(CNS)</h2>\n<p><b>나비 지식 온도</b>는 매뉴얼을 얼마나 익혔는지 보여 주는 값으로, 36.5°에서 시작해 초급을 마치면 60°, 중급을 마치면 80°, 고급을 마치면 100°가 됩니다. 각 단계 안에서는 완료한 장 수에 비례해 오릅니다. 단계별 진행은 화면 위의 진행 막대로 봅니다.</p>\n<h3>인증서 받기</h3>\n<ul><li>나비 지식 온도가 <b>95° 이상</b>이 되면 <b>나비웹 전문가 인증서(Chartered Naviweb Specialist, CNS)</b>를 발급받을 수 있고, 화면에 “인증서 발급받기” 버튼이 나타납니다.</li><li>인증서에 넣을 <b>이름</b>을 입력합니다. 발급하면 이름과 발급일은 바꿀 수 없으니 정확히 적으세요.</li><li>발급된 인증서는 화면에서 보고 <b>PDF로 저장·인쇄</b>할 수 있습니다.</li></ul>\n<h3>준비 중</h3>\n<ul><li>이 인증서는 매뉴얼 학습 완료를 확인하는 것입니다. 변호사·세무사 같은 <b>전문가 면허 인증과 구독은 준비 중</b>입니다.</li></ul>\n<p>나비 지식 온도는 거래·평가로 오르내리는 신뢰 지표인 <b>나비 온도</b>와 다른 값입니다. 매뉴얼을 얼마나 익혔는지만 보여 줍니다.</p><p class=\"ch-note\">이 장은 매뉴얼의 나비 지식 온도 계산과 인증서 화면를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"나비 온도가 몇 도 이상이면 인증서를 발급받을 수 있나요?","options":["60°","80°","95°"],"answer":2,"explain":"정답은 “95°”입니다."},{"q":"인증서를 발급한 뒤 바꿀 수 없는 것은?","options":["이름과 발급일","PDF 저장 여부","화면 디자인"],"answer":0,"explain":"정답은 “이름과 발급일”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_kstock","title":"K-Stock — AI 자산관리 상담","body":"<h2>K-Stock — AI 자산관리 상담</h2>\n<p><b>하는 일</b>: 주식·채권·부동산·암호화폐·원자재 같은 자산을 나 한 명에게 맞춰 분석해 주는 AI 자산관리 전문가입니다. 소개 화면에는 대시보드와 “AI 전문가 상담”이 있습니다.</p>\n<h3>소개 화면이 설명하는 것</h3>\n<ul><li>24시간 연중무휴, 1:1 상담. 기존 PB와의 차이를 비교표로 보여 줍니다.</li><li>분석 자산군 89개, 재무 목표 예측(은퇴·주택·승계) 30년.</li><li>기록은 OpenHash로 위변조를 막는다고 적혀 있습니다.</li></ul>\n<h3>쓸 때 주의</h3>\n<ul><li>이 서비스의 답은 참고용 정보입니다. 투자 결정과 책임은 내게 있고, 나비는 특정 상품을 사라고 권하지 않습니다.</li><li>소개 화면의 수치(자산군 수, 예측 기간 등)는 서비스 설명이며 제3자가 검증한 결과가 아닙니다.</li></ul>\n<p class=\"ch-note\">이 장은 stock 저장소 소개 화면 문구를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-Stock의 답을 어떻게 써야 하나요?","options":["그대로 매수 지시로 따른다","참고용 정보로 보고 결정은 내가 한다","법원에 제출한다"],"answer":1,"explain":"정답은 “참고용 정보로 보고 결정은 내가 한다”입니다."},{"q":"소개 화면의 수치는?","options":["제3자가 검증했다","서비스 설명이며 제3자 검증 결과가 아니다","정부가 보증한다"],"answer":1,"explain":"정답은 “서비스 설명이며 제3자 검증 결과가 아니다”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_kinsurance","title":"K-Insurance — 상황 기반 AI 보험 (설계 단계)","body":"<h2>K-Insurance — 상황 기반 AI 보험 (설계 단계)</h2>\n<p><b>하는 일(설계 문서 기준)</b>: 이동·결제·의료 같은 일이 생길 때 AI가 필요한 보험을 판단해 적용하고, 사고가 나면 증거(PDV와 OpenHash)로 청구 서류를 만드는 보험 에이전트를 목표로 합니다. 제주 시범으로 시작한다고 적혀 있습니다.</p>\n<h3>상품 구조(설계 문서)</h3>\n<ul><li><b>자동 적용 보험</b>: 탑승(K-Traffic) · 배달(K-Market) · 응급 의료(K-119) · 거래 사기(GDC 고액 이체) — 해당 이벤트가 생기면 자동으로 적용됩니다.</li><li><b>생명 보험</b> 등 그 밖의 상품군이 함께 설계돼 있습니다.</li><li>소액(₮1 단위) 보험, 지점·설계사 없음, 재무제표 기반 보험료 산출이 특징으로 적혀 있습니다.</li></ul>\n<h3>지금 상태</h3>\n<ul><li>이 장은 저장소의 설계 문서를 풀어 쓴 것입니다. 실제로 가입·청구·지급할 수 있는 화면은 확인되지 않았습니다. 확인되면 화면을 따라가는 방식으로 다시 씁니다.</li></ul>\n<p class=\"ch-note\">이 장은 insurance 저장소 README(설계 문서)를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-Insurance의 현재 상태에 가장 가까운 설명은?","options":["모든 보험을 지금 가입할 수 있다","설계 문서 단계이며 실제 가입 화면은 확인되지 않았다","종료됐다"],"answer":1,"explain":"정답은 “설계 문서 단계이며 실제 가입 화면은 확인되지 않았다”입니다."},{"q":"자동 적용 보험의 예가 아닌 것은?","options":["탑승 보험","거래 사기 보험","주민등록 보험"],"answer":2,"explain":"정답은 “주민등록 보험”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_khealth","title":"K-Health — AI 증상 상담","body":"<h2>K-Health — AI 증상 상담</h2>\n<p><b>하는 일</b>: 채팅으로 AI와 증상을 상담합니다. 화면 제목은 “AI 평행 병원”이며, 메뉴에는 나의 의료 기록·건강 지표·예약 & 진료 기관·처방 & 약국·의료진·응급 안내가 있습니다.</p>\n<h3>실제로 되는 것과 개발 중인 것</h3>\n<ul><li><b>실제 동작</b>: AI 증상 상담(채팅, 24시간), PDV 암호화 저장(동의 하에 본인만 열람).</li><li><b>개발되지 않음(목표)</b>: 진료 기관 자동 추천, 진료 기관과 자동 협상·예약, 의사 사전 브리핑, 전 생애 PDV 기록 참조.</li><li>진단 정확도 향상은 검증된 수치가 없다고 화면에 적혀 있습니다.</li></ul>\n<h3>꼭 알아 둘 것</h3>\n<ul><li>AI 상담은 의사의 진단을 대신하지 않습니다. 몸이 걱정되면 병원에서 진료받으세요.</li><li>응급 상황이면 상담하지 말고 먼저 119에 연락하세요.</li></ul>\n<p class=\"ch-note\">이 장은 health 저장소 화면 문구(현재 상태 vs 목표 표)를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-Health에서 현재 실제로 동작하는 것은?","options":["AI 증상 상담","진료 기관 자동 예약","의사 사전 브리핑"],"answer":0,"explain":"정답은 “AI 증상 상담”입니다."},{"q":"응급 상황에서는?","options":["AI 상담을 먼저 한다","먼저 119에 연락한다","메일을 보낸다"],"answer":1,"explain":"정답은 “먼저 119에 연락한다”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_kpolice","title":"K-Police — AI 치안 서비스","body":"<h2>K-Police — AI 치안 서비스</h2>\n<p><b>하는 일</b>: 모든 시민·기관·사물에 전담 AI 경찰관을 배정한다는 AI 치안 서비스입니다. 별도 신청 없이 계정만으로 쓸 수 있다고 소개되며, 상황실 대시보드가 따로 있습니다.</p>\n<h3>소개 화면이 설명하는 것</h3>\n<ul><li>GPS·일정·채팅을 종합해 위험이 생기기 전에 알립니다(야간 이동, 낯선 차량 탑승, 우범 지역 접근 등).</li><li>신고를 받으면 사건번호를 발급하고, 위급한 사건은 가까운 요원에게 배정합니다.</li><li>모든 이력은 PDV에 6하원칙으로 암호화 기록됩니다.</li><li>K-Watch와의 차이: K-Police는 대화 중 <b>본인의 위험 신호</b>를 감지해 신고하고, K-Watch는 제3자로서 목격한 사건을 다룹니다.</li></ul>\n<h3>꼭 알아 둘 것</h3>\n<ul><li>위급할 때는 먼저 <b>112</b>에 직접 연락하세요.</li><li>소개 화면의 평균 출동 시간 같은 수치는 서비스 소개용 수치이며 제3자 검증 결과가 아닙니다.</li></ul>\n<p class=\"ch-note\">이 장은 police 저장소 소개 화면 문구를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"위급한 상황에서 먼저 해야 할 일은?","options":["K-Police 앱 설정 변경","112에 직접 연락","일정 추가"],"answer":1,"explain":"정답은 “112에 직접 연락”입니다."},{"q":"K-Police와 K-Watch의 차이로 맞는 것은?","options":["K-Police는 본인의 위험 신호, K-Watch는 제3자 목격 사건","둘은 같다","K-Watch는 본인만 다룬다"],"answer":0,"explain":"정답은 “K-Police는 본인의 위험 신호, K-Watch는 제3자 목격 사건”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_k119","title":"K-119 — AI 응급출동 서비스","body":"<h2>K-119 — AI 응급출동 서비스</h2>\n<p><b>하는 일</b>: 화재·구조·구급·자연재해·화학사고 같은 응급 상황에 대응하는 AI 응급출동 서비스입니다. 계정만으로 쓸 수 있다고 소개되며 종합상황실 화면이 따로 있습니다.</p>\n<h3>소개 화면이 설명하는 것</h3>\n<ul><li>GPS·신체 정보·채팅으로 위험을 미리 알립니다(심정지·낙상·화재 감지 시 알림).</li><li>신고하면 중증도를 1~4급으로 나누고 출동번호(FD-)를 발급합니다.</li><li>가까운 소방서·구급대 배치를 안내합니다.</li><li>기록은 PDV에 남습니다.</li></ul>\n<h3>꼭 알아 둘 것</h3>\n<ul><li>생명이 위급하면 앱을 열기 전에 <b>119</b>에 직접 전화하세요.</li><li>소개 화면의 평균 도착 시간 같은 수치는 제3자 검증 결과가 아닙니다.</li></ul>\n<p class=\"ch-note\">이 장은 911 저장소 소개 화면 문구를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"생명이 위급할 때 가장 먼저 할 일은?","options":["119에 직접 전화","앱 설정 열기","메일 쓰기"],"answer":0,"explain":"정답은 “119에 직접 전화”입니다."},{"q":"K-119가 신고를 중증도로 나누는 단계는?","options":["1~4급","1~10급","나누지 않는다"],"answer":0,"explain":"정답은 “1~4급”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_kpublic","title":"K-Public — AI 행정 상담","body":"<h2>K-Public — AI 행정 상담</h2>\n<p><b>하는 일</b>: 민원 발급·인허가·시설 신고·복지 신청 같은 행정 절차를 AI 채팅으로 안내받습니다.</p>\n<h3>실제로 되는 것과 개발되지 않은 것</h3>\n<ul><li><b>실제 동작</b>: 행정 절차 AI 상담(채팅, 24시간). 지역 예산·사업 정보는 일반 안내만 가능하고 실시간 공공데이터 연동은 아닙니다.</li><li><b>개발되지 않음</b>: 민원을 AI가 대신 처리, 서류 자동 작성·제출, 처리 현황 실시간 보고, 시설 신고 처리, 복지 서비스 안내(PDV 기반).</li></ul>\n<h3>알아 둘 점</h3>\n<ul><li>서류를 직접 쓰려면 “나비로” 같은 직역 사이트와 “서류 작성” 장을 이용하세요.</li></ul>\n<p class=\"ch-note\">이 장은 public 저장소 화면 문구(현재 상태 vs 목표 표)를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-Public에서 지금 실제로 동작하는 기능은?","options":["행정 절차 AI 상담","민원 대신 처리","서류 자동 제출"],"answer":0,"explain":"정답은 “행정 절차 AI 상담”입니다."},{"q":"민원을 AI가 대신 처리하는 기능은?","options":["이미 된다","개발되지 않았다","유료로 된다"],"answer":1,"explain":"정답은 “개발되지 않았다”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_ksecurity","title":"K-Security — 나비웹 보안 감시","body":"<h2>K-Security — 나비웹 보안 감시</h2>\n<p><b>하는 일</b>: 나비웹 하위 시스템 22개의 해킹·오류 여부를 AI가 30초마다 감시하고, 현황을 공개합니다. 실시간 대시보드, AI 보안 상담, 백서가 있습니다.</p>\n<h3>작동 방식(소개 화면)</h3>\n<ul><li>각 시스템에 에이전트를 붙이면 30초마다 응답 시간·인증 상태·PDV 흐름을 스스로 점검해 보고합니다.</li><li>AI가 2단계로 분석하고 심각도(S1~S3)를 판정합니다.</li><li>이상이 있으면 해당 시스템의 이해관계자에게 알립니다. 가장 심각한(S3) 단계에서는 시스템 정지 지시와 K-Police 연동이 발동한다고 적혀 있습니다.</li></ul>\n<h3>사용자가 알 것</h3>\n<ul><li>일반 사용자가 설정할 것은 없습니다. 보안 현황은 숨기지 않고 공개한다는 원칙이 소개돼 있습니다.</li></ul>\n<p class=\"ch-note\">이 장은 security 저장소 소개 화면 문구를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-Security는 얼마나 자주 점검하나요?","options":["30초마다","하루에 한 번","1년에 한 번"],"answer":0,"explain":"정답은 “30초마다”입니다."},{"q":"일반 사용자가 설정해야 하는 것은?","options":["매일 점검 버튼","없다 — 감시는 자동이다","비밀번호 공유"],"answer":1,"explain":"정답은 “없다 — 감시는 자동이다”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_ktraffic","title":"K-Traffic — 교통·카풀 매칭","body":"<h2>K-Traffic — 교통·카풀 매칭</h2>\n<p><b>하는 일</b>: 이미 이동 중인 차량의 동선에 새로운 이동 수요를 끼워 넣어 이동 경로를 짜는 AI 교통 플랫폼입니다. 저장소 설명 기준입니다.</p>\n<h3>화면(저장소 설명)</h3>\n<ul><li>운전자·사무 이용자용 화면: AI 채팅 매칭, 이동 요청, PDV 기록, GDC 지갑.</li><li>스마트폰용 화면: 차량 탐색, 탑승 요청.</li><li>내 이동 이력(기간별), 전국 현황판, 관제 센터용 지도 화면이 따로 있습니다.</li></ul>\n<h3>알아 둘 점</h3>\n<ul><li>탑승·화물·평가·긴급 이벤트는 PDV에 기록되고, K-Insurance의 탑승 보험과 이어지도록 설계돼 있습니다.</li><li>실제 운행 서비스 여부는 확인되지 않았습니다. 확인되면 화면을 따라가며 다시 씁니다.</li></ul>\n<p class=\"ch-note\">이 장은 traffic 저장소 README를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-Traffic의 핵심 아이디어는?","options":["새 차량을 늘린다","이미 이동 중인 차량의 동선에 수요를 끼워 넣는다","도로를 새로 만든다"],"answer":1,"explain":"정답은 “이미 이동 중인 차량의 동선에 수요를 끼워 넣는다”입니다."},{"q":"탑승 이벤트는 어디에 기록되나요?","options":["PDV","공개 게시판","기록하지 않는다"],"answer":0,"explain":"정답은 “PDV”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_klogistics","title":"K-Logistics — 물류 매칭","body":"<h2>K-Logistics — 물류 매칭</h2>\n<p><b>하는 일</b>: 이미 이동 중인 차량의 동선에 화물을 끼워 넣어 물류 경로를 짜는 AI 물류 플랫폼입니다. 농수산물·제조 부품·소비재·의료품을 한 플랫폼으로 합친다는 것이 목표입니다. K-Traffic과 같은 구조입니다.</p>\n<h3>화면(저장소 설명)</h3>\n<ul><li>스마트폰 화면: AI 물류 채팅 매칭, 배송 요청, 실시간 추적, PDV 기록.</li><li>개인 발송자 화면: 내 배송 이력, GDC 지출, OpenHash 증빙 조회.</li><li>전국 물류 현황판과 관제 센터 화면이 따로 있습니다.</li></ul>\n<h3>알아 둘 점</h3>\n<ul><li>실제 배송 서비스 여부는 확인되지 않았습니다. 확인되면 화면을 따라가며 다시 씁니다.</li></ul>\n<p class=\"ch-note\">이 장은 logistics 저장소 README를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-Logistics가 화물을 끼워 넣는 대상은?","options":["이미 이동 중인 차량의 동선","새로 지은 창고","드론"],"answer":0,"explain":"정답은 “이미 이동 중인 차량의 동선”입니다."},{"q":"배송 이력과 GDC 지출은 어디서 보나요?","options":["개인 발송자 화면","관제 센터 화면만","볼 수 없다"],"answer":0,"explain":"정답은 “개인 발송자 화면”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_kdemocracy","title":"K-Democracy — AI 민주주의","body":"<h2>K-Democracy — AI 민주주의</h2>\n<p><b>하는 일</b>: 고팡 AI 평행 세계의 입법 시스템입니다. 누구나 안건을 제안하고, 공헌도에 비례한 의결권으로 결정하며, 결과는 OpenHash에 영구 기록됩니다.</p>\n<h3>구성</h3>\n<ul><li>메인 화면(desktop)과 모바일 화면, 그리고 고팡 평행 법전(원칙·민사규칙 18조·형사규칙 30조)이 있습니다.</li><li>고팡의 원칙과 규칙은 현실 세계의 헌법과 법률에 종속된다고 명시돼 있습니다.</li></ul>\n<h3>알아 둘 점</h3>\n<ul><li>이 서비스의 결정은 가상(평행 세계) 입법이며 현실의 법적 효력이 없습니다.</li></ul>\n<p class=\"ch-note\">이 장은 democracy 저장소 README를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-Democracy에서 의결권은 무엇에 비례하나요?","options":["공헌도","재산","나이"],"answer":0,"explain":"정답은 “공헌도”입니다."},{"q":"고팡의 원칙과 규칙은 현실의 법과 어떤 관계인가요?","options":["현실의 헌법·법률에 종속된다","현실의 법보다 우선한다","무관하다"],"answer":0,"explain":"정답은 “현실의 헌법·법률에 종속된다”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_kconst","title":"K-Const — 헌법재판소 가상 결정 시뮬레이션","body":"<h2>K-Const — 헌법재판소 가상 결정 시뮬레이션</h2>\n<p><b>하는 일</b>: 헌법재판소의 5개 심판유형(위헌법률심판·헌법소원심판·탄핵심판·정당해산심판·권한쟁의심판)에 대한 <b>가상 결정</b>을 시뮬레이션하는 방법론입니다. K-Law(가상 판결)의 자매 시스템이며 별도 저장소로 나뉘어 있습니다.</p>\n<h3>K-Law와 다른 점</h3>\n<ul><li>헌법재판소는 법원이 아닌 독립된 헌법기관이고, 판결이 아니라 “결정”을 하며, 심판유형이 5가지로 법에 정해져 있어 공리 체계가 다릅니다.</li></ul>\n<h3>알아 둘 점</h3>\n<ul><li>이것은 가상 결정 시뮬레이션이며 실제 헌법재판소의 결정이 아닙니다. 일치도 같은 수치는 자체 실험이며 제3자 검증을 받지 않았습니다.</li><li>저장소는 방법론 문서 중심이며 사용자 화면은 확인되지 않았습니다.</li></ul>\n<p class=\"ch-note\">이 장은 constitution 저장소 README를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-Const가 다루는 것은?","options":["실제 헌법재판소 결정","가상 결정 시뮬레이션","재판 대리"],"answer":1,"explain":"정답은 “가상 결정 시뮬레이션”입니다."},{"q":"헌법재판소의 심판유형은 몇 가지인가요?","options":["3가지","5가지","10가지"],"answer":1,"explain":"정답은 “5가지”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","id":"ch_kjit","title":"K-JIT — 사회효용 우선 적시조달 (초안·준비 중)","body":"<h2>K-JIT — 사회효용 우선 적시조달 (초안·준비 중)</h2>\n<p><b>하는 일</b>: 가계·기업·기관이 필요한 물자·인원·서비스의 조달을 계획하는 메커니즘입니다. 개별 주체의 비용 최소화가 아니라 사회 전체의 효용 극대화와 총비용 최소화를 목표로 삼는 점이 기존 JIT와 다릅니다.</p>\n<h3>현재 상태 — 준비 중</h3>\n<ul><li>저장소 기준 <b>초안(v0.1)</b>이며 아직 서비스 목록에 등록되지 않았고 라우팅에도 연결되지 않았습니다.</li><li>K-Logistics·K-Market과 이어지는 서비스로 설계돼 있습니다.</li></ul>\n<p>서비스가 열리면 화면과 쓰는 방법을 채웁니다.</p>\n<p class=\"ch-note\">이 장은 jit 저장소 README를 근거로 쓴 초안입니다. 실제 화면 확인 전이라 버튼 이름과 순서가 다를 수 있습니다.</p>","quiz":[{"q":"K-JIT가 목표로 삼는 것은?","options":["개별 주체의 비용 최소화","사회 전체의 효용 극대화와 총비용 최소화","재고 확대"],"answer":1,"explain":"정답은 “사회 전체의 효용 극대화와 총비용 최소화”입니다."},{"q":"K-JIT의 현재 상태는?","options":["정식 서비스 중","초안·준비 중","종료"],"answer":1,"explain":"정답은 “초안·준비 중”입니다."}],"updated":"2026-11-15"}];
var TIER_LABELS = {"beginner": "초급", "intermediate": "중급", "advanced": "고급"};

var TIER_ORDER = ["beginner", "intermediate", "advanced"];
var STORAGE_KEY = "hondi_manual_progress_v1";

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {completed: [], tierRewardClaimed: []}; }
  catch (e) { return {completed: [], tierRewardClaimed: []}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
var progress = loadProgress();
var currentTier = "beginner";
var currentChapterId = CHAPTERS[0].id;

function chaptersByTier(tier) { return CHAPTERS.filter(function (c) { return c.tier === tier; }); }
function isCompleted(id) { return progress.completed.indexOf(id) !== -1; }
function tierCompletedCount(tier) { return chaptersByTier(tier).filter(function (c) { return isCompleted(c.id); }).length; }
function tierFullyDone(tier) { var chs = chaptersByTier(tier); return chs.length > 0 && chs.every(function (c) { return isCompleted(c.id); }); }

/* 나비 지식 온도(2026-11-14) — 초급·중급·고급 단계별 구간으로 올라간다: 시작 36.5° → 초급 완료 60° → 중급 완료 80° → 고급 완료 100°.

   95° 이상이 되면 나비웹 전문가 인증서(Chartered Naviweb Specialist, CNS)를 발급받을 수 있다. */
var TEMP_BASE = 36.5, TEMP_SPAN = {beginner: 23.5, intermediate: 20, advanced: 20}, CNS_AT = 95, CNS_KEY = 'naviweb_cns_v1';

  var t = TEMP_BASE, mf = {};

  var mName = text.match(/문서명\s*:\s*(.+?)\s*—/);
  var mDept = text.match(/소관부처\s*:\s*(.+)/);
  return { name: mName ? mName[1].trim() : null, dept: mDept ? mDept[1].trim() : '기타' };
}
function kgovRawUrl(repoRelativePath) {
  return 'https://raw.githubusercontent.com/Openhash-Gopang/gopang/main/' + repoRelativePath;
}
function kgovModal() {
  var m = DOC.getElementById('kgovModal');
  if (m) return m;
  m = document.createElement('div');
  m.id = 'kgovModal';
  m.className = 'kgov-modal';
  m.innerHTML = '<div class="kgov-modal-inner"><div class="kgov-modal-head"><span id="kgovModalTitle"></span><button type="button" id="kgovModalClose" aria-label="닫기">✕</button></div><pre id="kgovModalBody"></pre></div>';
  (EMBED ? DOC : document.body).appendChild(m);
  m.addEventListener('click', function (e) { if (e.target === m) m.classList.remove('open'); });
  m.querySelector('#kgovModalClose').addEventListener('click', function () { m.classList.remove('open'); });
  return m;
}
function kgovShow(title, text) {
  var m = kgovModal();
  m.querySelector('#kgovModalTitle').textContent = title;
  m.querySelector('#kgovModalBody').textContent = text;
  var note = m.querySelector('#kgovModalNote');
  var leftover = text.match(/\{[A-Z_]+\}/g);
  if (leftover) {
    if (!note) {
      note = document.createElement('div');
      note.id = 'kgovModalNote';
      note.className = 'kgov-modal-note';
      m.querySelector('.kgov-modal-inner').insertBefore(note, m.querySelector('#kgovModalBody'));
    }
    var uniq = Array.from(new Set(leftover)).join(', ');
    note.textContent = uniq + '는 실제 서비스에서 상위 공용 SP가 자동으로 삽입되는 자리로, 이 화면에서는 표시되지 않습니다.';
    note.hidden = false;
  } else if (note) {
    note.hidden = true;
  }
  m.classList.add('open');
}
function kgovShowLoading(title) { kgovShow(title, '불러오는 중…'); }

function kgovCategorySection(title, countLabel, buildFn) {
  var sec = document.createElement('div');
  sec.className = 'kgov-category';
  var head = document.createElement('button');
  head.type = 'button';
  head.className = 'kgov-cat-head';
  head.innerHTML = '<span>' + kgovEsc(title) + '</span><span class="kgov-cat-count">' + kgovEsc(countLabel) + '</span>';
  var body = document.createElement('div');
  body.className = 'kgov-cat-body';
  body.hidden = true;
  var built = false;
  head.addEventListener('click', function () {
    body.hidden = !body.hidden;
    head.classList.toggle('open', !body.hidden);
    if (!built) { built = true; buildFn(body); }
  });
  sec.appendChild(head);
  sec.appendChild(body);
  return sec;
}

function kgovAgencyItem(container, label, disabled, onOpen) {
  var wrap = document.createElement('div');
  wrap.className = 'kgov-agency-item';
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'kgov-agency-btn';
  btn.textContent = label;
  if (disabled) btn.disabled = true;
  var panel = document.createElement('div');
  panel.className = 'kgov-dept-panel';
  panel.hidden = true;
  btn.addEventListener('click', function () {
    var wasOpen = !panel.hidden;
    container.querySelectorAll('.kgov-dept-panel').forEach(function (p) { p.hidden = true; });
    container.querySelectorAll('.kgov-agency-btn').forEach(function (b) { b.classList.remove('active'); });
    if (wasOpen) return;
    btn.classList.add('active');
    panel.hidden = false;
    if (!panel.dataset.loaded) {
      panel.dataset.loaded = '1';
      onOpen(panel);
    }
  });
  wrap.appendChild(btn);
  wrap.appendChild(panel);
  container.appendChild(wrap);
}

/* 입법부·사법부·행정부 공용: division목록 JSON을 매번 새로 읽어
   기관 목록·부서 목록을 뽑아내고, 부서 SP는 공용 템플릿에 그 자리에서 치환한다. */
function kgovBranch(container, jsonUrl, tmplUrl) {
  container.innerHTML = '기관 목록 불러오는 중…';
  kgovFetchJSON(jsonUrl).then(function (data) {
    var rows = data['division목록'];
    var agencies = [];
    rows.forEach(function (r) { if (agencies.indexOf(r['기관명']) === -1) agencies.push(r['기관명']); });
    container.innerHTML = '';
    agencies.forEach(function (name) {
      kgovAgencyItem(container, name, false, function (panel) {
        var subRows = rows.filter(function (r) { return r['기관명'] === name; });
        panel.innerHTML = '';
        subRows.forEach(function (row) {
          var dbtn = document.createElement('button');
          dbtn.type = 'button';
          dbtn.className = 'kgov-dept-btn';
          dbtn.textContent = row['부서명'] + (row['부서유형'] ? ' · ' + row['부서유형'] : '');
          dbtn.addEventListener('click', function () {
            kgovShowLoading(name + ' · ' + row['부서명']);
            /* 이 6종 템플릿은 자리표시자 이름이 {상위기관이름}/{부서이름}으로,
               JSON 필드명(기관명/부서명)과 표기가 달라 별칭을 붙여 치환한다. */
            var aliased = Object.assign({}, row, { '상위기관이름': row['기관명'], '부서이름': row['부서명'] });
            kgovFetchText(tmplUrl).then(function (tmpl) {
              kgovShow(name + ' · ' + row['부서명'] + ' — SP', kgovSubstitute(tmpl, aliased));
            });
          });
          panel.appendChild(dbtn);
        });
      });
    });
  });
}

/* 지방자치단체: province-master-data.json에 실제 등재된 시도만 그대로
   보여준다(전체 개수를 가정하거나 미등재 항목을 임의로 채워 넣지 않음). */
function kgovLocal(container) {
  var PROV_JSON = '../prompts/gov-tree/01-do/templates/province-master-data.json';
  var PROV_TMPL = '../prompts/gov-tree/01-do/templates/SP-PROVINCE-TEMPLATE_v1.1.md';
  var DEPT_JSON = '../prompts/gov-tree/02-do-dept/templates/do-dept-master-data.json';
  var DEPT_TMPL_BASE = '../prompts/gov-tree/02-do-dept/templates/';

  container.innerHTML = '시도 목록 불러오는 중…';
  kgovFetchJSON(PROV_JSON).then(function (data) {
    var provinces = data['도목록'];
    container.innerHTML = '';
    provinces.forEach(function (row) {
      kgovAgencyItem(container, row['도이름'], false, function (panel) {
        panel.innerHTML = '';
        var ownBtn = document.createElement('button');
        ownBtn.type = 'button';
        ownBtn.className = 'kgov-dept-btn kgov-dept-btn-own';
        ownBtn.textContent = row['도이름'] + ' 자체 SP 보기';
        ownBtn.addEventListener('click', function () {
          kgovShowLoading(row['도이름']);
          kgovFetchText(PROV_TMPL).then(function (tmpl) { kgovShow(row['도이름'] + ' — SP', kgovSubstitute(tmpl, row)); });
        });
        panel.appendChild(ownBtn);
        kgovFetchJSON(DEPT_JSON).then(function (dd) {
          var deptRows = dd['부서목록'].filter(function (r) { return r['도코드'] === row['도코드']; });
          if (!deptRows.length) {
            var note = document.createElement('div');
            note.className = 'kgov-note';
            note.textContent = '실·국 단위 부서 데이터는 아직 조사 전입니다.';
            panel.appendChild(note);
            return;
          }
          deptRows.forEach(function (row2) {
            var tmplFile = row2['template'];
            var notReady = tmplFile.indexOf('미작성') !== -1;
            var dbtn = document.createElement('button');
            dbtn.type = 'button';
            dbtn.className = 'kgov-dept-btn';
            dbtn.textContent = row2['부서명'] + (notReady ? ' (준비 중)' : '');
            if (notReady) dbtn.disabled = true;
            dbtn.addEventListener('click', function () {
              kgovShowLoading(row['도이름'] + ' · ' + row2['부서명']);
              kgovFetchText(DEPT_TMPL_BASE + tmplFile).then(function (tmpl) {
                kgovShow(row['도이름'] + ' · ' + row2['부서명'] + ' — SP', kgovSubstitute(tmpl, row2));
              });
            });
            panel.appendChild(dbtn);
          });
        });
      });
    });
  });
}

/* 공기업·공공기관: 사이트 정본 카탈로그(prompts/sp-catalog-categories.json)에서
   해당 폴더 하위 파일 목록만 가져오고, 이름·소관부처는 그 파일을 열어 그
   자리에서 읽는다 — 파일 자체가 유일한 출처이며 별도로 베껴 두지 않는다. */
function kgovFileCategory(container, folderPrefix) {
  var CATALOG_URL = '../prompts/sp-catalog-categories.json';
  container.innerHTML = '목록 불러오는 중…';
  kgovFetchJSON(CATALOG_URL).then(function (catalog) {
    var files = catalog.items.filter(function (it) { return it.file.indexOf(folderPrefix) === 0; });
    container.innerHTML = files.length + '개 기관의 이름을 불러오는 중… (처음 한 번만 시간이 걸립니다)';
    return Promise.all(files.map(function (f) {
      return kgovFetchText(kgovRawUrl(f.file)).then(function (text) {
        var meta = kgovParseHeader(text);
        return { name: meta.name || f.name, dept: meta.dept, file: f.file };
      }).catch(function () {
        return { name: f.name, dept: '기타', file: f.file };
      });
    }));
  }).then(function (items) {
    var groups = {};
    items.forEach(function (it) { (groups[it.dept] = groups[it.dept] || []).push(it); });
    var groupArr = Object.keys(groups).map(function (k) { return { dept: k, items: groups[k] }; });
    groupArr.sort(function (a, b) { return b.items.length - a.items.length; });

    container.innerHTML = '';
    var filterBox = document.createElement('input');
    filterBox.type = 'text';
    filterBox.placeholder = '기관 이름으로 찾기…';
    filterBox.className = 'kgov-filter-input';
    container.appendChild(filterBox);

    var listWrap = document.createElement('div');
    container.appendChild(listWrap);

    function render(filterText) {
      listWrap.innerHTML = '';
      var q = (filterText || '').trim();
      groupArr.forEach(function (g) {
        var matched = q ? g.items.filter(function (it) { return it.name.indexOf(q) !== -1; }) : g.items;
        if (!matched.length) return;
        var wrap = document.createElement('div');
        wrap.className = 'kgov-group';
        var head = document.createElement('button');
        head.type = 'button';
        head.className = 'kgov-group-head';
        head.innerHTML = '<span>' + kgovEsc(g.dept) + '</span><span class="kgov-group-count">' + matched.length + '개</span>';
        var body = document.createElement('div');
        body.className = 'kgov-group-body';
        body.hidden = !q;
        matched.forEach(function (it) {
          var a = document.createElement('a');
          a.href = '../pages/prompt-editor.html?file=' + encodeURIComponent(it.file);
          a.target = '_blank';
          a.rel = 'noopener';
          a.className = 'kgov-file-link';
          a.textContent = it.name;
          body.appendChild(a);
        });
        head.addEventListener('click', function () {
          body.hidden = !body.hidden;
          head.classList.toggle('open', !body.hidden);
        });
        wrap.appendChild(head);
        wrap.appendChild(body);
        listWrap.appendChild(wrap);
      });
    }
    render('');
    filterBox.addEventListener('input', function () { render(filterBox.value); });
  });
}

function kgovBuildApp(root) {
  if (!root || root.dataset.built) return;
  root.dataset.built = '1';
  root.innerHTML = '';

  var DIV_BASE = '../prompts/gov-tree/09-national/policy-bodies/divisions/';

  root.appendChild(kgovCategorySection('입법부', '국회 소속기관', function (body) {
    kgovBranch(body, DIV_BASE + 'assembly-agency-division-master-data.json', DIV_BASE + 'SP-ASSEMBLY-AGENCYDIV-TEMPLATE_v1.0.md');
  }));

  root.appendChild(kgovCategorySection('사법부', '법원 소속기관', function (body) {
    kgovBranch(body, DIV_BASE + 'judiciary-division-master-data.json', DIV_BASE + 'SP-JUDICIARY-ADMINDIV-TEMPLATE_v1.0.md');
  }));

  root.appendChild(kgovCategorySection('행정부', '대통령 직속·위원회·처·부·청', function (body) {
    body.appendChild(kgovCategorySection('대통령 직속', '', function (b2) {
      kgovBranch(b2, DIV_BASE + 'presidential-division-master-data.json', DIV_BASE + 'SP-PRESIDENTIAL-ADMINDIV-TEMPLATE_v1.0.md');
    }));
    body.appendChild(kgovCategorySection('위원회', '', function (b2) {
      kgovBranch(b2, DIV_BASE + 'commission-division-master-data.json', DIV_BASE + 'SP-COMMISSION-ADMINDIV-TEMPLATE_v1.0.md');
    }));
    body.appendChild(kgovCategorySection('처', '', function (b2) {
      kgovBranch(b2, DIV_BASE + 'bureau-division-master-data.json', DIV_BASE + 'SP-BUREAU-ADMINDIV-TEMPLATE_v1.0.md');
    }));
    body.appendChild(kgovCategorySection('부·청', '', function (b2) {
      kgovBranch(b2, DIV_BASE + 'ministry-division-master-data.json', DIV_BASE + 'SP-MINISTRY-ADMINDIV-TEMPLATE_v1.0.md');
    }));
  }));

  root.appendChild(kgovCategorySection('지방자치단체', '광역시도', function (body) {
    kgovLocal(body);
  }));

  root.appendChild(kgovCategorySection('공기업', '', function (body) {
    kgovFileCategory(body, 'prompts/gov-tree/09-national/enterprises/');
  }));

  root.appendChild(kgovCategorySection('공공기관', '', function (body) {
    kgovFileCategory(body, 'prompts/gov-tree/09-national/other/');
  }));
}
