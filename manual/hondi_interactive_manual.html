 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"></path><polyline points=\"22 6 12 13 2 6\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">② 초안 확인</div><div class=\"step-desc\">AI가 만든 제목·본문 초안이 화면에 뜹니다. 마음에 안 들면 \"더 짧게 써줘\"처럼 다시 요청할 수 있습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 보내기</div><div class=\"step-desc\">확인 후 \"보내줘\"라고 말하면 바로 발송됩니다.</div></div></div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"></path><polyline points=\"22 6 12 13 2 6\"></polyline></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">보낸 사람은 어떻게 되나요?</div>메일을 보낸 상대는 자동으로 내 주소록에 등록됩니다 — 다음에 또 보낼 때 이름만 말해도 찾아줍니다.</div>\n</div>\n","quiz":[{"q":"K-Mail로 메일을 보내는 가장 쉬운 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"></path></svg>","options":["이메일 앱을 따로 설치","내 AI 비서에게 말로 요청","HTML 코드를 직접 작성","불가능함"],"answer":1,"explain":"\"OOO한테 메일 보내줘\"처럼 말하면 K-Mail이 초안부터 발송까지 처리합니다."},{"q":"나비 가입자의 메일 주소는 어떻게 정해지나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"></path><polyline points=\"22 6 12 13 2 6\"></polyline></svg>","options":["직접 아이디를 만들어야 함","내 GUID 기반으로 자동 생성됨","가입 시 이메일을 따로 입력해야 함","메일 주소가 없음"],"answer":1,"explain":"가입자는 누구나 <내 GUID>@hondi.kr 형태의 메일 주소를 자동으로 갖습니다."},{"q":"K-Mail로 메일을 보낸 상대는 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"></circle><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"></line></svg>","options":["기록되지 않음","자동으로 주소록에 등록됨","삭제됨","매번 다시 입력해야 함"],"answer":1,"explain":"보낸 상대는 자동으로 주소록에 등록되어, 다음번엔 이름만 말해도 찾을 수 있습니다."}],"placeholder":false},{"tier":"advanced","title":"K-Mail 고급 — 주소록 대량 등록과 \"메일\" 탭 깊이 쓰기","id":"ch_kmail_advanced","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"9\" cy=\"21\" r=\"1\"></circle><circle cx=\"20\" cy=\"21\" r=\"1\"></circle><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path></g></svg></div>\n<h2>K-Mail 고급 — 주소록 대량 등록과 \"메일\" 탭 깊이 쓰기</h2>\n<p>18장에서 다룬 기본 사용법을 넘어, 수백 명 단위의 주소록을 한 번에 관리하고 편지쓰기·보관함까지 갖춘 전용 화면을 쓰는 방법입니다.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">CSV/엑셀로 수백 명 한 번에 등록</div>대화로 한 명씩 부르는 대신, 엑셀이나 CSV 파일을 그대로 업로드하면 AI 호출 없이 순수 등록 경로로 한 번에 처리됩니다 — 대화형 등록이 배치 크기에 걸려 실패하던 문제를 구조적으로 피합니다.</div>\n</div>\n\n<h3>등록되면서 자동으로 분류됩니다</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">① 파일 업로드</div><div class=\"step-desc\">이름·이메일·소속 열이 있는 CSV나 엑셀 파일을 그대로 올립니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"21\" r=\"1\"></circle><circle cx=\"20\" cy=\"21\" r=\"1\"></circle><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path></svg></div><div class=\"step-body\"><div class=\"step-title\">② 소속명으로 카테고리 자동분류</div><div class=\"step-desc\">\"대학교\"가 들어가면 교육, \"병원\"이 들어가면 의료, \"시청\"이 들어가면 행정 — 이런 식으로 소속명 키워드를 보고 카테고리를 결정적으로(무작위 아님) 채워줍니다. 애매하면 빈 값으로 남겨둡니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 중복은 자동으로 걸러짐</div><div class=\"step-desc\">이미 등록된 이메일은 대소문자가 달라도 중복으로 인식해 다시 만들지 않습니다.</div></div></div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"></rect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"></rect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"></rect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"></rect></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">주소록이 커지면 목록 대신 카테고리 요약</div>연락처가 수백~수천 건이 되면 전체를 한 번에 나열하는 대신, 카테고리별 건수 칩만 먼저 보여줍니다 — 원하는 카테고리를 눌러야 그 안의 목록이 열립니다. 검색창을 쓰면 카테고리와 무관하게 전체에서 바로 찾을 수 있습니다.</div>\n</div>\n\n<h3>\"메일\" 탭 — 전형적인 메일 클라이언트</h3>\n<p>편지쓰기·임시보관함·보낸메일함·받은메일함·태그별 보관함 다섯 개 화면을 갖춘 전용 탭입니다. 편지쓰기 본문은 굵게·목록 같은 서식을 지원하는 리치 텍스트 편집기이고, 받은메일함에서 메일에 라벨(태그)을 달면 태그별 보관함에서 모아볼 수 있습니다.</p>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"></path><polyline points=\"22 6 12 13 2 6\"></polyline></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">대화로 쓴 초안이 편집기로 넘어옵니다</div>\"새 캠페인\" 대화에서 K-Mail에게 메일을 써달라고 하고 \"초안으로 저장해줘\"라고 말하면, 그 제목·본문이 \"메일\" 탭 편지쓰기 화면에 그대로 채워집니다 — 대화와 편집기를 오가며 다듬을 수 있습니다.</div>\n</div>\n","quiz":[{"q":"수백 명 단위의 주소록을 한 번에 등록하는 가장 안전한 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></svg>","options":["대화로 한 명씩 부르기","CSV/엑셀 파일 업로드","전화로 문의","불가능함"],"answer":1,"explain":"파일 업로드는 AI 대화를 거치지 않는 순수 등록 경로라, 대화형 등록이 배치 크기에 걸려 실패하던 문제를 구조적으로 피합니다."},{"q":"CSV 업로드 시 카테고리는 어떻게 채워지나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"21\" r=\"1\"></circle><circle cx=\"20\" cy=\"21\" r=\"1\"></circle><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"></path></svg>","options":["항상 무작위로 채워짐","소속명 키워드로 결정적으로 분류, 애매하면 빈 값","사람이 매번 직접 입력","카테고리 기능 없음"],"answer":1,"explain":"대학교, 병원, 시청 같은 키워드로 카테고리를 자동 분류하고, 판단이 애매하면 억지로 채우지 않고 빈 값으로 남깁니다."},{"q":"주소록이 아주 커지면 기본 화면에는 무엇이 보이나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"></rect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"></rect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"></rect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"></rect></svg>","options":["전체 목록이 한 번에 다 나열됨","카테고리별 건수 요약 칩","빈 화면","오류 메시지"],"answer":1,"explain":"전체를 한 번에 나열하는 대신 카테고리별 건수 칩을 먼저 보여주고, 칩을 눌러야 그 안의 목록이 열립니다."}],"placeholder":false},{"tier":"beginner","title":"K-Clean 첫걸음 — 사진 한 장으로 환경 신고하기","id":"ch_kclean_basic","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(38,38)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"6\" width=\"20\" height=\"16\" rx=\"3\"></rect><path d=\"M8 6l2-3h4l2 3\"></path><circle cx=\"12\" cy=\"14\" r=\"4\"></circle></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(162,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M9 11l3 3L22 4\"></path><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"></path></g></svg></div>\n<h2>K-Clean 첫걸음 — 사진 한 장으로 환경 신고하기</h2>\n<p>해변에 떠밀려온 쓰레기, 무단 투기 현장, 오염된 하천을 봤을 때 어디에 신고해야 할지 몰라 그냥 지나친 적 있나요? K-Clean은 <strong>사진 한 장과 몇 마디 말만으로</strong> 신고가 접수되는 나비의 환경 신고 AI 비서입니다.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"></line><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"></line></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">가장 쉬운 사용법</div>내 AI 비서에게 \"쓰레기 신고할게\" \"여기 해양 오염 신고해줘\"처럼 말하거나, 환경 관련 사진을 그냥 전송하기만 해도 K-Clean이 자동으로 열립니다. 8장에서 다룬 나비 숫자 코드로 바로 들어갈 수도 있습니다.</div>\n</div>\n\n<h3>세 단계면 끝입니다</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"></path><circle cx=\"12\" cy=\"13\" r=\"4\"></circle></svg></div><div class=\"step-body\"><div class=\"step-title\">① 현장 사진 찍기</div><div class=\"step-desc\">신고하려는 현장을 폰 카메라로 찍거나, 이미 찍어둔 사진을 K-Clean 채팅창에 첨부합니다. 위치 정보(GPS)는 AI 비서가 자동으로 함께 전달하므로 주소를 직접 입력할 필요가 없습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"></path></svg></div><div class=\"step-body\"><div class=\"step-title\">② 한 줄 설명 (선택)</div><div class=\"step-desc\">\"해변에 그물이랑 스티로폼이 많이 밀려왔어요\"처럼 짧게 상황을 덧붙이면 더 정확하게 접수됩니다. 아무 말 없이 사진만 보내도 K-Clean이 내용을 알아서 분석합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 접수번호 확인</div><div class=\"step-desc\">\"RPT-2026-0000\" 같은 접수번호가 발급되면 신고 완료입니다. 이 번호로 언제든 처리 상황을 다시 조회할 수 있습니다.</div></div></div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"></path><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"></line><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"></line></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">로그인 없이도 신고할 수 있나요?</div>나비에 로그인돼 있지 않아도 신고 자체는 접수됩니다. 다만 로그인한 상태로 신고하면 내 접수 목록에서 처리 현황을 계속 확인할 수 있고, 13장에서 다루는 PDV 기록에도 남습니다.</div>\n</div>","quiz":[{"q":"K-Clean 신고에 최소한 필요한 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["서류 작성과 방문","현장 사진 한 장(설명은 선택)","사업자등록증","전화 통화"],"answer":1,"explain":"사진 한 장만 보내도 K-Clean이 내용을 분석해 접수합니다. 한 줄 설명은 선택입니다."},{"q":"신고할 위치(주소)는 어떻게 전달되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["반드시 직접 입력한다","AI 비서가 위치정보(GPS)를 자동으로 함께 전달한다","우편번호만 입력한다","위치는 전달되지 않는다"],"answer":1,"explain":"위치정보는 AI 비서가 자동으로 전달하므로 주소를 직접 입력할 필요가 없습니다."},{"q":"접수번호는 어디에 쓰나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["처리 상황을 다시 조회할 때","결제할 때","로그아웃할 때","쓸 곳이 없다"],"answer":0,"explain":"접수번호로 언제든 처리 상황을 조회할 수 있습니다."}],"updated":"2026-10-24"},{"tier":"intermediate","title":"K-Clean 신고 처리 — 사진·동영상에서 조치까지","id":"ch_kclean_report","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:260px;display:block;margin:0 auto\"><circle cx=\"50\" cy=\"70\" r=\"42\" fill=\"#eaf3fc\"/><g transform=\"translate(32,52)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"0\" y=\"4\" width=\"36\" height=\"26\" rx=\"3\"></rect><circle cx=\"18\" cy=\"17\" r=\"7\"></circle></g><circle cx=\"120\" cy=\"70\" r=\"42\" fill=\"#fef7e0\"/><g transform=\"translate(102,52)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"></path><path d=\"M6 10h12M6 15h8\"></path></g><circle cx=\"190\" cy=\"70\" r=\"42\" fill=\"#e6f4ea\"/><g transform=\"translate(172,52)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"></path><polyline points=\"8 12 11 15 16 9\"></polyline></g></svg></div>\n<h2>K-Clean 신고 처리 — 사진·동영상에서 조치까지</h2>\n<p>K-Clean이 다른 신고 채널과 다른 점은, 신고를 접수만 하고 끝나는 게 아니라 <strong>담당 기관이 실제로 조치하도록 끝까지 추적</strong>한다는 것입니다. 사진·동영상 한 건이 어떻게 공식 처리 절차로 바뀌는지 살펴보겠습니다.</p>\n\n<h3>1) AI가 현장을 읽습니다</h3>\n<p>업로드한 사진(정지영상은 물론, 동영상의 대표 프레임도 함께)을 Gemini Vision 기반 이미지 분석 AI가 확인해 다음을 자동으로 뽑아냅니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z\"></path><circle cx=\"12\" cy=\"10\" r=\"3\"></circle></svg></div><div class=\"step-body\"><div class=\"step-title\">위치</div><div class=\"step-desc\">사진의 GPS 태그(EXIF)와 신고 시점의 AI 비서 위치정보를 대조해 정확한 지점을 특정합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"></rect><path d=\"M3 9h18M9 21V9\"></path></svg></div><div class=\"step-body\"><div class=\"step-title\">종류·규모</div><div class=\"step-desc\">해양 쓰레기·불법 투기·산림 훼손·오염 폐수 등 종류를 분류하고, 사진 속 면적·부피로 대략적인 규모를 추정합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"></path><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"></line><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"></line></svg></div><div class=\"step-body\"><div class=\"step-title\">긴급도</div><div class=\"step-desc\">기름 유출처럼 확산 위험이 있는 경우 \"긴급\"으로 자동 표시해 우선 처리 대상이 되도록 합니다.</div></div></div>\n</div>\n\n<h3>2) 서류가 자동으로 만들어집니다</h3>\n<p>분석 결과를 바탕으로 K-Clean이 <strong>환경신고서</strong>와, 필요한 경우 <strong>수거 견적서</strong>를 자동으로 작성합니다. 사람이 서식을 채우지 않아도 담당 기관 실무자가 바로 검토할 수 있는 형태로 정리됩니다.</p>\n\n<h3>3) 담당 기관에 배정되고, 상태가 추적됩니다</h3>\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"></path><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"></path></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">\"신고하고 끝\"이 아닙니다</div>신고 건은 <code>접수 → 처리중 → 완료</code> 순으로 상태가 관리되고, 내 접수번호로 언제든 지금 어느 단계인지 확인할 수 있습니다. 오래 방치된 건은 담당 부서에 다시 알리는 방식으로 실제 조치를 강제합니다 — 신고서를 접수해두고 잊혀지는 걸 막는 것이 K-Clean의 핵심입니다.</div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"></line><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"></line></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">동영상도 되나요?</div>동영상은 대표 장면을 정지영상으로 뽑아 같은 방식으로 분석합니다. 물이 흘러가는 방향이나 투기 순간처럼 사진 한 장으로는 안 보이는 정황을 설명에 함께 적어주면 분석 정확도가 올라갑니다.</div>\n</div>","quiz":[{"q":"K-Clean이 다른 신고 채널과 다른 점은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["접수만 하고 끝낸다","담당 기관이 실제로 조치하도록 끝까지 추적한다","신고자가 직접 수거한다","동영상만 받는다"],"answer":1,"explain":"접수 후에도 상태를 추적하고 방치된 건은 담당 부서에 다시 알립니다."},{"q":"\"긴급\"으로 자동 표시되는 대표적인 경우는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["쓰레기가 1개일 때","기름 유출처럼 확산 위험이 있을 때","낮에 찍은 사진일 때","로그인하지 않았을 때"],"answer":1,"explain":"확산 위험이 있는 경우는 긴급으로 표시해 우선 처리 대상이 됩니다."},{"q":"K-Clean이 자동으로 작성하는 서류는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["환경신고서(필요시 수거 견적서)","세금계산서","여권","계약서 일체"],"answer":0,"explain":"분석 결과로 환경신고서를, 필요하면 수거 견적서를 자동 작성합니다."}],"updated":"2026-10-24"},{"tier":"advanced","title":"K-Clean 비용 산정과 정산 — 수거업체·지자체 연동","id":"ch_kclean_settlement","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:260px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"70\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(38,48)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"22\" cy=\"22\" r=\"20\"></circle><path d=\"M22 12v20M17 16h7a3.5 3.5 0 0 1 0 7h-7a3.5 3.5 0 0 0 0 7h7\"></path></g><circle cx=\"180\" cy=\"70\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(158,48)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"6\" width=\"40\" height=\"30\" rx=\"3\"></rect><path d=\"M2 14h40M10 22h8\"></path></g></svg></div>\n<h2>K-Clean 비용 산정과 정산 — 수거업체·지자체 연동</h2>\n<p>신고가 실제 수거·정화로 이어지려면 \"누가 얼마에 처리할 것인가\"가 정해져야 합니다. K-Clean은 이 견적·배정·정산 과정도 시스템 안에서 처리합니다.</p>\n\n<h3>1) 수거 견적 산정</h3>\n<p>2단계에서 분석한 쓰레기 종류·규모를 바탕으로 K-Clean이 예상 수거 비용을 산정합니다. 인력·장비(필요시 드론 운용 포함)·운반 거리 등을 반영한 <strong>수거 견적서</strong>가 신고서와 함께 발급됩니다.</p>\n\n<h3>2) 수거업체 배정(dispatch)</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"3\" width=\"15\" height=\"13\"></rect><polygon points=\"16 8 20 8 23 11 23 16 16 16 16 8\"></polygon><circle cx=\"5.5\" cy=\"18.5\" r=\"2.5\"></circle><circle cx=\"18.5\" cy=\"18.5\" r=\"2.5\"></circle></svg></div><div class=\"step-body\"><div class=\"step-title\">① 담당 업체 매칭</div><div class=\"step-desc\">지역·처리 종류에 맞는 등록된 수거업체(또는 지자체 환경과 직영반)에 견적서와 함께 작업이 배정됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">② 담당자 승인</div><div class=\"step-desc\">지자체 담당 공무원이 견적을 확인·승인하면 처리 상태가 \"승인\"으로 바뀌고, 승인 시각과 확정 비용이 함께 기록됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"></path><polyline points=\"8 12 11 15 16 9\"></polyline></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 정산</div><div class=\"step-desc\">수거 완료가 확인되면 확정 비용을 기준으로 정산이 이뤄지고, 세전 소득(income_before_tax) 기준으로 기록이 남아 24장에서 다루는 세금 계산 자동화와도 연결됩니다.</div></div></div>\n</div>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"></line><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"></line></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">담당 공무원·업체는 어디서 확인하나요?</div>지자체·수거업체 계정으로 로그인하면 배정된 신고 건 목록과 승인 대기 견적을 대시보드에서 바로 확인·승인할 수 있습니다. 20장에서 다룬 재무제표 자동 생성과 같은 방식으로, 정산 내역이 각 업체의 매출 기록에도 자동 반영됩니다.</div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"></path><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"></line><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"></line></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">일반 신고자도 비용을 부담하나요?</div>아니요. 신고자는 비용을 내지 않습니다. 비용 산정·정산은 담당 기관과 수거업체 사이의 절차이며, 신고자는 접수번호로 처리 상태만 확인하면 됩니다.</div>\n</div>","quiz":[{"q":"일반 신고자는 수거 비용을 부담하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["예, 전액 부담","아니요, 신고자는 비용을 내지 않는다","절반만 부담","업체에 따라 다르다"],"answer":1,"explain":"비용 산정·정산은 담당 기관과 수거업체 사이의 절차입니다."},{"q":"수거 견적을 확인·승인하는 사람은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["신고자","지자체 담당 공무원","다른 이용자","아무도 승인하지 않는다"],"answer":1,"explain":"담당 공무원이 승인하면 처리 상태가 \"승인\"으로 바뀌고 확정 비용이 기록됩니다."},{"q":"정산 내역은 업체의 어디에 반영되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["반영되지 않는다","매출 기록(재무제표)에 자동 반영된다","개인 PDV에만 남는다","우편으로 통보된다"],"answer":1,"explain":"재무제표 자동 생성과 같은 방식으로 업체의 매출 기록에 반영됩니다."}],"updated":"2026-10-24"}];
var TIER_LABELS = {"beginner": "초급", "intermediate": "중급", "advanced": "고급"};
var TIER_REWARDS = {"beginner": 1000, "intermediate": 3000, "advanced": 10000};
var TIER_ORDER = ["beginner", "intermediate", "advanced"];
var STORAGE_KEY = "hondi_manual_progress_v1";

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {completed: [], tierRewardClaimed: []}; }
  catch (e) { return {completed: [], tierRewardClaimed: []}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
var progress = loadProgress();
var currentTier = "beginner";
var currentChapterId = CHAPTERS[0].id;

function chaptersByTier(tier) { return CHAPTERS.filter(function (c) { return c.tier === tier; }); }
function isCompleted(id) { return progress.completed.indexOf(id) !== -1; }
function tierCompletedCount(tier) { return chaptersByTier(tier).filter(function (c) { return isCompleted(c.id); }).length; }
function tierFullyDone(tier) { var chs = chaptersByTier(tier); return chs.length > 0 && chs.every(function (c) { return isCompleted(c.id); }); }

/* 나비 온도(2026-11-14) — 초급·중급·고급 단계별 구간으로 올라간다: 시작 36.5° → 초급 완료 60° → 중급 완료 80° → 고급 완료 100°.
   각 단계 안에서는 완료한 장 수에 비례한다. 같은 사이트의 '사용법 강의'(기본10·활용10·고급5쪽) 진행도 같은 단계로 세어, 단계마다 둘 중 많이 마친 쪽을 쓴다.
   95° 이상이 되면 나비웹 전문가 인증서(Chartered Naviweb Specialist, CNS)를 발급받을 수 있다. */
var TEMP_BASE = 36.5, TEMP_SPAN = {beginner: 23.5, intermediate: 20, advanced: 20}, CNS_AT = 95, CNS_KEY = 'naviweb_cns_v1';
function courseFractions() {
  try {
    var v = localStorage.getItem('kmail_guide_done'); if (v === null) return null;
    var d = parseInt(v, 10) || 0;
    return {beginner: Math.min(d, 10) / 10, intermediate: Math.max(0, Math.min(d - 10, 10)) / 10, advanced: Math.max(0, Math.min(d - 20, 5)) / 5};
  } catch (e) { return null; }
}
function naviTemp() {
  var cf = courseFractions(), t = TEMP_BASE, mf = {};
  TIER_ORDER.forEach(function (k) {
    var chs = chaptersByTier(k), f = chs.length ? tierCompletedCount(k) / chs.length : 0;
    mf[k] = f;   // 사용법 화면(guide.js)이 같은 온도를 계산하도록 이 매뉴얼의 단계별 진행률을 남겨 둔다
    if (cf) f = Math.max(f, cf[k]);
    t += TEMP_SPAN[k] * f;
  });
  try { localStorage.setItem('naviweb_manual_frac_v1', JSON.stringify(mf)); } catch (e) { /* 저장 불가 */ }
  return Math.min(100, Math.round(t * 10) / 10);
}
function loadCns() { try { return JSON.parse(localStorage.getItem(CNS_KEY)) || null; } catch (e) { return null; } }
function cnsNumber(name, ymd) {   // 이름·발급일로 만든 8자리 번호(FNV-1a)
  var h = 0x811c9dc5, s = name + '|' + ymd;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
  return 'CNS-' + ymd.replace(/-/g, '') + '-' + h.toString(36).toUpperCase().padStart(7, '0').slice(-7);
}
function cnsEsc(x) { return String(x).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function renderCnsBanner(temp) {
  var b = DOC.getElementById('cnsBanner'), c = loadCns();
  if (!c && temp < CNS_AT) { b.classList.remove('show'); return; }
  DOC.getElementById('cnsBannerText').textContent = c ? '🎓 나비웹 전문가 인증서(CNS)가 발급되었습니다 — ' + c.no : '🎓 나비 온도 ' + temp.toFixed(1) + '° — 나비웹 전문가 인증서(CNS)를 발급받을 수 있습니다!';
  DOC.getElementById('cnsBannerBtn').textContent = c ? '인증서 보기' : '인증서 발급받기';
  b.classList.add('show');
}
function showCert(c) {

function renderQuiz(chapter) {

  chapter.quiz.forEach(function (q, qi) {

      '<div class="quiz-q-head"><div class="quiz-q-icon">' + (q.icon || '') + '</div><div class="quiz-q-text">' + (qi + 1) + '. ' + q.q + '</div></div>';
    q.options.forEach(function (opt, oi) {
      html += '<button type="button" class="quiz-opt" data-oi="' + oi + '">' +
        '<span class="quiz-opt-mark">' +
          '<svg class="mark-check" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
          '<svg class="mark-x" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</span>' +
        '<span class="quiz-opt-text">' + opt + '</span></button>';
    });
    html += '<div class="quiz-explain"></div></div>';
  });
  html += '<button type="button" class="quiz-submit" id="quizSubmitBtn">채점하기</button><div class="quiz-result" id="quizResult"></div></div>';
  return html;
}

function renderContent() {
  var chapter = CHAPTERS.find(function (c) { return c.id === currentChapterId; });
  var el = DOC.getElementById('chContent');
  var upd = chapter.updated ? '<div class="ch-updated is-new">마지막 갱신 ' + chapter.updated + '</div>' : '<div class="ch-updated">마지막 갱신일 기록 전</div>';
  el.innerHTML = upd + (ASSET_BASE ? chapter.body.replace(/src="manual-img\//g, 'src="' + ASSET_BASE + 'manual-img/') : chapter.body) + (chapter.placeholder ? '' : renderQuiz(chapter));
  if (chapter.id === 'ch_kgov' && !chapter.placeholder) kgovBuildApp(DOC.getElementById('kgov-app'));
  if (chapter.placeholder) return;
  var selections = {}; var submitted = false;
  el.querySelectorAll('.quiz-q').forEach(function (qEl) {
    var qi = qEl.dataset.qi;
    qEl.querySelectorAll('.quiz-opt').forEach(function (optBtn) {
      optBtn.addEventListener('click', function () {
        if (submitted) return;
        qEl.querySelectorAll('.quiz-opt').forEach(function (b) { b.classList.remove('selected'); });
        optBtn.classList.add('selected');
        selections[qi] = parseInt(optBtn.dataset.oi, 10);
      });
    });
  });
  var submitBtn = DOC.getElementById('quizSubmitBtn');
  submitBtn.addEventListener('click', function () {
    if (Object.keys(selections).length < chapter.quiz.length) { alert('모든 문항에 답해 주세요.'); return; }
    submitted = true; var allCorrect = true;
    el.querySelectorAll('.quiz-q').forEach(function (qEl) {
      var qi = parseInt(qEl.dataset.qi, 10); var q = chapter.quiz[qi]; var picked = selections[qi];
      var correct = picked === q.answer; if (!correct) allCorrect = false;
      qEl.querySelectorAll('.quiz-opt').forEach(function (optBtn) {
        var oi = parseInt(optBtn.dataset.oi, 10); optBtn.disabled = true;
        if (oi === q.answer) optBtn.classList.add('correct');
        else if (oi === picked) optBtn.classList.add('incorrect');
      });
      var expl = qEl.querySelector('.quiz-explain'); expl.textContent = q.explain; expl.classList.add('show');
    });
    submitBtn.disabled = true;
    var resultEl = DOC.getElementById('quizResult');
    resultEl.classList.add('show', allCorrect ? 'pass' : 'fail');
    if (allCorrect) {
      resultEl.textContent = '🎉 정답입니다! 이 장을 완료 처리했습니다.';
      if (!isCompleted(chapter.id)) { progress.completed.push(chapter.id); saveProgress(progress); }
      checkTierReward(chapter.tier);
      renderHeader(); renderTierTabs(); renderChapterTabs();
    } else {
      resultEl.textContent = '아쉽지만 틀린 문항이 있습니다. 내용을 다시 읽고 새로고침 후 재도전해 보세요.';
    }
  });
}

/* ── K-정부 챕터 전용 로직 (2026-08-29 신설, 2026-08-29 단일 출처로 재설계) ──
   이 챕터는 어떤 기관·부서 명칭도 직접 저장해 두지 않는다 — 전부 그때그때
   저장소에서 읽어온다:
   - 입법·사법·행정부·지자체 부서: division목록 JSON(실사 데이터)에서 기관명을
     매번 새로 뽑아내고, 부서 SP는 공용 템플릿에 그 행의 데이터를 그 자리에서
     치환해 만든다(저장·중복 없음).
   - 공기업·공공기관: 사이트가 이미 쓰고 있는 정본 카탈로그
     prompts/sp-catalog-categories.json에서 해당 폴더 하위 파일 목록을 그대로
     가져오고, 이름·소관부처는 그 파일을 직접 열어 표시 시점에 읽는다.
   즉 이 파일 안에 있는 건 전부 "어디서 가져올지"뿐이고, "무엇이 있는지"는
   단 한 곳(저장소의 실제 데이터/카탈로그)에서만 관리된다. */

var KGOV_CACHE = {};
function kgovFetchText(url) {
  if (KGOV_CACHE[url]) return Promise.resolve(KGOV_CACHE[url]);
  return fetch(url).then(function (r) { return r.text(); }).then(function (t) { KGOV_CACHE[url] = t; return t; });
}
function kgovFetchJSON(url) {
  if (KGOV_CACHE[url]) return Promise.resolve(KGOV_CACHE[url]);
  return fetch(url).then(function (r) { return r.json(); }).then(function (j) { KGOV_CACHE[url] = j; return j; });
}
function kgovEsc(s) {
  return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function kgovSubstitute(tmpl, row) {
  var out = tmpl;
  Object.keys(row).forEach(function (k) {
    var v = row[k];
    if (typeof v === 'string') out = out.split('{' + k + '}').join(v);
  });
  return out;
}
function kgovParseHeader(text) {
  var mName = text.match(/문서명\s*:\s*(.+?)\s*—/);
  var mDept = text.match(/소관부처\s*:\s*(.+)/);
  return { name: mName ? mName[1].trim() : null, dept: mDept ? mDept[1].trim() : '기타' };
}
function kgovRawUrl(repoRelativePath) {
  return 'https://raw.githubusercontent.com/Openhash-Gopang/gopang/main/' + repoRelativePath;
}
function kgovModal() {
  var m = DOC.getElementById('kgovModal');
  if (m) return m;
  m = document.createElement('div');
  m.id = 'kgovModal';
  m.className = 'kgov-modal';
  m.innerHTML = '<div class="kgov-modal-inner"><div class="kgov-modal-head"><span id="kgovModalTitle"></span><button type="button" id="kgovModalClose" aria-label="닫기">✕</button></div><pre id="kgovModalBody"></pre></div>';
  (EMBED ? DOC : document.body).appendChild(m);
  m.addEventListener('click', function (e) { if (e.target === m) m.classList.remove('open'); });
  m.querySelector('#kgovModalClose').addEventListener('click', function () { m.classList.remove('open'); });
  return m;
}
function kgovShow(title, text) {
  var m = kgovModal();
  m.querySelector('#kgovModalTitle').textContent = title;
  m.querySelector('#kgovModalBody').textContent = text;
  var note = m.querySelector('#kgovModalNote');
  var leftover = text.match(/\{[A-Z_]+\}/g);
  if (leftover) {
    if (!note) {
      note = document.createElement('div');
      note.id = 'kgovModalNote';
      note.className = 'kgov-modal-note';
      m.querySelector('.kgov-modal-inner').insertBefore(note, m.querySelector('#kgovModalBody'));
    }
    var uniq = Array.from(new Set(leftover)).join(', ');
    note.textContent = uniq + '는 실제 서비스에서 상위 공용 SP가 자동으로 삽입되는 자리로, 이 화면에서는 표시되지 않습니다.';
    note.hidden = false;
  } else if (note) {
    note.hidden = true;
  }
  m.classList.add('open');
}
function kgovShowLoading(title) { kgovShow(title, '불러오는 중…'); }

function kgovCategorySection(title, countLabel, buildFn) {

function kgovAgencyItem(container, label, disabled, onOpen) {
  var wrap = document.createElement('div');
  wrap.className = 'kgov-agency-item';
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'kgov-agency-btn';
  btn.textContent = label;
  if (disabled) btn.disabled = true;
  var panel = document.createElement('div');
  panel.className = 'kgov-dept-panel';
  panel.hidden = true;
  btn.addEventListener('click', function () {
    var wasOpen = !panel.hidden;
    container.querySelectorAll('.kgov-dept-panel').forEach(function (p) { p.hidden = true; });
    container.querySelectorAll('.kgov-agency-btn').forEach(function (b) { b.classList.remove('active'); });
    if (wasOpen) return;
    btn.classList.add('active');
    panel.hidden = false;
    if (!panel.dataset.loaded) {
      panel.dataset.loaded = '1';
      onOpen(panel);
    }
  });
  wrap.appendChild(btn);
  wrap.appendChild(panel);
  container.appendChild(wrap);
}

/* 입법부·사법부·행정부 공용: division목록 JSON을 매번 새로 읽어
   기관 목록·부서 목록을 뽑아내고, 부서 SP는 공용 템플릿에 그 자리에서 치환한다. */
function kgovBranch(container, jsonUrl, tmplUrl) {
  container.innerHTML = '기관 목록 불러오는 중…';
  kgovFetchJSON(jsonUrl).then(function (data) {
    var rows = data['division목록'];
    var agencies = [];
    rows.forEach(function (r) { if (agencies.indexOf(r['기관명']) === -1) agencies.push(r['기관명']); });
    container.innerHTML = '';
    agencies.forEach(function (name) {
      kgovAgencyItem(container, name, false, function (panel) {
        var subRows = rows.filter(function (r) { return r['기관명'] === name; });
        panel.innerHTML = '';
        subRows.forEach(function (row) {
          var dbtn = document.createElement('button');
          dbtn.type = 'button';
          dbtn.className = 'kgov-dept-btn';
          dbtn.textContent = row['부서명'] + (row['부서유형'] ? ' · ' + row['부서유형'] : '');
          dbtn.addEventListener('click', function () {
            kgovShowLoading(name + ' · ' + row['부서명']);
            /* 이 6종 템플릿은 자리표시자 이름이 {상위기관이름}/{부서이름}으로,
               JSON 필드명(기관명/부서명)과 표기가 달라 별칭을 붙여 치환한다. */
            var aliased = Object.assign({}, row, { '상위기관이름': row['기관명'], '부서이름': row['부서명'] });
            kgovFetchText(tmplUrl).then(function (tmpl) {
              kgovShow(name + ' · ' + row['부서명'] + ' — SP', kgovSubstitute(tmpl, aliased));
            });
          });
          panel.appendChild(dbtn);
        });
      });
    });
  });
}

/* 지방자치단체: province-master-data.json에 실제 등재된 시도만 그대로
   보여준다(전체 개수를 가정하거나 미등재 항목을 임의로 채워 넣지 않음). */
function kgovLocal(container) {
  var PROV_JSON = '../prompts/gov-tree/01-do/templates/province-master-data.json';
  var PROV_TMPL = '../prompts/gov-tree/01-do/templates/SP-PROVINCE-TEMPLATE_v1.1.md';
  var DEPT_JSON = '../prompts/gov-tree/02-do-dept/templates/do-dept-master-data.json';
  var DEPT_TMPL_BASE = '../prompts/gov-tree/02-do-dept/templates/';

  container.innerHTML = '시도 목록 불러오는 중…';
  kgovFetchJSON(PROV_JSON).then(function (data) {
    var provinces = data['도목록'];
    container.innerHTML = '';
    provinces.forEach(function (row) {
      kgovAgencyItem(container, row['도이름'], false, function (panel) {
        panel.innerHTML = '';
        var ownBtn = document.createElement('button');
        ownBtn.type = 'button';
        ownBtn.className = 'kgov-dept-btn kgov-dept-btn-own';
        ownBtn.textContent = row['도이름'] + ' 자체 SP 보기';
        ownBtn.addEventListener('click', function () {
          kgovShowLoading(row['도이름']);
          kgovFetchText(PROV_TMPL).then(function (tmpl) { kgovShow(row['도이름'] + ' — SP', kgovSubstitute(tmpl, row)); });
        });
        panel.appendChild(ownBtn);
        kgovFetchJSON(DEPT_JSON).then(function (dd) {
          var deptRows = dd['부서목록'].filter(function (r) { return r['도코드'] === row['도코드']; });
          if (!deptRows.length) {
            var note = document.createElement('div');
            note.className = 'kgov-note';
            note.textContent = '실·국 단위 부서 데이터는 아직 조사 전입니다.';
            panel.appendChild(note);
            return;
          }
          deptRows.forEach(function (row2) {
            var tmplFile = row2['template'];
            var notReady = tmplFile.indexOf('미작성') !== -1;
            var dbtn = document.createElement('button');
            dbtn.type = 'button';
            dbtn.className = 'kgov-dept-btn';
            dbtn.textContent = row2['부서명'] + (notReady ? ' (준비 중)' : '');
            if (notReady) dbtn.disabled = true;
            dbtn.addEventListener('click', function () {
              kgovShowLoading(row['도이름'] + ' · ' + row2['부서명']);
              kgovFetchText(DEPT_TMPL_BASE + tmplFile).then(function (tmpl) {
                kgovShow(row['도이름'] + ' · ' + row2['부서명'] + ' — SP', kgovSubstitute(tmpl, row2));
              });
            });
            panel.appendChild(dbtn);
          });
        });
      });
    });
  });
}

/* 공기업·공공기관: 사이트 정본 카탈로그(prompts/sp-catalog-categories.json)에서
   해당 폴더 하위 파일 목록만 가져오고, 이름·소관부처는 그 파일을 열어 그
   자리에서 읽는다 — 파일 자체가 유일한 출처이며 별도로 베껴 두지 않는다. */
function kgovFileCategory(container, folderPrefix) {
  var CATALOG_URL = '../prompts/sp-catalog-categories.json';
  container.innerHTML = '목록 불러오는 중…';
  kgovFetchJSON(CATALOG_URL).then(function (catalog) {
    var files = catalog.items.filter(function (it) { return it.file.indexOf(folderPrefix) === 0; });
    container.innerHTML = files.length + '개 기관의 이름을 불러오는 중… (처음 한 번만 시간이 걸립니다)';
    return Promise.all(files.map(function (f) {
      return kgovFetchText(kgovRawUrl(f.file)).then(function (text) {
        var meta = kgovParseHeader(text);
        return { name: meta.name || f.name, dept: meta.dept, file: f.file };
      }).catch(function () {
        return { name: f.name, dept: '기타', file: f.file };
      });
    }));
  }).then(function (items) {
    var groups = {};
    items.forEach(function (it) { (groups[it.dept] = groups[it.dept] || []).push(it); });
    var groupArr = Object.keys(groups).map(function (k) { return { dept: k, items: groups[k] }; });
    groupArr.sort(function (a, b) { return b.items.length - a.items.length; });

    container.innerHTML = '';
    var filterBox = document.createElement('input');
    filterBox.type = 'text';
    filterBox.placeholder = '기관 이름으로 찾기…';
    filterBox.className = 'kgov-filter-input';
    container.appendChild(filterBox);

    var listWrap = document.createElement('div');
    container.appendChild(listWrap);

    function render(filterText) {
      listWrap.innerHTML = '';
      var q = (filterText || '').trim();
      groupArr.forEach(function (g) {
        var matched = q ? g.items.filter(function (it) { return it.name.indexOf(q) !== -1; }) : g.items;
        if (!matched.length) return;
        var wrap = document.createElement('div');
        wrap.className = 'kgov-group';
        var head = document.createElement('button');
        head.type = 'button';
        head.className = 'kgov-group-head';
        head.innerHTML = '<span>' + kgovEsc(g.dept) + '</span><span class="kgov-group-count">' + matched.length + '개</span>';
        var body = document.createElement('div');
        body.className = 'kgov-group-body';
        body.hidden = !q;
        matched.forEach(function (it) {
          var a = document.createElement('a');
          a.href = '../pages/prompt-editor.html?file=' + encodeURIComponent(it.file);
          a.target = '_blank';
          a.rel = 'noopener';
          a.className = 'kgov-file-link';
          a.textContent = it.name;
          body.appendChild(a);
        });
        head.addEventListener('click', function () {
          body.hidden = !body.hidden;
          head.classList.toggle('open', !body.hidden);
        });
        wrap.appendChild(head);
        wrap.appendChild(body);
        listWrap.appendChild(wrap);
      });
    }
    render('');
    filterBox.addEventListener('input', function () { render(filterBox.value); });
  });
}

function kgovBuildApp(root) {
  if (!root || root.dataset.built) return;
  root.dataset.built = '1';
  root.innerHTML = '';

  var DIV_BASE = '../prompts/gov-tree/09-national/policy-bodies/divisions/';

  root.appendChild(kgovCategorySection('입법부', '국회 소속기관', function (body) {
    kgovBranch(body, DIV_BASE + 'assembly-agency-division-master-data.json', DIV_BASE + 'SP-ASSEMBLY-AGENCYDIV-TEMPLATE_v1.0.md');
  }));

  root.appendChild(kgovCategorySection('사법부', '법원 소속기관', function (body) {
    kgovBranch(body, DIV_BASE + 'judiciary-division-master-data.json', DIV_BASE + 'SP-JUDICIARY-ADMINDIV-TEMPLATE_v1.0.md');
  }));

  root.appendChild(kgovCategorySection('행정부', '대통령 직속·위원회·처·부·청', function (body) {
    body.appendChild(kgovCategorySection('대통령 직속', '', function (b2) {
      kgovBranch(b2, DIV_BASE + 'presidential-division-master-data.json', DIV_BASE + 'SP-PRESIDENTIAL-ADMINDIV-TEMPLATE_v1.0.md');
    }));
    body.appendChild(kgovCategorySection('위원회', '', function (b2) {
      kgovBranch(b2, DIV_BASE + 'commission-division-master-data.json', DIV_BASE + 'SP-COMMISSION-ADMINDIV-TEMPLATE_v1.0.md');
    }));
    body.appendChild(kgovCategorySection('처', '', function (b2) {
      kgovBranch(b2, DIV_BASE + 'bureau-division-master-data.json', DIV_BASE + 'SP-BUREAU-ADMINDIV-TEMPLATE_v1.0.md');
    }));
    body.appendChild(kgovCategorySection('부·청', '', function (b2) {
      kgovBranch(b2, DIV_BASE + 'ministry-division-master-data.json', DIV_BASE + 'SP-MINISTRY-ADMINDIV-TEMPLATE_v1.0.md');
    }));
  }));

  root.appendChild(kgovCategorySection('지방자치단체', '광역시도', function (body) {
    kgovLocal(body);
  }));

  root.appendChild(kgovCategorySection('공기업', '', function (body) {
    kgovFileCategory(body, 'prompts/gov-tree/09-national/enterprises/');
  }));

  root.appendChild(kgovCategorySection('공공기관', '', function (body) {
    kgovFileCategory(body, 'prompts/gov-tree/09-national/other/');
  }));
}
