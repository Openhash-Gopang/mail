 오해 없이 빠른 속도로 정보를 주고받을 수 있습니다."},{"q":"사람과 사람의 대화에서 자주 생기는 문제는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>","options":["항상 완벽함","오해나 지연이 생길 수 있음","AI보다 항상 빠름","문제 없음"],"answer":1,"explain":"말투, 감정, 타이밍 등으로 오해나 지연이 생길 수 있습니다."},{"q":"중요한 결정은 누가 하는 것이 좋은가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>","options":["항상 AI가","사람이 직접","AI와 사람 둘 다 절대 안 됨","무작위로"],"answer":1,"explain":"중요한 결정이나 감정적 교류는 여전히 사람이 직접 하는 것이 좋습니다."}],"placeholder":false},{"tier":"intermediate","title":"쓰면 쓸수록 똑똑해지는 나만의 AI 비서","id":"ch11","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:340px;display:block;margin:0 auto\">\n<circle cx=\"70\" cy=\"100\" r=\"20\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"200\" cy=\"80\" r=\"30\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"340\" cy=\"55\" r=\"42\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n<path d=\"M40 130 L370 20\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-dasharray=\"4 4\" fill=\"none\"/>\n<text x=\"70\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#64748b\">1일차</text>\n<text x=\"200\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#64748b\">1개월</text>\n<text x=\"340\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#0c6cc3\" font-weight=\"700\">1년</text>\n</svg></div>\n<h2>쓰면 쓸수록 똑똑해지는 나만의 AI 비서</h2>\n<p>내 AI 비서는 대화가 쌓일수록 내 습관, 선호, 맥락을 점점 더 잘 이해하게 됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2v-1A2.5 2.5 0 0 0 17.5 7 2.5 2.5 0 0 0 14.5 2z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">기억이 쌓입니다</div><div class=\"step-desc\">과거 대화·PDV 기록을 참고해 다음 대화에서 더 정확한 답을 줍니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">점점 맞춤화됩니다</div><div class=\"step-desc\">반복되는 요청 패턴을 학습해 먼저 제안해주기도 합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">내 데이터는 내 것</div><div class=\"step-desc\">이 모든 학습은 내 PDV 안에서만 이뤄지며, 다른 사람 비서와 섞이지 않습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2v-1A2.5 2.5 0 0 0 17.5 7 2.5 2.5 0 0 0 14.5 2z\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">다른 AI 챗봇과 다른 점</div>일반 챗봇은 대화가 끝나면 기억을 잃지만, 내 AI 비서는 PDV에 계속 기록을 남겨 시간이 지날수록 더 정확해집니다.</div></div>\n","quiz":[{"q":"내 AI 비서가 똑똑해지는 원리는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2v-1A2.5 2.5 0 0 0 17.5 7 2.5 2.5 0 0 0 14.5 2z\"/></svg>","options":["소프트웨어 업데이트만으로","내 대화·PDV 기록이 쌓이기 때문","랜덤으로","불가능하다"],"answer":1,"explain":"쌓인 대화와 PDV 기록을 참고해 점점 더 맞춤화된 답을 줍니다."},{"q":"이 학습된 정보는 다른 사람과 공유되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>","options":["예, 모두와 공유됨","아니요, 내 PDV 안에서만 유지됨","공개 게시판에 올라감","알 수 없음"],"answer":1,"explain":"학습은 내 PDV 안에서만 이뤄지며 다른 사람 비서와 섞이지 않습니다."},{"q":"일반 챗봇과 내 AI 비서의 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2v-1A2.5 2.5 0 0 0 17.5 7 2.5 2.5 0 0 0 14.5 2z\"/></svg>","options":["차이 없음","일반 챗봇은 대화가 끝나면 기억을 잃지만 내 비서는 기록이 누적됨","일반 챗봇이 더 똑똑함","내 비서는 기록을 안 남김"],"answer":1,"explain":"PDV에 기록이 누적되어 시간이 지날수록 더 정확해지는 게 핵심 차이입니다."}],"placeholder":false},{"tier":"intermediate","title":"PDV 기록 — 내 데이터는 어디에 있는가","id":"ch12","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 120 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:120px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></g></svg></div>\n<h2>PDV 기록 — 내 데이터는 어디에 있는가</h2>\n<p>PDV(Private Data Vault, 개인 데이터 저장소)는 내 모든 대화·거래·기록이 안전하게 보관되는 나만의 금고입니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">내 것은 내 것</div><div class=\"step-desc\">PDV의 데이터는 나만 열람할 수 있고, 다른 사람이나 기업이 마음대로 가져갈 수 없습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">AI 비서가 참고합니다</div><div class=\"step-desc\"><a class=\"ch-link\" href=\"#\" data-goto=\"ch11\">「쓰면 쓸수록 똑똑해지는 나만의 AI 비서」장</a>에서 다룬 “똑똑해지는 AI 비서”의 재료가 바로 이 PDV 기록입니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><circle cx=\"6\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"18\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">평생 쌓입니다</div><div class=\"step-desc\">오늘의 기록이 10년 뒤에도 그대로 남아 나의 역사가 됩니다(<a class=\"ch-link\" href=\"#\" data-goto=\"ch13\">「출생부터 평생, 기록의 가치」장</a>에서 이어집니다).</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">PDV를 내보낼 수 있나요?</div>네, <a class=\"ch-link\" href=\"#\" data-goto=\"ch9\">「설정 페이지 사용법」장</a>에서 다룬 설정 페이지에서 내 PDV 기록 전체를 다운로드할 수 있습니다.</div></div>\n\n<h3>PDV에 쌓이는 것과 쓰는 법</h3>\n<p>PDV에 쌓이는 것: <b>내 정보</b>(이름·주소·연락처 → 서류 칸 자동 입력, 주소지는 정부 AI의 기관 선택에도 사용) · <b>Draft</b> · <b>작성한 서류</b> · <b>양식</b>(자주 쓰는·내가 만든·올려 둔) · <b>과제 계획서</b>. 업무 기록은 본인 기기에 저장되고 네트워크에는 해시만 남습니다.</p>\n<p>내 정보는 한 번만 정확히 적습니다. 이름이 비슷한 칸에 맞춰 채워지기 쉽지만 보장되지는 않으니 <b>채워진 값은 검토</b>하세요. <b>번호류(주민등록번호·카드·계좌)는 두지 않습니다</b> — 비서에게 가려지므로 필요한 서류에서 직접 적습니다.</p>\n<p>서류 안에서 칸을 고쳐도 PDV의 원본은 바뀌지 않습니다. 내 정보를 바꾸려면 설정 → PDV에서 고칩니다.</p>\n<p><b>기기마다 따로</b>입니다. 폰·컴퓨터·브라우저 사이의 자동 동기화는 아직 없고, 기기를 바꾸거나 브라우저 데이터를 지우면 사라질 수 있으니 중요한 서류는 Word·PDF로 받아 따로 보관하세요. 공용 컴퓨터에는 저장하지 마세요.</p>","quiz":[{"q":"PDV는 무엇의 줄임말인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>","options":["Personal Data Vault","Public Data View","Private Digital Video","Personal Device Verification"],"answer":0,"explain":"PDV는 Private Data Vault, 개인 데이터 저장소입니다."},{"q":"PDV의 데이터는 누가 열람할 수 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>","options":["누구나","오직 나 자신","나비 직원 전체","광고주"],"answer":1,"explain":"PDV는 개인 소유의 저장소로, 본인만 열람할 수 있습니다."},{"q":"내 AI 비서가 똑똑해지는 재료는 무엇인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2v-1a2.5 2.5 0 0 1 2.5-2.5A2.5 2.5 0 0 1 9.5 2z\"/></svg>","options":["광고 데이터","내 PDV 기록","다른 사람의 대화","임의의 데이터"],"answer":1,"explain":"12장에서 다뤘듯, AI 비서는 내 PDV 기록을 참고해 점점 맞춤화됩니다."},{"q":"PDV는 어디에 보관되나요?","options":["이 기기 안","공개 서버","메일함"],"answer":0,"explain":"정답은 “이 기기 안”입니다."},{"q":"서류 안에서 칸을 고치면 PDV의 내 정보는?","options":["함께 바뀐다","바뀌지 않는다","삭제된다"],"answer":1,"explain":"정답은 “바뀌지 않는다”입니다."},{"q":"다른 기기에서 PDV를 쓰려면?","options":["자동 동기화된다","아직 동기화가 없어 기기마다 따로다","메일로 전송된다"],"answer":1,"explain":"정답은 “아직 동기화가 없어 기기마다 따로다”입니다."}],"placeholder":false,"updated":"2026-11-15"},{"tier":"intermediate","title":"PDV 거래명세서 — 사고팔면 양쪽 다 기록됩니다","id":"ch_pdv_trade_record","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\"><rect x=\"20\" y=\"30\" width=\"160\" height=\"110\" rx=\"14\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"75\" r=\"18\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2\"/><rect x=\"55\" y=\"105\" width=\"90\" height=\"10\" rx=\"5\" fill=\"#bfe0fb\"/><text x=\"100\" y=\"155\" text-anchor=\"middle\" font-size=\"13\" fill=\"#0c6cc3\" font-weight=\"700\">구매자</text><rect x=\"220\" y=\"30\" width=\"160\" height=\"110\" rx=\"14\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2\"/><circle cx=\"300\" cy=\"75\" r=\"18\" fill=\"#fff\" stroke=\"#188038\" stroke-width=\"2\"/><rect x=\"255\" y=\"105\" width=\"90\" height=\"10\" rx=\"5\" fill=\"#bfe6c9\"/><text x=\"300\" y=\"155\" text-anchor=\"middle\" font-size=\"13\" fill=\"#188038\" font-weight=\"700\">판매자</text><line x1=\"180\" y1=\"85\" x2=\"220\" y2=\"85\" stroke=\"#f59e0b\" stroke-width=\"2.5\"/></svg></div>\n<h2>PDV 거래명세서 — 사고팔면 양쪽 다 기록됩니다</h2>\n<p><a class=\"ch-link\" href=\"#\" data-goto=\"ch12\">「PDV 기록」장</a>에서 다룬 PDV(개인 데이터 저장소)는 대화만 기록하는 게 아닙니다. 나비마켓·이체처럼 <strong>두 사람이 관여하는 거래</strong>가 성사되면, 구매자와 판매자 <strong>양쪽 모두의</strong> PDV에 6하원칙(누가·언제·어디서·무엇을·어떻게·왜) 거래명세서가 각자의 관점으로 남습니다.</p>\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">누가·언제·어디서·무엇을·어떻게·왜</div>같은 거래라도 구매자 쪽 기록은 \"무엇을 샀는지\", 판매자 쪽 기록은 \"무엇을 팔았는지\"로 관점이 다르게 남습니다 — 언제·어디서 일어난 거래인지는 양쪽이 똑같이 공유합니다.</div>\n</div>\n<h3>거래 하나, 기록 두 개</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"21\" r=\"1\"/><circle cx=\"20\" cy=\"21\" r=\"1\"/><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">구매자 쪽 기록</div><div class=\"step-desc\">\"무엇을 얼마에 샀는지\"가 내 PDV에 남습니다. <a class=\"ch-link\" href=\"#\" data-goto=\"ch20\">「나비마켓 판매자의 재무제표 자동 생성」장</a>에서 다룰 재무제표의 지출(매입) 내역도 여기서 함께 시작됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">판매자 쪽 기록</div><div class=\"step-desc\">\"무엇을 얼마에 팔았는지\"가 판매자의 PDV에 똑같이 남습니다 — 예전에는 판매자 기록만 남고 구매자 기록이 비어 있던 시절도 있었지만, 지금은 항상 두 쪽 모두 기록됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">내 기록에 상대방 개인정보가 남나요?</div>아니요 — 상대방은 익명 식별자로만 표시됩니다. 내 PDV에는 내가 무엇을 하고 얼마를 주고받았는지만 남지, 상대의 신상정보가 담기지는 않습니다.</div>\n</div>\n","quiz":[{"q":"두 사람이 거래하면 6하원칙 기록은 누구에게 남나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/></svg>","options":["판매자에게만","구매자에게만","구매자·판매자 양쪽 모두","아무에게도 안 남음"],"answer":2,"explain":"거래가 성사되면 구매자·판매자 양쪽의 PDV에 각자 관점의 6하원칙 기록이 함께 남습니다."},{"q":"구매자 쪽 기록과 판매자 쪽 기록의 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["완전히 동일하다","무엇을 샀는지/팔았는지 관점만 다르다","판매자 기록만 진짜다","구매자 기록만 저장된다"],"answer":1,"explain":"언제·어디서 일어난 거래인지는 공유하지만, 무엇을 했는지(구매/판매)는 각자의 관점으로 따로 남습니다."},{"q":"내 PDV 거래 기록에 상대방의 개인정보가 그대로 담기나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["예, 이름과 연락처까지 저장됨","아니요, 익명 식별자로만 표시됨","선택적으로 공개 가능","확인할 방법이 없음"],"answer":1,"explain":"상대방은 익명 식별자로만 남고, 신상정보는 내 PDV 기록에 포함되지 않습니다."}],"placeholder":false},{"tier":"intermediate","title":"출생부터 평생, 기록의 가치","id":"ch13","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 120 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:120px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><circle cx=\"6\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"18\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/></g></svg></div>\n<h2>출생부터 평생, 기록의 가치</h2>\n<p>PDV는 태어난 순간부터 평생에 걸쳐 쌓일 수 있는 기록입니다. 시간이 지날수록 그 가치가 커집니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><circle cx=\"6\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"18\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">생애 전 구간</div><div class=\"step-desc\">출생, 학교, 취업, 결혼, 은퇴 등 각 시점의 기록이 하나로 이어집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5C2 13 7 16.5 12 21c2.13-1.9 4.09-3.6 5.71-5.2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">예: 의료 기록</div><div class=\"step-desc\">평생 쌓인 건강 기록이 있으면 새로운 병원에서도 정확한 진단에 도움이 됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"1\"/><line x1=\"9\" y1=\"8\" x2=\"9\" y2=\"8\"/><line x1=\"15\" y1=\"8\" x2=\"15\" y2=\"8\"/><line x1=\"9\" y1=\"13\" x2=\"9\" y2=\"13\"/><line x1=\"15\" y1=\"13\" x2=\"15\" y2=\"13\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">예: 신용·자산 기록</div><div class=\"step-desc\"><a class=\"ch-link\" href=\"#\" data-goto=\"ch20\">「나비마켓 판매자의 재무제표 자동 생성」장</a> 이후에서 다룰 신용 평가·대출도 이런 장기 기록을 바탕으로 자동화됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><circle cx=\"6\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"18\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">기록이 길수록 유리한가요?</div>예, 특히 신용 평가나 전문 서비스 이용 시 오래되고 일관된 기록일수록 더 정확한 판단이 가능합니다.</div></div>\n","quiz":[{"q":"PDV 기록은 언제부터 쌓일 수 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><circle cx=\"6\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"18\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"/></svg>","options":["성인이 된 후부터","출생부터 평생","입사 후부터","기록 안 됨"],"answer":1,"explain":"PDV는 출생부터 평생에 걸쳐 쌓일 수 있는 개인 기록입니다."},{"q":"평생 의료 기록이 쌓이면 어떤 장점이 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5C2 13 7 16.5 12 21c2.13-1.9 4.09-3.6 5.71-5.2\"/></svg>","options":["장점 없음","새 병원에서도 정확한 진단에 도움","기록이 유출됨","비용이 더 든다"],"answer":1,"explain":"일관된 장기 의료 기록은 새로운 진료 시에도 정확한 판단에 도움이 됩니다."},{"q":"장기 기록이 도움이 되는 또 다른 분야는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"1\"/><line x1=\"9\" y1=\"8\" x2=\"9\" y2=\"8\"/><line x1=\"15\" y1=\"8\" x2=\"15\" y2=\"8\"/><line x1=\"9\" y1=\"13\" x2=\"9\" y2=\"13\"/><line x1=\"15\" y1=\"13\" x2=\"15\" y2=\"13\"/></svg>","options":["신용 평가·대출","날씨 예보","게임 점수","없음"],"answer":0,"explain":"20장 이후에서 다루는 신용 평가와 대출 자동화가 이런 장기 기록을 바탕으로 합니다."}],"placeholder":false},{"tier":"intermediate","title":"GDC 충전하기","id":"ch14","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></g></svg></div>\n<h2>GDC 충전하기</h2>\n<p>GDC(나비의 디지털 통화)는 <strong>계좌 입금</strong>으로 충전됩니다 — 카드 자동결제 같은 정기결제 수단은 없습니다. 신청 없이 바로 입금하는 방법이 가장 간단합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 입금자명에 전화번호 뒷자리 8자리</div><div class=\"step-desc\">신청서 작성 없이, 지정된 계좌로 바로 입금하면 됩니다 — 입금자명(보내는분)에 나비에 등록된 내 전화번호 뒷자리 8자리를 적습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 관리자가 은행 알림으로 확인</div><div class=\"step-desc\">입금이 되면 관리자 폰에 은행 자체 입금 알림이 옵니다. 관리자가 그 전화번호·금액으로 내 계정을 찾아 충전을 처리합니다 — 사람이 확인하는 단계라 즉시(밀리초 단위)는 아니지만, 별도 신청서를 미리 작성할 필요는 없습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ GDC 발행</div><div class=\"step-desc\">확인이 끝나면 입금액과 1:1 비율로 GDC가 지갑에 발행됩니다(예: 1,000원 = 1,000 GDC — 지금은 테스트 기간 기준이며 바뀔 수 있습니다).</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">충전 확인은 어디서?</div>대시보드 홈의 GDC 지갑 카드에서 잔액을 확인할 수 있습니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">미리 신청서를 쓰는 방법도 있나요?</div>네 — `charge.html`에서 먼저 신청해 매칭코드를 받은 뒤 입금하는 방법도 있습니다. 두 방법 다 결국 관리자 확인을 거쳐 GDC가 발행된다는 점은 같습니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">월 기본료나 구독료가 있나요?</div>아니요. 나비 이용은 <strong>쓴 만큼만 GDC 잔액에서 차감</strong>되는 종량제 하나입니다(<a class=\"ch-link\" href=\"#\" data-goto=\"ch15\">「GDC 사용하기」장</a>에서 이어집니다). 충전은 지갑을 채우는 일일 뿐이고, 잔액이 <strong>1,000 GDC 이하</strong>로 내려가면 충전을 권하는 알림이 옵니다.</div></div>\n","quiz":[{"q":"GDC를 신청서 없이 바로 충전하려면 입금자명에 뭘 적어야 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg>","options":["아무거나 상관없음","내 전화번호 뒷자리 8자리","닉네임","주민등록번호"],"answer":1,"explain":"입금자명에 나비에 등록된 전화번호 뒷자리 8자리를 적어야 관리자가 은행 알림을 보고 내 계정을 정확히 찾을 수 있습니다."},{"q":"이 방식으로 입금하면 GDC가 어떻게 충전되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg>","options":["신청서 작성은 필요 없지만, 관리자가 은행 알림을 보고 확인해야 발행됨","아무도 확인 안 하고 즉시 자동 발행","1주일 뒤 일괄 처리","환불됨"],"answer":0,"explain":"미리 신청서를 쓸 필요는 없지만, 관리자가 은행 입금 알림을 직접 보고 확인하는 절차는 여전히 있습니다."},{"q":"GDC 충전과 별개로 매달 내는 기본료가 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg>","options":["있다 — 월 정액 요금제","없다 — 쓴 만큼만 잔액에서 차감된다","1년에 한 번만 낸다","충전할 때마다 수수료를 낸다"],"answer":1,"explain":"월 기본료·구독 요금제는 없습니다. 나비는 쓴 만큼만 GDC 잔액에서 차감하는 종량제이고, 잔액이 1,000 GDC 이하가 되면 충전 알림이 옵니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"intermediate","title":"GDC 사용하기 — 사용료와 사용자 간 결제","id":"ch15","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></g></svg></div>\n<h2>GDC 사용하기 — 사용료와 사용자 간 결제</h2>\n<p>GDC는 나비 이용료 지불뿐 아니라, <strong>사용자끼리 직접 주고받는 결제</strong>에도 쓰입니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">서비스 이용료 결제</div><div class=\"step-desc\">전문가 페르소나·K-서비스 이용 시 GDC가 자동 차감됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">사용자 간 결제</div><div class=\"step-desc\">나비마켓에서 물건을 사고팔 때도 GDC로 결제합니다 — <a class=\"ch-link\" href=\"#\" data-goto=\"ch19\">「나비마켓」장</a>에서 이어집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">내역 확인</div><div class=\"step-desc\">대시보드에서 충전·사용 내역을 모두 확인할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">GDC는 현금과 같나요?</div>나비 생태계 안에서는 현금처럼 쓰이지만, 실제 환전이나 외부 사용에는 <a class=\"ch-link\" href=\"#\" data-goto=\"ch26\">「수수료 없는 글로벌 디지털 통화 GDC」장</a> \"수수료 없는 GDC 환전과 송금\"에서 다루는 규칙이 적용됩니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">결제할 때마다 지문을 확인하나요?</div>아니요 — 일정 금액 미만(기본 1만 원)은 매번 지문 없이 바로 결제됩니다. 그 금액을 넘어서는 결제만 지문(또는 Face ID)으로 한 번 더 확인합니다. 이 기준 금액은 설정에서 직접 조정할 수 있습니다 — <a class=\"ch-link\" href=\"#\" data-goto=\"ch33\">「보안 설정 직접 조정하기」장</a>에서 다룹니다.</div></div>\n<h3>무료 사용량을 모두 썼다면</h3>\n<p>가입할 때 받은 무료 사용량(1,000원어치)을 모두 쓰고 GDC 잔액도 부족하면, 나비가 아래와 같이 알려 줍니다. <strong>GDC를 충전한 뒤 다시 이용</strong>하면 됩니다. 안내창의 <strong>\"내 GDC 잔액 확인하기\"</strong> 버튼으로 잔액을 확인할 수 있습니다(충전 방법은 <a class=\"ch-link\" href=\"#\" data-goto=\"ch14\">「GDC 충전하기」장</a> 참고).</p>\n<figure class=\"ch-shot\" style=\"max-width:320px\"><img src=\"manual-img/gdc-free-limit-used.webp?v=20261114\" alt=\"무료 사용량 소진 안내\" loading=\"lazy\"><figcaption>무료 사용량과 GDC 잔액이 모두 부족할 때 나비가 보여 주는 안내</figcaption></figure>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">얼마가 차감되나요?</div>사용한 만큼만 차감됩니다. 가입하면 <strong>테스트 기간에는 소액(100 GDC)의 무료 GDC</strong>가 먼저 지급되어 처음 써 보는 데 쓸 수 있습니다. 월 기본료는 없고, 잔액이 1,000 GDC 이하가 되면 충전 알림이 옵니다. 전문가용 AI의 연 구독은 아직 <strong>준비 중</strong>입니다(전문가 인증 장 참고).</div></div>","quiz":[{"q":"GDC로 결제할 수 없는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg>","options":["전문가 페르소나 이용료","K-서비스 이용료","나비마켓 거래","해당 없음(모두 가능)"],"answer":3,"explain":"GDC는 서비스 이용료와 사용자 간 거래 모두에 쓰일 수 있습니다."},{"q":"나비마켓에서의 결제 수단은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>","options":["현금만","신용카드만","GDC","포인트만"],"answer":2,"explain":"나비마켓의 거래도 GDC로 이뤄집니다."},{"q":"사용 내역은 어디서 확인하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg>","options":["확인 불가","대시보드","고객센터 전화","은행 앱"],"answer":1,"explain":"대시보드에서 충전·사용 내역을 모두 확인할 수 있습니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"intermediate","title":"전문가 페르소나 호출하기","id":"ch16","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5C2 13 7 16.5 12 21c2.13-1.9 4.09-3.6 5.71-5.2\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"1\"/><line x1=\"9\" y1=\"8\" x2=\"9\" y2=\"8\"/><line x1=\"15\" y1=\"8\" x2=\"15\" y2=\"8\"/><line x1=\"9\" y1=\"13\" x2=\"9\" y2=\"13\"/><line x1=\"15\" y1=\"13\" x2=\"15\" y2=\"13\"/></g></svg></div><h2>전문가 페르소나 호출하기</h2><p>변호사, 세무사, 회계사, 간호사, 건축사 등 수백 종의 전문 분야마다 AI 페이지가 있습니다. 이 AI들은 전문가를 대신하는 존재가 아니라, <strong>전문가와 소속 직원이 서류 작성 같은 업무를 대화로 진행하도록 돕는 보조 도구</strong>입니다.</p><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 분야 찾기</div><div class=\"step-desc\">원하는 직역(예: \"세무사\")을 검색하거나 목록에서 고릅니다. 직역 버튼을 누르면 그 직역 전용 페이지가 열립니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 페이지에서 서류 고르기</div><div class=\"step-desc\">직역별 서류 목록에서 작성할 서류를 고르거나, 목록에 없으면 직접 말해서 요청합니다. 자세한 사용법은 다음 장에서 다룹니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 대화로 서류 작성</div><div class=\"step-desc\">AI가 단계별로 묻고 채워 갑니다. 최종 확인과 서명은 항상 전문가 본인의 몫입니다.</div></div></div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">일반인용과 전문가용</div>직역에 따라 <strong>일반인용(신원 확인 없이 쓰는 안내)</strong>과 <strong>전문가용(전문가·직원의 업무 보조)</strong>이 나뉘어 있습니다. 전문가용은 면허 인증이 필요하며 지금은 준비 중입니다.</div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">\"상담\"이 아니라 \"서류 작성 보조\"입니다</div>법률·세무·의료처럼 자격 전문가의 업무는 AI가 대신하지 않습니다. AI는 서류 작성 같은 작업을 돕고, 판단·확인·서명은 전문가가 합니다. 교사·사회복지사처럼 상담 자체가 업무인 직역은 상담형으로 동작합니다.</div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">어떤 분야가 있나요?</div>법률, 회계, 세무, 의료·보건, 건축, 관광통역, 감정평가, 변리 등 매우 다양한 직역의 페이지가 준비되어 있습니다.</div></div>","quiz":[{"q":"전문가 페르소나를 찾는 첫 단계는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["바로 결제","분야 검색","회원 탈퇴","이메일 전송"],"answer":1,"explain":"원하는 전문 분야를 먼저 검색해서 찾습니다."},{"q":"전문가 페르소나로 다룰 수 있는 분야가 아닌 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5C2 13 7 16.5 12 21c2.13-1.9 4.09-3.6 5.71-5.2\"/></svg>","options":["법률","세무","의료","해당 없음(매우 다양함)"],"answer":3,"explain":"법률·회계·의료·건축 등 수백 종의 다양한 전문 분야를 다룹니다."},{"q":"전문가 페르소나 채팅은 내 AI 비서와 같은 화면인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>","options":["예, 완전히 같다","아니요, 별도 화면(5장 참고)","전문가 페르소나는 존재하지 않는다","항상 전화로만 가능"],"answer":1,"explain":"5장에서 다뤘듯 전문가 페르소나는 내 AI 비서와 별도의 화면에서 진행됩니다."},{"q":"전문가 페르소나 AI의 역할로 맞는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["전문가를 완전히 대체한다","전문가·직원의 서류 작성 등 업무를 대화로 보조한다","결제만 대신 처리한다","광고를 보여 준다"],"answer":1,"explain":"전문가 AI는 서류 작성 같은 작업을 돕는 보조 도구이고, 최종 확인과 서명은 전문가가 합니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"intermediate","title":"서류 작성: 시작부터 저장까지","id":"ch_doc_write","body":"<h2>서류 작성: 시작부터 저장까지</h2>\n<p>① <b>설정 → PDV</b>에 이름·주소·연락처를 저장해 둡니다. 서류를 열면 해당 칸에 자동으로 들어가고 “내 정보 칸”으로 표시됩니다. 번호류는 비서에게 가려지므로 서류 화면에서 직접 적습니다.</p>\n<p>② 입력창에 “소장 작성해 주세요”처럼 말하거나 <b>서류 작성 ▾</b>에서 고릅니다. ③ 서류가 열리면 입력창은 잠기고, 비서가 <b>💬 대화창</b>에서 필요한 것을 하나씩 묻습니다.</p>\n<p>④ “빈 칸을 채워 줘”라고 하면 아는 값으로 채우고, 모르는 것은 <b>지어내지 않고</b> 비워 둡니다. ⑤ 사실을 모르면 신분증·계약서·고지서 같은 자료를 <b>📎</b>로 올려 달라고 합니다(글·사진·PDF, 4개 안팎, 8MB 이하).</p>\n<p>⑥ 서류 화면에서 검토합니다. 비서가 쓴 칸에는 <b>“SP” 배지</b>가 붙고, 내가 직접 쓴 칸은 비서가 함부로 바꾸지 않습니다. ⑦ 다 맞으면 <b>작성 완료로 저장</b>. 중간에 나가면 Draft로 저장되지만 입력칸까지 복원되지는 않으니, 오래 걸리는 서류는 중간에 저장하세요.</p>","quiz":[{"q":"서류의 “SP” 배지는 무슨 뜻인가요?","options":["비서가 쓴 칸","내가 직접 쓴 칸","필수 칸"],"answer":0,"explain":"정답은 “비서가 쓴 칸”입니다."},{"q":"내 정보(이름·주소)가 서류에 자동으로 들어가게 하려면?","options":["설정 → PDV에 저장해 둔다","매번 입력창에 쓴다","불가능하다"],"answer":0,"explain":"정답은 “설정 → PDV에 저장해 둔다”입니다."},{"q":"비서가 모르는 사항은 어떻게 하나요?","options":["지어내서 채운다","비워 두고 내가 알려 줄 것만 말해 준다","서류를 삭제한다"],"answer":1,"explain":"정답은 “비워 두고 내가 알려 줄 것만 말해 준다”입니다."}],"updated":"2026-11-15"},{"tier":"intermediate","title":"서류를 말로 고치고, 전달·제출 준비하기","id":"ch_doc_edit","body":"<h2>서류를 말로 고치고, 전달·제출 준비하기</h2>\n<p>완성한 서류에서 “신청 사유를 조금 더 정중하게 고쳐 줘”, “매매대금을 4억 원으로 바꿔 줘”처럼 말합니다. 나만의 AI 비서는 <b>어느 칸을 고칠지만</b> 정하고, 값은 서류를 작성한 전문 비서가 씁니다. 바뀐 칸은 강조와 SP 배지로 보이고 <b>이전 값 → 새 값</b> 카드가 나옵니다. 마음에 안 들면 카드의 <b>되돌리기</b>를 누릅니다.</p>\n<p><b>직접 쓴 칸</b>은 “매매대금을 바꿔 줘”처럼 <b>칸 이름을 말했을 때만</b> 바로 고치고, 말하지 않은 칸은 “바꿀까요?”라고 물어 바꾸기/그대로 두기를 고르게 합니다. 칸이 있는 서식 서류만, 다 만든 뒤에, 컴퓨터에서, 한 번에 최대 12칸까지 됩니다.</p>\n<p><b>전달</b>을 누르면 완성한 서류가 메일에 첨부됩니다. <b>제출</b>을 누르면 대화창이 제출 안내 비서로 바뀌어 빈 칸 확인 → 제출 기관 특정 → 공동인증서 준비 → 제출처 접속·로그인 → 파일 첨부 → 수수료 납부 → 접수증 보관 → 처리 확인 순으로 안내합니다.</p>\n<p>공동인증서 비밀번호·주민등록번호·계좌번호는 대화창에 입력하지 마세요. 안내는 접수 결과를 보장하지 않습니다.</p>","quiz":[{"q":"비서가 고친 칸을 되돌리려면?","options":["카드의 되돌리기를 누른다","서류를 새로 만든다","불가능하다"],"answer":0,"explain":"정답은 “카드의 되돌리기를 누른다”입니다."},{"q":"내가 직접 쓴 칸을 말로 지목하지 않았는데 바꾸려 하면?","options":["말없이 바꾼다","“바꿀까요?”라고 먼저 묻는다","서류를 삭제한다"],"answer":1,"explain":"정답은 ““바꿀까요?”라고 먼저 묻는다”입니다."},{"q":"“제출”을 누르면 나비웹은?","options":["대신 접수한다","제출 방법을 단계별로 안내한다","자동으로 인증서를 입력한다"],"answer":1,"explain":"정답은 “제출 방법을 단계별로 안내한다”입니다."}],"updated":"2026-11-15"},{"tier":"intermediate","title":"내 양식으로 쓰기 — 양식 업로드와 내 서류함","id":"ch_myforms","body":"<h2>내 양식으로 쓰기 — 양식 업로드와 내 서류함</h2>\n<p><b>서류 작성 ▾ → 양식 업로드</b>(검색창 바로 아래)에 가지고 있는 양식(이미지·PDF)을 올립니다. 서류를 고르기 <b>전에</b> 올려야 그 양식으로 서류가 만들어집니다.</p>\n<p>나비가 양식을 읽어 칸을 만듭니다. 이미 있는 양식과 같으면 기존 양식에 반영해 작성본을 보여 주고, 새 양식이면 서류 목록에 추가할지 묻습니다. 이후 작성은 “서류 작성: 시작부터 저장까지” 장과 같습니다.</p>\n<p>작성 중 위쪽 바의 <b>★ 내 서류함에 담기</b>를 누르면 <b>내 서류함 → 자주 쓰는 양식</b>에 담깁니다. 서류 화면에서 올린 양식은 <b>올려 둔 양식</b>에 보관됩니다. <b>내가 만든 양식</b>은 새 양식 만들기로 만든 것입니다.</p>\n<p>내 서류함의 항목을 누르면 서류 작성 화면에서 바로 열립니다. 모두 이 기기의 PDV에 보관되므로 다른 기기에서는 보이지 않습니다.</p>","quiz":[{"q":"자주 쓰는 양식에 담으려면?","options":["★ 내 서류함에 담기","Draft 저장","빠른 발송"],"answer":0,"explain":"정답은 “★ 내 서류함에 담기”입니다."},{"q":"내 서류함은 어디에 보관되나요?","options":["이 기기의 PDV","공개 서버","메일"],"answer":0,"explain":"정답은 “이 기기의 PDV”입니다."},{"q":"양식 파일은 언제 올려야 그 양식으로 서류가 만들어지나요?","options":["서류를 고르기 전","서류를 제출한 뒤","아무 때나"],"answer":0,"explain":"정답은 “서류를 고르기 전”입니다."}],"updated":"2026-11-15"},{"tier":"intermediate","title":"정보 공개 청구서 만들기","id":"ch_foi","body":"<h2>정보 공개 청구서 만들기</h2>\n<p><b>서류 작성 ▾ → 정보 공개 청구</b>를 고르면 입력창이 <b>대화창</b>이 되고, 대화에 따라 그 아래에 <b>청구서</b>가 만들어집니다.</p>\n<p>알고 싶은 것을 평소 말투로 적습니다(예: “제주도 지난 3년 간 공공 도서관 예산과 집행 내역을 알고 싶어요”). 청구 대상 기관과 내용을 읽고 직접 고칠 수 있으며, 청구인 정보는 <b>[대괄호] 칸에 직접</b> 적습니다.</p>\n<p><b>복사</b>·<b>파일로 받기</b>를 하고, <b>정보공개포털 열기</b>로 open.go.kr에 가서 <b>내가 직접 제출</b>합니다. 나비웹이 대신 제출하지 않습니다. 연습에서는 제출하지 마세요.</p>\n<p>청구 목적에 “SP”·“프롬프트” 같은 내부 용어가 있으면 일반적인 표현으로 바꾸고, 개인정보는 대화에 넣지 마세요.</p>","quiz":[{"q":"완성한 청구서는 누가 제출하나요?","options":["나비웹이 자동으로","내가 정보공개포털 등에 직접","관리자"],"answer":1,"explain":"정답은 “내가 정보공개포털 등에 직접”입니다."},{"q":"청구인 정보는 어디에 적나요?","options":["[대괄호] 칸에 직접","대화에 주민등록번호로","적지 않는다"],"answer":0,"explain":"정답은 “[대괄호] 칸에 직접”입니다."},{"q":"정보 공개 청구는 어디서 시작하나요?","options":["서류 작성 ▾ 목록","빠른 발송","주소록"],"answer":0,"explain":"정답은 “서류 작성 ▾ 목록”입니다."}],"updated":"2026-11-15"},{"tier":"intermediate","title":"전문가 AI로 서류 쓰기 — 서류 목록과 서식 쌓기","id":"ch_expertdoc","quiz":[{"q":"목록에 없는 서류가 필요할 때는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["불가능하다","\"목록에 없는 서류\" 버튼으로 직접 요청하거나 양식을 첨부한다","고객센터에 전화한다","다른 직역 페이지를 쓴다"],"answer":1,"explain":"직접 요청하거나 양식을 첨부하면 AI가 파악해 작성을 돕습니다."},{"q":"내가 올린 서식은 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["나만 볼 수 있다","동의하면 해당 직역 페이지에 게시되어 다른 이용자도 쓸 수 있다","자동 삭제된다","관리자만 쓴다"],"answer":1,"explain":"동의 후 게시되어 다른 이용자가 첨부 없이 활용할 수 있습니다."},{"q":"완성된 서류의 최종 확인과 서명은 누가 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["AI","전문가 본인","이용자 중 아무나","결제 담당자"],"answer":1,"explain":"AI는 작성을 돕고, 최종 확인과 서명은 전문가가 합니다."}],"body":"<h2>전문가 AI로 서류 쓰기 — 서류 목록과 서식 쌓기</h2><p>전문가 AI 페이지는 질문에 답하는 창구가 아니라, <strong>전문가와 소속 직원이 서류를 대화로 작성하는 작업대</strong>입니다. 서류 작성 화면은 PC를 기본으로 하고, 모바일은 간단한 질의와 업무 지시에 알맞습니다.</p><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 직역 페이지 열기</div><div class=\"step-desc\">직역을 고르면 그 직역의 서류 목록이 있는 전용 페이지가 열립니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 서류 고르기</div><div class=\"step-desc\">목록에서 고르거나, 목록에 없으면 \"목록에 없는 서류\" 버튼으로 직접 요청합니다. 카메라 촬영이나 파일(PDF·DOCX·HWPX) 첨부로 양식을 보여 줄 수도 있습니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 대화로 단계 진행</div><div class=\"step-desc\">AI가 단계마다 묻고 채웁니다. 입력창은 대화가 길어지면 아래로 늘어납니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">④ 확인과 서명은 전문가</div><div class=\"step-desc\">완성된 서류의 최종 확인과 서명은 전문가 본인이 합니다.</div></div></div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">상단 탭과 안내띠</div>페이지 위쪽 탭에서 작업 화면과 방법론을 오갑니다. 방법론 탭에는 이 AI가 따르는 지침의 원문이 펼쳐져 있어 AI가 무슨 규칙으로 일하는지 직접 읽어 볼 수 있습니다. 노란 안내띠는 한 줄로 통합되어 있고, X로 다시 보지 않을 수 있습니다.</div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">서식이 쌓이는 방식</div>목록에 없는 서류의 양식을 올리면, <strong>동의 후 해당 직역 페이지에 게시되어</strong> 다른 이용자가 첨부 없이 같은 서식을 쓸 수 있습니다. 처음 올린 서식을 다른 이용자들이 높게 평가하면 GDC 보상을 받을 수 있습니다(보장은 아니며, 지급 여부와 기준은 운영 정책에 따릅니다). 쓰는 사람이 늘수록 쓸 수 있는 서식도 늘어납니다.</div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">AI가 하지 않는 일</div>AI는 전문가의 판단을 대신하지 않습니다. 의료 같은 임상 직역은 전문가가 지시한 내용만 서류에 적고, 진단·처방을 AI가 정하지 않습니다. 법령에 맞는지 점검하고 싶다면 \"법률 검토\" 탭(의견 보내기 장 참고)을 이용하세요.</div></div>","updated":"2026-10-24"},{"tier":"intermediate","title":"전문가 인증과 전문가용 AI — 준비 중","id":"ch_proverify","quiz":[{"q":"전문가 인증과 구독의 현재 상태는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["이미 시행 중이다","준비 중이다","폐지됐다","일반인에게 의무다"],"answer":1,"explain":"아직 준비 중이며 확정되면 이 장이 갱신됩니다."},{"q":"예정된 인증 방식은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["면허증 사본 업로드 후 관리자 수동 승인","전화 한 통","자동 승인","추천인 확인"],"answer":0,"explain":"면허증 사본을 올리면 관리자가 확인·승인합니다."},{"q":"전문가 구독이 생기면 종량제는 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["사라진다","병행한다(계획)","두 배가 된다","환불된다"],"answer":1,"explain":"종량제와 병행하는 것이 계획입니다."}],"body":"<h2>전문가 인증과 전문가용 AI — 준비 중</h2><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">아직 준비 중인 기능입니다</div>이 장은 <strong>예정된 흐름</strong>을 미리 알려 드립니다. 시행 시점과 조건이 확정되면 이 장을 갱신합니다. 지금 일반 사용에는 아무 변화가 없습니다.</div></div><p>전문가용 AI는 면허를 가진 전문가 본인과 소속 직원이 업무에 쓰는 도구입니다. 그래서 면허 보유를 먼저 확인하는 절차가 필요합니다.</p><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 인증 신청</div><div class=\"step-desc\">면허증 사본을 올려 인증을 신청합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 관리자 확인</div><div class=\"step-desc\">관리자가 확인한 뒤 승인하는 수동 방식입니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 전문가 세션 시작</div><div class=\"step-desc\">승인되면 전문가용 AI를 쓸 수 있는 세션이 열립니다.</div></div></div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">비용 계획</div>일반 사용의 종량제와 별도로, 직역 서비스는 <strong>연 구독(전문가·직원 각각 연 99,000원)</strong>을 병행할 계획입니다. 초기 결제는 입금을 사람이 확인하는 방식이며, 체험 기간도 계획되어 있습니다. 모두 확정 전 계획이며 바뀔 수 있습니다.</div></div>","updated":"2026-10-24"},{"tier":"intermediate","title":"학습 AI — 교수 페르소나와 과목별 학습","id":"ch_learning","quiz":[{"q":"교수 페르소나의 역할은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["서류 작성 대행","학문 분야를 1:1로 가르친다","결제 처리","메일 발송"],"answer":1,"explain":"학문 분야마다 1:1로 가르치는 AI입니다."},{"q":"학습을 시작하는 곳은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["과목별 학습 시작 페이지","설정 페이지","충전 페이지","프로필 페이지"],"answer":0,"explain":"과목마다 학습 시작 페이지가 있습니다."},{"q":"학습 트랙은 몇 단계 흐름인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["3단계","5단계","10단계","단계가 없다"],"answer":2,"explain":"10단계 흐름으로 진행됩니다."}],"body":"<h2>학습 AI — 교수 페르소나와 과목별 학습</h2><p>교수 페르소나는 학문 분야마다 1:1로 가르치는 AI입니다. 교수 페르소나 공통 페이지는 세무사 페이지와 같은 배치를 쓰고, 과목마다 <strong>학습 시작 페이지</strong>가 따로 있습니다.</p><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 과목 고르기</div><div class=\"step-desc\">학문 분야와 세부 과목을 고릅니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 학습 시작</div><div class=\"step-desc\">과목별 학습 시작 페이지에서 학습 트랙을 시작합니다. 학습은 10단계 흐름으로 진행됩니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 이어서 배우기</div><div class=\"step-desc\">대화로 이해한 만큼 이어 가며, 내 속도에 맞춰 설명받습니다.</div></div></div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">다른 전문가 AI와의 차이</div>전문가 AI는 서류 작성을 돕고, 교수 AI는 배우는 사람을 가르칩니다. 다만 교수 AI도 평가나 최종 확인을 대신하지는 않습니다.</div></div>","updated":"2026-10-24"},{"tier":"intermediate","title":"K-정부","id":"ch_kgov","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(35,35)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M25 0L2 12v3h46v-3z\"/><line x1=\"2\" y1=\"15\" x2=\"48\" y2=\"15\"/><line x1=\"6\" y1=\"15\" x2=\"6\" y2=\"40\"/><line x1=\"16\" y1=\"15\" x2=\"16\" y2=\"40\"/><line x1=\"26\" y1=\"15\" x2=\"26\" y2=\"40\"/><line x1=\"36\" y1=\"15\" x2=\"36\" y2=\"40\"/><line x1=\"46\" y1=\"15\" x2=\"46\" y2=\"40\"/><line x1=\"0\" y1=\"40\" x2=\"50\" y2=\"40\"/><line x1=\"0\" y1=\"44\" x2=\"50\" y2=\"44\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(160,38)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"2\" width=\"36\" height=\"34\" rx=\"2\"/><line x1=\"8\" y1=\"10\" x2=\"32\" y2=\"10\"/><line x1=\"8\" y1=\"18\" x2=\"32\" y2=\"18\"/><line x1=\"8\" y1=\"26\" x2=\"20\" y2=\"26\"/></g></svg></div>\n<h2>K-정부 — 대한민국 공공기관 전체 지도</h2>\n<p>K-정부는 대한민국의 입법·사법·행정부, 지방자치단체, 공기업, 공공기관을 한 곳에서 찾아볼 수 있는 AI 디렉토리입니다. 모든 부서까지 다 나열하지는 않고, 기관 명칭 위주로 안내합니다.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">K-서비스(<a class=\"ch-link\" href=\"#\" data-goto=\"ch17\">「K-서비스 호출하기」장</a>)와 무엇이 다른가요?</div>K-서비스는 K-Law·K-Tax처럼 특정 \"기능\" 중심의 공익 서비스입니다. K-정부는 그 기능들이 실제로 속한 \"기관\" 자체를 찾아가는 디렉토리입니다 — 예를 들어 세금 신고는 K-Tax로 바로 가지만, \"국세청은 어떤 조직인가\"를 알고 싶을 때는 K-정부에서 국세청을 찾습니다.</div>\n</div>\n\n<h3>기관을 눌러 살펴보세요</h3>\n<p style=\"font-size:13px;color:var(--on-surface-variant);margin-bottom:8px\">카테고리 → 기관 → 부서 순으로 펼쳐집니다. 부서를 누르면 그 부서의 SP(System Prompt)를 바로 확인할 수 있습니다.</p>\n<div id=\"kgov-app\" class=\"kgov-app\"><div class=\"kgov-loading\">불러오는 중…</div></div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">부서 SP는 어떻게 만들어지나요?</div>입법부·사법부·행정부·지방자치단체의 부서 SP는 미리 파일로 만들어 둔 게 아니라, 공용 템플릿에 그 부서의 실사 데이터(부서명·소관업무 등)를 그 자리에서 채워 넣어 만듭니다 — 나비가 실제로 부서 AI를 필요할 때만 만드는 방식(지연 인스턴스화)과 같습니다. 반면 공기업·공공기관은 기관마다 이미 완성된 SP 파일이 있어 클릭하면 바로 열립니다. 지방자치단체는 16개 시도 중 15개는 시도 자체 정보가, 13개는 실·국 단위 부서까지 조사되어 있으며 나머지는 준비 중입니다.</div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">기관별 AI 페이지</div>기관의 AI를 전문가 페이지와 같은 모양으로 만나려면 중급 과정의 \"행정기관 AI 페이지와 접수 연동 민원\" 장을 참고하세요.</div></div>","quiz":[{"q":"K-정부와 K-서비스의 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["차이 없음","K-서비스는 기능 중심, K-정부는 기관 자체를 찾는 디렉토리","K-정부가 유료 서비스","K-서비스는 지방자치단체 전용"],"answer":1,"explain":"K-서비스는 K-Law·K-Tax 같은 기능 중심 서비스이고, K-정부는 그 기능이 속한 기관 자체를 찾아가는 디렉토리입니다."},{"q":"입법부·사법부·행정부·지방자치단체 부서의 SP는 어떻게 만들어지나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["기관마다 미리 만들어 둔 개별 파일을 연다","공용 템플릿에 그 부서의 실사 데이터를 즉석에서 채워 만든다","만들 수 없다","관리자가 매번 수작업으로 작성한다"],"answer":1,"explain":"나비의 지연 인스턴스화 원칙과 같은 방식으로, 공용 템플릿에 그 부서의 데이터를 채워 그 자리에서 SP를 만듭니다."},{"q":"공기업·공공기관 SP는 어떻게 확인하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/></svg>","options":["템플릿 치환이 필요하다","기관마다 이미 완성된 SP 파일을 바로 열람한다","확인할 방법이 없다","가입자만 볼 수 있다"],"answer":1,"explain":"공기업 30개·공공기관 254개는 기관마다 이미 완성된 SP 파일이 있어, 클릭하면 그 파일을 바로 열람할 수 있습니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"intermediate","title":"행정기관 AI 페이지와 접수 연동 민원","id":"ch_govagency","quiz":[{"q":"행정기관 AI 페이지에서 볼 수 없는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["작성된 문서","관계 법령","접수 연동 민원","다른 사람의 개인 민원 내용"],"answer":3,"explain":"개인의 민원 내용은 본인만 볼 수 있습니다."},{"q":"나비가 발급하는 접수번호는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["정부 공식 접수번호","나비 내부 접수번호","주민등록번호","결제 번호"],"answer":1,"explain":"공식 번호가 아니라 나비 내부 접수번호입니다."},{"q":"재량이나 법적 책임이 걸린 판단은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["AI가 단독 결정한다","담당 직원의 확인·승인을 거친다","신청자가 결정한다","무조건 반려된다"],"answer":1,"explain":"담당 직원의 확인·승인 단계를 둡니다."}],"body":"<h2>행정기관 AI 페이지와 접수 연동 민원</h2><p>K-정부에서 기관을 찾았다면, 행정기관 AI 페이지에서는 그 기관의 AI를 <strong>전문가 페이지와 같은 모양</strong>으로 만날 수 있습니다.</p><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 기관 페이지 열기</div><div class=\"step-desc\">행정기관 AI 페이지에서 기관을 고릅니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 작성된 문서와 관계 법령 보기</div><div class=\"step-desc\">그 기관 업무와 관련해 작성된 문서 목록과 근거가 되는 법령 목록을 볼 수 있습니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 접수 연동 민원 탭</div><div class=\"step-desc\">서버 접수와 연결된 민원이 모여 있어, 신청하면 접수번호까지 발급됩니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">접수번호와 직원 확인</div>나비가 발급하는 접수번호는 <strong>나비 내부 접수번호</strong>이며 정부의 공식 접수번호가 아닙니다. 재량이나 법적 책임이 걸린 판단은 담당 직원의 확인·승인을 거칩니다.</div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">조사가 진행 중입니다</div>제주시·서귀포시를 중심으로 부서별 업무와 근거 법령을 조사하고 있어, 기관·부서에 따라 아직 안내 수준에 머무는 업무가 있습니다. 폐지·개명된 법령은 점검을 거쳐 표시가 바뀔 수 있습니다.</div></div>","updated":"2026-10-24"},{"tier":"intermediate","title":"K-서비스 호출하기","id":"ch17","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></g></svg></div>\n<h2>K-서비스 호출하기</h2>\n<p>K-Law, K-Health, K-119처럼 정부·공공 성격의 AI 서비스를 K-서비스라고 부릅니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① K-서비스 목록 열기</div><div class=\"step-desc\">K-119·K-Law·K-Health·K-School·K-Tax·K-Market 등 다양한 서비스 탭이 나열됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 원하는 서비스 선택</div><div class=\"step-desc\">예를 들어 세금 문의는 K-Tax, 법률 업무 보조는 K-Law를 선택합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 바로 안내·처리</div><div class=\"step-desc\">공공 성격의 절차를 AI가 즉시 안내하거나 처리해줍니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">전문가 페르소나와 뭐가 다른가요?</div>전문가 페르소나(<a class=\"ch-link\" href=\"#\" data-goto=\"ch16\">「전문가 페르소나 호출하기」장</a>)는 개별 전문가 역할이고, K-서비스는 정부·공공기관 성격의 서비스라는 점이 다릅니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">K-Law를 쓸 때 알아 둘 점</div>K-Law의 주 이용자는 변호사이며, 결과는 참고용입니다. 인간 전문가의 확인이 필요합니다. 성능 수치를 읽는 법은 고급 과정의 \"K-Law 판결 예측\" 장에서 다룹니다.</div></div>","quiz":[{"q":"K-서비스의 성격은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg>","options":["개인 전문가 역할","정부·공공기관 성격의 서비스","광고 플랫폼","게임"],"answer":1,"explain":"K-서비스는 K-Law, K-Health 등 정부·공공 성격의 AI 서비스입니다."},{"q":"세금 관련 문의에 적합한 K-서비스는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["K-119","K-Tax","K-School","K-Market"],"answer":1,"explain":"세금 관련 문의는 K-Tax를 이용합니다."},{"q":"K-서비스와 전문가 페르소나의 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"1\"/><line x1=\"9\" y1=\"8\" x2=\"9\" y2=\"8\"/><line x1=\"15\" y1=\"8\" x2=\"15\" y2=\"8\"/><line x1=\"9\" y1=\"13\" x2=\"9\" y2=\"13\"/><line x1=\"15\" y1=\"13\" x2=\"15\" y2=\"13\"/></svg>","options":["차이 없음","K-서비스는 공공 성격, 전문가 페르소나는 개별 전문가 역할","전문가 페르소나가 더 공공적","K-서비스는 유료만 가능"],"answer":1,"explain":"전문가 페르소나는 개별 전문가 역할, K-서비스는 정부·공공기관 성격이라는 차이가 있습니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"intermediate","title":"K-서비스 전체 지도","id":"ch_kservicemap","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></g></svg></div><h2>K-서비스 전체 지도</h2><p><a class=\"ch-link\" href=\"#\" data-goto=\"ch17\">「K-서비스 호출하기」장</a>에서 K-Tax·K-Law·K-Health 몇 가지를 예시로 봤지만, 실제로는 <strong>스무 가지가 넘는 K-서비스</strong>가 있습니다. K-정부(<a class=\"ch-link\" href=\"#\" data-goto=\"ch_kgov\">「K-정부」장</a> 다음)가 \"기관\"을 찾는 지도라면, 이 지도는 \"기능\"을 찾는 지도입니다.</p><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">카테고리로 나뉘어 있습니다</div>생활(K-Health·K-School·K-Market), 행정(K-Law·K-Tax·K-Public·K-Police), 업무 실행(K-Plan·K-Compose·K-Execute·K-Deliver·K-Job·K-Mail), 감시·안전(K-Watch·K-119·K-Security), 물류·이동(K-Logistics·K-Traffic) 등으로 나뉘어 있습니다.</div></div><h3>기능 중심으로 찾는 법</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 하고 싶은 일을 먼저 떠올리기</div><div class=\"step-desc\">\"이메일 보내기\", \"이직 준비\", \"일정 여러 단계 계획\" 처럼 목적을 먼저 생각합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 해당 카테고리에서 찾기</div><div class=\"step-desc\">목적에 맞는 카테고리(생활/행정/업무 실행 등)를 열어 후보를 봅니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 안 찾아도 됩니다</div><div class=\"step-desc\">내 AI 비서에게 그냥 말해도 됩니다 — <a class=\"ch-link\" href=\"#\" data-goto=\"ch3\">「AI 비서 채팅 vs 다른 AI 호출」장</a>에서 다뤘듯, 필요한 K-서비스를 비서가 알아서 찾아 연결해줄 때가 많습니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">몇몇 K-서비스는 서로 연결돼 있습니다</div>K-Plan(상위 계획)이 목표를 세우면 K-Compose·K-Execute·K-Deliver·K-Report 순서로 실제 실행을 이어받는 구조가 많습니다. 예를 들어 K-Job(구직 실행)이나 K-Mail(메일 발송)은 이 체인 위에서 동작합니다 — 다음 두 장에서 각각 자세히 다룹니다.</div></div>","quiz":[{"q":"K-정부와 K-서비스 전체 지도의 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["차이 없음","K-정부는 기관을 찾는 지도, K-서비스 지도는 기능을 찾는 지도","K-서비스가 유료 전용","K-정부는 검색이 안 됨"],"answer":1,"explain":"K-정부는 '어느 기관인가'를, K-서비스 지도는 '어떤 기능이 필요한가'를 기준으로 찾는 지도입니다."},{"q":"K-서비스를 굳이 직접 찾지 않아도 되는 이유는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>","options":["K-서비스가 존재하지 않아서","내 AI 비서가 필요시 알아서 연결해줄 수 있어서","항상 유료라서","검색 기능이 없어서"],"answer":1,"explain":"5장에서 다뤘듯 내 AI 비서에게 그냥 요청하면 필요한 K-서비스를 대신 찾아 연결해줄 수 있습니다."},{"q":"K-Plan이 세운 목표를 실제로 실행하는 체인에 속하지 않는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["K-Compose","K-Execute","K-Deliver","K-Watch"],"answer":3,"explain":"K-Compose→K-Execute→K-Deliver→K-Report가 K-Plan의 실행 체인이며, K-Watch는 감시·안전 카테고리의 별개 서비스입니다."}]},{"tier":"intermediate","title":"K-Mail — 말로 메일 보내기","id":"ch_kmail","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"/><polyline points=\"22 6 12 13 2 6\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></g></svg></div><h2>K-Mail — 말로 메일 보내기</h2><p>나비 가입자는 각자 고유 메일 주소(<code>&lt;메일 아이디&gt;@naviweb.kr</code>)를 갖습니다. \"누구누구한테 메일 보내줘\"라고 말하면 K-Mail이 초안부터 발송까지 처리합니다.</p><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"/><polyline points=\"22 6 12 13 2 6\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">할 수 있는 일</div>즉시 발송뿐 아니라 예약 발송, 여러 명에게 각자 다른 맞춤 본문 보내기, 회신을 정해진 시각까지 모아 다이제스트로 정리하기, 주소록 자동 등록·검색까지 가능합니다.</div></div><h3>사용 흐름</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 대화로 요청</div><div class=\"step-desc\">\"OOO한테 회의 일정 물어보는 메일 보내줘\"처럼 자연어로 요청합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"/><polyline points=\"22 6 12 13 2 6\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 초안 확인 후 발송</div><div class=\"step-desc\">AI가 만든 초안을 확인하고, 즉시 또는 원하는 시각에 발송합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 주소록·회신 관리</div><div class=\"step-desc\">보낸 상대는 자동으로 주소록에 등록되고, 회신이 오면 다이제스트로 모아 보여줍니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fil
