li>이 사이트는 서류 작성을 돕는 도구입니다. 제출 전에 내용과 법적 효력은 담당 기관이나 전문가에게 확인하세요.</li>\n</ul>\n<p class=\"ch-note\">이 장은 2026-11-15 school.naviweb.kr 화면을 보고 쓴 초안입니다. 사용법·사이트의 특징 안내 문구는 나비 스쿨 화면에서 읽은 것이며, 직역 사이트들이 같은 틀을 쓰므로 사이트마다 서류 이름과 건수만 바뀝니다.</p>","quiz":[{"q":"나비 스쿨(school.naviweb.kr)의 첫 화면에서 서류를 찾는 방법은?","options":["입력창에 서류 이름을 입력한다","왼쪽 메뉴에서 서류 번호를 고른다","메일로 서류 이름을 보낸다"],"answer":0,"explain":"정답은 “입력창에 서류 이름을 입력한다”입니다. 이름을 치는 즉시 서식이 펼쳐집니다."},{"q":"작성 중인 서류는 어디에 저장되나요?","options":["저장 버튼을 눌러야 Draft에 저장된다","Draft(초안)에 실시간으로 자동 저장된다","저장되지 않고 닫으면 사라진다"],"answer":1,"explain":"정답은 “Draft(초안)에 실시간으로 자동 저장된다”입니다. 별도의 저장 버튼은 필요 없습니다."},{"q":"인적사항(성명·주소 등)은 어떻게 채워지나요?","options":["매번 직접 입력해야 한다","PDV에서 가져와 파란 칸으로 자동 입력되고 고칠 수 있다","서버가 몰래 채운다"],"answer":1,"explain":"정답은 “PDV에서 가져와 파란 칸으로 자동 입력되고 고칠 수 있다”입니다."}],"updated":"2026-11-15"},{"tier":"intermediate","title":"종합 실습과 졸업 점검","id":"ch_capstone","body":"<h2>종합 실습과 졸업 점검</h2>\n<p>시나리오 “다음 달 동네 책 모임 준비”: 접속 → 나비 길잡이로 계획서 → 말로 메일 보내기 → 주소록에 태그 → 서류 작성 → 말로 고치고 되돌리기, 전달 → ★ 내 서류함에 담기 → 업무(나 홀로)에 메일 기록·기한 → 계획서 완료·업무 종료·보관.</p>\n<p>막히는 단계는 앞의 해당 장으로 돌아가 다시 해 보세요. 연습은 <b>내 다른 메일 주소</b>로 하고 제출은 하지 마세요.</p>\n<p>꼭 기억할 안전 수칙: <b>주민등록번호·카드·계좌 번호와 비밀번호는 AI에게 말하지 않고 직접 입력</b>하고, 보내기 전에 받는 사람 주소와 날짜·금액·당사자를 읽고, 중요한 결정은 사람 전문가와 상의합니다.</p>\n<p>새로 알게 된 점이나 불편한 점은 위쪽 바의 <b>기능 개선 제안</b>에 남겨 주세요. 고급 장에서는 내 양식 만들기, 자동화 같은 기술을 다룹니다.</p>","quiz":[{"q":"실습 메일의 받는 사람은?","options":["내 다른 메일 주소","모르는 사람","관리자"],"answer":0,"explain":"정답은 “내 다른 메일 주소”입니다."},{"q":"주민등록번호·카드번호는?","options":["AI에게 말해 준다","AI에게 말하지 않고 직접 입력한다","메일 본문에 쓴다"],"answer":1,"explain":"정답은 “AI에게 말하지 않고 직접 입력한다”입니다."},{"q":"불편한 점을 알리는 곳은?","options":["기능 개선 제안","빠른 발송","주소록"],"answer":0,"explain":"정답은 “기능 개선 제안”입니다."}],"updated":"2026-11-15"},{"tier":"advanced","title":"지식 노동의 자동화 — 사람과 AI의 분업 체계","id":"ch18","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></g></svg></div>\n<h2>지식 노동의 자동화 — 사람과 AI의 분업 체계</h2>\n<p>반복적이고 정형화된 지식노동(문서 정리, 자료 조사, 1차 응대)은 AI가 처리하고, 판단과 책임이 필요한 부분은 사람이 맡습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">AI가 맡는 일</div><div class=\"step-desc\">자료 취합, 초안 작성, 반복 질의응답, 서류 검토 1차 스크리닝.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">사람이 맡는 일</div><div class=\"step-desc\">최종 판단, 감정적 소통, 창의적 의사결정, 책임 있는 승인.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">효율은 어떻게 오르나요</div><div class=\"step-desc\">AI가 반복 작업을 덜어주면 사람은 더 가치 있는 일에 집중할 시간이 늘어납니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">AI가 사람을 대체하나요?</div>완전히 대체하기보다, 반복 작업을 넘겨받아 사람이 더 중요한 일에 집중하게 돕는 분업 구조에 가깝습니다.</div></div>\n","quiz":[{"q":"AI가 주로 맡는 지식노동은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg>","options":["최종 책임 승인","반복적 자료 취합·초안 작성","감정적 상담","창의적 의사결정"],"answer":1,"explain":"정형화되고 반복적인 작업은 AI가 처리합니다."},{"q":"사람이 계속 맡아야 하는 영역은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>","options":["단순 반복 작업","최종 판단과 책임있는 승인","자료 취합","서류 스캔"],"answer":1,"explain":"판단과 책임이 필요한 영역은 여전히 사람의 몫입니다."},{"q":"이 분업 구조의 목적은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["사람을 완전히 대체","사람이 더 중요한 일에 집중하도록 돕는 것","AI 사용을 줄이는 것","무작위 배분"],"answer":1,"explain":"AI가 반복 작업을 맡아 사람이 가치 있는 일에 집중할 수 있게 합니다."}],"placeholder":false},{"tier":"advanced","title":"나비마켓 — AI 도구를 사고파는 오픈 마켓플레이스","id":"ch19","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></g></svg></div>\n<h2>나비마켓 — AI 도구를 사고파는 오픈 마켓플레이스</h2>\n<p>필요한 AI 도구를 사고파는 나비의 오픈 마켓플레이스입니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 도구 탐색</div><div class=\"step-desc\">필요한 AI 도구·SP를 검색하거나 카테고리별로 둘러봅니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"4\" width=\"22\" height=\"16\" rx=\"2\"/><line x1=\"1\" y1=\"10\" x2=\"23\" y2=\"10\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② GDC로 구매</div><div class=\"step-desc\">마음에 드는 도구를 GDC로 즉시 구매합니다(<a class=\"ch-link\" href=\"#\" data-goto=\"ch15\">「GDC 사용하기」장</a> 참고).</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 판매도 가능</div><div class=\"step-desc\">내가 만든 AI 도구를 등록해 판매자가 될 수도 있습니다 — <a class=\"ch-link\" href=\"#\" data-goto=\"ch20\">「나비마켓 판매자의 재무제표 자동 생성」장</a>부터 이어지는 재무·신용 체계가 여기서 시작됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">판매자가 되면 무엇이 달라지나요?</div>거래 실적이 쌓이고 구매자 리뷰를 받으면서 나비 온도(<a class=\"ch-link\" href=\"#\" data-goto=\"ch8\">「내 프로필」장</a>)가 오르내리기 시작합니다.</div></div>\n","quiz":[{"q":"나비마켓에서 거래되는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["중고 가전","AI 도구","부동산","자동차"],"answer":1,"explain":"나비마켓은 AI 도구를 사고파는 오픈 마켓플레이스입니다."},{"q":"나비마켓 결제 수단은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"4\" width=\"22\" height=\"16\" rx=\"2\"/><line x1=\"1\" y1=\"10\" x2=\"23\" y2=\"10\"/></svg>","options":["현금","GDC","포인트카드","상품권"],"answer":1,"explain":"GDC로 즉시 구매할 수 있습니다."},{"q":"나비마켓 판매자가 되면 영향을 받는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["나비 온도","전화번호","생년월일","아무 영향 없음"],"answer":0,"explain":"구매자 리뷰에 따라 나비 온도가 오르내리게 됩니다."}],"placeholder":false},{"tier":"advanced","title":"나비마켓 판매자의 재무제표 자동 생성","id":"ch20","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></g></svg></div>\n<h2>나비마켓 판매자의 재무제표 자동 생성</h2>\n<p>나비마켓에서 물건을 팔면, 거래 기록이 PDV에 쌓이고 이를 바탕으로 <strong>재무제표가 자동으로 작성</strong>됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 거래 기록 축적</div><div class=\"step-desc\">판매·매입 내역이 GDC 결제와 함께 자동 기록됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 재무제표 생성</div><div class=\"step-desc\">손익계산서·대차대조표·현금흐름표 세 가지가 자동으로 만들어집니다. 재판매용으로 사입한 상품은 재고자산으로 잡혔다가, 실제로 팔리는 시점에만 매출원가로 반영됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 신뢰의 근거가 됨</div><div class=\"step-desc\">이 재무제표가 <a class=\"ch-link\" href=\"#\" data-goto=\"ch21\">「재무제표 기반 신용 평가」장</a>의 기초 자료가 됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">영수증을 따로 정리해야 하나요?</div>아니요 — <a class=\"ch-link\" href=\"#\" data-goto=\"ch5\">「마이크·카메라·파일 첨부」장</a>에서 다룬 카메라로 영수증만 찍어 보내면 자동으로 반영됩니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">이 재무제표, 조작된 건 아닌지 확인할 수 있나요?</div>네 — 재무제표가 바뀔 때마다 그 내용의 해시가 Openhash(<a class=\"ch-link\" href=\"#\" data-goto=\"ch29\">「Openhash」장</a>)에 함께 기록됩니다. 대시보드 손익계산서 탭의 “지금 검증” 버튼을 누르면, 지금 보이는 숫자가 그 기록된 해시와 실제로 일치하는지 바로 확인할 수 있습니다.</div></div>\n","quiz":[{"q":"나비마켓 판매자의 재무제표는 어떻게 만들어지나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["직접 엑셀 작성","거래 기록 기반 자동 생성","세무사에게 의뢰만 가능","만들 수 없음"],"answer":1,"explain":"GDC 거래 기록을 바탕으로 AI가 자동으로 재무제표를 생성합니다."},{"q":"영수증은 어떻게 반영하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg>","options":["직접 타이핑","카메라로 촬영해 전송","우편 발송","반영 불가"],"answer":1,"explain":"7장에서 다룬 카메라 기능으로 영수증을 찍으면 자동 반영됩니다."},{"q":"이 재무제표는 어디에 쓰이나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["아무 데도 안 쓰임","신용 평가의 기초 자료","광고용","없음"],"answer":1,"explain":"다음 장인 신용 평가의 기초 자료로 활용됩니다."}],"placeholder":false},{"tier":"advanced","title":"구매자의 재무제표도 자동 생성됩니다","id":"ch_fs_buyer_symmetric","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></g></svg></div>\n<h2>구매자의 재무제표도 자동 생성됩니다</h2>\n<p><a class=\"ch-link\" href=\"#\" data-goto=\"ch20\">「나비마켓 판매자의 재무제표 자동 생성」장</a>에서는 <strong>판매자</strong>의 재무제표가 거래 기록으로 자동 생성되는 걸 봤습니다. 지금은 <strong>구매자</strong> 쪽도 똑같이 자동으로 반영됩니다 — 나비마켓에서 물건을 샀다면, 그 지출이 내 재무제표의 매입(비용) 항목에 자동으로 잡힙니다.</p>\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">모든 사업자는 팔기도, 사기도 합니다</div>재료를 사고 상품을 파는 게 정상적인 장사이듯, 나비마켓에서 활동하는 계정도 파는 쪽 기록만 있고 사는 쪽 기록이 없으면 재무제표가 반쪽짜리가 됩니다. 그래서 이제는 앞장의 PDV 거래명세서(양방향 기록)를 바탕으로, 구매·판매 양쪽 다 재무제표에 반영됩니다.</div>\n</div>\n<h3>재무제표 탭에서 확인하는 법</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 손익계산서 열기</div><div class=\"step-desc\">대시보드의 \"재무제표\" 탭에서 손익계산서를 엽니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 매입 항목 확인</div><div class=\"step-desc\">내가 구매자로서 지출한 금액이 매입 항목에 자동으로 쌓여 있습니다 — 직접 입력할 필요가 없습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><polyline points=\"9 12 11 14 15 10\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 필요하면 무결성 검증</div><div class=\"step-desc\">이 매입 내역도 ch_fsverify에서 다룬 것과 동일한 방식으로 Openhash에 기록되어, \"지금 검증\" 버튼으로 조작 여부를 확인할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\"><a class=\"ch-link\" href=\"#\" data-goto=\"ch21\">「재무제표 기반 신용 평가」장</a>의 신용 평가에도 영향을 주나요?</div>네 — 지출(매입) 내역도 재무제표의 일부라, <a class=\"ch-link\" href=\"#\" data-goto=\"ch21\">「재무제표 기반 신용 평가」장</a>에서 다룬 신용 평가에 함께 반영됩니다. 꾸준히 사고파는 활동 이력 자체가 신뢰의 근거가 됩니다.</div>\n</div>\n","quiz":[{"q":"구매자로서 물건을 사면 재무제표에 무엇이 잡히나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg>","options":["아무것도 안 잡힘","매입(비용) 항목","매출 항목","세금 항목만"],"answer":1,"explain":"구매자로서 지출한 금액은 손익계산서의 매입(비용) 항목에 자동으로 반영됩니다."},{"q":"이 매입 항목을 직접 입력해야 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["예, 매번 직접 입력","아니요, 거래 기록에서 자동 반영","세무사에게 요청해야 함","불가능함"],"answer":1,"explain":"PDV에 남은 거래 기록을 바탕으로 자동으로 재무제표에 반영되어, 직접 입력할 필요가 없습니다."},{"q":"구매자의 지출 내역이 영향을 주는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>","options":["신용 평가","나비 온도의 시작값","가입 절차","없음"],"answer":0,"explain":"지출 내역도 재무제표의 일부로 21장에서 다룬 신용 평가에 함께 반영됩니다."}],"placeholder":false},{"tier":"advanced","title":"재무제표 무결성 검증 — 조작 여부 확인하기","id":"ch_fsverify","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><polyline points=\"9 12 11 14 15 10\"/></g></svg></div><h2>재무제표 무결성 검증 — 조작 여부 확인하기</h2><p><a class=\"ch-link\" href=\"#\" data-goto=\"ch20\">「나비마켓 판매자의 재무제표 자동 생성」장</a>에서 자동 생성된 재무제표는 바뀔 때마다 그 내용의 해시(지문 같은 고유 값)가 Openhash(<a class=\"ch-link\" href=\"#\" data-goto=\"ch29\">「Openhash」장</a>)에 함께 기록됩니다. 이 장에서는 \"지금 보이는 숫자가 정말 그 기록과 일치하는가\"를 직접 확인하는 방법을 다룹니다.</p><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><polyline points=\"9 12 11 14 15 10\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 검증이 필요한가요?</div>재무제표는 <a class=\"ch-link\" href=\"#\" data-goto=\"ch21\">「재무제표 기반 신용 평가」장</a>의 신용 평가, <a class=\"ch-link\" href=\"#\" data-goto=\"ch24\">「세금 계산·납부 자동화」장</a>의 세금 계산처럼 중요한 판단의 근거가 됩니다. 그 숫자가 중간에 조작되지 않았다는 걸 스스로 확인할 수 있어야, 그 위에 쌓이는 모든 판단을 믿을 수 있습니다.</div></div><h3>대시보드에서 직접 검증하기</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 재무제표 탭 열기</div><div class=\"step-desc\">대시보드의 \"재무제표\" 탭에서 손익계산서·대차대조표·현금흐름표 중 확인하고 싶은 걸 엽니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><polyline points=\"9 12 11 14 15 10\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② \"지금 검증\" 버튼 누르기</div><div class=\"step-desc\">무결성 검증 카드의 버튼을 누르면, 지금 화면의 숫자로 해시를 다시 계산해 기록된 해시와 비교합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 결과 확인</div><div class=\"step-desc\">\"데이터↔해시 일치\", \"앵커↔머클루트 일치\" 두 가지가 모두 \"예\"로 나오면 조작되지 않았다는 뜻입니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">\"아직 앵커링 전\"이라고 나온다면?</div>재무제표가 방금 바뀌었다면, Openhash에 기록되기까지 최대 10분 정도 걸릴 수 있습니다 — 오류가 아니라 정상적인 대기 상태입니다. 잠시 후 다시 확인해 보세요.</div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">검증에 실패하면 무슨 뜻인가요?</div>데이터와 해시가 일치하지 않거나 앵커 기록을 찾을 수 없다면, 화면에 보이는 재무제표가 실제 기록과 달라졌을 수 있다는 신호입니다 — 그 재무제표를 근거로 한 신용 평가·세금 계산을 그대로 신뢰하지 말고 다시 확인해야 합니다.</div></div>","quiz":[{"q":"재무제표 무결성 검증에서 확인하는 두 가지는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><polyline points=\"9 12 11 14 15 10\"/></svg>","options":["글자 크기와 색상","데이터↔해시 일치, 앵커↔머클루트 일치","가입 날짜와 온도","닉네임과 프로필 사진"],"answer":1,"explain":"화면의 데이터로 다시 계산한 해시가 기록된 해시와 일치하는지, 그 해시가 앵커(머클루트)와도 일치하는지 두 가지를 확인합니다."},{"q":"\"아직 앵커링 전\"이라는 결과가 나오면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["데이터가 조작됨","방금 바뀐 재무제표가 기록되기까지 대기 중인 정상 상태","오류이므로 신고해야 함","계정이 잠김"],"answer":1,"explain":"Openhash 기록까지 최대 10분 정도 걸릴 수 있어, 방금 바뀐 데이터는 잠시 후 다시 확인하면 됩니다."},{"q":"검증에 실패했을 때 해야 할 일은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>","options":["무시하고 넘어간다","그 재무제표를 근거로 한 판단(신용 평가·세금 계산 등)을 다시 확인한다","앱을 재설치한다","계정을 삭제한다"],"answer":1,"explain":"검증 실패는 화면 데이터가 실제 기록과 달라졌을 수 있다는 신호이므로, 그 위에 쌓인 판단을 그대로 신뢰하면 안 됩니다."}]},{"tier":"advanced","title":"재무제표 기반 신용 평가","id":"ch21","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></g></svg></div>\n<h2>재무제표 기반 신용 평가</h2>\n<p>자동 생성된 재무제표와 나비 온도(<a class=\"ch-link\" href=\"#\" data-goto=\"ch8\">「내 프로필」장</a>)를 종합해 신용 등급이 산정됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 재무 데이터 분석</div><div class=\"step-desc\">매출 안정성, 거래 빈도, 수익성을 AI가 분석합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 나비 온도 반영</div><div class=\"step-desc\">거래 신뢰도(온도)도 신용 평가에 함께 반영됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 등급 산정</div><div class=\"step-desc\">종합 점수로 신용 등급이 매겨지고, <a class=\"ch-link\" href=\"#\" data-goto=\"ch22\">「신용 등급에 따른 채권 이자율 결정」장</a>의 채권 이자율에 영향을 줍니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">기존 은행 신용평가와 다른 점</div>서류를 따로 제출할 필요 없이, 이미 쌓인 실제 거래 데이터를 근거로 평가한다는 점이 다릅니다.</div></div>\n","quiz":[{"q":"신용 평가에 반영되는 두 가지 요소는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["재무제표와 나비 온도","나이와 성별","거주지와 취미","없음"],"answer":0,"explain":"자동 생성된 재무제표와 나비 온도가 함께 반영됩니다."},{"q":"기존 은행 신용평가와 다른 점은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>","options":["서류 제출 없이 실거래 데이터 기반 평가","더 오래 걸림","평가 안 함","동일함"],"answer":0,"explain":"실제 쌓인 거래 데이터를 근거로 자동 평가한다는 게 특징입니다."},{"q":"신용 등급은 다음 장의 무엇에 영향을 주나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>","options":["채권 이자율","나비 온도의 시작값","가입 절차","없음"],"answer":0,"explain":"신용 등급이 22장에서 다루는 채권 이자율 결정에 영향을 줍니다."}],"placeholder":false},{"tier":"advanced","title":"나비 온도와 신용 점수의 관계","id":"ch_temp_credit","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(42,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(162,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></g></svg></div><h2>나비 온도와 신용 점수의 관계</h2><p><a class=\"ch-link\" href=\"#\" data-goto=\"ch8\">「내 프로필」장</a>에서 다룬 나비 온도(36.5도에서 시작하는 거래 신뢰 지표)와, <a class=\"ch-link\" href=\"#\" data-goto=\"ch21\">「재무제표 기반 신용 평가」장</a>에서 다룬 신용 평가는 서로 다른 지표지만 실제로는 함께 맞물려 움직입니다.</p><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">온도는 \"사람들이 겪은 신뢰\", 재무제표는 \"숫자로 본 안정성\"</div>온도는 실제로 거래해본 다른 사용자들의 평가가 쌓인 결과이고, 재무제표는 매출·매입 같은 객관적 숫자입니다. 신용 평가는 이 둘을 함께 봐서, 숫자만으로는 안 보이는 \"이 판매자를 실제로 믿을 만한가\"까지 반영합니다.</div></div><h3>온도가 신용에 반영되는 흐름</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 거래·리뷰로 온도 변화</div><div class=\"step-desc\"><a class=\"ch-link\" href=\"#\" data-goto=\"ch19\">「나비마켓」장</a>의 나비마켓에서 거래하고 리뷰를 주고받을 때마다 온도가 오르내립니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 재무제표와 함께 종합</div><div class=\"step-desc\"><a class=\"ch-link\" href=\"#\" data-goto=\"ch21\">「재무제표 기반 신용 평가」장</a>에서 다뤘듯, 이 온도가 재무제표 분석 결과와 함께 신용 등급 산정에 들어갑니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 등급이 이자율로 이어짐</div><div class=\"step-desc\"><a class=\"ch-link\" href=\"#\" data-goto=\"ch22\">「신용 등급에 따른 채권 이자율 결정」장</a>에서 다룬 채권 이자율까지 최종적으로 영향을 받습니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">재무제표는 좋은데 온도가 낮다면?</div>매출은 꾸준해도 거래 후기가 나쁘면 신용 등급이 숫자만으로 매겨질 때보다 낮게 나올 수 있습니다 — 숫자와 평판 중 한쪽만 좋아서는 최고 등급을 받기 어려운 구조입니다.</div></div>","quiz":[{"q":"나비 온도와 재무제표가 신용 평가에서 각각 나타내는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["둘 다 같은 것을 나타냄","온도는 사람들의 평판, 재무제표는 숫자로 본 안정성","온도는 나이, 재무제표는 성별","관련 없음"],"answer":1,"explain":"온도는 실제 거래 경험이 쌓인 평판 지표, 재무제표는 매출·매입 같은 객관적 숫자 지표입니다."},{"q":"온도가 낮은데 매출이 꾸준하다면 신용 등급은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["항상 최고 등급","숫자만 봤을 때보다 낮게 나올 수 있음","항상 최저 등급","영향 없음"],"answer":1,"explain":"신용 평가는 온도와 재무제표를 함께 반영하므로, 평판이 나쁘면 매출이 좋아도 등급이 낮아질 수 있습니다."},{"q":"신용 등급이 최종적으로 영향을 주는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg>","options":["채권 이자율","가입 절차","닉네임 표시 색상","알림 빈도"],"answer":0,"explain":"22장에서 다뤘듯, 신용 등급은 채권을 발행할 때의 이자율에까지 영향을 줍니다."}]},{"tier":"advanced","title":"신용 등급에 따른 채권 이자율 결정","id":"ch22","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></g></svg></div>\n<h2>신용 등급에 따른 채권 이자율 결정</h2>\n<p>신용 등급이 높을수록 낮은 이자율로 자금을 조달할 수 있습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 등급별 기준 금리</div><div class=\"step-desc\">신용 등급 구간마다 기본 이자율이 정해집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 개별 조정</div><div class=\"step-desc\">거래 이력의 일관성·성장세에 따라 미세 조정됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 채권 발행</div><div class=\"step-desc\">확정된 이자율로 채권을 발행해 자금을 조달할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 신용이 높으면 이자가 낮나요?</div>신용이 높다는 것은 상환 가능성이 높다는 뜻이라, 대출자·투자자 입장에서 위험이 낮아 낮은 이자로도 자금을 빌려줄 수 있기 때문입니다.</div></div>\n","quiz":[{"q":"신용 등급이 높으면 이자율은 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>","options":["더 높아짐","더 낮아짐","무관함","0이 됨"],"answer":1,"explain":"신용이 높을수록 상환 위험이 낮다고 판단되어 이자율이 낮아집니다."},{"q":"이자율에 영향을 주는 추가 요소는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["거래 이력의 일관성·성장세","가입 날짜","닉네임 길이","프로필 사진"],"answer":0,"explain":"기본 등급 금리에 더해 개별 거래 이력의 일관성 등이 미세 조정 요소가 됩니다."},{"q":"확정된 이자율로 할 수 있는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg>","options":["채권 발행","가입 취소","온도 초기화","관련 없음"],"answer":0,"explain":"확정된 이자율로 채권을 발행해 자금을 조달할 수 있습니다."}],"placeholder":false},{"tier":"advanced","title":"GDC 채권 발행과 투자 — 지역에서 글로벌까지 위험 분산","id":"ch_bondpool","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></g></svg></div><h2>GDC 채권 발행과 투자 — 지역에서 글로벌까지 위험 분산</h2><p><a class=\"ch-link\" href=\"#\" data-goto=\"ch22\">「신용 등급에 따른 채권 이자율 결정」장</a>에서 정해진 이자율로 실제로 채권을 발행하거나, 다른 사람의 채권에 투자하는 흐름을 <strong>체험판(시뮬레이션)으로 미리 볼 수 있습니다.</strong> 내 GDC 예치금이 다른 사용자의 채권이 되는 원리를 보여줍니다.</p><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">아직 실제로 동작하지 않는 개념 시연입니다</div>이 기능은 라이선스 컨소시엄 이전이 완료되기 전까지는 실제 자금이 오가지 않는 시뮬레이션입니다. 재무제표 기반 신용평가·분산 검증 등은 특허 출원 문서에 설계된 개념을 바탕으로 미리 보여드리는 것이며, 실제 투자·발행은 아직 할 수 없습니다.</div></div><h3>채권 POOL로 위험을 나눕니다</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 개별 채권 대신 POOL 선택</div><div class=\"step-desc\">한 명의 채권에 몰아 투자하는 대신, 여러 발행자를 묶은 POOL에 투자해 한 명이 부도나도 영향을 줄일 수 있습니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z\"/><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"18\"/><line x1=\"16\" y1=\"6\" x2=\"16\" y2=\"22\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 지역 범위로 위험 분산 정도 확인</div><div class=\"step-desc\">한림읍 POOL(발행자 18명, 위험 매우 높음)부터 글로벌 POOL(발행자 230만 명, 위험 최소)까지, 범위가 넓어질수록 위험이 줄고 이자율은 낮아집니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 위험과 이자율의 맞교환 확인</div><div class=\"step-desc\">위험이 낮은 POOL일수록 이자율도 낮습니다 — 더 큰 수익을 원한다면 더 좁은 지역, 더 높은 위험을 감수해야 합니다.</div></div></div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 POOL 단위로 나뉘나요?</div>한 명에게 문제가 생겨도 나머지 발행자들이 있으면 전체 손실이 줄어듭니다. 범위가 좁을수록(한림읍) 지역 경기에 함께 흔들리고, 범위가 넓을수록(글로벌) 서로 다른 경기 흐름이 상쇄돼 위험이 크게 줄어듭니다.</div></div>","quiz":[{"q":"이 채권 POOL 투자 기능은 지금 실제로 자금이 오가나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["예, 실제 투자가 즉시 이뤄짐","아니요, 라이선스 컨소시엄 이전 전까지는 개념 시연(시뮬레이션)","실제 계좌 이체가 필요함","현금으로만 가능함"],"answer":1,"explain":"이 기능은 아직 라이선스 컨소시엄 이전 전이라 실제로 동작하지 않으며, 개념을 미리 보여주는 시뮬레이션입니다."},{"q":"POOL의 범위가 넓어질수록(예: 한림읍 → 글로벌) 위험은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg>","options":["더 커진다","더 작아진다","변화 없다","알 수 없다"],"answer":1,"explain":"범위가 넓어질수록 서로 다른 지역의 경기 사이클이 상쇄돼 개별 발행자의 부도 위험이 크게 줄어듭니다."},{"q":"위험이 낮은 POOL일수록 이자율은 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["더 높아진다","더 낮아진다","항상 동일하다","이자가 없다"],"answer":1,"explain":"위험과 이자율은 맞교환 관계라, 위험이 낮은 POOL일수록 이자율도 낮게 형성됩니다."}]},{"tier":"advanced","title":"예금과 대출의 전자동화","id":"ch23","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></g></svg></div>\n<h2>예금과 대출의 전자동화</h2>\n<p>신용 평가와 채권 이자율 체계를 기반으로, 예금·대출까지 자동으로 처리됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① GDC 예치</div><div class=\"step-desc\">여유 자금을 예치하면 정해진 이자를 받습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 대출 신청</div><div class=\"step-desc\">필요 자금을 신청하면 <a class=\"ch-link\" href=\"#\" data-goto=\"ch22\">「신용 등급에 따른 채권 이자율 결정」장</a>에서 정해진 내 신용 등급의 이자율이 자동 적용됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 자동 상환 관리</div><div class=\"step-desc\">상환 일정과 이자 계산이 자동으로 관리됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">서류 심사가 필요한가요?</div>별도 서류 제출 없이, 이미 쌓인 재무제표와 신용 등급으로 즉시 처리됩니다 — 다만 큰 금액은 추가 확인이 있을 수 있습니다.</div></div>\n","quiz":[{"q":"대출 시 적용되는 이자율은 어떻게 정해지나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>","options":["무작위","내 신용 등급에 따라 자동 적용","협상으로만 결정","고정 이자율만 존재"],"answer":1,"explain":"22장에서 정해진 신용 등급별 이자율이 자동으로 적용됩니다."},{"q":"예금을 하면 무엇을 받나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg>","options":["아무것도 없음","정해진 이자","할인 쿠폰","GDC 차감"],"answer":1,"explain":"예치한 GDC에 대해 정해진 이자를 받습니다."},{"q":"대출 심사에 별도 서류 제출이 필요한가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg>","options":["항상 필요","기본적으로 불필요(큰 금액은 예외 가능)","불가능함","매번 은행 방문 필요"],"answer":1,"explain":"이미 쌓인 재무제표와 신용 등급으로 즉시 처리되며, 큰 금액은 추가 확인이 있을 수 있습니다."}],"placeholder":false},{"tier":"advanced","title":"세금 계산·납부 자동화 — 국세청 API 연동","id":"ch24","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></g></svg></div>\n<h2>세금 계산·납부 자동화 — 국세청 API 연동</h2>\n<p><a class=\"ch-link\" href=\"#\" data-goto=\"ch20\">「나비마켓 판매자의 재무제표 자동 생성」장</a>의 재무제표가 국세청 API와 연동되어, 세금 계산과 납부까지 자동으로 처리됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 매출·매입 정리</div><div class=\"step-desc\">자동 생성된 재무제표에서 과세 대상 항목을 정리합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 국세청 API 연동</div><div class=\"step-desc\">정리된 데이터를 국세청 API로 전송해 세액을 계산합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 자동 납부</div><div class=\"step-desc\">계산된 세금을 기한 내 GDC(또는 연동 계좌)로 자동 납부합니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">신고 실수 걱정은?</div>자동 연동이라 수기 입력 실수가 줄어들지만, 최종 신고 전 내용을 한 번 확인하는 걸 권장합니다.</div></div>\n","quiz":[{"q":"세금 계산의 바탕이 되는 자료는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg>","options":["즉흥적인 추정","자동 생성된 재무제표","타인의 신고서","없음"],"answer":1,"explain":"20장에서 자동 생성된 재무제표를 바탕으로 세액을 계산합니다."},{"q":"세액 계산은 어떤 기관 API와 연동되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg>","options":["국세청","기상청","경찰청","교육청"],"answer":0,"explain":"국세청 API와 연동해 정확한 세액을 계산합니다."},{"q":"자동화되어도 권장되는 습관은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg>","options":["아무것도 확인 안 해도 됨","최종 신고 전 한 번 확인","매일 재확인","세무사 없이는 불가능"],"answer":1,"explain":"자동화로 실수는 줄지만, 최종 신고 전 확인을 권장합니다."}],"placeholder":false},{"tier":"advanced","title":"세무사 보조 AI와 경정청구 자동 실행","id":"ch_taxadvisor","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"2.2\" fill=\"none\"><polyline points=\"20 6 9 17 4 12\"/></g></svg></div>\n<h2>세무사 보조 AI와 경정청구 자동 실행</h2>\n<p><a class=\"ch-link\" href=\"#\" data-goto=\"ch20\">「나비마켓 판매자의 재무제표 자동 생성」장</a>에서 자동으로 만들어진 재무제표를 세무사 AI가 그대로 넘겨받아 절세 전략을 대화로 함께 찾아 주고, 조건이 맞으면 <strong>경정청구까지 자동으로 실행</strong>할 수 있습니다.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\"><a class=\"ch-link\" href=\"#\" data-goto=\"ch24\">「세금 계산·납부 자동화」장</a>의 \"세금 자동화\"와 뭐가 다른가요?</div><a class=\"ch-link\" href=\"#\" data-goto=\"ch24\">「세금 계산·납부 자동화」장</a>은 정기 신고(종합소득세 등)를 계산·납부하는 절차였습니다. 이 장은 그와 별개로, <strong>세무사 보조 AI와 대화하며 절세 전략을 찾고</strong>, 지난 신고에서 놓친 게 있으면 <strong>경정청구</strong>(이미 낸 세금을 돌려받는 절차)를 진행하는 기능입니다.</div>\n</div>\n\n<h3>대시보드 \"세무\" 탭 사용법</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① \"세무\" 탭 열기</div><div class=\"step-desc\">대시보드 사이드 메뉴에서 \"세무\"를 누릅니다. \"재무제표\" 탭의 데이터가 자동으로 함께 실립니다 — 매출·매입을 다시 입력할 필요가 없습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 세무사 보조 AI와 대화 시작</div><div class=\"step-desc\">\"상담 시작\" 버튼을 누르면 <a class=\"ch-link\" href=\"#\" data-goto=\"ch16\">「전문가 페르소나 호출하기」장</a>에서 다룬 전문가 페르소나 화면이 열리는데, 이번엔 처음부터 내 재무제표를 알고 있는 상태로 대화가 시작됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 경정청구 후보 확인</div><div class=\"step-desc\">재무제표를 훑어 \"이 부분은 경정청구 대상일 수 있습니다\" 같은 후보를 자동으로 보여줍니다 — 다만 이건 1차 스크리닝일 뿐, 최종 판단은 대화와 세무사의 확인에서 이뤄집니다.</div></div></div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">경정청구를 \"자동 실행\"하려면 4가지 조건이 모두 맞아야 합니다</div>① <a class=\"ch-link\" href=\"#\" data-goto=\"ch9\">「설정 페이지 사용법」장</a> 설정 페이지에서 \"세무 자동 집행 위임(G8-TAX)\"을 직접 켜야 합니다 — 기본값은 꺼짐입니다. ② 세무사 AI가 매긴 확신도가 가장 높은 단계(🟢)여야 합니다. ③ 경정청구 제척기간(보통 5년) 안이어야 합니다. ④ 실제 제출 시스템이 연결돼 있어야 합니다. 넷 중 하나라도 안 맞으면 자동 실행 대신 초안만 보여줍니다.</div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">지금 당장 경정청구가 자동 제출되나요?</div>아니요 — 국세청에는 경정청구를 앱이 대신 제출할 수 있는 공식 창구가 아직 없습니다. 위 4가지 조건을 다 만족해도, 지금은 \"제출 준비가 다 됐다\"는 완성된 초안까지만 드리고, 실제 제출 경로가 연결되는 대로 자동 제출로 전환됩니다 — 아직 안 되는 걸 된다고 하지 않습니다.</div>\n</div>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">세무조정계산서 작성이나 기장대리도 자동 실행되나요?</div>아니요 — 그런 업무는 세무사법상 최종 확인이 반드시 등록 세무사 본인을 거쳐야 해서, 처음부터 \"초안까지만\" 제공하도록 설계돼 있습니다. 자동 실행 대상은 홈택스 조회와 경정청구, 이 두 가지뿐입니다.</div>\n</div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">세무사 보조 AI의 위치</div>이 AI는 세무사의 업무를 대신하지 않고, 신고서·경정청구서 같은 서류 작업을 돕습니다. 세무사 직역 페이지에는 수백 종의 서류 목록이 있으며, 최종 확인은 등록 세무사가 합니다.</div></div>","quiz":[{"q":"경정청구 자동 실행의 4가지 조건에 포함되지 않는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg>","options":["G8-TAX 위임이 켜져 있을 것","확신도가 가장 높은 단계일 것","사용자의 신용 등급이 특급일 것","경정청구 제척기간 이내일 것"],"answer":2,"explain":"네 조건은 위임 켜짐(G8-TAX)·확신도 최고 단계(🟢)·제척기간 이내·제출 시스템 연결입니다 — 신용 등급은 조건에 포함되지 않습니다."},{"q":"세무 탭에서 대화를 시작하면 무엇이 자동으로 전달되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg>","options":["아무것도 전달되지 않음","재무제표 탭의 데이터","타인의 세금 정보","은행 계좌 비밀번호"],"answer":1,"explain":"재무제표 탭 데이터가 자동으로 세무사 AI에게 전달돼, 매출·매입을 다시 입력할 필요가 없습니다."},{"q":"지금 경정청구 실제 제출이 자동으로 되지 않는 이유는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["기능을 아직 안 만들어서","국세청에 앱이 대신 제출할 공식 창구가 아직 없어서","사용자가 원하지 않아서","비용이 너무 비싸서"],"answer":1,"explain":"4가지 조건을 다 만족해도, 국세청 쪽에 실제 제출을 대신할 공식 경로가 아직 연결되지 않아 지금은 완성된 초안까지만 제공합니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"advanced","title":"글로벌 나비마켓","id":"ch25","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:380px;display:block;margin:0 auto\">\n<circle cx=\"80\" cy=\"70\" r=\"40\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"200\" cy=\"50\" r=\"30\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2\"/>\n<circle cx=\"320\" cy=\"80\" r=\"35\" fill=\"#fef7e0\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<line x1=\"118\" y1=\"65\" x2=\"172\" y2=\"55\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n<line x1=\"228\" y1=\"60\" x2=\"288\" y2=\"75\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n</svg></div>\n<h2>글로벌 나비마켓</h2>\n<p><a class=\"ch-link\" href=\"#\" data-goto=\"ch19\">「나비마켓」장</a>의 나비마켓은 국내에 머물지 않습니다 — 전 세계 사용자와 AI 도구를 사고팔 수 있습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 글로벌 카탈로그</div><div class=\"step-desc\">국가·언어 구분 없이 전 세계 판매자의 AI 도구를 한 곳에서 검색합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 자동 번역·통화 환산</div><div class=\"step-desc\">설명과 가격이 내 언어·통화 기준으로 자동 변환되어 표시됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 신뢰는 그대로 적용</div><div class=\"step-desc\">국경을 넘어도 <a class=\"ch-link\" href=\"#\" data-goto=\"ch8\">「내 프로필」장</a>의 나비 온도 시스템이 동일하게 적용됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">환전 수수료는 어떻게 되나요?</div>다음 장(<a class=\"ch-link\" href=\"#\" data-goto=\"ch26\">「수수료 없는 글로벌 디지털 통화 GDC」장</a>)에서 다루는 수수료 없는 GDC 환전 방식이 여기에도 그대로 적용됩니다.</div></div>\n","quiz":[{"q":"글로벌 나비마켓의 특징은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["국내 전용","전 세계 사용자와 거래 가능","한국어만 지원","불가능함"],"answer":1,"explain":"국경 없이 전 세계 사용자와 AI 도구를 사고팔 수 있습니다."},{"q":"가격 표시는 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg>","options":["항상 달러로만 표시","내 언어·통화 기준으로 자동 변환","변환 안 됨","수동 계산 필요"],"answer":1,"explain":"설명과 가격이 자동으로 내 언어·통화 기준으로 변환되어 표시됩니다."},{"q":"국경을 넘어도 동일하게 적용되는 신뢰 지표는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["나비 온도","전화번호","국적","없음"],"answer":0,"explain":"10장에서 다룬 나비 온도 시스템이 글로벌 거래에도 동일하게 적용됩니다."}],"placeholder":false},{"tier":"advanced","title":"수수료 없는 글로벌 디지털 통화 GDC — 환전과 송금","id":"ch26","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></g></svg></div>\n<h2>수수료 없는 글로벌 디지털 통화 GDC — 환전과 송금</h2>\n<p>GDC는 나비 생태계 안에서 국경을 넘나드는 <strong>수수료 없는</strong> 디지털 통화 역할을 합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 환전 없이 그대로 사용</div><div class=\"step-desc\">다른 나라 사용자와 거래해도 GDC 자체는 환전할 필요 없이 그대로 쓰입니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 즉시 송금</div><div class=\"step-desc\">국경 간 송금도 은행을 거치지 않고 즉시 처리됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 수수료 0원</div><div class=\"step-desc\">기존 국제송금에서 발생하던 환전·송금 수수료가 없습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 수수료가 없나요?</div>GDC는 나비 생태계 안에서 통용되는 자체 디지털 통화라, 은행 간 환전·중개 수수료 구조 자체가 필요 없기 때문입니다.</div></div>\n","quiz":[{"q":"GDC로 해외 사용자와 거래할 때 환전이 필요한가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg>","options":["필요함","필요 없음, 그대로 사용","현금으로만 가능","불가능함"],"answer":1,"explain":"GDC는 환전 없이 그대로 국경 간 거래에 쓰일 수 있습니다."},{"q":"GDC 국제 송금의 특징은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg>","options":["은행을 거쳐야 함","은행 없이 즉시 처리","며칠씩 걸림","불가능함"],"answer":1,"explain":"은행을 거치지 않고 즉시 송금이 처리됩니다."},{"q":"기존 국제송금 대비 GDC의 장점은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>","options":["더 비싼 수수료","수수료 없음","더 느림","환율 변동 위험 증가"],"answer":1,"explain":"환전·송금 수수료가 없다는 게 핵심 장점입니다."}],"placeholder":false},{"tier":"advanced","title":"나만의 SP 맞춤 수정하기 — 개인·기관·부서","id":"ch27","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 120 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:120px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"4\" r=\"2\"/><circle cx=\"6\" cy=\"14\" r=\"2\"/><circle cx=\"18\" cy=\"14\" r=\"2\"/><circle cx=\"6\" cy=\"21\" r=\"1.5\"/><circle cx=\"18\" cy=\"21\" r=\"1.5\"/><path d=\"M12 6v3M12 9l-6 5M12 9l6 5M6 16v3M18 16v3\"/></g></svg></div>\n<h2>나만의 SP 맞춤 수정하기 — 개인·기관·부서</h2>\n<p>SP(System Prompt, AI 비서의 기본 지침)를 내 필요에 맞게 직접 수정할 수 있습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 개인용 맞춤</div><div class=\"step-desc\">말투, 우선순위, 자주 쓰는 표현 등을 개인 SP에 반영합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"1\"/><line x1=\"9\" y1=\"8\" x2=\"9\" y2=\"8\"/><line x1=\"15\" y1=\"8\" x2=\"15\" y2=\"8\"/><line x1=\"9\" y1=\"13\" x2=\"9\" y2=\"13\"/><line x1=\"15\" y1=\"13\" x2=\"15\" y2=\"13\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 기관용 맞춤</div><div class=\"step-desc\">회사·단체 전체가 공유하는 규칙(응대 매뉴얼 등)을 기관 SP에 반영합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"4\" r=\"2\"/><circle cx=\"6\" cy=\"14\" r=\"2\"/><circle cx=\"18\" cy=\"14\" r=\"2\"/><circle cx=\"6\" cy=\"21\" r=\"1.5\"/><circle cx=\"18\" cy=\"21\" r=\"1.5\"/><path d=\"M12 6v3M12 9l-6 5M12 9l6 5M6 16v3M18 16v3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 부서용 맞춤</div><div class=\"step-desc\">기관 SP를 기반으로 부서별 세부 규칙을 상속받아 추가할 수 있습니다 — 나무처럼 계층 구조입니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"4\" r=\"2\"/><circle cx=\"6\" cy=\"14\" r=\"2\"/><circle cx=\"18\" cy=\"14\" r=\"2\"/><circle cx=\"6\" cy=\"21\" r=\"1.5\"/><circle cx=\"18\" cy=\"21\" r=\"1.5\"/><path d=\"M12 6v3M12 9l-6 5M12 9l6 5M6 16v3M18 16v3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">기관 전체에 적용하려면?</div>정부 기관·부서 단위의 대규모 적용은 별도의 로드맵 문서(기관 AI 비서 로드맵)를 참고하시면 더 자세히 알 수 있습니다.</div></div>\n","quiz":[{"q":"SP는 무엇의 줄임말인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"16 18 22 12 16 6\"/><polyline points=\"8 6 2 12 8 18\"/></svg>","options":["Special Password","System Prompt","Service Provider","Smart Personal"],"answer":1,"explain":"SP는 System Prompt, AI 비서의 기본 지침을 뜻합니다."},{"q":"SP를 계층적으로 상속할 수 있는 구조는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"4\" r=\"2\"/><circle cx=\"6\" cy=\"14\" r=\"2\"/><circle cx=\"18\" cy=\"14\" r=\"2\"/><circle cx=\"6\" cy=\"21\" r=\"1.5\"/><circle cx=\"18\" cy=\"21\" r=\"1.5\"/><path d=\"M12 6v3M12 9l-6 5M12 9l6 5M6 16v3M18 16v3\"/></svg>","options":["개인→기관→부서","부서→개인만","불가능함","무작위"],"answer":0,"explain":"기관 SP를 기반으로 부서별 세부 규칙을 상속받는 나무 구조입니다."},{"q":"개인 SP에 반영할 수 있는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></svg>","options":["말투와 우선순위","타인의 개인정보","불가능함","고정불변"],"answer":0,"explain":"말투, 우선순위, 자주 쓰는 표현 등을 개인 SP에 맞출 수 있습니다."}],"placeholder":false},{"tier":"advanced","title":"나만의 API 키 연결하기(BYOK)","id":"ch28","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><polyline points=\"16 18 22 12 16 6\"/><polyline points=\"8 6 2 12 8 18\"/></g></svg></div>\n<h2>나만의 API 키 연결하기(BYOK)</h2>\n<p>비용을 직접 관리하고 싶다면, 내 OpenRouter API 키를 발급받아 나비에 연결할 수 있습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① API 키 발급</div><div class=\"step-desc\">OpenRouter 등에서 본인 명의의 API 키를 발급받습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 설정에 등록</div><div class=\"step-desc\"><a class=\"ch-link\" href=\"#\" data-goto=\"ch9\">「설정 페이지 사용법」장</a>의 설정 페이지에서 발급받은 키를 등록합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 사용량 직접 관리</div><div class=\"step-desc\">이후 AI 사용량과 비용을 내 키 기준으로 직접 확인·관리합니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">누구에게 필요한 기능인가요?</div>일반 사용자는 필요 없습니다 — 대량으로 AI를 쓰거나 비용을 세밀하게 관리하고 싶은 고급 사용자를 위한 선택 기능입니다.</div></div>\n","quiz":[{"q":"BYOK는 무엇을 의미하나요?","icon":
