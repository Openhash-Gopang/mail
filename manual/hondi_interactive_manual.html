cap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 등급이 이자율로 이어짐</div><div class=\"step-desc\">22장에서 다룬 채권 이자율까지 최종적으로 영향을 받습니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">재무제표는 좋은데 온도가 낮다면?</div>매출은 꾸준해도 거래 후기가 나쁘면 신용 등급이 숫자만으로 매겨질 때보다 낮게 나올 수 있습니다 — 숫자와 평판 중 한쪽만 좋아서는 최고 등급을 받기 어려운 구조입니다.</div></div>","quiz":[{"q":"나비 온도와 재무제표가 신용 평가에서 각각 나타내는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["둘 다 같은 것을 나타냄","온도는 사람들의 평판, 재무제표는 숫자로 본 안정성","온도는 나이, 재무제표는 성별","관련 없음"],"answer":1,"explain":"온도는 실제 거래 경험이 쌓인 평판 지표, 재무제표는 매출·매입 같은 객관적 숫자 지표입니다."},{"q":"온도가 낮은데 매출이 꾸준하다면 신용 등급은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["항상 최고 등급","숫자만 봤을 때보다 낮게 나올 수 있음","항상 최저 등급","영향 없음"],"answer":1,"explain":"신용 평가는 온도와 재무제표를 함께 반영하므로, 평판이 나쁘면 매출이 좋아도 등급이 낮아질 수 있습니다."},{"q":"신용 등급이 최종적으로 영향을 주는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg>","options":["채권 이자율","가입 절차","닉네임 표시 색상","알림 빈도"],"answer":0,"explain":"22장에서 다뤘듯, 신용 등급은 채권을 발행할 때의 이자율에까지 영향을 줍니다."}]},{"tier":"advanced","title":"신용 등급에 따른 채권 이자율 결정","id":"ch22","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></g></svg></div>\n<h2>신용 등급에 따른 채권 이자율 결정</h2>\n<p>신용 등급이 높을수록 낮은 이자율로 자금을 조달할 수 있습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 등급별 기준 금리</div><div class=\"step-desc\">신용 등급 구간마다 기본 이자율이 정해집니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 개별 조정</div><div class=\"step-desc\">거래 이력의 일관성·성장세에 따라 미세 조정됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 채권 발행</div><div class=\"step-desc\">확정된 이자율로 채권을 발행해 자금을 조달할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 신용이 높으면 이자가 낮나요?</div>신용이 높다는 것은 상환 가능성이 높다는 뜻이라, 대출자·투자자 입장에서 위험이 낮아 낮은 이자로도 자금을 빌려줄 수 있기 때문입니다.</div></div>\n","quiz":[{"q":"신용 등급이 높으면 이자율은 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>","options":["더 높아짐","더 낮아짐","무관함","0이 됨"],"answer":1,"explain":"신용이 높을수록 상환 위험이 낮다고 판단되어 이자율이 낮아집니다."},{"q":"이자율에 영향을 주는 추가 요소는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["거래 이력의 일관성·성장세","가입 날짜","닉네임 길이","프로필 사진"],"answer":0,"explain":"기본 등급 금리에 더해 개별 거래 이력의 일관성 등이 미세 조정 요소가 됩니다."},{"q":"확정된 이자율로 할 수 있는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg>","options":["채권 발행","가입 취소","온도 초기화","관련 없음"],"answer":0,"explain":"확정된 이자율로 채권을 발행해 자금을 조달할 수 있습니다."}],"placeholder":false},{"tier":"advanced","title":"GDC 채권 발행과 투자 — 지역에서 글로벌까지 위험 분산","id":"ch_bondpool","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></g></svg></div><h2>GDC 채권 발행과 투자 — 지역에서 글로벌까지 위험 분산</h2><p>22장에서 정해진 이자율로 실제로 채권을 발행하거나, 다른 사람의 채권에 투자하는 흐름을 <strong>체험판(시뮬레이션)으로 미리 볼 수 있습니다.</strong> 내 GDC 예치금이 다른 사용자의 채권이 되는 원리를 보여줍니다.</p><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">아직 실제로 동작하지 않는 개념 시연입니다</div>이 기능은 라이선스 컨소시엄 이전이 완료되기 전까지는 실제 자금이 오가지 않는 시뮬레이션입니다. 재무제표 기반 신용평가·분산 검증 등은 특허 출원 문서에 설계된 개념을 바탕으로 미리 보여드리는 것이며, 실제 투자·발행은 아직 할 수 없습니다.</div></div><h3>채권 POOL로 위험을 나눕니다</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 개별 채권 대신 POOL 선택</div><div class=\"step-desc\">한 명의 채권에 몰아 투자하는 대신, 여러 발행자를 묶은 POOL에 투자해 한 명이 부도나도 영향을 줄일 수 있습니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z\"/><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"18\"/><line x1=\"16\" y1=\"6\" x2=\"16\" y2=\"22\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 지역 범위로 위험 분산 정도 확인</div><div class=\"step-desc\">한림읍 POOL(발행자 18명, 위험 매우 높음)부터 글로벌 POOL(발행자 230만 명, 위험 최소)까지, 범위가 넓어질수록 위험이 줄고 이자율은 낮아집니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 위험과 이자율의 맞교환 확인</div><div class=\"step-desc\">위험이 낮은 POOL일수록 이자율도 낮습니다 — 더 큰 수익을 원한다면 더 좁은 지역, 더 높은 위험을 감수해야 합니다.</div></div></div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 POOL 단위로 나뉘나요?</div>한 명에게 문제가 생겨도 나머지 발행자들이 있으면 전체 손실이 줄어듭니다. 범위가 좁을수록(한림읍) 지역 경기에 함께 흔들리고, 범위가 넓을수록(글로벌) 서로 다른 경기 흐름이 상쇄돼 위험이 크게 줄어듭니다.</div></div>","quiz":[{"q":"이 채권 POOL 투자 기능은 지금 실제로 자금이 오가나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["예, 실제 투자가 즉시 이뤄짐","아니요, 라이선스 컨소시엄 이전 전까지는 개념 시연(시뮬레이션)","실제 계좌 이체가 필요함","현금으로만 가능함"],"answer":1,"explain":"이 기능은 아직 라이선스 컨소시엄 이전 전이라 실제로 동작하지 않으며, 개념을 미리 보여주는 시뮬레이션입니다."},{"q":"POOL의 범위가 넓어질수록(예: 한림읍 → 글로벌) 위험은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg>","options":["더 커진다","더 작아진다","변화 없다","알 수 없다"],"answer":1,"explain":"범위가 넓어질수록 서로 다른 지역의 경기 사이클이 상쇄돼 개별 발행자의 부도 위험이 크게 줄어듭니다."},{"q":"위험이 낮은 POOL일수록 이자율은 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["더 높아진다","더 낮아진다","항상 동일하다","이자가 없다"],"answer":1,"explain":"위험과 이자율은 맞교환 관계라, 위험이 낮은 POOL일수록 이자율도 낮게 형성됩니다."}]},{"tier":"advanced","title":"예금과 대출의 전자동화","id":"ch23","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></g></svg></div>\n<h2>예금과 대출의 전자동화</h2>\n<p>신용 평가와 채권 이자율 체계를 기반으로, 예금·대출까지 자동으로 처리됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① GDC 예치</div><div class=\"step-desc\">여유 자금을 예치하면 정해진 이자를 받습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 대출 신청</div><div class=\"step-desc\">필요 자금을 신청하면 22장에서 정해진 내 신용 등급의 이자율이 자동 적용됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 자동 상환 관리</div><div class=\"step-desc\">상환 일정과 이자 계산이 자동으로 관리됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">서류 심사가 필요한가요?</div>별도 서류 제출 없이, 이미 쌓인 재무제표와 신용 등급으로 즉시 처리됩니다 — 다만 큰 금액은 추가 확인이 있을 수 있습니다.</div></div>\n","quiz":[{"q":"대출 시 적용되는 이자율은 어떻게 정해지나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>","options":["무작위","내 신용 등급에 따라 자동 적용","협상으로만 결정","고정 이자율만 존재"],"answer":1,"explain":"22장에서 정해진 신용 등급별 이자율이 자동으로 적용됩니다."},{"q":"예금을 하면 무엇을 받나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4z\"/></svg>","options":["아무것도 없음","정해진 이자","할인 쿠폰","GDC 차감"],"answer":1,"explain":"예치한 GDC에 대해 정해진 이자를 받습니다."},{"q":"대출 심사에 별도 서류 제출이 필요한가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/></svg>","options":["항상 필요","기본적으로 불필요(큰 금액은 예외 가능)","불가능함","매번 은행 방문 필요"],"answer":1,"explain":"이미 쌓인 재무제표와 신용 등급으로 즉시 처리되며, 큰 금액은 추가 확인이 있을 수 있습니다."}],"placeholder":false},{"tier":"advanced","title":"세금 계산·납부 자동화 — 국세청 API 연동","id":"ch24","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></g></svg></div>\n<h2>세금 계산·납부 자동화 — 국세청 API 연동</h2>\n<p>20장의 재무제표가 국세청 API와 연동되어, 세금 계산과 납부까지 자동으로 처리됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 매출·매입 정리</div><div class=\"step-desc\">자동 생성된 재무제표에서 과세 대상 항목을 정리합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 국세청 API 연동</div><div class=\"step-desc\">정리된 데이터를 국세청 API로 전송해 세액을 계산합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 자동 납부</div><div class=\"step-desc\">계산된 세금을 기한 내 GDC(또는 연동 계좌)로 자동 납부합니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">신고 실수 걱정은?</div>자동 연동이라 수기 입력 실수가 줄어들지만, 최종 신고 전 내용을 한 번 확인하는 걸 권장합니다.</div></div>\n","quiz":[{"q":"세금 계산의 바탕이 되는 자료는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg>","options":["즉흥적인 추정","자동 생성된 재무제표","타인의 신고서","없음"],"answer":1,"explain":"20장에서 자동 생성된 재무제표를 바탕으로 세액을 계산합니다."},{"q":"세액 계산은 어떤 기관 API와 연동되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg>","options":["국세청","기상청","경찰청","교육청"],"answer":0,"explain":"국세청 API와 연동해 정확한 세액을 계산합니다."},{"q":"자동화되어도 권장되는 습관은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg>","options":["아무것도 확인 안 해도 됨","최종 신고 전 한 번 확인","매일 재확인","세무사 없이는 불가능"],"answer":1,"explain":"자동화로 실수는 줄지만, 최종 신고 전 확인을 권장합니다."}],"placeholder":false},{"tier":"advanced","title":"세무사 보조 AI와 경정청구 자동 실행","id":"ch_taxadvisor","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"2.2\" fill=\"none\"><polyline points=\"20 6 9 17 4 12\"/></g></svg></div>\n<h2>세무사 보조 AI와 경정청구 자동 실행</h2>\n<p>20장에서 자동으로 만들어진 재무제표를 세무사 AI가 그대로 넘겨받아 절세 전략을 대화로 함께 찾아 주고, 조건이 맞으면 <strong>경정청구까지 자동으로 실행</strong>할 수 있습니다.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">24장의 \"세금 자동화\"와 뭐가 다른가요?</div>24장은 정기 신고(종합소득세 등)를 계산·납부하는 절차였습니다. 이 장은 그와 별개로, <strong>세무사 보조 AI와 대화하며 절세 전략을 찾고</strong>, 지난 신고에서 놓친 게 있으면 <strong>경정청구</strong>(이미 낸 세금을 돌려받는 절차)를 진행하는 기능입니다.</div>\n</div>\n\n<h3>대시보드 \"세무\" 탭 사용법</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① \"세무\" 탭 열기</div><div class=\"step-desc\">대시보드 사이드 메뉴에서 \"세무\"를 누릅니다. \"재무제표\" 탭의 데이터가 자동으로 함께 실립니다 — 매출·매입을 다시 입력할 필요가 없습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 세무사 보조 AI와 대화 시작</div><div class=\"step-desc\">\"상담 시작\" 버튼을 누르면 17장에서 다룬 전문가 페르소나 화면이 열리는데, 이번엔 처음부터 내 재무제표를 알고 있는 상태로 대화가 시작됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 경정청구 후보 확인</div><div class=\"step-desc\">재무제표를 훑어 \"이 부분은 경정청구 대상일 수 있습니다\" 같은 후보를 자동으로 보여줍니다 — 다만 이건 1차 스크리닝일 뿐, 최종 판단은 대화와 세무사의 확인에서 이뤄집니다.</div></div></div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">경정청구를 \"자동 실행\"하려면 4가지 조건이 모두 맞아야 합니다</div>① 11장 설정 페이지에서 \"세무 자동 집행 위임(G8-TAX)\"을 직접 켜야 합니다 — 기본값은 꺼짐입니다. ② 세무사 AI가 매긴 확신도가 가장 높은 단계(🟢)여야 합니다. ③ 경정청구 제척기간(보통 5년) 안이어야 합니다. ④ 실제 제출 시스템이 연결돼 있어야 합니다. 넷 중 하나라도 안 맞으면 자동 실행 대신 초안만 보여줍니다.</div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">지금 당장 경정청구가 자동 제출되나요?</div>아니요 — 국세청에는 경정청구를 앱이 대신 제출할 수 있는 공식 창구가 아직 없습니다. 위 4가지 조건을 다 만족해도, 지금은 \"제출 준비가 다 됐다\"는 완성된 초안까지만 드리고, 실제 제출 경로가 연결되는 대로 자동 제출로 전환됩니다 — 아직 안 되는 걸 된다고 하지 않습니다.</div>\n</div>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">세무조정계산서 작성이나 기장대리도 자동 실행되나요?</div>아니요 — 그런 업무는 세무사법상 최종 확인이 반드시 등록 세무사 본인을 거쳐야 해서, 처음부터 \"초안까지만\" 제공하도록 설계돼 있습니다. 자동 실행 대상은 홈택스 조회와 경정청구, 이 두 가지뿐입니다.</div>\n</div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">세무사 보조 AI의 위치</div>이 AI는 세무사의 업무를 대신하지 않고, 신고서·경정청구서 같은 서류 작업을 돕습니다. 세무사 직역 페이지에는 수백 종의 서류 목록이 있으며, 최종 확인은 등록 세무사가 합니다.</div></div>","quiz":[{"q":"경정청구 자동 실행의 4가지 조건에 포함되지 않는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg>","options":["G8-TAX 위임이 켜져 있을 것","확신도가 가장 높은 단계일 것","사용자의 신용 등급이 특급일 것","경정청구 제척기간 이내일 것"],"answer":2,"explain":"네 조건은 위임 켜짐(G8-TAX)·확신도 최고 단계(🟢)·제척기간 이내·제출 시스템 연결입니다 — 신용 등급은 조건에 포함되지 않습니다."},{"q":"세무 탭에서 대화를 시작하면 무엇이 자동으로 전달되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg>","options":["아무것도 전달되지 않음","재무제표 탭의 데이터","타인의 세금 정보","은행 계좌 비밀번호"],"answer":1,"explain":"재무제표 탭 데이터가 자동으로 세무사 AI에게 전달돼, 매출·매입을 다시 입력할 필요가 없습니다."},{"q":"지금 경정청구 실제 제출이 자동으로 되지 않는 이유는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["기능을 아직 안 만들어서","국세청에 앱이 대신 제출할 공식 창구가 아직 없어서","사용자가 원하지 않아서","비용이 너무 비싸서"],"answer":1,"explain":"4가지 조건을 다 만족해도, 국세청 쪽에 실제 제출을 대신할 공식 경로가 아직 연결되지 않아 지금은 완성된 초안까지만 제공합니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"advanced","title":"글로벌 나비마켓","id":"ch25","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:380px;display:block;margin:0 auto\">\n<circle cx=\"80\" cy=\"70\" r=\"40\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"200\" cy=\"50\" r=\"30\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2\"/>\n<circle cx=\"320\" cy=\"80\" r=\"35\" fill=\"#fef7e0\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<line x1=\"118\" y1=\"65\" x2=\"172\" y2=\"55\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n<line x1=\"228\" y1=\"60\" x2=\"288\" y2=\"75\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n</svg></div>\n<h2>글로벌 나비마켓</h2>\n<p>20장의 나비마켓은 국내에 머물지 않습니다 — 전 세계 사용자와 AI 도구를 사고팔 수 있습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 글로벌 카탈로그</div><div class=\"step-desc\">국가·언어 구분 없이 전 세계 판매자의 AI 도구를 한 곳에서 검색합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 자동 번역·통화 환산</div><div class=\"step-desc\">설명과 가격이 내 언어·통화 기준으로 자동 변환되어 표시됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 신뢰는 그대로 적용</div><div class=\"step-desc\">국경을 넘어도 10장의 나비 온도 시스템이 동일하게 적용됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">환전 수수료는 어떻게 되나요?</div>다음 장(26장)에서 다루는 수수료 없는 GDC 환전 방식이 여기에도 그대로 적용됩니다.</div></div>\n","quiz":[{"q":"글로벌 나비마켓의 특징은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["국내 전용","전 세계 사용자와 거래 가능","한국어만 지원","불가능함"],"answer":1,"explain":"국경 없이 전 세계 사용자와 AI 도구를 사고팔 수 있습니다."},{"q":"가격 표시는 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg>","options":["항상 달러로만 표시","내 언어·통화 기준으로 자동 변환","변환 안 됨","수동 계산 필요"],"answer":1,"explain":"설명과 가격이 자동으로 내 언어·통화 기준으로 변환되어 표시됩니다."},{"q":"국경을 넘어도 동일하게 적용되는 신뢰 지표는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["나비 온도","전화번호","국적","없음"],"answer":0,"explain":"10장에서 다룬 나비 온도 시스템이 글로벌 거래에도 동일하게 적용됩니다."}],"placeholder":false},{"tier":"advanced","title":"수수료 없는 글로벌 디지털 통화 GDC — 환전과 송금","id":"ch26","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></g></svg></div>\n<h2>수수료 없는 글로벌 디지털 통화 GDC — 환전과 송금</h2>\n<p>GDC는 나비 생태계 안에서 국경을 넘나드는 <strong>수수료 없는</strong> 디지털 통화 역할을 합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 환전 없이 그대로 사용</div><div class=\"step-desc\">다른 나라 사용자와 거래해도 GDC 자체는 환전할 필요 없이 그대로 쓰입니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 즉시 송금</div><div class=\"step-desc\">국경 간 송금도 은행을 거치지 않고 즉시 처리됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 수수료 0원</div><div class=\"step-desc\">기존 국제송금에서 발생하던 환전·송금 수수료가 없습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 수수료가 없나요?</div>GDC는 나비 생태계 안에서 통용되는 자체 디지털 통화라, 은행 간 환전·중개 수수료 구조 자체가 필요 없기 때문입니다.</div></div>\n","quiz":[{"q":"GDC로 해외 사용자와 거래할 때 환전이 필요한가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg>","options":["필요함","필요 없음, 그대로 사용","현금으로만 가능","불가능함"],"answer":1,"explain":"GDC는 환전 없이 그대로 국경 간 거래에 쓰일 수 있습니다."},{"q":"GDC 국제 송금의 특징은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg>","options":["은행을 거쳐야 함","은행 없이 즉시 처리","며칠씩 걸림","불가능함"],"answer":1,"explain":"은행을 거치지 않고 즉시 송금이 처리됩니다."},{"q":"기존 국제송금 대비 GDC의 장점은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>","options":["더 비싼 수수료","수수료 없음","더 느림","환율 변동 위험 증가"],"answer":1,"explain":"환전·송금 수수료가 없다는 게 핵심 장점입니다."}],"placeholder":false},{"tier":"advanced","title":"나만의 SP 맞춤 수정하기 — 개인·기관·부서","id":"ch27","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 120 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:120px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"4\" r=\"2\"/><circle cx=\"6\" cy=\"14\" r=\"2\"/><circle cx=\"18\" cy=\"14\" r=\"2\"/><circle cx=\"6\" cy=\"21\" r=\"1.5\"/><circle cx=\"18\" cy=\"21\" r=\"1.5\"/><path d=\"M12 6v3M12 9l-6 5M12 9l6 5M6 16v3M18 16v3\"/></g></svg></div>\n<h2>나만의 SP 맞춤 수정하기 — 개인·기관·부서</h2>\n<p>SP(System Prompt, AI 비서의 기본 지침)를 내 필요에 맞게 직접 수정할 수 있습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 개인용 맞춤</div><div class=\"step-desc\">말투, 우선순위, 자주 쓰는 표현 등을 개인 SP에 반영합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"1\"/><line x1=\"9\" y1=\"8\" x2=\"9\" y2=\"8\"/><line x1=\"15\" y1=\"8\" x2=\"15\" y2=\"8\"/><line x1=\"9\" y1=\"13\" x2=\"9\" y2=\"13\"/><line x1=\"15\" y1=\"13\" x2=\"15\" y2=\"13\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 기관용 맞춤</div><div class=\"step-desc\">회사·단체 전체가 공유하는 규칙(응대 매뉴얼 등)을 기관 SP에 반영합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"4\" r=\"2\"/><circle cx=\"6\" cy=\"14\" r=\"2\"/><circle cx=\"18\" cy=\"14\" r=\"2\"/><circle cx=\"6\" cy=\"21\" r=\"1.5\"/><circle cx=\"18\" cy=\"21\" r=\"1.5\"/><path d=\"M12 6v3M12 9l-6 5M12 9l6 5M6 16v3M18 16v3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 부서용 맞춤</div><div class=\"step-desc\">기관 SP를 기반으로 부서별 세부 규칙을 상속받아 추가할 수 있습니다 — 나무처럼 계층 구조입니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"4\" r=\"2\"/><circle cx=\"6\" cy=\"14\" r=\"2\"/><circle cx=\"18\" cy=\"14\" r=\"2\"/><circle cx=\"6\" cy=\"21\" r=\"1.5\"/><circle cx=\"18\" cy=\"21\" r=\"1.5\"/><path d=\"M12 6v3M12 9l-6 5M12 9l6 5M6 16v3M18 16v3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">기관 전체에 적용하려면?</div>정부 기관·부서 단위의 대규모 적용은 별도의 로드맵 문서(기관 AI 비서 로드맵)를 참고하시면 더 자세히 알 수 있습니다.</div></div>\n","quiz":[{"q":"SP는 무엇의 줄임말인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"16 18 22 12 16 6\"/><polyline points=\"8 6 2 12 8 18\"/></svg>","options":["Special Password","System Prompt","Service Provider","Smart Personal"],"answer":1,"explain":"SP는 System Prompt, AI 비서의 기본 지침을 뜻합니다."},{"q":"SP를 계층적으로 상속할 수 있는 구조는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"4\" r=\"2\"/><circle cx=\"6\" cy=\"14\" r=\"2\"/><circle cx=\"18\" cy=\"14\" r=\"2\"/><circle cx=\"6\" cy=\"21\" r=\"1.5\"/><circle cx=\"18\" cy=\"21\" r=\"1.5\"/><path d=\"M12 6v3M12 9l-6 5M12 9l6 5M6 16v3M18 16v3\"/></svg>","options":["개인→기관→부서","부서→개인만","불가능함","무작위"],"answer":0,"explain":"기관 SP를 기반으로 부서별 세부 규칙을 상속받는 나무 구조입니다."},{"q":"개인 SP에 반영할 수 있는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"/></svg>","options":["말투와 우선순위","타인의 개인정보","불가능함","고정불변"],"answer":0,"explain":"말투, 우선순위, 자주 쓰는 표현 등을 개인 SP에 맞출 수 있습니다."}],"placeholder":false},{"tier":"advanced","title":"나만의 API 키 연결하기(BYOK)","id":"ch28","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><polyline points=\"16 18 22 12 16 6\"/><polyline points=\"8 6 2 12 8 18\"/></g></svg></div>\n<h2>나만의 API 키 연결하기(BYOK)</h2>\n<p>비용을 직접 관리하고 싶다면, 내 OpenRouter API 키를 발급받아 나비에 연결할 수 있습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① API 키 발급</div><div class=\"step-desc\">OpenRouter 등에서 본인 명의의 API 키를 발급받습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 설정에 등록</div><div class=\"step-desc\">11장의 설정 페이지에서 발급받은 키를 등록합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 사용량 직접 관리</div><div class=\"step-desc\">이후 AI 사용량과 비용을 내 키 기준으로 직접 확인·관리합니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">누구에게 필요한 기능인가요?</div>일반 사용자는 필요 없습니다 — 대량으로 AI를 쓰거나 비용을 세밀하게 관리하고 싶은 고급 사용자를 위한 선택 기능입니다.</div></div>\n","quiz":[{"q":"BYOK는 무엇을 의미하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>","options":["Bring Your Own Key(내 API 키 사용)","필수 가입 절차","나비 온도 계산법","무료 체험 기간"],"answer":0,"explain":"BYOK는 본인 명의의 API 키를 직접 연결해 쓰는 기능입니다."},{"q":"API 키는 어디에 등록하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/></svg>","options":["설정 페이지","고객센터 전화","이메일 전송","등록 불필요"],"answer":0,"explain":"11장에서 다룬 설정 페이지에서 API 키를 등록합니다."},{"q":"이 기능이 필요한 사용자는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["모든 사용자 필수","비용을 세밀히 관리하려는 고급 사용자","신규 가입자만","불필요한 기능"],"answer":1,"explain":"일반 사용자는 필요 없고, 대량 사용·세밀한 비용 관리를 원하는 고급 사용자를 위한 선택 기능입니다."}],"placeholder":false},{"tier":"advanced","title":"Openhash — 서버 없는 인증","id":"ch29","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\">\n<circle cx=\"90\" cy=\"50\" r=\"9\" fill=\"#0c6cc3\"/><circle cx=\"200\" cy=\"30\" r=\"9\" fill=\"#0c6cc3\"/><circle cx=\"310\" cy=\"55\" r=\"9\" fill=\"#0c6cc3\"/>\n<circle cx=\"130\" cy=\"110\" r=\"9\" fill=\"#0c6cc3\"/><circle cx=\"260\" cy=\"115\" r=\"9\" fill=\"#0c6cc3\"/><circle cx=\"200\" cy=\"85\" r=\"9\" fill=\"#188038\"/>\n<line x1=\"90\" y1=\"50\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<line x1=\"200\" y1=\"30\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<line x1=\"310\" y1=\"55\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<line x1=\"130\" y1=\"110\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n<line x1=\"260\" y1=\"115\" x2=\"200\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n</svg></div>\n<h2>Openhash — 서버 없는 인증</h2>\n<p>주민등록증이나 운전면허증처럼 위변조를 원천 차단하는 기술이 Openhash입니다. 특정 중앙 서버 하나에 의존하지 않고 데이터 무결성을 보장합니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 분산 기록</div><div class=\"step-desc\">기록이 하나의 서버가 아니라 여러 지점에 분산 저장됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 위변조 방지</div><div class=\"step-desc\">한 곳의 기록만 몰래 바꿔서는 전체 무결성을 속일 수 없는 구조입니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 신뢰의 기반</div><div class=\"step-desc\">이 덕분에 PDV(13장) 기록과 재무제표(20장)를 믿고 쓸 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">블록체인과 같은 건가요?</div>비슷한 \"분산·위변조 방지\" 철학을 공유하지만, 나비의 Openhash는 나비 생태계 안의 데이터 무결성 보장에 특화되어 있습니다.</div></div>\n","quiz":[{"q":"Openhash의 핵심 목적은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>","options":["속도 향상","데이터 위변조 방지","디자인 개선","광고 차단"],"answer":1,"explain":"주민등록증처럼 위변조를 원천 차단하는 신뢰 인프라입니다."},{"q":"Openhash는 어떻게 위변조를 막나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg>","options":["한 서버에 강력한 암호를 걸어서","여러 지점에 분산 기록해서","기록을 아예 안 남겨서","비밀번호로"],"answer":1,"explain":"하나의 중앙 서버가 아니라 여러 지점에 분산 기록해 한 곳만 조작해서는 무결성을 속일 수 없습니다."},{"q":"Openhash가 신뢰의 기반이 되는 예로 언급된 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>","options":["PDV 기록과 재무제표","날씨 예보","게임 점수","광고 노출수"],"answer":0,"explain":"PDV 기록과 재무제표의 신뢰성이 Openhash 위에서 보장됩니다."}],"placeholder":false},{"tier":"advanced","title":"K-Law 판결 예측 — 성능 평가 페이지 읽는 법","id":"ch_klawverdict","quiz":[{"q":"이 장의 수치를 어떻게 다뤄야 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["어디에나 인용해도 된다","자체 실험이며 제3자 검증이 없으므로 인용·이용하지 않는다","법원에 제출한다","광고에 쓴다"],"answer":1,"explain":"자체 실험 결과이며 제3자 검증을 거치지 않았습니다."},{"q":"성능 평가 시험의 방식으로 맞는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["익명화한 사건을 같은 지시문으로 여러 LLM에 입력해 실제 판결과 비교","변호사가 직접 판결","LLM마다 다른 지시문","웹 검색을 허용해 정답을 찾게 함"],"answer":0,"explain":"같은 지시문(웹 검색 금지)으로 입력해 실제 판결과 비교합니다."},{"q":"Agon은 무엇인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["K-Law와 같은 이름","원심 결과 은닉·공방·모범 판결문 채점을 쓰는 별도 방법론 체계","결제 수단","새 로고"],"answer":1,"explain":"K-Law와는 별개의 방법론 체계입니다."}],"body":"<h2>K-Law 판결 예측 — 성능 평가 페이지 읽는 법</h2><div class=\"md-container tonal-error\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">먼저 알아 둘 점</div>이 장의 모든 수치는 <strong>자체 실험 결과</strong>이며 제3자 검증을 거치지 않았고 일부는 초안입니다. 어떠한 용도로도 인용하거나 이용하지 마세요. 판결 예측은 법적 판단이나 자문이 아니며, 인간 전문가의 확인이 필요합니다.</div></div><h3>이름이 바뀐 이유</h3><p>예전의 \"가상 판결문\"은 실제 판결문 형식을 흉내 냈습니다. 지금은 <strong>\"판결 예측\"</strong>이라는 이름의 서술형 리포트로 바뀌었습니다. 주 이용자는 인간 변호사이고, 변호사가 AI의 1차 분석을 바탕으로 일하는 협업을 전제로 합니다.</p><h3>성능 평가 페이지는 이렇게 시험합니다</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 사건 준비</div><div class=\"step-desc\">최신 대법원 판례를 완전히 익명화해 사건 개요로 만듭니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 같은 지시문으로 입력</div><div class=\"step-desc\">대형 LLM과 중소형 오픈소스 LLM에 같은 지시문(웹 검색 금지)으로 넣습니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 실제 판결과 비교</div><div class=\"step-desc\">결론과 법리가 실제 판결과 얼마나 맞는지 채점합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">④ K-Law 적용 전후 비교</div><div class=\"step-desc\">K-Law를 적용했을 때 점수가 얼마나 오르는지 대형·중소형 그룹별로 봅니다.</div></div></div></div><h3>수치를 읽는 법</h3><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">일치도</div>대법원 공개 판례 300건으로 한 자체 시험에서 최초 평가 평균은 <strong>7.44/10(약 74%)</strong>이었습니다. 1·2심의 40~45%라는 수치는 대법원 공개 판례에 한정한 경향이며, 1·2심 판결 전반의 일치도는 훨씬 높습니다. 시험은 AI에게 불리한 조건(A4 1쪽 사건 개요, 웹 검색 차단)에서 했습니다.</div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">Agon</div>Agon은 원심 결과를 숨기고, 원고·피고 공방을 거치며, 모범 판결문으로 채점하는 별도의 방법론 체계입니다. K-Law(v15.x)와는 별개의 경로로 진행하며, 공개는 2027년 상반기로 예정되어 있습니다(변경될 수 있습니다).</div></div>","updated":"2026-10-24"},{"tier":"advanced","title":"MoTE란 무엇인가","id":"ch30","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:340px;display:block;margin:0 auto\">\n<rect x=\"30\" y=\"20\" width=\"140\" height=\"100\" rx=\"8\" fill=\"#fef7e0\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"40\" x2=\"150\" y2=\"40\" stroke=\"#b06000\" stroke-width=\"2\"/><line x1=\"50\" y1=\"55\" x2=\"150\" y2=\"55\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"70\" x2=\"150\" y2=\"70\" stroke=\"#b06000\" stroke-width=\"2\"/><line x1=\"50\" y1=\"85\" x2=\"120\" y2=\"85\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<text x=\"100\" y=\"112\" text-anchor=\"middle\" font-size=\"10\" fill=\"#b06000\">A4 약 50페이지</text>\n<line x1=\"185\" y1=\"70\" x2=\"230\" y2=\"70\" stroke=\"#94a3b8\" stroke-width=\"2\" marker-end=\"url(#a30)\"/>\n<defs><marker id=\"a30\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#94a3b8\"/></marker></defs>\n<circle cx=\"300\" cy=\"70\" r=\"45\" fill=\"#e6f4ea\" stroke=\"#188038\" stroke-width=\"2.5\"/>\n<text x=\"300\" y=\"65\" text-anchor=\"middle\" font-size=\"11\" fill=\"#188038\" font-weight=\"700\">MoTE</text>\n<text x=\"300\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#188038\">비용 절감</text>\n</svg></div>\n<h2>MoTE란 무엇인가</h2>\n<p>K-Law가 법률 분석을 하려면 헌법·법률·판례 지침을 미리 읽혀둬야 하며, 그 분량은 A4 용지로 약 50페이지에 달합니다. <strong>MoTE는 이 비용을 구조적으로 줄이는 기술</strong>입니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">문제: 매번 다시 읽기</div><div class=\"step-desc\">AI가 질문마다 50페이지 분량의 참고자료를 새로 읽으면 비용과 에너지가 많이 듭니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">해결: MoTE</div><div class=\"step-desc\">핵심 지침을 효율적으로 재사용해 매번 처음부터 다시 읽지 않도록 구조화합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">효과: 이용료·에너지 절감</div><div class=\"step-desc\">이 절감분이 5장·17장·18장에서 다룬 K-서비스·전문가 페르소나 이용료를 낮추는 데 기여합니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 중요한가요?</div>MoTE 같은 구조적 효율화가 없다면 전문 지식이 필요한 AI 서비스의 비용이 훨씬 비싸질 수밖에 없습니다.</div></div>\n","quiz":[{"q":"MoTE가 해결하려는 문제는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/></svg>","options":["느린 인터넷 속도","매번 방대한 참고자료를 새로 읽어야 하는 비용 문제","디자인 문제","가입 절차 문제"],"answer":1,"explain":"K-Law 같은 서비스가 매번 A4 약 50페이지를 다시 읽어야 하는 비용 문제를 구조적으로 줄입니다."},{"q":"MoTE의 효과는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg>","options":["속도만 빨라짐","이용료·에너지 절감","기능이 줄어듦","보안 강화만"],"answer":1,"explain":"구조적으로 비용과 에너지를 절감시켜 이용료를 낮추는 데 기여합니다."},{"q":"MoTE의 절감 효과가 영향을 주는 서비스는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["K-서비스·전문가 페르소나 이용료","나비 온도","가입 절차","없음"],"answer":0,"explain":"절감된 비용이 K-서비스·전문가 페르소나 이용료를 낮추는 데 반영됩니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"advanced","title":"정부 없이 여권 발급이 가능할까?","id":"ch31","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;display:block;margin:0 auto\">\n<circle cx=\"200\" cy=\"80\" r=\"60\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<line x1=\"140\" y1=\"80\" x2=\"260\" y2=\"80\" stroke=\"#0c6cc3\" stroke-width=\"1.5\"/>\n<path d=\"M200 20a60 90 0 0 1 0 120\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"1.5\"/>\n<path d=\"M200 20a60 90 0 0 0 0 120\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"1.5\"/>\n<circle cx=\"200\" cy=\"80\" r=\"18\" fill=\"#fef7e0\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<text x=\"200\" y=\"86\" text-anchor=\"middle\" font-size=\"18\" fill=\"#b06000\" font-weight=\"700\">?</text>\n</svg></div>\n<h2>정부 없이 여권 발급이 가능할까?</h2>\n<p>여권은 전통적으로 국가만이 발급해왔습니다. 하지만 신원 확인·기록 관리를 기술로 대체할 수 있다면 어떨까요?</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">신원 확인의 핵심</div><div class=\"step-desc\">여권의 본질은 \"이 사람이 실제로 이 사람이다\"를 증명하는 것 — 나비의 가입·인증 구조(1장)와 원리가 같습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">신뢰 인프라</div><div class=\"step-desc\">Openhash(29장) 같은 위변조 방지 기술이 국가 발급 없이도 신뢰를 담보할 잠재력을 보여줍니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">현실적 한계</div><div class=\"step-desc\">다만 국경 통과·법적 효력은 각국 정부의 상호 인정이 필요해, 기술만으로 완전히 대체하긴 어렵습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">그래서 결론은?</div>기술적으로는 신원 증명이 가능하지만, 실제 여권 대체는 국제적 합의가 필요한 영역입니다 — 32장에서 나비가 이 문제에 접근하는 방식을 다룹니다.</div></div>\n","quiz":[{"q":"여권의 본질적 기능은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>","options":["예쁜 디자인","신원 증명","사진 보관","여행 기록"],"answer":1,"explain":"여권의 핵심은 '이 사람이 실제로 이 사람이다'를 증명하는 신원 확인 기능입니다."},{"q":"나비의 어떤 기술이 신원 증명의 신뢰 기반이 될 수 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg>","options":["Openhash","GDC","나비마켓","전문가 페르소나"],"answer":0,"explain":"위변조 방지 기술인 Openhash가 신뢰의 기반이 될 잠재력을 보여줍니다."},{"q":"기술만으로 여권을 완전히 대체하기 어려운 이유는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"21\"/><line x1=\"5\" y1=\"21\" x2=\"5\" y2=\"10\"/><line x1=\"19\" y1=\"21\" x2=\"19\" y2=\"10\"/><polygon points=\"12 3 21 8 3 8 12 3\"/><line x1=\"9\" y1=\"21\" x2=\"9\" y2=\"10\"/><line x1=\"15\" y1=\"21\" x2=\"15\" y2=\"10\"/></svg>","options":["기술이 부족해서","국경 통과 등에는 각국 정부의 상호 인정이 필요해서","비용이 너무 비싸서","보안이 약해서"],"answer":1,"explain":"법적 효력과 국경 통과는 국제적 합의가 필요한 영역이기 때문입니다."}],"placeholder":false},{"tier":"advanced","title":"나비로 구현하는 글로벌 전자 여권","id":"ch32","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:340px;display:block;margin:0 auto\">\n<rect x=\"130\" y=\"20\" width=\"140\" height=\"100\" rx=\"8\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n<circle cx=\"200\" cy=\"55\" r=\"16\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<line x1=\"150\" y1=\"90\" x2=\"250\" y2=\"90\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"70\" cy=\"70\" r=\"10\" fill=\"#188038\"/><circle cx=\"330\" cy=\"70\" r=\"10\" fill=\"#188038\"/><circle cx=\"200\" cy=\"140\" r=\"10\" fill=\"#188038\"/>\n<line x1=\"130\" y1=\"70\" x2=\"80\" y2=\"70\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n<line x1=\"270\" y1=\"70\" x2=\"320\" y2=\"70\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n<line x1=\"200\" y1=\"120\" x2=\"200\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n</svg></div>\n<h2>나비로 구현하는 글로벌 전자 여권</h2>\n<p>31장에서 살펴본 개념을 실제로 구현하면, 나비 계정 하나로 전 세계 어디서든 신원을 증명할 수 있는 형태가 됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"2\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><line x1=\"8\" y1=\"17\" x2=\"16\" y2=\"17\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 나비 신원 = 전자 여권의 기초</div><div class=\"step-desc\">1장의 지갑 기반 신원이 여권 역할의 출발점이 됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② Openhash로 위변조 방지</div><div class=\"step-desc\">29장의 분산 인증 기술이 여권 정보의 신뢰성을 보장합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 국가 간 상호 인정 확대</div><div class=\"step-desc\">각국 정부·기관이 나비 신원을 인정하는 범위가 넓어질수록 실제 여권처럼 쓰일 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"2\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><line x1=\"8\" y1=\"17\" x2=\"16\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">지금 당장 여권을 대체하나요?</div>아직은 아닙니다 — 이는 나비가 지향하는 방향이며, 각국의 제도적 인정이 함께 진행되어야 완성됩니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">전체 장을 완주하셨다면</div>축하합니다! 초급·중급·고급 전체 장을 모두 마치면 GDC 10,000T와 나비 온도 상승이 함께 반영됩니다.</div></div>\n","quiz":[{"q":"나비 전자 여권 구상의 출발점은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"2\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><line x1=\"8\" y1=\"17\" x2=\"16\" y2=\"17\"/></svg>","options":["지갑 기반 신원(1장)","나비마켓 거래","GDC 잔액","닉네임"],"answer":0,"explain":"1장에서 다룬 지갑 기반 신원이 전자 여권 구상의 기초가 됩니다."},{"q":"여권 정보의 신뢰성을 보장하는 기술은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"/><circle cx=\"5\" cy=\"19\" r=\"2.5\"/><circle cx=\"19\" cy=\"19\" r=\"2.5\"/><line x1=\"12\" y1=\"7.5\" x2=\"6\" y2=\"17\"/><line x1=\"12\" y1=\"7.5\" x2=\"18\" y2=\"17\"/><line x1=\"7\" y1=\"19\" x2=\"17\" y2=\"19\"/></svg>","options":["Openhash","마이크 기능","숫자 코드","나비마켓"],"answer":0,"explain":"29장에서 다룬 Openhash의 분산 인증 기술이 신뢰성을 보장합니다."},{"q":"나비 전자 여권이 실제 여권처럼 쓰이려면 무엇이 필요한가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg>","options":["아무것도 필요 없음, 이미 완성됨","각국 정부·기관의 상호 인정 확대","앱 재설치","광고 시청"],"answer":1,"explain":"국가 간 상호 인정이 확대되어야 실제 여권처럼 통용될 수 있습니다."}],"placeholder":false},{"tier":"advanced","title":"보안 설정 직접 조정하기 — 문턱값과 유예","id":"ch33","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/></g></svg></div>\n<h2>보안 설정 직접 조정하기 — 문턱값과 유예</h2>\n<p>9장(폰-PC 연동)의 지문 확인, 16장(GDC 사용)의 결제 문턱값처럼, 나비는 지문 인증을 기본적으로 넓게 적용합니다. 다만 이 기준을 사용자가 직접 조정할 수 있고, <strong>조정 방향에 따라 처리 방식이 다릅니다.</strong></p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">조정할 수 있는 3가지</div>\n  ① GDC 개인 간 송금 시 지문을 요구하는 금액(기본 10만 원) ② K-서비스 결제 시 지문을 요구하는 금액(기본 1만 원, 16장 참고) ③ 다른 기기 로그인 승인 시 지문 필수 여부(기본 켜짐, 9장 참고). 모두 설정 페이지(11장)에서 조정합니다.</div>\n</div>\n\n<h3>보안을 높이는 쪽 vs 낮추는 쪽</h3>\n<div class=\"step-list\">\n  <div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">낮은 금액으로, 지문 켜짐으로 — 즉시 적용</div><div class=\"step-desc\">문턱값을 낮추거나(더 자주 지문 요구) 지문 필수를 다시 켜는 건 보호를 강화하는 방향이라, 지갑 서명만으로 바로 반영됩니다.</div></div></div>\n  <div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">높은 금액으로, 지문 꺼짐으로 — 24시간 뒤 적용</div><div class=\"step-desc\">문턱값을 올리거나 지문 필수를 끄는 건 보호를 낮추는 방향입니다. 그 자리에서 지문 확인을 한 번 거친 뒤에도, 바로 적용되지 않고 <strong>24시간 뒤부터 적용</strong>됩니다.</div></div></div>\n  <div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">그 사이 다른 기기로 알림</div><div class=\"step-desc\">완화가 예약되면 등록된 다른 기기에도 알림이 갑니다. 본인이 요청한 게 아니라면, 적용되기 전까지 언제든 설정 화면에서 취소할 수 있습니다.</div></div></div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">왜 완화만 24시간이 걸리나요?</div>\n  누군가 잠깐이라도 내 폰을 손에 넣으면, 즉시 보안을 낮춰놓고 돌려줄 위험이 있습니다 — 그러면 원래 주인은 눈치도 못 챈 채 보호가 약해진 상태로 계속 지내게 됩니다. 강화는 그런 위험이 없어서 즉시 반영해도 안전하지만, 완화는 \"진짜 내가 원해서 낮추는 건지\" 확인할 시간이 필요합니다.</div>\n</div>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">지문을 못 쓰는 기기라면?</div>\n  지문·Face ID 센서가 없는 기기는 이 조정 자체를 켤 수 없습니다 — 대신 기본값(넓은 지문 적용)이 계속 유지됩니다. 지원 기기로 한 번이라도 로그인하면 그 계정 전체의 설정을 조정할 수 있습니다.</div>\n</div>","quiz":[{"q":"문턱값을 낮추는 것과 올리는 것 중, 즉시 적용되는 쪽은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg>","options":["낮추는 쪽(강화)","올리는 쪽(완화)","둘 다 즉시 적용","둘 다 24시간 걸림"],"answer":0,"explain":"보호를 강화하는 방향(문턱값을 낮추거나 지문을 다시 켜는 것)은 지갑 서명만으로 바로 반영됩니다."},{"q":"보호를 낮추는 조정을 하면 어떤 일이 함께 일어나나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></svg>","options":["아무 일도 없음","지문 확인 후 24시간 유예 + 다른 기기로 알림","즉시 계정이 잠김","자동으로 취소됨"],"answer":1,"explain":"지문 확인을 거친 뒤에도 24시간 뒤에야 적용되고, 그 사이 다른 등록 기기에 알림이 갑니다 — 본인이 요청한 게 아니면 취소할 수 있습니다."},{"q":"완화에 유예 시간을 두는 이유는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["시스템 속도 문제","폰을 잠깐 손에 넣은 사람이 몰래 보안을 낮춰버리는 걸 막기 위해","법적 의무라서","이유 없음"],"answer":1,"explain":"즉시 완화되면, 폰을 잠깐이라도 손에 넣은 사람이 보호 수준을 낮춰놓고 돌려줘도 원래 주인이 알아챌 수 없습니다. 유예 시간과 알림이 이걸 막습니다."}],"placeholder":false},{"tier":"beginner","title":"K-Mail 첫걸음 — 말 한마디로 메일 보내기","id":"ch_kmail_basic","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"></path><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"></path><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"></line></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"></path><polyline points=\"22 6 12 13 2 6\"></polyline></g></svg></div>\n<h2>K-Mail 첫걸음 — 말 한마디로 메일 보내기</h2>\n<p>나비 가입자는 누구나 자신만의 메일 주소(<code>&lt;내 GUID&gt;@hondi.kr</code>)를 자동으로 갖습니다. 이메일 앱을 따로 켤 필요 없이, 내 AI 비서에게 말하는 것만으로 메일을 보낼 수 있습니다.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"></path><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"></path><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"></line></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">가장 쉬운 사용법</div>\"OOO한테 회의 시간 물어보는 메일 보내줘\"처럼 말하면, K-Mail이 제목과 본문을 알아서 채워 보여줍니다. 7장에서 다룬 마이크 버튼으로 말해도 똑같이 동작합니다.</div>\n</div>\n\n<h3>세 단계면 끝입니다</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"></path><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"></path><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"></line></svg></div><div class=\"step-body\"><div class=\"step-title\">① 누구에게, 무슨 내용인지 말하기</div><div class=\"step-desc\">받는 사람의 이메일 주소나 이름, 그리고 어떤 내용을 보내고 싶은지 자연어로 말합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0
