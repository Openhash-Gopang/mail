<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나비 사용자 매뉴얼 — 배우면서 GDC 받기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
:root, :host {
  /* ── Material 3 톤 컬러 ── */
  --primary: #0c6cc3; --on-primary: #ffffff;
  --primary-container: #d3e4ff; --on-primary-container: #001c38;
  --secondary-container: #ffe9b3; --on-secondary-container: #4a3800;
  --tertiary-container: #d7f0dd; --on-tertiary-container: #003916;
  --error-container: #fce8e6; --on-error-container: #7a0000;
  --surface: #ffffff; --surface-container: #f3f3f8; --surface-container-high: #ececf4;
  --on-surface: #1b1c1f; --on-surface-variant: #47464f;
  --outline: #c9c7d0; --outline-variant: #e3e1ea;
  --navy: #0e1c3f;

  /* M3 elevation */
  --el-1: 0 1px 2px rgba(15,23,42,0.06), 0 1px 3px 1px rgba(15,23,42,0.08);
  --el-2: 0 1px 2px rgba(15,23,42,0.08), 0 2px 6px 2px rgba(15,23,42,0.10);
  --el-3: 0 1px 3px rgba(15,23,42,0.10), 0 4px 10px 2px rgba(15,23,42,0.10);
  --el-4: 0 2px 3px rgba(15,23,42,0.12), 0 6px 14px 4px rgba(15,23,42,0.12);
  --radius: 12px; --radius-sm: 8px; --radius-full: 999px;
}
body, .mn-page {
  background: #eef1f6; color: var(--on-surface);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  font-size: 14px; line-height: 1.8; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 20px 110px; }

/* ── 단계(초·중·고급) 카드 ── */
.tier-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 20px 0 26px; }
.tier-card { position: relative; overflow: hidden; text-align: left; font-family: inherit; cursor: pointer; background: var(--tc); color: #fff; border: 0; border-radius: 4px; padding: 16px 20px 18px; min-height: 96px; box-shadow: 0 2px 4px rgba(15,23,42,.22), 0 1px 10px rgba(15,23,42,.14), 0 4px 5px rgba(15,23,42,.16); transition: box-shadow .2s cubic-bezier(.4,0,.2,1); min-width: 0; -webkit-tap-highlight-color: transparent; }
.tier-card::before { content: ''; position: absolute; inset: 0; background: #fff; opacity: 0; transition: opacity .2s; pointer-events: none; }
.tier-card:hover::before { opacity: .12; }
.tier-card:active::before { opacity: .24; }
.tier-card:hover { box-shadow: 0 4px 6px rgba(15,23,42,.24), 0 2px 16px rgba(15,23,42,.16), 0 6px 8px rgba(15,23,42,.18); }
.tier-card:focus-visible { outline: 3px solid var(--on-primary-container); outline-offset: 3px; }
.tier-card.active { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--tc), 0 6px 10px rgba(15,23,42,.28); }
.tc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; position: relative; }
.tc-name { font-size: 16px; font-weight: 700; letter-spacing: .08em; }
.tc-gdc { font-size: 12px; font-weight: 700; color: #fff; opacity: .92; }
.tc-count { font-size: 12.5px; color: #fff; opacity: .92; margin: 3px 0 12px; position: relative; }
.tc-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.32); overflow: hidden; position: relative; }
.tc-bar i { display: block; height: 100%; background: #fff; border-radius: 3px; transition: width .3s; }

/* ── 장 목록 머리말 + 세그먼트 버튼 ── */
.sec-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head h2 { font-size: 19px; font-weight: 700; color: var(--navy); flex: 1 1 160px; }
.seg { display: flex; border: 1px solid var(--outline); border-radius: var(--radius-full); overflow: hidden; background: var(--surface); }
.seg button { height: 40px; padding: 0 20px; border: 0; border-left: 1px solid var(--outline); background: var(--surface); color: var(--on-surface-variant); font: 600 13.5px/1 inherit; font-family: inherit; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button.active { background: var(--primary-container); color: var(--on-primary-container); font-weight: 700; }

/* ── 장(chapter) 카드 격자 ── */
.ch-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-bottom: 26px; }
.ch-card { display: flex; flex-direction: column; gap: 12px; min-height: 124px; text-align: left; font-family: inherit; cursor: pointer; background: var(--surface); border: 0; border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--el-1); color: var(--on-surface); transition: box-shadow .15s, transform .15s; }
.ch-card:hover { box-shadow: var(--el-3); transform: translateY(-1px); }
.ch-card.active { background: var(--primary-container); box-shadow: 0 0 0 2px var(--primary), var(--el-2); }
.cc-top { display: flex; align-items: center; justify-content: space-between; }
.cc-num { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-container-high); color: var(--on-surface-variant); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
.ch-card.active .cc-num { background: #fff; color: var(--primary); }
.ch-card.completed .cc-num { background: var(--primary); color: #fff; }
.cc-chip { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 12px; background: var(--surface-container-high); color: var(--on-surface-variant); }
.ch-card.active .cc-chip { background: #fff; color: var(--on-primary-container); }
.ch-card.completed .cc-chip { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.cc-title { word-break: keep-all; font-size: 15.5px; font-weight: 700; line-height: 1.5; }
@media (max-width: 720px) { .ch-content { padding: 24px 18px; } .tier-cards { grid-template-columns: 1fr; } }


/* ── 본문 카드 ── */
.ch-content { background: var(--surface); border-radius: var(--radius); padding: 34px 36px; box-shadow: var(--el-1); margin-bottom: 20px; }
.ch-hero { margin-bottom: 8px; }
.ch-updated { font-size: 11.5px; color: #6b7a99; text-align: right; margin: -4px 0 10px; }
.ch-updated.is-new { color: #0c6cc3; font-weight: 600; }
.ch-content h2 { font-size: 21px; font-weight: 700; color: var(--navy); margin: 6px 0 18px; text-align: center; }
.ch-content h3 { font-size: 15px; font-weight: 700; color: var(--on-surface); margin: 26px 0 14px; }
.ch-content p { color: var(--on-surface-variant); margin-bottom: 12px; }
.ch-illust { margin: 8px 0 20px; }
.ch-shot { margin: 12px auto 20px; text-align: center; }
.ch-shot img { width: 100%; height: auto; border: 1px solid #e2e8f0; border-radius: 12px; display: block; }
.ch-shot figcaption { margin-top: 6px; font-size: 13px; color: #64748b; }
.ch-soon { padding: 50px 0; text-align: center; color: var(--outline); font-size: 13.5px; }

/* Material 톤 컨테이너(callout) */
.md-container { display: flex; gap: 14px; border-radius: var(--radius); padding: 16px 18px; margin: 18px 0; }
.md-container .mc-icon { flex-shrink: 0; width: 30px; height: 30px; }
.md-container .mc-icon svg { width: 100%; height: 100%; }
.md-container .mc-title { font-weight: 700; margin-bottom: 4px; font-size: 13px; }
.md-container.tonal-primary { background: var(--primary-container); color: var(--on-primary-container); }
.md-container.tonal-warn { background: var(--secondary-container); color: var(--on-secondary-container); }
.md-container.tonal-error { background: var(--error-container); color: var(--on-error-container); }

/* 스텝 리스트 — 아이콘형(카드 아님, 리스트 열) */
.step-list { display: flex; flex-direction: column; gap: 4px; margin: 18px 0; }
.step-row { display: flex; gap: 14px; align-items: flex-start; padding: 12px 8px; border-radius: var(--radius-sm); transition: background 0.15s; }
.step-row:hover { background: var(--surface-container); }
.step-icon { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; background: var(--primary-container); color: var(--primary); display: flex; align-items: center; justify-content: center; }
.step-icon svg { width: 19px; height: 19px; }
.step-title { font-weight: 700; color: var(--on-surface); font-size: 13.5px; margin-bottom: 2px; }
.step-desc { color: var(--on-surface-variant); font-size: 13px; }

/* ── 퀴즈 (M3 카드형) ── */
.quiz-section { margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--outline-variant); }
.quiz-title { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
.quiz-sub { font-size: 12px; color: var(--outline); margin-bottom: 18px; }
.quiz-q { background: var(--surface-container); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
.quiz-q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.quiz-q-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--surface); box-shadow: var(--el-1); display:flex; align-items:center; justify-content:center; flex-shrink:0; color: var(--primary); }
.quiz-q-icon svg { width: 15px; height: 15px; }
.quiz-q-text { font-size: 13.5px; font-weight: 600; color: var(--on-surface); }
.quiz-opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--outline-variant);
  border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 7px; cursor: pointer;
  font-size: 13px; color: var(--on-surface-variant); font-family: inherit; transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
.quiz-opt-mark {
  position: relative; flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--outline);
  display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, background 0.15s;
}
.quiz-opt-mark svg { position: absolute; width: 12px; height: 12px; opacity: 0; transition: opacity 0.15s; stroke: #fff; }
.quiz-opt-text { flex: 1; }
.quiz-opt.selected .quiz-opt-mark { border-color: var(--primary); background: var(--primary); }
.quiz-opt.selected .quiz-opt-mark .mark-check { opacity: 1; }
.quiz-opt.correct .quiz-opt-mark { border-color: #188038; background: #188038; }
.quiz-opt.correct .quiz-opt-mark .mark-check { opacity: 1; }
.quiz-opt.correct .quiz-opt-mark .mark-x { opacity: 0; }
.quiz-opt.incorrect .quiz-opt-mark { border-color: #c5221f; background: #c5221f; }
.quiz-opt.incorrect .quiz-opt-mark .mark-x { opacity: 1; }
.quiz-opt.incorrect .quiz-opt-mark .mark-check { opacity: 0; }
.quiz-opt:hover { box-shadow: var(--el-1); }
.quiz-opt.selected { border-color: var(--primary); background: var(--primary-container); color: var(--on-primary-container); }
.quiz-opt.correct { border-color: #188038; background: var(--tertiary-container); color: var(--on-tertiary-container); font-weight: 700; }
.quiz-opt.incorrect { border-color: #c5221f; background: var(--error-container); color: var(--on-error-container); font-weight: 700; }
.quiz-opt:disabled { cursor: default; }
.quiz-explain { font-size: 12.5px; color: var(--on-surface-variant); margin-top: 4px; padding: 10px 14px; background: var(--surface); border-radius: var(--radius-sm); display: none; }
.quiz-explain.show { display: block; }
.quiz-submit {
  background: var(--primary); color: #fff; border: none; border-radius: var(--radius-full);
  padding: 12px 28px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: var(--el-1);
}
.quiz-submit:hover { box-shadow: var(--el-2); }
.quiz-submit:disabled { background: var(--outline-variant); color: var(--outline); cursor: not-allowed; box-shadow:none; }
.quiz-result { margin-top: 16px; padding: 14px 18px; border-radius: var(--radius); font-size: 13.5px; font-weight: 700; display: none; }
.quiz-result.show { display: block; }
.quiz-result.pass { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.quiz-result.fail { background: var(--error-container); color: var(--on-error-container); }

.tier-reward-banner {
  display: none; margin-top: 4px; background: linear-gradient(135deg, var(--navy), #16295a); color: #fff;
  border-radius: var(--radius); padding: 22px 24px; text-align: center; box-shadow: var(--el-4);
}
.tier-reward-banner.show { display: block; }
.trb-amount { font-size: 24px; font-weight: 700; color: #ffe9b3; }

/* ── FAB(다음 장) ── */
.fab {
  position: fixed; bottom: 26px; right: 26px; height: 56px; padding: 0 24px 0 20px; border-radius: 16px;
  background: var(--primary); color: #fff; border: none; cursor: pointer; font: 700 15px inherit; font-family: inherit;
  display: flex; align-items: center; gap: 12px; box-shadow: var(--el-3);
  transition: box-shadow 0.15s, transform 0.15s;
}
.fab:hover { box-shadow: var(--el-4); transform: translateY(-2px); }
.fab svg { width: 24px; height: 24px; }

/* ── K-정부 챕터 전용 UI (2026-08-29 신설) ── */
.kgov-app { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.kgov-category { border: 1px solid var(--outline-variant); border-radius: var(--radius-sm); overflow: hidden; }
.kgov-cat-head, .kgov-group-head {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  background: var(--surface-container); border: none; cursor: pointer;
  font-family: inherit; font-size: 13.5px; font-weight: 700; color: var(--on-surface);
  padding: 12px 14px; text-align: left;
}
.kgov-cat-head:hover, .kgov-group-head:hover { background: var(--surface-container-high); }
.kgov-cat-count, .kgov-group-count { font-size: 11.5px; font-weight: 500; color: var(--on-surface-variant); }
.kgov-cat-body { padding: 10px 14px 14px; border-top: 1px solid var(--outline-variant); }
.kgov-category > .kgov-cat-head::before, .kgov-group-head::before {
  content: '▸'; display: inline-block; margin-right: 8px; transition: transform 0.15s; color: var(--primary);
}
.kgov-cat-head.open::before, .kgov-group-head.open::before { transform: rotate(90deg); }
.kgov-agency-list { display: flex; flex-direction: column; gap: 4px; }
.kgov-agency-item { border-radius: var(--radius-sm); }
.kgov-agency-btn {
  width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 8px 10px; font-family: inherit; font-size: 13px; color: var(--on-surface-variant); cursor: pointer;
}
.kgov-agency-btn:hover { background: var(--surface-container); }
.kgov-agency-btn.active { background: var(--primary-container); color: var(--on-primary-container); font-weight: 700; }
.kgov-agency-btn:disabled { color: var(--outline); cursor: not-allowed; }
.kgov-dept-panel { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 4px 10px 18px; }
.kgov-dept-btn {
  background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-full);
  padding: 6px 12px; font-family: inherit; font-size: 12px; color: var(--on-surface-variant); cursor: pointer;
}
.kgov-dept-btn:hover { border-color: var(--primary); color: var(--primary); }
.kgov-dept-btn:disabled { color: var(--outline); cursor: not-allowed; }
.kgov-dept-btn-own { border-color: var(--primary); color: var(--primary); font-weight: 700; }
.kgov-note { font-size: 12px; color: var(--outline); padding: 6px 4px; width: 100%; }
.kgov-group { border-top: 1px solid var(--outline-variant); }
.kgov-group:first-child { border-top: none; }
.kgov-group-body { display: flex; flex-direction: column; gap: 2px; padding: 4px 4px 10px 18px; }
.kgov-file-link {
  font-size: 12.5px; color: var(--primary); text-decoration: none; padding: 5px 6px; border-radius: 6px;
}
.kgov-file-link:hover { background: var(--primary-container); text-decoration: underline; }
.kgov-loading { font-size: 13px; color: var(--outline); padding: 12px 4px; }
.kgov-filter-input {
  width: 100%; box-sizing: border-box; padding: 9px 12px; margin-bottom: 10px;
  border: 1px solid var(--outline-variant); border-radius: var(--radius-sm);
  font-family: inherit; font-size: 13px; color: var(--on-surface);
}
.kgov-filter-input:focus { outline: none; border-color: var(--primary); }

/* SP 열람 모달 */
.kgov-modal {
  display: none; position: fixed; inset: 0; background: rgba(15,17,20,0.55); z-index: 2000;
  align-items: center; justify-content: center; padding: 24px;
}
.kgov-modal.open { display: flex; }
.kgov-modal-inner {
  background: var(--surface); border-radius: var(--radius); max-width: 760px; width: 100%;
  max-height: 86vh; display: flex; flex-direction: column; box-shadow: var(--el-4); overflow: hidden;
}
.kgov-modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--outline-variant); flex-shrink: 0;
}
.kgov-modal-head span { font-size: 14px; font-weight: 700; color: var(--navy); }
.kgov-modal-head button {
  background: none; border: none; cursor: pointer; font-size: 16px; color: var(--on-surface-variant);
  width: 28px; height: 28px; border-radius: 50%;
}
.kgov-modal-head button:hover { background: var(--surface-container); }
.kgov-modal-note {
  font-size: 12px; color: var(--on-surface-variant); background: var(--surface-container);
  padding: 10px 18px; border-bottom: 1px solid var(--outline-variant); flex-shrink: 0;
}
.kgov-modal-inner pre {
  margin: 0; padding: 18px; overflow: auto; font-family: 'Pretendard', monospace; font-size: 12px;
  line-height: 1.7; color: var(--on-surface-variant); white-space: pre-wrap; word-break: break-word;
}
@media (max-width: 640px) {
  .kgov-dept-panel { padding-left: 8px; }
  .kgov-group-body { padding-left: 8px; }
}


.cns-banner { display:none; margin: 18px 0 0; max-width: none; padding: 14px 18px; border-radius: 14px; background: linear-gradient(135deg,#fff7e0,#ffe9b0); border: 1px solid #f59e0b; color:#5b3b00; font-weight:600; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.cns-banner.show { display:flex; }
.cns-banner button, .cns-modal button.cns-go { border:0; background:#b45309; color:#fff; border-radius:999px; padding:9px 18px; font:inherit; font-weight:700; cursor:pointer; }
.cns-modal { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:16px; overflow:auto; }
.cns-modal.show { display:flex; }
.cns-box { background:#fff; color:#1b2733; max-width:760px; width:100%; border-radius:16px; padding:24px; }
.cns-box h2 { font-size:20px; margin-bottom:8px; }
.cns-box input { width:100%; padding:11px 12px; border:1px solid #c5cbd3; border-radius:8px; font:inherit; margin:8px 0 12px; }
.cns-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
.cns-actions button.cns-sub { border:1px solid #c5cbd3; background:#fff; color:#1b2733; border-radius:999px; padding:9px 18px; font:inherit; cursor:pointer; }
.cns-cert { border:6px double #b8860b; border-radius:6px; padding:34px 28px; text-align:center; background:#fffdf5; }
.cns-cert .c-ko { font-size:30px; font-weight:800; letter-spacing:.06em; color:#7a4f00; }
.cns-cert .c-en { font-size:15px; letter-spacing:.14em; color:#9a6a00; margin:4px 0 22px; }
.cns-cert .c-name { font-size:28px; font-weight:800; margin:6px 0 14px; border-bottom:2px solid #b8860b; display:inline-block; padding:0 28px 4px; }
.cns-cert p { line-height:1.8; font-size:15px; }
.cns-cert .c-meta { margin-top:22px; font-size:13.5px; color:#5b6b7a; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; }
.cns-cert .c-foot { margin-top:14px; font-size:12px; color:#8a97a5; }
@media print { .mn-page .wrap > *:not(#cnsModal), .mn-page .fab { display:none !important; } .mn-page { background:none; } body > *:not(#cnsModal) { display:none !important; } #cnsModal { position:static; background:none; padding:0; display:block !important; } .cns-box { box-shadow:none; padding:0; max-width:none; } .cns-box > :not(#cnsCertWrap) { display:none !important; } .cns-actions { display:none !important; } @page { size: A4 landscape; margin: 14mm; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="cns-banner" id="cnsBanner" role="status"><span id="cnsBannerText"></span><button type="button" id="cnsBannerBtn">인증서 발급받기</button></div>
  <div class="tier-cards" id="tierCards"></div>
  <div class="sec-head"><h2 id="gridTitle">초급</h2><div class="seg" id="tierSeg" role="group" aria-label="단계 선택"></div></div>
  <div class="ch-cards" id="chTabs"></div>
  <div class="ch-content" id="chContent"></div>
  <div class="tier-reward-banner" id="tierRewardBanner"></div>
  <div class="cns-modal" id="cnsModal" role="dialog" aria-modal="true" aria-label="나비웹 전문가 인증서"><div class="cns-box">

<script>
/* 루트: 독립 페이지는 document, 사용법 탭에 직접 붙일 때는 shadow root(window.__naviManualRoot) */
var DOC = window.__naviManualRoot || document;
var EMBED = DOC !== document;
var ASSET_BASE = window.__naviManualBase || '';
var CHAPTERS = [{"tier":"beginner","title":"가입하기 — 폰으로 시작하는 첫걸음","id":"ch1","body":"\n<div class=\"ch-hero\"><svg viewBox=\"0 0 400 180\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\">\n  <circle cx=\"200\" cy=\"90\" r=\"78\" fill=\"#eaf3fc\"/>\n  <g transform=\"translate(150,40)\">\n    <rect x=\"0\" y=\"0\" width=\"56\" height=\"96\" rx=\"10\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n    <circle cx=\"28\" cy=\"82\" r=\"3\" fill=\"#0c6cc3\"/>\n    <rect x=\"10\" y=\"14\" width=\"36\" height=\"52\" rx=\"4\" fill=\"#eaf3fc\"/>\n    <circle cx=\"28\" cy=\"40\" r=\"10\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n    <path d=\"M20 40l6 6 12-12\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n  </g>\n  <g transform=\"translate(60,100)\" stroke=\"#f59e0b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <rect x=\"0\" y=\"14\" width=\"30\" height=\"20\" rx=\"3\"/>\n    <path d=\"M6 14V8a9 9 0 0 1 15-6.7\"/>\n  </g>\n  <g transform=\"translate(300,30)\" stroke=\"#188038\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#e6f4ea\" stroke=\"none\"/>\n    <polyline points=\"7 14 12 19 21 8\"/>\n  </g>\n</svg></div>\n<h2>가입하기 — 폰으로 시작하는 첫걸음</h2>\n<p>나비에는 <strong>외워야 하는 비밀번호가 없습니다.</strong> 대신 여러분의 스마트폰이 곧 신원증명입니다. 그래서 나비 가입은 <strong>반드시 스마트폰에서</strong> 시작합니다. PC에서는 가입이 끝까지 되지 않고, PC 로그인 창의 \"회원 가입\"을 누르면 QR 코드나 문자 링크로 <strong>폰에서 이어 가도록</strong> 안내합니다.</p>\n<h3>시작하기 전에 — 준비물 3가지</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">① 문자를 받을 수 있는 내 스마트폰</div><div class=\"step-desc\">본인 명의 번호로 문자(인증번호)가 오는 폰이면 됩니다. Chrome(크롬) 앱이 설치돼 있어야 합니다. 안드로이드 폰을 기준으로 설명합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">② 평소 쓰던 이메일 주소</div><div class=\"step-desc\">Gmail, 네이버 메일 등 <strong>가입하기 전부터 쓰던 주소</strong>입니다. 나비가 이 주소로 \"백업 키\"를 보내 드립니다. 나비웹 주소(@naviweb.kr)가 아닙니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">③ 5분 정도의 시간</div><div class=\"step-desc\">문자 인증번호는 5분, 이메일 인증번호는 10분 안에 입력해야 합니다. 시간이 지나도 다시 받을 수 있으니 당황하지 마세요.</div></div></div>\n</div>\n\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">왜 폰에서만 가입이 되나요?</div>\n  전화번호 인증이 \"이 사람이 실제로 그 번호의 주인이다\"를 확인하는 유일한 방법이기 때문입니다. 인증받는 기기와 계정을 만드는 기기가 다르면 이 확인이 무의미해집니다.</div>\n</div>\n\n<h3>가입 한눈에 보기</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">① 가입 정보 입력</div><div class=\"step-desc\">전화번호, 닉네임, 이메일 ID, 백업 키를 받을 내 이메일을 적습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">② 문자 인증</div><div class=\"step-desc\">문자로 온 6자리 인증번호를 입력합니다(폰이 자동으로 입력해 주기도 합니다).</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">③ 이메일 확인</div><div class=\"step-desc\">백업 키를 받을 내 이메일로 온 6자리 인증번호를 입력합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">④ 백업 키 받기</div><div class=\"step-desc\">내 이메일로 \"[나비] 내 백업 키\" 메일이 옵니다. <strong>이 메일을 꼭 보관하세요.</strong></div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">⑤ 시작</div><div class=\"step-desc\">나비가 폰에 앱으로 설치되고 첫 대화를 시작합니다. 폰이 여러분만의 암호 키(지갑)를 자동으로 만들어 두니, 따로 하실 일은 없습니다.</div></div></div>\n</div>\n<h3>가입 과정, 화면으로 따라가기</h3>\n<p>아래는 처음 가입하는 사람이 폰에서 보게 되는 화면을 <strong>순서대로</strong> 담은 것입니다. 각 화면 사진과 똑같은 모습이 폰에 보이면 설명대로 따라 하세요. 화면 위쪽 시계와 일부 글자는 폰마다 조금 다를 수 있습니다. (이메일 주소·백업 키 등 민감한 부분은 가렸습니다.)</p>\n<h4>1단계. 나비웹 열고 \"가입\" 누르기</h4>\n<p>폰에서 <strong>Chrome</strong> 앱(동그란 빨강·노랑·초록·파랑 아이콘)을 열고, 맨 위 주소창에 <strong>naviweb.kr</strong>을 입력한 뒤 이동합니다. 아래와 같은 로그인 창이 뜨면 <strong>위쪽의 \"가입\" 탭</strong>을 누르세요. 이미 가입한 분은 이 창에서 \"로그인\"을 쓰고 2장으로 가면 됩니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/join-1-login-tab.webp\" alt=\"나비웹 로그인 창\" loading=\"lazy\"><figcaption>처음 열면 \"로그인\" 탭이 선택되어 있습니다. 처음이라면 오른쪽의 <strong>가입</strong>을 누르세요.</figcaption></figure>\n<ul class=\"ch-tips\"><li>주소는 <strong>naviweb.kr</strong>입니다. 검색창이 아니라 맨 위 주소창에 입력하세요.</li><li>이 창 바깥의 어두운 부분을 누르면 창이 닫힙니다. 닫혔다면 화면을 눌러 다시 여세요.</li></ul>\n<h4>2단계. 가입 정보 4가지 입력하기</h4>\n<p>\"가입\" 탭을 누르면 입력 칸이 나타납니다. 위에서부터 차례로 채우세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:300px\"><img src=\"manual-img/join-2-signup-form.webp\" alt=\"가입 정보 입력 화면\" loading=\"lazy\"><figcaption>입력이 맞으면 초록색 ✓ 문구가 나타납니다. 모두 채운 뒤 맨 아래 초록 <strong>가입하기</strong>를 누릅니다. 빨간 글씨 \"가입되지 않은 번호입니다…\"는 오류가 아니라 처음이라는 안내입니다.</figcaption></figure>\n<ul class=\"ch-tips\"><li><strong>전화번호</strong>: 국가는 +82 그대로 두고, 010 뒤의 8자리만 입력합니다. 예: 010-<strong>1234-5678</strong>이면 12345678.</li><li><strong>닉네임</strong>: 나비가 나를 부를 이름입니다. \"처음 사용하는 닉네임입니다.\"가 초록색으로 나오면 쓸 수 있습니다. 이미 있으면 다른 이름으로 바꾸세요.</li><li><strong>이메일 ID</strong>: 나비웹 메일 주소의 앞부분입니다(영문 소문자·숫자). 오른쪽의 @naviweb.kr은 자동으로 붙고, \"쓸 수 있습니다. 내 메일 주소: ○○@naviweb.kr\"이 나오면 됩니다.</li><li><strong>백업 키 받을 내 이메일</strong>: 평소 쓰던 Gmail 등의 주소입니다. <strong>오타가 없는지 두 번 확인하세요.</strong> 틀리면 백업 키가 엉뚱한 곳으로 갑니다.</li></ul>\n<h4>3단계. 문자 인증번호 받기</h4>\n<p>\"가입하기\"를 누르면 입력한 번호로 인증번호 문자가 옵니다. 그 순간 Chrome이 \"문자를 읽고 코드를 입력하도록 허용하시겠습니까?\"라고 묻습니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/join-3-sms-autofill.webp\" alt=\"문자 읽기 허용 창\" loading=\"lazy\"><figcaption>인증번호 문자 내용이 함께 보입니다. 오른쪽 파란 <strong>허용</strong>을 누르면 번호가 자동으로 입력됩니다.</figcaption></figure>\n<ul class=\"ch-tips\"><li><strong>허용</strong>을 누르면 직접 옮겨 적을 필요가 없습니다.</li><li>\"거부\"를 눌러도 괜찮습니다. 그때는 문자 앱에서 번호를 보고 다음 화면에 <strong>직접 입력</strong>하면 됩니다.</li><li>문자 속 \"#숫자\"는 자동 입력용 표시이니 신경 쓰지 않아도 됩니다.</li></ul>\n<h4>4단계. 문자 인증번호 입력하기</h4>\n<p>자동 입력이 안 됐다면 아래 칸에 6자리를 직접 입력하고 <strong>확인</strong>을 누릅니다. 문자를 보러 다른 앱에 갔다 와도 이 화면은 그대로 남아 있습니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/join-4-sms-code.webp\" alt=\"인증번호 입력 창\" loading=\"lazy\"><figcaption>\"인증번호 입력\" 창 — 6자리를 입력하고 초록 <strong>확인</strong>을 누르세요. 5분 안에 입력해야 합니다.</figcaption></figure>\n<ul class=\"ch-tips\"><li>문자가 안 오면 왼쪽 <strong>재전송</strong>을 누르세요.</li><li>번호를 잘못 적었다면 오른쪽 <strong>전화번호 다시 입력</strong>을 누르세요.</li></ul>\n<h4>5단계. 내 이메일로 간 인증번호 확인하기</h4>\n<p>폰 인증이 끝나면, 2단계에서 적은 내 이메일로도 인증번호가 갑니다. 그 주소가 정말 내 것인지 확인하는 단계입니다. 아래 창이 뜨면 <strong>Gmail 같은 메일 앱</strong>으로 가서 메일을 확인하세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/join-5-email-code-empty.webp\" alt=\"이메일 인증번호 입력 창\" loading=\"lazy\"><figcaption>\"백업 키를 이메일로 보냅니다\" — 메일함에서 확인한 6자리를 입력하는 창입니다. 이 화면은 닫지 말고 그대로 두세요.</figcaption></figure>\n<figure class=\"ch-shot\" style=\"max-width:420px\"><img src=\"manual-img/join-11-email-code-mail.webp\" alt=\"이메일 인증번호 메일\" loading=\"lazy\"><figcaption>받은 메일함의 <strong>\"[나비] 이메일 인증번호\"</strong> 메일. 인증번호 6자리가 적혀 있고 10분 안에 입력해야 합니다.</figcaption></figure>\n<ul class=\"ch-tips\"><li>메일이 안 보이면 <strong>스팸함</strong>도 살펴보세요. 그래도 없으면 나비 창의 <strong>인증번호 다시 받기</strong>를 누릅니다.</li><li>지금 하고 싶지 않다면 <strong>나중에</strong>를 누를 수 있지만, 가능하면 지금 끝내 두세요(아래 \"나중에를 눌렀다면\" 참고).</li></ul>\n<h4>6단계. 이메일 인증번호 입력하고 \"확인\"</h4>\n<p>메일의 6자리를 나비 창 입력 칸에 적고 초록 <strong>확인</strong>을 누르세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/join-7-email-code-filled.webp\" alt=\"이메일 인증번호를 입력한 모습\" loading=\"lazy\"><figcaption>인증번호(예: 127483)를 입력한 모습입니다. <strong>확인</strong>을 누르면 잠시 \"보내는 중…\"으로 바뀝니다. 기다리세요.</figcaption></figure>\n<ul class=\"ch-tips\"><li>이 숫자는 예시입니다. 내 메일에 온 숫자를 입력하세요.</li></ul>\n<h4>7단계. \"백업 키를 보냈습니다\" 확인</h4>\n<p>잠시 뒤 아래 창이 나타나면 내 이메일로 백업 키가 발송된 것입니다. 보낸 메일의 제목·받는 주소·보낸 시각이 표시되니 내 주소가 맞는지 확인하고 <strong>확인</strong>을 누르세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/join-6-backup-sent.webp\" alt=\"백업 키 발송 완료 창\" loading=\"lazy\"><figcaption>\"백업 키를 보냈습니다\" — 받는 주소가 내 이메일과 같은지 확인하세요.</figcaption></figure>\n<ul class=\"ch-tips\"></ul>\n<h4>8단계. 내 메일함에서 백업 키 메일 확인·보관</h4>\n<p>Gmail 등 내 메일 앱에 <strong>\"[나비] 내 백업 키 — 안전하게 보관하세요\"</strong> 메일이 와 있어야 합니다. 메일 가운데 긴 한 줄이 백업 키입니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:460px\"><img src=\"manual-img/join-12-backup-key-mail.webp\" alt=\"백업 키 메일\" loading=\"lazy\"><figcaption>계정 번호와 백업 키(그림에서는 가렸습니다)가 적힌 메일. <strong>지우지 말고 보관</strong>하세요.</figcaption></figure>\n<ul class=\"ch-tips\"><li>받은 메일함에서 <strong>\"[나비] 내 백업 키\"</strong>를 검색하면 언제든 찾을 수 있습니다.</li><li>메일에 별표나 \"중요\" 표시를 해 두면 실수로 지우는 일을 줄일 수 있습니다.</li></ul>\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">백업 키는 비밀번호만큼 중요합니다</div>\n  이 키를 아는 사람은 누구나 내 계정이 될 수 있습니다. 메일을 다른 사람에게 전달하거나 공개된 곳에 저장하지 마세요. 기기를 잃어버렸을 때 새 기기에서 \"백업 키로 복구\"에 이 키를 입력하면 계정을 되찾을 수 있습니다. 스크린샷으로 남기거나 남에게 보여 주지 않도록 주의하세요.</div>\n</div>\n<h4>9단계. 알림 허용하기</h4>\n<p>나비 화면으로 돌아오면 폰이 \"나비에서 알림을 보내도록 허용하시겠습니까?\"라고 묻습니다. <strong>허용</strong>을 누르세요. 나중에 PC에서 로그인할 때 \"로그인 확인\" 알림이 폰으로 오려면 꼭 필요합니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/join-8-notify-allow.webp\" alt=\"알림 허용 창\" loading=\"lazy\"><figcaption><strong>허용</strong>을 누르면 알림을 받을 수 있습니다. \"허용 안 함\"을 눌렀다면 폰 설정에서 나비(Chrome) 알림을 켜야 합니다(9장 참고).</figcaption></figure>\n<ul class=\"ch-tips\"><li>이 창 뒤에 보이는 글자 크기 설정은 나중에 바꿀 수 있습니다.</li></ul>\n<h4>10단계. 폰 잠금으로 본인 확인(패스키 만들기)</h4>\n<p>폰이 \"naviweb.kr의 패스키를 생성할까요?\"라는 창을 띄울 수 있습니다. 비밀번호 대신 <strong>지문이나 화면 잠금(패턴·PIN)</strong>으로 본인임을 확인하는 열쇠를 만드는 것입니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/join-10-passkey.webp\" alt=\"패스키 생성 창\" loading=\"lazy\"><figcaption>폰의 지문 센서에 손가락을 대거나 <strong>패턴 사용</strong>을 눌러 폰 잠금을 풀 때 쓰는 방법으로 확인합니다. 이렇게 만든 열쇠는 PC 로그인 때 폰에서 승인할 때 쓰입니다.</figcaption></figure>\n<ul class=\"ch-tips\"><li>창 모양은 폰 기종에 따라 다릅니다. 폰 잠금을 설정해 두지 않았다면 먼저 폰 설정에서 지문이나 패턴을 등록하세요.</li><li>이 창이 뜨지 않으면 그냥 넘어가도 됩니다.</li></ul>\n<h4>11단계. 가입 끝 — 나비와 첫 인사</h4>\n<p>가입이 끝나면 나비가 폰에 앱으로 설치되고, 첫 화면에서 나비가 먼저 인사합니다. 아래 입력창에 하고 싶은 말을 적거나 마이크 아이콘으로 말해 보세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/join-9-first-chat.webp\" alt=\"나비의 첫 인사\" loading=\"lazy\"><figcaption>\"안녕하세요, ○○님. 나비입니다. 무엇을 도와드릴까요?\" — 이 화면이 보이면 가입 완료입니다.</figcaption></figure>\n<ul class=\"ch-tips\"><li>폰 홈 화면에 나비 아이콘이 생깁니다. 다음부터는 이 아이콘으로 바로 열면 됩니다.</li></ul>\n\n<h3>가입 직후 — 무료 사용 안내</h3>\n<p>가입을 마치면 아래와 같은 안내창이 한 번 나타납니다. <strong>AI 사용 500원어치 또는 24시간 중 먼저 오는 때까지</strong> 무료로 쓸 수 있다는 뜻입니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:420px\"><img src=\"manual-img/free-intro-popup.webp\" alt=\"무료로 시작해 보세요 안내창\" loading=\"lazy\"><figcaption>가입 직후 나타나는 \"무료로 시작해 보세요\" 안내창</figcaption></figure>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">남은 사용량 보기</div><div class=\"step-desc\">오른쪽 위 메뉴에서 언제든 확인할 수 있고, 거의 다 쓰기 전에 미리 알려 드립니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">계속 쓰려면</div><div class=\"step-desc\">플랜을 고르거나 GDC를 충전하면 됩니다(16장 \"GDC 충전하기\" 참고). \"요금·충전 안내 보기\"를 누르면 요금 안내로 이동합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">확인 버튼</div><div class=\"step-desc\">내용을 읽었다면 \"확인\"을 눌러 닫고 바로 대화를 시작하세요.</div></div></div>\n</div>\n\n<h3>\"나중에\"를 눌렀다면</h3>\n<p>이메일 확인 창에서 \"나중에\"를 누르면 백업 키 메일이 <strong>보내지지 않습니다.</strong> 가입은 되지만, 폰을 잃어버리면 계정을 되찾을 방법이 없어집니다. 그래서 나비는 저장할 때까지 아래 안내를 계속 보여 드립니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:380px\"><svg viewBox=\"0 0 380 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;display:block;border:1px solid #d1d5db;border-radius:12px;background:#f3f4f6\" role=\"img\"><rect x=\"16\" y=\"24\" width=\"348\" height=\"84\" rx=\"12\" fill=\"#fff7ed\" stroke=\"#fed7aa\"/><text x=\"40\" y=\"66\" font-size=\"24\" fill=\"#374151\" text-anchor=\"start\" font-weight=\"400\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">🔑</text><text x=\"76\" y=\"58\" font-size=\"14\" fill=\"#9a3412\" text-anchor=\"start\" font-weight=\"700\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">백업 키를 저장하지 않았습니다</text><text x=\"76\" y=\"78\" font-size=\"12\" fill=\"#9a3412\" text-anchor=\"start\" font-weight=\"400\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">기기를 잃으면 계정을 복구할 수 없습니다</text><rect x=\"76\" y=\"88\" width=\"84\" height=\"26\" rx=\"8\" fill=\"#ea580c\"/><text x=\"118.0\" y=\"106.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">지금 저장</text><rect x=\"168\" y=\"88\" width=\"64\" height=\"26\" rx=\"8\" fill=\"#fff\" stroke=\"#fdba74\"/><text x=\"200.0\" y=\"106.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#9a3412\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">나중에</text></svg><figcaption>가입 때 백업 키를 보내지 않고 \"나중에\"를 눌렀다면, 앱을 열 때마다 이런 안내가 나타납니다. \"지금 저장\"을 누르면 바로 저장할 수 있습니다. (그림)</figcaption></figure>\n<p>지금 하지 못했다면 앱 <strong>설정 → 백업 키</strong>(또는 빠른 메뉴의 \"백업 키\")에서 언제든 저장할 수 있습니다. 가능하면 가입할 때 바로 끝내 두세요.</p>\n<h3>백업 키, 이렇게 보관하세요</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">메일을 지우지 마세요</div><div class=\"step-desc\">받은 메일함에서 <strong>\"[나비] 내 백업 키\"</strong>를 검색하면 찾을 수 있습니다. 보관함(아카이브)이나 \"중요\" 표시를 해 두면 실수로 지우는 일을 줄일 수 있습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">한 곳 더 적어 두세요</div><div class=\"step-desc\">이메일 계정에 접속하지 못하게 되는 경우에 대비해, 비밀번호 관리자 앱이나 <strong>종이에 적어 안전한 곳</strong>에 한 부 더 보관하면 좋습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">남에게 보여 주지 마세요</div><div class=\"step-desc\">이 키를 아는 사람은 누구나 내 계정이 될 수 있습니다. 메신저로 보내거나, 공개된 클라우드·SNS에 올리거나, 사진으로 찍어 두지 마세요.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">나비·직원도 묻지 않습니다</div><div class=\"step-desc\">나비웹은 어떤 경우에도 백업 키를 알려 달라고 하지 않습니다. 누가 물으면 응하지 마세요.</div></div></div>\n</div>\n<h3>폰을 바꾸거나 잃어버렸을 때 — 백업 키로 되찾기</h3>\n<p>새 폰(또는 PC)에서 로그인하려는데 예전 폰의 승인을 받을 수 없을 때 쓰는 방법입니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">① 새 기기에서 로그인 시작</div><div class=\"step-desc\">naviweb.kr에서 내 전화번호로 로그인을 시작합니다. 예전 폰이 살아 있다면 그 폰에서 승인하는 쪽이 가장 쉽습니다(2장 \"PC로 로그인하기\" 참고).</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">② \"백업 키로 복구\" 누르기</div><div class=\"step-desc\">\"폰에서 승인하세요\" 화면 아래의 <strong>백업 키로 복구</strong>를 누릅니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">③ 메일의 백업 키 붙여넣기</div><div class=\"step-desc\">내 이메일에서 \"[나비] 내 백업 키\" 메일을 열어 키(영문·숫자·기호가 섞인 긴 한 줄)를 <strong>복사</strong>한 뒤 입력칸에 <strong>붙여넣고</strong> \"복구\"를 누릅니다. 직접 타이핑하면 오타가 나기 쉬우니 복사·붙여넣기를 권합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">④ 끝</div><div class=\"step-desc\">복구되면 이전과 같은 내 계정으로 들어갑니다.</div></div></div>\n</div>\n<figure class=\"ch-shot\" style=\"max-width:360px\"><svg viewBox=\"0 0 360 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;display:block;border:1px solid #d1d5db;border-radius:12px;background:#f3f4f6\" role=\"img\"><rect x=\"30\" y=\"20\" width=\"300\" height=\"340\" rx=\"16\" fill=\"#fff\" stroke=\"#e5e7eb\"/><text x=\"52\" y=\"58\" font-size=\"18\" fill=\"#111827\" text-anchor=\"start\" font-weight=\"700\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">백업 키 입력</text><text x=\"52\" y=\"88\" font-size=\"12.5\" fill=\"#374151\" text-anchor=\"start\" font-weight=\"400\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">가입 시 또는 설정 → 백업 키에서 내보낸</text><text x=\"52\" y=\"106\" font-size=\"12.5\" fill=\"#374151\" text-anchor=\"start\" font-weight=\"400\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">키 문자열을 붙여넣어 주세요.</text><rect x=\"52\" y=\"120\" width=\"256\" height=\"84\" rx=\"10\" fill=\"#fff\" stroke=\"#9ca3af\"/><text x=\"66\" y=\"146\" font-size=\"13\" fill=\"#9ca3af\" text-anchor=\"start\" font-weight=\"400\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">백업 키 붙여넣기</text><rect x=\"52\" y=\"222\" width=\"256\" height=\"42\" rx=\"8\" fill=\"#00796b\"/><text x=\"180.0\" y=\"248.0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">복구</text><text x=\"180\" y=\"296\" font-size=\"14\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">뒤로</text><text x=\"180\" y=\"336\" font-size=\"10.5\" fill=\"#b91c1c\" text-anchor=\"middle\" font-weight=\"400\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">※ 키가 맞지 않으면 \"이 백업 키는 이 계정의 키가 아닙니다.\"</text></svg><figcaption>\"백업 키 입력\" 창(그림). 메일에 있던 백업 키를 통째로 붙여넣고 \"복구\"를 누릅니다. (실제 화면과 같은 글자로 그린 예시입니다.)</figcaption></figure>\n<div class=\"md-container tonal-primary\"><div class=\"mc-body\"><div class=\"mc-title\">복구가 안 될 때</div>\"이 백업 키는 이 계정의 키가 아닙니다\"는 다른 계정의 키이거나 오래된 키라는 뜻입니다. 메일이 여러 통이라면 <strong>가장 최근 메일</strong>의 키를 써 보세요. \"키 형식이 올바르지 않습니다\"는 키가 중간에 잘렸거나 앞뒤에 공백·글자가 붙은 경우가 많으니, 처음부터 끝까지 다시 복사하세요.</div></div>\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">비밀번호가 없다면, 뭘 기억해야 하나요?</div>\n  외울 비밀번호는 없습니다. 대신 두 가지만 기억하세요. <strong>① 가입한 그 폰을 잃어버리지 않기</strong> — PC나 다른 폰에서 로그인하려면 이 폰이 승인해줘야 합니다(2장 \"PC로 로그인하기\"). <strong>② \"[나비] 내 백업 키\" 메일을 보관하기</strong> — 폰을 잃어버렸을 때 계정을 되찾는 유일한 열쇠입니다.</div>\n</div>\n","quiz":[{"q":"나비에 처음 가입할 때 반드시 사용해야 하는 기기는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["PC(데스크톱)","스마트폰","태블릿","아무 기기나 상관없음"],"answer":1,"explain":"나비는 전화번호 인증으로 본인을 확인하기 때문에, 최초 가입은 반드시 스마트폰에서 이뤄져야 합니다."},{"q":"나비에서 비밀번호 대신 계정을 되찾는 데 쓰는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 9.9-1\"/></svg>","options":["사용자 이름과 비밀번호","주민등록번호","가입할 때 이메일로 받은 백업 키","닉네임"],"answer":2,"explain":"나비에는 외울 비밀번호가 없습니다. 폰을 잃어버렸을 때는 가입 시 이메일로 받은 \"백업 키\"를 새 기기의 \"백업 키로 복구\"에 붙여넣어 계정을 되찾습니다."},{"q":"가입한 폰을 잃어버리면 왜 중요한 문제가 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></svg>","options":["폰 요금이 계속 나가서","다른 기기가 로그인하려면 이 폰의 승인이 필요하기 때문에","사진이 사라져서","문제가 되지 않는다"],"answer":1,"explain":"PC 등 다른 기기에서 로그인하려면 이미 등록된 폰이 '본인이 맞다'고 승인해줘야 합니다. 이게 나비 인증의 핵심 구조입니다."},{"q":"가입 때 이메일 확인 창에서 \"나중에\"를 누르면 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["백업 키 메일이 그대로 발송된다","백업 키가 보내지지 않으며, 설정 → 백업 키에서 나중에 저장해야 한다","가입이 취소된다","백업 키가 필요 없어진다"],"answer":1,"explain":"\"나중에\"를 누르면 백업 키 메일이 보내지지 않습니다. 저장할 때까지 안내 배너가 나타나며, 설정 → 백업 키에서 저장할 수 있습니다."},{"q":"가입하려면 어떤 환경에서 시작해야 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["나비 전용 설치 프로그램","문자를 받을 수 있는 내 폰의 Chrome에서 naviweb.kr 접속","PC의 아무 브라우저","다른 사람의 폰"],"answer":1,"explain":"가입은 폰에서 시작합니다. 폰의 Chrome으로 naviweb.kr을 열고 \"가입\" 탭을 고릅니다. PC 로그인 창의 \"회원 가입\"을 눌러도 QR 코드나 문자 링크로 폰에서 이어 가게 됩니다."},{"q":"가입 전에 준비해 두어야 하는 것으로 알맞은 묶음은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["주민등록증, 신용카드, 공인인증서","PC, USB 보안키, 비밀번호","나비웹 메일 주소만","본인 폰, 평소 쓰던 이메일 주소, 약 5분의 시간"],"answer":3,"explain":"문자를 받을 본인 폰, 가입 전부터 쓰던 이메일(백업 키를 받을 주소), 인증번호를 입력할 시간이 필요합니다."},{"q":"이메일 ID를 hong으로 정하면 내 나비웹 메일 주소는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["naviweb.kr/hong","hong@gmail.com","hong@naviweb.kr","hong@hondi.net"],"answer":2,"explain":"이메일 ID는 나비웹 메일 ."},{"q":"백업 키 메일을 가장 안전하게 다루는 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["받자마자 메일을 삭제한다","메일을 지우지 않고 보관하고, 종이나 비밀번호 관리자에 한 부 더 보관한다","단체 채팅방에 올려 둔다","SNS에 사진으로 올린다"],"answer":1,"explain":"백업 키는 비밀번호만큼 중요합니다. 메일을 지우지 말고, 한 부 더 안전하게 보관하되 남에게 보여 주거나 공개된 곳에 올리지 마세요."},{"q":"누군가 \"백업 키를 알려 주면 도와주겠다\"고 하면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["앞 글자만 알려 준다","나비웹도 직원도 백업 키를 묻지 않으니 응하지 않는다","절반만 알려 준다","알려 준다"],"answer":1,"explain":"이 키를 아는 사람은 누구나 내 계정이 될 수 있습니다. 나비웹은 어떤 경우에도 백업 키를 알려 달라고 하지 않습니다."},{"q":"새 폰에서 예전 폰의 승인을 받을 수 없을 때, 계정을 되찾으려면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["기다리면 저절로 복구된다","고객센터에서 비밀번호를 받는다","\"백업 키로 복구\"를 눌러 메일의 백업 키를 붙여넣고 \"복구\"를 누른다","새로 가입해서 번호를 바꾼다"],"answer":2,"explain":"\"폰에서 승인하세요\" 화면의 \"백업 키로 복구\"를 누르고, 메일에서 복사한 키를 붙여넣은 뒤 \"복구\"를 누릅니다."},{"q":"\"이 백업 키는 이 계정의 키가 아닙니다\"라는 안내가 나오면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["키가 정확하니 계속 같은 키를 입력한다","가입을 취소한다","다른 계정의 키이거나 오래된 키일 수 있으니 가장 최근 메일의 키로 다시 시도한다","앱을 새로 설치한다"],"answer":2,"explain":"이 메시지는 키가 이 계정의 것이 아니라는 뜻입니다. 메일이 여러 통이라면 가장 최근 메일의 키를 처음부터 끝까지 다시 복사해 붙여넣으세요."},{"q":"가입 직후 나타나는 \"무료로 시작해 보세요\" 안내의 의미는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["AI 사용 500원어치 또는 24시간 중 먼저 오는 때까지 무료","영원히 무료","가입 즉시 요금이 청구됨","무료 기간이 없음"],"answer":0,"explain":"가입 후 AI 사용 500원어치 또는 24시간 중 먼저 오는 때까지 무료로 쓸 수 있습니다. 남은 사용량은 오른쪽 위 메뉴에서 확인하고, 계속 쓰려면 플랜을 고르거나 GDC를 충전합니다."},{"q":"가입을 마치면 폰에서 일어나는 일은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["나비가 앱으로 설치되고 첫 인사를 건넨다","아무 일도 없다","PC가 자동으로 로그인된다","새 비밀번호가 문자로 온다"],"answer":0,"explain":"가입이 끝나면 \"앱이 설치됨\" 알림이 뜨고, 첫 화면에서 나비가 먼저 인사를 건넵니다."},{"q":"가입 화면 맨 위쪽에서 처음 가입하는 사람이 눌러야 하는 탭은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["가입","로그인","닫기","뒤로"],"answer":0,"explain":"처음이라면 로그인 창 위쪽의 \"가입\" 탭을 눌러 정보를 입력합니다."},{"q":"Chrome이 \"문자를 읽고 코드를 입력하도록 허용하시겠습니까?\"라고 물을 때 허용하면 좋은 점은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["인증번호가 자동으로 입력된다","가입비가 면제된다","PC에서 자동 로그인된다","백업 키가 필요 없어진다"],"answer":0,"explain":"허용하면 인증번호가 자동 입력됩니다. 거부해도 문자 앱에서 번호를 보고 직접 입력하면 됩니다."},{"q":"이메일 인증번호 메일이 안 보일 때 먼저 할 일은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["스팸함을 확인하고, 없으면 \"인증번호 다시 받기\"를 누른다","가입을 포기한다","문자 인증번호를 입력한다","백업 키를 새로 만든다"],"answer":0,"explain":"스팸함을 확인하고, 그래도 없으면 \"인증번호 다시 받기\"로 다시 받으세요."},{"q":"가입 중 \"나비에서 알림을 보내도록 허용하시겠습니까?\"에 어떻게 답하는 것이 좋나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["허용","허용 안 함","창을 닫고 가입을 취소","알림 설정은 나중에도 못 바꾼다"],"answer":0,"explain":"PC 로그인 때 폰으로 오는 확인 알림을 받으려면 알림을 허용해야 합니다."}],"placeholder":false},{"id":"ch_pclogin","tier":"beginner","title":"PC로 로그인하기 — 이미 가입한 분","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 360 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"1\"/><line x1=\"9\" y1=\"18\" x2=\"9\" y2=\"18.01\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"14\" rx=\"1\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/></g><circle cx=\"300\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(282,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></g></svg></div>\n<h2>PC로 로그인하기 — 이미 가입한 분</h2>\n<p>이미 나비웹에 가입한 분이 <strong>PC에서 로그인</strong>하는 방법입니다. 나비에는 비밀번호가 없어서, 가입할 때 쓴 <strong>내 폰이 \"본인이 맞다\"고 승인</strong>해 주는 방식으로 로그인합니다. 처음이라 아직 가입하지 않았다면 먼저 1장을 따라 폰에서 가입하세요.</p>\n<h3>시작하기 전에 — 준비물 3가지</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">① 가입할 때 쓴 내 폰</div><div class=\"step-desc\">폰이 켜져 있고 Wi-Fi나 데이터로 인터넷에 연결돼 있어야 합니다. 로그인이 끝날 때까지 곁에 두세요.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">② PC와 브라우저</div><div class=\"step-desc\">Chrome 같은 최신 브라우저를 권장합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">③ 내 폰 번호 뒤 8자리</div><div class=\"step-desc\">010을 뺀 뒤쪽 8자리입니다. 예를 들어 010-1234-5678이면 12345678입니다.</div></div></div>\n</div>\n<h3>로그인 과정, 화면으로 따라가기</h3>\n<p>PC와 폰 화면을 <strong>순서대로</strong> 보여 드립니다. <strong>PC에서 시작해 → 폰에서 승인하고 → 다시 PC에서 끝납니다.</strong> 그림의 폰 번호·숫자는 예시이므로 내 화면에 보이는 숫자를 따르세요.</p>\n<h4>1단계. PC에서 naviweb.kr 열고 \"로그인하지 않았습니다\" 누르기</h4>\n<p>PC의 Chrome에서 주소창에 <strong>naviweb.kr</strong>을 입력해 나비웹을 엽니다. 오른쪽 위에 \"로그인하지 않았습니다\"라고 보이면 로그인이 안 된 상태입니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:640px\"><img src=\"manual-img/pcl-1-desktop-home.webp\" alt=\"PC 나비웹 첫 화면\" loading=\"lazy\"><figcaption>오른쪽 위의 <strong>로그인하지 않았습니다</strong> 단추를 누르세요. 이 화면 모양은 PC 화면 크기에 따라 조금 다를 수 있습니다.</figcaption></figure>\n<h4>2단계. 메뉴에서 \"로그인\" 누르기</h4>\n<p>작은 창이 열리면 초록색 <strong>로그인</strong>을 누릅니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:300px\"><img src=\"manual-img/pcl-2-login-menu.webp\" alt=\"로그인 메뉴\" loading=\"lazy\"><figcaption>\"처음이세요? 회원 가입\"은 아직 가입하지 않은 분용입니다. 가입은 폰에서 해야 하니 1장을 먼저 따라 하세요.</figcaption></figure>\n<h4>3단계. 폰 번호 뒤 8자리 입력하고 \"로그인\"</h4>\n<p>로그인 창이 열리면 <strong>010을 뺀 폰 번호 뒤 8자리</strong>만 입력하고 초록 <strong>로그인</strong>을 누릅니다. 예를 들어 010-1234-5678이면 12345678입니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:640px\"><img src=\"manual-img/pcl-3-login-dialog.webp\" alt=\"PC 로그인 창\" loading=\"lazy\"><figcaption>입력 칸에 8자리를 쓰고 \"로그인\"을 누릅니다. 마음이 바뀌면 오른쪽 아래 \"취소\"를 누르세요.</figcaption></figure>\n<ul class=\"ch-tips\"><li>가입할 때 쓴 <strong>바로 그 폰의 번호</strong>여야 합니다.</li></ul>\n<h4>4단계. PC 화면의 숫자 확인하기</h4>\n<p>잠시 뒤 PC 화면이 아래처럼 바뀝니다. 큰 숫자(그림에서는 <strong>84</strong>)와 남은 시간이 보입니다. <strong>이 숫자를 기억해 두고 폰으로 넘어가세요.</strong> 이 창은 닫지 마세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:320px\"><img src=\"manual-img/pcl-4-pc-wait.webp\" alt=\"PC 승인 대기 화면\" loading=\"lazy\"><figcaption>\"폰에서 이 숫자를 선택하세요\" — 남은 시간이 줄어듭니다(그림에서는 299초). 시간이 지나면 \"다시 입력\"을 눌러 처음부터 다시 하면 됩니다. 숫자는 로그인을 시도할 때마다 새로 정해집니다.</figcaption></figure>\n<h4>5단계. 폰에서 \"서명 요청\" 알림 누르기</h4>\n<p>폰 화면 위쪽에 <strong>\"서명 요청 — naviweb에서 서명을 요청했습니다. 확인하려면 누르세요.\"</strong> 알림이 소리와 함께 나타납니다. 알림을 누르세요. 폰 화면이 꺼져 있었다면 켜고 위에서 아래로 쓸어 내려 알림창을 열면 보입니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/pcl-5-phone-notify.webp\" alt=\"폰 알림\" loading=\"lazy\"><figcaption>Chrome(app.naviweb.kr)에서 온 \"서명 요청\" 알림입니다. 이 알림은 Wi-Fi나 데이터로 도착하며 문자 요금이 들지 않습니다. 누르면 승인 화면이 열립니다.</figcaption></figure>\n<ul class=\"ch-tips\"><li>\"서명 요청\"은 <strong>PC 로그인을 확인해 달라</strong>는 뜻입니다. 내가 방금 PC에서 로그인을 시작했을 때만 누르세요.</li><li>알림 아래의 \"수신 거부\"는 누르지 마세요. 누르면 앞으로 로그인 알림이 오지 않습니다.</li></ul>\n<h4>6단계. 잠시 기다리기</h4>\n<p>알림을 누르면 폰에 \"불러오는 중…\"이 잠깐 나타납니다. 손대지 말고 몇 초 기다리세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:260px\"><img src=\"manual-img/pcl-6-phone-loading.webp\" alt=\"폰 불러오는 중 화면\" loading=\"lazy\"><figcaption>승인 정보를 가져오는 중입니다. 곧 숫자 선택 화면으로 바뀝니다.</figcaption></figure>\n<h4>7단계. PC 화면의 숫자와 같은 숫자 누르기</h4>\n<p>폰에 숫자가 <strong>세 개</strong> 나타납니다. <strong>PC 화면에 보이는 숫자(4단계)와 같은 것</strong>을 누르세요. 그림에서는 PC에 84가 보였으므로 84를 누릅니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/pcl-7-phone-pick.webp\" alt=\"폰 숫자 선택 화면\" loading=\"lazy\"><figcaption>\"로그인하려는 PC 화면에 보이는 숫자를 선택하세요\". 맨 위에는 요청한 PC의 대략적인 위치가 함께 표시됩니다. 내가 있는 곳과 크게 다르면 누르지 마세요.</figcaption></figure>\n<ul class=\"ch-tips\"><li>PC 화면을 보고 있지 않거나 PC에 숫자가 없다면 <strong>아무것도 누르지 마세요.</strong></li></ul>\n<h4>8단계. 지문(또는 얼굴)으로 확인하기</h4>\n<p>숫자를 누르면 폰이 지문이나 Face ID 확인을 요청합니다. 폰에서 설정한 방법으로 확인하세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/pcl-8-phone-biometric.webp\" alt=\"폰 지문 확인 화면\" loading=\"lazy\"><figcaption>누른 숫자가 파란 테두리로 표시되고 \"지문/Face ID 확인이 필요합니다…\"가 나타납니다. 지문 센서에 손가락을 대거나 폰 잠금을 풀 때 쓰는 방법으로 확인하세요.</figcaption></figure>\n<ul class=\"ch-tips\"><li>지문 인식이 안 되면 폰의 화면 잠금(패턴·PIN) 방법을 고를 수 있습니다.</li></ul>\n<h4>9단계. 폰에서 \"완료됐습니다\" 확인</h4>\n<p>확인이 끝나면 폰에 완료 메시지가 나타납니다. 이제 <strong>폰 창은 닫으셔도 됩니다.</strong></p>\n<figure class=\"ch-shot\" style=\"max-width:280px\"><img src=\"manual-img/pcl-9-phone-done.webp\" alt=\"폰 완료 화면\" loading=\"lazy\"><figcaption>\"완료됐습니다. 요청했던 기기의 화면을 확인해 주세요.\" 아래의 검은 상자는 처리 기록이며 신경 쓰지 않아도 됩니다. (그림에서는 흐리게 처리했습니다.)</figcaption></figure>\n<h4>10단계. PC에서 로그인 확인</h4>\n<p>PC로 돌아가면 자동으로 로그인되어 있습니다. 오른쪽 위에 내 닉네임(그림에서는 ceo)이 보입니다. 누르면 내 메일 주소, 보내는 이름, 로그아웃 등을 볼 수 있습니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:320px\"><img src=\"manual-img/pcl-10-logged-in.webp\" alt=\"로그인된 PC 화면\" loading=\"lazy\"><figcaption>닉네임 단추를 누르면 열리는 메뉴 — 내 나비웹 메일 주소와 \"로그아웃\"이 보입니다. 공용 PC에서는 사용 후 꼭 <strong>로그아웃</strong>을 누르세요.</figcaption></figure>\n<ul class=\"ch-tips\"><li>공용 PC(PC방·도서관 등)에서 로그인했다면 일이 끝난 뒤 반드시 로그아웃하세요.</li></ul>\n<div class=\"md-container tonal-warn\"><div class=\"mc-body\"><div class=\"mc-title\">PC 화면을 보고 있지 않다면 누르지 마세요</div>내가 시작하지 않은 로그인 알림이 오거나, PC 화면에 숫자가 없거나, 숫자를 알 수 없다면 <strong>아무 숫자도 누르지 마세요.</strong> 다른 사람이 내 번호로 로그인을 시도한 것일 수 있습니다. 승인하지 않으면 로그인되지 않습니다.</div></div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-body\"><div class=\"mc-title\">왜 폰이 승인해야 하나요?</div>비밀번호는 남이 알아낼 수 있지만, <strong>내 폰과 PC 화면의 숫자를 동시에 가진 사람</strong>만 통과할 수 있습니다. 그래서 비밀번호 없이도 안전합니다. 알림 방식과 제한 시간의 원리는 9장에서 더 자세히 다룹니다.</div></div>\n<h3>알림이 안 오거나 폰이 없을 때</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">폰 화면을 켜고 잠시 기다리기</div><div class=\"step-desc\">절전 상태의 폰은 알림이 몇 초 늦을 수 있습니다. 화면을 켜 보세요.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">폰의 인터넷·알림 확인</div><div class=\"step-desc\">Wi-Fi나 데이터가 켜져 있는지, 폰 설정에서 나비(Chrome) 알림이 꺼져 있지 않은지 확인하세요. 무음·방해 금지 모드에서는 소리가 나지 않지만 알림 창에는 표시됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">PC에서 \"다시 입력\"</div><div class=\"step-desc\">PC 화면의 \"다시 입력\"을 눌러 처음부터 다시 요청하면 새 알림이 옵니다. 이때 PC의 숫자도 새로 바뀝니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">\"문자로 받기\"</div><div class=\"step-desc\">알림이 오지 않을 때 PC 화면에 나타나는 \"문자로 받기\"를 누르면 폰으로 승인 링크가 문자로 갑니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">폰을 잃어버렸거나 바꿨다면</div><div class=\"step-desc\">PC 화면의 <strong>\"백업 키로 복구\"</strong>를 누르세요. 가입할 때 이메일로 받은 백업 키가 필요합니다(1장 \"폰을 바꾸거나 잃어버렸을 때\" 참고).</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-body\"><div class=\"mc-title\">알림이 늦거나 소리가 작다면</div>폰의 배터리 절약 설정이나 알림 설정 때문일 수 있습니다. 9장 \"알림이 늦게 오거나 안 올 때\"와 \"알림 소리가 작아서 못 들었다면\"을 따라 한 번만 설정해 두세요.</div></div>\n<h3>폰에서 로그인할 때는</h3>\n<p>폰에서는 PC처럼 숫자를 고르지 않습니다. 폰의 Chrome에서 naviweb.kr을 열고 <strong>로그인</strong> 탭에 번호를 입력하면, 그 번호로 <strong>인증번호 문자</strong>가 오고 폰이 자동으로 입력해 줍니다(1장의 \"문자 인증\"과 같은 방식). \"로그인\"을 누르면 끝납니다.</p>\n","quiz":[{"q":"PC에서 로그인할 때 로그인을 승인하는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["내 폰","PC 자신","고객센터","자동 승인"],"answer":0,"explain":"가입할 때 쓴 내 폰이 승인해야 PC가 로그인됩니다."},{"q":"PC 로그인 창에 입력하는 번호는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["주민등록번호","010을 뺀 폰 번호 뒤 8자리","폰 번호 전체 11자리와 비밀번호","이메일 주소"],"answer":1,"explain":"010을 제외한 뒤 8자리만 입력합니다. 예를 들어 010-1234-5678은 12345678입니다."},{"q":"PC 화면의 \"폰에서 승인하세요\"에 나타나는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["두 자리 숫자와 남은 시간","QR 코드 두 개","내 백업 키","비밀번호 입력칸"],"answer":0,"explain":"PC에는 두 자리 숫자와 남은 시간(초)이 보이고, 그 안에 폰에서 같은 숫자를 눌러야 합니다."},{"q":"폰에 숫자가 세 개 나타나면 어떻게 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["아무거나 누른다","모두 누른다","PC 화면에 보이는 숫자와 같은 것을 누른다","가장 큰 숫자를 누른다"],"answer":2,"explain":"PC 화면에 보이는 숫자와 같은 숫자를 눌러야 승인됩니다."},{"q":"내가 로그인을 시도하지 않았는데 폰에 로그인 알림이 왔다면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["일단 승인한다","알림을 무시하고 폰을 꺼 둔다","아무 숫자도 누르지 않는다","숫자를 SNS에 올린다"],"answer":2,"explain":"누르지 않으면 로그인되지 않습니다. 다른 사람이 내 번호로 시도한 것일 수 있으니 아무 숫자도 누르지 마세요."},{"q":"로그인 알림이 오지 않을 때 시도할 수 있는 방법이 아닌 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["PC에서 \"다시 입력\"으로 다시 요청","폰 화면을 켜고 인터넷·알림 확인","\"문자로 받기\"","다른 사람에게 인증 숫자를 알려 주고 대신 눌러 달라고 하기"],"answer":3,"explain":"숫자를 남에게 알려 주고 대신 누르게 하면 안 됩니다. 알림이 오지 않으면 다시 입력, 폰 확인, 문자로 받기를 시도하세요."},{"q":"폰을 잃어버려 승인할 폰이 없을 때 PC에서 쓰는 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["고객센터에 비밀번호 요청","새 번호로 다시 가입하기","기다리면 저절로 로그인된다","\"백업 키로 복구\"에 이메일로 받은 백업 키를 붙여넣기"],"answer":3,"explain":"PC 로그인 화면의 \"백업 키로 복구\"를 눌러 가입할 때 이메일로 받은 백업 키를 붙여넣으면 계정을 되찾을 수 있습니다."},{"q":"폰에서 로그인할 때는 어떻게 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["PC처럼 숫자 세 개 중 하나를 고른다","번호를 입력하면 인증번호 문자가 와서 자동 입력되고 \"로그인\"을 누른다","백업 키를 매번 입력한다","폰에서는 로그인할 수 없다"],"answer":1,"explain":"폰에서는 번호 입력 → 인증번호 문자(자동 입력) → 로그인 순서입니다. 숫자 고르기는 PC 로그인에서 씁니다."},{"q":"PC 로그인을 시작하면 폰에 오는 알림의 제목은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["서명 요청","광고 안내","업데이트 완료","결제 승인"],"answer":0,"explain":"폰에 \"서명 요청 — naviweb에서 서명을 요청했습니다\" 알림이 옵니다. 내가 PC에서 로그인을 시작했을 때만 누르세요."},{"q":"폰에서 숫자를 누른 뒤 폰이 요청하는 확인은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["지문(또는 얼굴) 확인","비밀번호 입력","주민등록번호 입력","이메일 인증번호 입력"],"answer":0,"explain":"숫자를 누르면 폰이 지문이나 Face ID 확인을 요청합니다."}],"placeholder":false},{"id":"ch_agent","tier":"beginner","title":"나비웹 도우미 설치하기","body":"<h2>나비웹 도우미 설치하기</h2>\n<p><strong>나비웹 도우미</strong>는 PC의 Chrome에 설치하는 작은 확장 프로그램입니다. 정부24 같은 기관 사이트를 <strong>대신 열고 눌러 주기</strong> 때문에, 서류를 가져오거나 가입 절차를 진행할 때 내가 할 일이 <strong>본인 인증과 결제</strong>만 남습니다. Chrome 웹 스토어에서 한 번만 설치하면 되고, 나비웹 안내서의 다른 기능(채팅, 로그인 등)은 도우미 없이도 쓸 수 있습니다.</p>\n<div class=\"md-container tonal-primary\"><div class=\"mc-body\"><div class=\"mc-title\">먼저 확인하세요</div>도우미는 <strong>PC의 Chrome</strong>에서만 설치합니다. 폰에서는 설치하지 않습니다. 이미 설치했다면 Chrome 오른쪽 위 퍼즐 아이콘에 나비웹 도우미가 보이므로 이 장은 건너뛰어도 됩니다.</div></div>\n<h3>설치 4단계 (1분이면 끝)</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">① 설치 링크 열기</div><div class=\"step-desc\">PC의 Chrome에서 나비웹이 안내하는 <strong>\"설치하기\"</strong>(나비웹의 도우미 설치 안내창, 계정 메뉴의 \"나비웹 도우미 설치\", 설정 → 계정의 \"설치하기\" 중 어느 것이든)를 누릅니다. Chrome 웹 스토어의 \"나비웹 도우미\" 페이지가 열립니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">② \"Chrome에 추가\" 누르기</div><div class=\"step-desc\">페이지 오른쪽 위의 파란 <strong>Chrome에 추가</strong> 단추를 누릅니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">③ \"확장 프로그램 추가\" 확인</div><div class=\"step-desc\">Chrome이 \"나비웹 도우미를 추가하시겠습니까?\"라고 물으면 <strong>확장 프로그램 추가</strong>를 누릅니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">④ naviweb.kr로 돌아가기</div><div class=\"step-desc\">주소창 오른쪽에 나비 아이콘이 생기고, 나비웹 화면 위쪽에 \"나비웹 도우미가 설치되었습니다.\"가 한 번 나타나면 끝입니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-body\"><div class=\"mc-title\">직접 검색해도 찾을 수 없어요</div>나비웹 도우미는 <strong>검색에는 나오지 않고</strong>, 나비웹이 알려 주는 링크로만 설치할 수 있습니다. 링크로 들어가야 정식 도우미를 받을 수 있으니, 비슷한 이름의 다른 확장 프로그램은 설치하지 마세요. 업데이트는 Chrome이 자동으로 해 주므로 다시 설치할 필요가 없습니다.</div></div>\n<h3>화면으로 따라가기</h3>\n<p>PC의 Chrome에서 아래 순서로 화면이 바뀝니다. 같은 모양이 보이면 설명대로 누르세요.</p>\n<h4>1단계. 나비웹의 설치 안내창에서 \"설치하기\"</h4>\n<p>나비웹(naviweb.kr)을 열었을 때 도우미가 없으면 아래와 같은 안내창이 저절로 나타납니다. 초록색 <strong>설치하기</strong>를 누르세요. 위쪽 \"나비웹 도우미 연결 안 됨 — 설치·켜기 안내\"를 눌러도 같은 창이 열립니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:640px\"><img src=\"manual-img/agent-1-install-guide.webp\" alt=\"나비웹의 도우미 설치 안내창\" loading=\"lazy\"><figcaption>\"나비웹 도우미가 보이지 않습니다\" — 전에 쓰던 도우미를 삭제했거나 꺼져 있을 때 나타납니다. 처음이라면 제목이 \"나비웹 도우미를 설치해 주세요\"로 보입니다.</figcaption></figure>\n<ul class=\"ch-tips\"><li>지금 하고 싶지 않으면 <strong>나중에</strong>를 누르세요. 하루 동안은 저절로 다시 뜨지 않습니다.</li><li>안내창을 닫았더라도 오른쪽 위 계정 메뉴(닉네임 옆 ⋮)의 <strong>나비웹 도우미 설치</strong>, 또는 설정 → 계정의 <strong>설치하기</strong>로 언제든 다시 설치할 수 있습니다.</li></ul>\n<h4>2단계. Chrome 웹 스토어에서 \"Chrome에 추가\"</h4>\n<p>새 탭에서 Chrome 웹 스토어의 \"나비웹 도우미\" 페이지가 열립니다. 오른쪽의 파란 <strong>Chrome에 추가</strong> 단추를 누르세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:640px\"><img src=\"manual-img/agent-2-store-page.webp\" alt=\"Chrome 웹 스토어의 나비웹 도우미 페이지\" loading=\"lazy\"><figcaption>나비웹 도우미 페이지. 단추 글자가 영어로 \"Add to Chrome\"으로 보이는 PC도 있습니다. 같은 단추입니다.</figcaption></figure>\n<ul class=\"ch-tips\"><li>웹 스토어 주소는 chromewebstore.google.com이고, 이름이 \"나비웹 도우미\"인지 확인하세요. 비슷한 이름의 다른 확장 프로그램은 설치하지 마세요.</li></ul>\n<h4>3단계. \"확장 프로그램 추가\" 누르기</h4>\n<p>Chrome이 \"나비웹 도우미를 추가하시겠습니까?\"라고 묻습니다. 오른쪽의 <strong>확장 프로그램 추가</strong>를 누르세요.</p>\n<figure class=\"ch-shot\" style=\"max-width:600px\"><img src=\"manual-img/agent-3-add-confirm.webp\" alt=\"확장 프로그램 추가 확인 창\" loading=\"lazy\"><figcaption>추가 확인 창. 아래 \"앱의 권한\" 두 줄이 보입니다. 취소하면 설치되지 않습니다.</figcaption></figure>\n<ul class=\"ch-tips\"><li><strong>\"모든 웹사이트에 있는 전체 내 데이터 읽기 및 변경\"</strong>은 도우미가 정부24 같은 기관 사이트의 화면을 보고 대신 눌러야 해서 Chrome이 모든 확장 프로그램에 똑같이 띄우는 문구입니다. 도우미는 비밀번호·인증서·주민등록번호를 모으거나 저장하지 않습니다.</li><li><strong>\"다운로드 관리\"</strong>는 기관 사이트에서 발급받은 서류 파일을 받아 나비웹에 넣기 위해 필요합니다.</li></ul>\n<h4>4단계. 도구 모음의 나비 아이콘 확인</h4>\n<p>설치되면 주소창 오른쪽 도구 모음에 노란 나비 아이콘이 생깁니다. 그리고 나비웹 화면 위쪽에 \"나비웹 도우미가 설치되었습니다.\"가 한 번 나타납니다.</p>\n<figure class=\"ch-shot\" style=\"max-width:320px\"><img src=\"manual-img/agent-4-toolbar-icon.webp\" alt=\"도구 모음의 나비웹 도우미 아이콘\" loading=\"lazy\"><figcaption>주소창 오른쪽의 노란 나비가 나비웹 도우미입니다. 아이콘이 안 보이면 퍼즐 모양 아이콘을 누르고 \"나비웹 도우미\" 옆 핀을 눌러 고정하세요.</figcaption></figure>\n<figure class=\"ch-shot\" style=\"max-width:440px\"><svg viewBox=\"0 0 440 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;display:block;border:1px solid #d1d5db;border-radius:12px;background:#f3f4f6\" role=\"img\"><rect x=\"20\" y=\"16\" width=\"400\" height=\"30\" rx=\"6\" fill=\"#e5e7eb\"/><text x=\"34\" y=\"36\" font-size=\"12\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">naviweb.kr</text><rect x=\"20\" y=\"58\" width=\"400\" height=\"38\" rx=\"8\" fill=\"#e6f4f1\" stroke=\"#00796b\"/><text x=\"220\" y=\"82\" font-size=\"14\" fill=\"#00695c\" text-anchor=\"middle\" font-weight=\"700\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">나비웹 도우미가 설치되었습니다.</text><text x=\"220\" y=\"140\" font-size=\"12\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\" font-family=\"Pretendard, Noto Sans KR, sans-serif\">(한 번만 나타나는 안내입니다)</text></svg><figcaption>⑤ 설치가 끝나면 naviweb.kr 화면 위쪽에 이 안내가 <strong>한 번만</strong> 나타납니다. 이후에는 설치하라는 안내가 다시 뜨지 않습니다.</figcaption></figure><ul class=\"ch-tips\"><li>설치 안내창이 떠 있던 나비웹 탭으로 돌아오면 자동으로 연결됩니다. 연결이 안 되면 그 탭을 새로고침(F5)하세요.</li></ul>\n<div class=\"md-container tonal-warn\"><div class=\"mc-body\"><div class=\"mc-title\">이런 것은 요청하지 않습니다</div>도우미는 주민등록번호, 계좌번호, 공동인증서 비밀번호를 <strong>절대 묻지 않습니다.</strong> 본인 인증과 결제는 기관 사이트 화면에서 <strong>내가 직접</strong> 합니다. 도우미라며 이런 정보를 입력하라는 창이 뜨면 입력하지 말고 닫으세요.</div></div>\n<h3>이렇게 쓰입니다</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">서류 가져오기</div><div class=\"step-desc\">서류 작성 화면에서 첨부서류의 \"도우미가 가져오기\"를 누르면 도우미가 기관 사이트를 새 탭으로 열고 단계마다 알려 줍니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">내가 할 일만 표시</div><div class=\"step-desc\">기관 사이트 위에 안내 띠나 팝업이 떠서, 지금 내가 해야 할 일(본인 인증, 결제 등)과 끝난 뒤 눌러야 할 버튼을 알려 줍니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">끝나면 이어서 진행</div><div class=\"step-desc\">내가 할 일을 마치면 도우미가 이어서 나머지를 진행하고, 받아 온 서류는 나비웹으로 돌아옵니다.</div></div></div>\n</div>\n<h3>잘 안 될 때</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">확장 프로그램이 꺼져 있다면</div><div class=\"step-desc\">주소창 오른쪽 퍼즐 아이콘 → \"확장 프로그램 관리\"에서 나비웹 도우미 스위치를 켜 보세요.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">아이콘이 안 보인다면</div><div class=\"step-desc\">퍼즐 아이콘을 누르고 나비웹 도우미 옆의 핀 모양을 눌러 고정하세요.</div></div></div>\n<div class=\"step-row\"><div class=\"step-body\"><div class=\"step-title\">설치했는데 또 설치하라고 나온다면</div><div class=\"step-desc\">naviweb.kr 탭을 새로 고침(F5)해 보세요. 그래도 같으면 확장 프로그램 관리 화면에서 도우미가 켜져 있는지 확인합니다.</div></div></div>\n</div>\n","quiz":[{"q":"나비웹 도우미는 어디에 설치하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["PC의 Chrome","폰의 문자 앱","PC의 메모장","폰의 카메라 앱"],"answer":0,"explain":"도우미는 PC의 Chrome 확장 프로그램입니다. 폰에는 설치하지 않습니다."},{"q":"도우미가 대신해 주는 일은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["기관 사이트를 열고 단계별로 눌러 주는 것","비밀번호를 대신 정해 주는 것","내 폰을 원격으로 조종하는 것","결제를 마음대로 하는 것"],"answer":0,"explain":"도우미는 기관 사이트에서 할 수 있는 일을 대신 진행하고, 내가 할 일은 본인 인증과 결제로 줄여 줍니다."},{"q":"도우미가 절대 묻지 않는 정보가 아닌 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["도우미가 가져올 서류의 종류 선택","주민등록번호","계좌번호","공동인증서 비밀번호"],"answer":0,"explain":"서류 종류 같은 선택은 단추로 물을 수 있지만, 주민등록번호·계좌번호·공동인증서 비밀번호는 묻지 않습니다."},{"q":"나비웹 도우미는 어떻게 설치하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["나비웹이 안내하는 링크로 Chrome 웹 스토어에서 \"Chrome에 추가\"","폰 앱 스토어에서 받는다","문자로 온 파일을 실행한다","카카오톡으로 받는다"],"answer":0,"explain":"나비웹이 안내하는 링크로 웹 스토어 페이지에 들어가 \"Chrome에 추가\"를 누르면 설치됩니다."},{"q":"웹 스토어에서 도우미를 검색하면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["검색에는 나오지 않고 안내 링크로만 설치한다","1번째로 나온다","유료로 판다","폰에서만 나온다"],"answer":0,"explain":"도우미는 비공개(링크 전용)라 검색에는 나오지 않습니다. 나비웹이 알려 주는 링크로만 설치하세요."},{"q":"설치가 끝났다는 신호는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["naviweb.kr 위쪽에 \"나비웹 도우미가 설치되었습니다.\"가 한 번 나타난다","폰이 진동한다","PC가 재부팅된다","메일이 온다"],"answer":0,"explain":"설치 직후 naviweb.kr 위쪽에 한 번만 나타나는 안내로 확인합니다."},{"q":"도우미가 정부24 등에서 내가 직접 해야 한다고 알려 주는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["본인 인증과 결제","모든 단계","글자 입력 전부","아무것도 없다"],"answer":0,"explain":"본인 인증과 결제는 내가 직접 하고, 나머지는 도우미가 진행합니다."},{"q":"도우미를 새 버전으로 바꾸려면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><line x1=\"12\" y1=\"18\" x2=\"12.01\" y2=\"18\"/></svg>","options":["Chrome이 자동으로 업데이트하므로 할 일이 없다","매번 ZIP을 받아 덮어쓴다","Chrome을 삭제했다가 다시 깐다","폰에서 다시 설치한다"],"answer":0,"explain":"웹 스토어로 설치한 확장 프로그램은 Chrome이 자동으로 업데이트합니다."}],"placeholder":false},{"tier":"beginner","title":"사람 찾기·호출하기","id":"ch2","body":"\n<div class=\"ch-hero\"><svg viewBox=\"0 0 400 180\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\">\n  <circle cx=\"200\" cy=\"90\" r=\"78\" fill=\"#eaf3fc\"/>\n  <g transform=\"translate(120,60)\">\n    <rect x=\"0\" y=\"0\" width=\"120\" height=\"30\" rx=\"15\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2.5\"/>\n    <circle cx=\"20\" cy=\"15\" r=\"6\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"2.2\"/>\n    <line x1=\"24.5\" y1=\"19.5\" x2=\"29\" y2=\"24\" stroke=\"#0c6cc3\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n    <rect x=\"40\" y=\"10\" width=\"60\" height=\"10\" rx=\"3\" fill=\"#dbeafe\"/>\n  </g>\n  <g transform=\"translate(70,110)\">\n    <circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2.2\"/>\n    <circle cx=\"14\" cy=\"10\" r=\"4.5\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"1.8\"/>\n    <path d=\"M6 21c0-4 3.5-6 8-6s8 2 8 6\" fill=\"none\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n  </g>\n  <g transform=\"translate(280,110)\">\n    <circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#fff\" stroke=\"#188038\" stroke-width=\"2.2\"/>\n    <circle cx=\"14\" cy=\"10\" r=\"4.5\" fill=\"none\" stroke=\"#188038\" stroke-width=\"1.8\"/>\n    <path d=\"M6 21c0-4 3.5-6 8-6s8 2 8 6\" fill=\"none\" stroke=\"#188038\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n  </g>\n  <path d=\"M98 120 Q200 90 266 120\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/>\n</svg></div>\n<h2>사람 찾기·호출하기</h2>\n<p>나비는 여러분의 AI 비서끼리만 대화하는 게 아니라, <strong>다른 사람과 직접 연결</strong>할 수도 있습니다. 닉네임이나 @handle로 검색해서 대화를 시작해 보세요.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">검색창은 어디에 있나요?</div>\n  화면 상단(또는 메뉴)의 검색 아이콘을 누르면 검색창이 뜹니다. 닉네임 일부만 입력해도 비슷한 이름이 함께 검색됩니다.</div>\n</div>\n\n<h3>검색부터 연결까지 4단계</h3>\n<div class=\"step-list\">\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">① 검색어 입력</div><div class=\"step-desc\">닉네임 또는 @handle을 입력합니다. @가 붙으면 정확히 그 handle 하나만, 없으면 비슷한 닉네임까지 함께 찾아줍니다.</div></div>\n    </div>\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">② 상세 필터(선택)</div><div class=\"step-desc\">결과가 너무 많으면 '상세 필터'를 펼쳐 국가코드(예: KR)나 지역(예: 서울)으로 좁힐 수 있습니다.</div></div>\n    </div>\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">③ 결과 확인</div><div class=\"step-desc\">닉네임과 handle이 함께 나열됩니다. 본인은 검색 결과에서 자동으로 제외됩니다.</div></div>\n    </div>\n  <div class=\"step-row\">\n      <div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 17l-3-3a2 2 0 0 1 0-3l4-4a2 2 0 0 1 3 0l1 1\"/><path d=\"M13 21l7-7\"/><path d=\"M2 12l5 5\"/><path d=\"M9 20l-3-3\"/></svg></div>\n      <div class=\"step-body\"><div class=\"step-title\">④ 연결 요청</div><div class=\"step-desc\">원하는 사람을 누르면 '연결 요청을 보내시겠습니까?' 확인창이 뜹니다. 동의하면 바로 대화가 시작됩니다.</div></div>\n    </div>\n</div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"10\" r=\"3\"/><path d=\"M12 2a8 8 0 0 0-8 8c0 5.25 8 13 8 13s8-7.75 8-13a8 8 0 0 0-8-8z\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">필터는 왜 필요한가요?</div>\n  흔한 닉네임은 동명이인이 많을 수 있습니다. 국가·지역 필터로 좁히면 원하는 사람을 더 빠르게 찾을 수 있습니다.</div>\n</div>\n\n<div class=\"md-container tonal-error\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">연결 후에는?</div>\n  연결이 성사되면 메인 화면에서 그 사람과의 대화창이 열립니다. 5장 \"메시지 주고받기\"에서 이어서 다룹니다.</div>\n</div>\n","quiz":[{"q":"검색어 앞에 @를 붙이면 어떻게 검색되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["더 많은 결과가 나온다","정확히 그 handle 하나만 검색된다","검색이 안 된다","국가별로 정렬된다"],"answer":1,"explain":"@가 붙으면 handle 정확 일치 검색이 되고, 없으면 닉네임·handle 부분 일치로 더 넓게 검색됩니다."},{"q":"검색 결과가 너무 많을 때 좁히는 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3\"/></svg>","options":["다시 로그인한다","상세 필터에서 국가·지역을 지정한다","앱을 재설치한다","방법이 없다"],"answer":1,"explain":"상세 필터를 펼쳐 국가코드나 지역을 입력하면 검색 범위를 좁힐 수 있습니다."},{"q":"검색 결과에 내 계정이 나오지 않는 이유는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>","options":["오류다","본인은 자동으로 결과에서 제외되기 때문","검색어를 잘못 입력해서","권한이 없어서"],"answer":1,"explain":"검색 로직이 내 handle과 일치하는 결과를 자동으로 걸러내므로, 본인은 목록에 뜨지 않습니다."}],"placeholder":false},{"tier":"beginner","title":"AI 비서 채팅 vs 다른 AI 호출","id":"ch3","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 400 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\">\n<rect x=\"20\" y=\"20\" width=\"160\" height=\"120\" rx=\"14\" fill=\"#eaf3fc\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<circle cx=\"100\" cy=\"60\" r=\"18\" fill=\"#fff\" stroke=\"#0c6cc3\" stroke-width=\"2\"/>\n<rect x=\"40\" y=\"90\" width=\"120\" height=\"10\" rx=\"5\" fill=\"#bfe0fb\"/>\n<rect x=\"40\" y=\"106\" width=\"80\" height=\"10\" rx=\"5\" fill=\"#bfe0fb\"/>\n<text x=\"100\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" fill=\"#0c6cc3\" font-weight=\"700\">내 AI 비서</text>\n<rect x=\"220\" y=\"20\" width=\"160\" height=\"120\" rx=\"14\" fill=\"#fef7e0\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<circle cx=\"300\" cy=\"60\" r=\"18\" fill=\"#fff\" stroke=\"#b06000\" stroke-width=\"2\"/>\n<rect x=\"240\" y=\"90\" width=\"120\" height
