v></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 서류 고르기</div><div class=\"step-desc\">목록에서 고르거나, 목록에 없으면 \"목록에 없는 서류\" 버튼으로 직접 요청합니다. 카메라 촬영이나 파일(PDF·DOCX·HWPX) 첨부로 양식을 보여 줄 수도 있습니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 대화로 단계 진행</div><div class=\"step-desc\">AI가 단계마다 묻고 채웁니다. 입력창은 대화가 길어지면 아래로 늘어납니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">④ 확인과 서명은 전문가</div><div class=\"step-desc\">완성된 서류의 최종 확인과 서명은 전문가 본인이 합니다.</div></div></div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">상단 탭과 안내띠</div>페이지 위쪽 탭에서 작업 화면과 방법론을 오갑니다. 방법론 탭에는 이 AI가 따르는 지침의 원문이 펼쳐져 있어 AI가 무슨 규칙으로 일하는지 직접 읽어 볼 수 있습니다. 노란 안내띠는 한 줄로 통합되어 있고, X로 다시 보지 않을 수 있습니다.</div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">서식이 쌓이는 방식</div>목록에 없는 서류의 양식을 올리면, <strong>동의 후 해당 직역 페이지에 게시되어</strong> 다른 이용자가 첨부 없이 같은 서식을 쓸 수 있습니다. 처음 올린 서식을 다른 이용자들이 높게 평가하면 GDC 보상을 받을 수 있습니다(보장은 아니며, 지급 여부와 기준은 운영 정책에 따릅니다). 쓰는 사람이 늘수록 쓸 수 있는 서식도 늘어납니다.</div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">AI가 하지 않는 일</div>AI는 전문가의 판단을 대신하지 않습니다. 의료 같은 임상 직역은 전문가가 지시한 내용만 서류에 적고, 진단·처방을 AI가 정하지 않습니다. 법령에 맞는지 점검하고 싶다면 \"법률 검토\" 탭(의견 보내기 장 참고)을 이용하세요.</div></div>","updated":"2026-10-24"},{"tier":"intermediate","title":"전문가 인증과 전문가용 AI — 준비 중","id":"ch_proverify","quiz":[{"q":"전문가 인증과 구독의 현재 상태는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["이미 시행 중이다","준비 중이다","폐지됐다","일반인에게 의무다"],"answer":1,"explain":"아직 준비 중이며 확정되면 이 장이 갱신됩니다."},{"q":"예정된 인증 방식은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["면허증 사본 업로드 후 관리자 수동 승인","전화 한 통","자동 승인","추천인 확인"],"answer":0,"explain":"면허증 사본을 올리면 관리자가 확인·승인합니다."},{"q":"전문가 구독이 생기면 종량제는 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["사라진다","병행한다(계획)","두 배가 된다","환불된다"],"answer":1,"explain":"종량제와 병행하는 것이 계획입니다."}],"body":"<h2>전문가 인증과 전문가용 AI — 준비 중</h2><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">아직 준비 중인 기능입니다</div>이 장은 <strong>예정된 흐름</strong>을 미리 알려 드립니다. 시행 시점과 조건이 확정되면 이 장을 갱신합니다. 지금 일반 사용에는 아무 변화가 없습니다.</div></div><p>전문가용 AI는 면허를 가진 전문가 본인과 소속 직원이 업무에 쓰는 도구입니다. 그래서 면허 보유를 먼저 확인하는 절차가 필요합니다.</p><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 인증 신청</div><div class=\"step-desc\">면허증 사본을 올려 인증을 신청합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 관리자 확인</div><div class=\"step-desc\">관리자가 확인한 뒤 승인하는 수동 방식입니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 전문가 세션 시작</div><div class=\"step-desc\">승인되면 전문가용 AI를 쓸 수 있는 세션이 열립니다.</div></div></div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">비용 계획</div>일반 사용의 종량제와 별도로, 직역 서비스는 <strong>연 구독(전문가·직원 각각 연 99,000원)</strong>을 병행할 계획입니다. 초기 결제는 입금을 사람이 확인하는 방식이며, 체험 기간도 계획되어 있습니다. 모두 확정 전 계획이며 바뀔 수 있습니다.</div></div>","updated":"2026-10-24"},{"tier":"intermediate","title":"학습 AI — 교수 페르소나와 과목별 학습","id":"ch_learning","quiz":[{"q":"교수 페르소나의 역할은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["서류 작성 대행","학문 분야를 1:1로 가르친다","결제 처리","메일 발송"],"answer":1,"explain":"학문 분야마다 1:1로 가르치는 AI입니다."},{"q":"학습을 시작하는 곳은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["과목별 학습 시작 페이지","설정 페이지","충전 페이지","프로필 페이지"],"answer":0,"explain":"과목마다 학습 시작 페이지가 있습니다."},{"q":"학습 트랙은 몇 단계 흐름인가요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["3단계","5단계","10단계","단계가 없다"],"answer":2,"explain":"10단계 흐름으로 진행됩니다."}],"body":"<h2>학습 AI — 교수 페르소나와 과목별 학습</h2><p>교수 페르소나는 학문 분야마다 1:1로 가르치는 AI입니다. 교수 페르소나 공통 페이지는 세무사 페이지와 같은 배치를 쓰고, 과목마다 <strong>학습 시작 페이지</strong>가 따로 있습니다.</p><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 과목 고르기</div><div class=\"step-desc\">학문 분야와 세부 과목을 고릅니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 학습 시작</div><div class=\"step-desc\">과목별 학습 시작 페이지에서 학습 트랙을 시작합니다. 학습은 10단계 흐름으로 진행됩니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 이어서 배우기</div><div class=\"step-desc\">대화로 이해한 만큼 이어 가며, 내 속도에 맞춰 설명받습니다.</div></div></div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">다른 전문가 AI와의 차이</div>전문가 AI는 서류 작성을 돕고, 교수 AI는 배우는 사람을 가르칩니다. 다만 교수 AI도 평가나 최종 확인을 대신하지는 않습니다.</div></div>","updated":"2026-10-24"},{"tier":"intermediate","title":"K-정부","id":"ch_kgov","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(35,35)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M25 0L2 12v3h46v-3z\"/><line x1=\"2\" y1=\"15\" x2=\"48\" y2=\"15\"/><line x1=\"6\" y1=\"15\" x2=\"6\" y2=\"40\"/><line x1=\"16\" y1=\"15\" x2=\"16\" y2=\"40\"/><line x1=\"26\" y1=\"15\" x2=\"26\" y2=\"40\"/><line x1=\"36\" y1=\"15\" x2=\"36\" y2=\"40\"/><line x1=\"46\" y1=\"15\" x2=\"46\" y2=\"40\"/><line x1=\"0\" y1=\"40\" x2=\"50\" y2=\"40\"/><line x1=\"0\" y1=\"44\" x2=\"50\" y2=\"44\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(160,38)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"2\" width=\"36\" height=\"34\" rx=\"2\"/><line x1=\"8\" y1=\"10\" x2=\"32\" y2=\"10\"/><line x1=\"8\" y1=\"18\" x2=\"32\" y2=\"18\"/><line x1=\"8\" y1=\"26\" x2=\"20\" y2=\"26\"/></g></svg></div>\n<h2>K-정부 — 대한민국 공공기관 전체 지도</h2>\n<p>K-정부는 대한민국의 입법·사법·행정부, 지방자치단체, 공기업, 공공기관을 한 곳에서 찾아볼 수 있는 AI 디렉토리입니다. 모든 부서까지 다 나열하지는 않고, 기관 명칭 위주로 안내합니다.</p>\n\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">K-서비스(18장)와 무엇이 다른가요?</div>K-서비스는 K-Law·K-Tax처럼 특정 \"기능\" 중심의 공익 서비스입니다. K-정부는 그 기능들이 실제로 속한 \"기관\" 자체를 찾아가는 디렉토리입니다 — 예를 들어 세금 신고는 K-Tax로 바로 가지만, \"국세청은 어떤 조직인가\"를 알고 싶을 때는 K-정부에서 국세청을 찾습니다.</div>\n</div>\n\n<h3>기관을 눌러 살펴보세요</h3>\n<p style=\"font-size:13px;color:var(--on-surface-variant);margin-bottom:8px\">카테고리 → 기관 → 부서 순으로 펼쳐집니다. 부서를 누르면 그 부서의 SP(System Prompt)를 바로 확인할 수 있습니다.</p>\n<div id=\"kgov-app\" class=\"kgov-app\"><div class=\"kgov-loading\">불러오는 중…</div></div>\n\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">부서 SP는 어떻게 만들어지나요?</div>입법부·사법부·행정부·지방자치단체의 부서 SP는 미리 파일로 만들어 둔 게 아니라, 공용 템플릿에 그 부서의 실사 데이터(부서명·소관업무 등)를 그 자리에서 채워 넣어 만듭니다 — 나비가 실제로 부서 AI를 필요할 때만 만드는 방식(지연 인스턴스화)과 같습니다. 반면 공기업·공공기관은 기관마다 이미 완성된 SP 파일이 있어 클릭하면 바로 열립니다. 지방자치단체는 16개 시도 중 15개는 시도 자체 정보가, 13개는 실·국 단위 부서까지 조사되어 있으며 나머지는 준비 중입니다.</div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">기관별 AI 페이지</div>기관의 AI를 전문가 페이지와 같은 모양으로 만나려면 중급 과정의 \"행정기관 AI 페이지와 접수 연동 민원\" 장을 참고하세요.</div></div>","quiz":[{"q":"K-정부와 K-서비스의 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["차이 없음","K-서비스는 기능 중심, K-정부는 기관 자체를 찾는 디렉토리","K-정부가 유료 서비스","K-서비스는 지방자치단체 전용"],"answer":1,"explain":"K-서비스는 K-Law·K-Tax 같은 기능 중심 서비스이고, K-정부는 그 기능이 속한 기관 자체를 찾아가는 디렉토리입니다."},{"q":"입법부·사법부·행정부·지방자치단체 부서의 SP는 어떻게 만들어지나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["기관마다 미리 만들어 둔 개별 파일을 연다","공용 템플릿에 그 부서의 실사 데이터를 즉석에서 채워 만든다","만들 수 없다","관리자가 매번 수작업으로 작성한다"],"answer":1,"explain":"나비의 지연 인스턴스화 원칙과 같은 방식으로, 공용 템플릿에 그 부서의 데이터를 채워 그 자리에서 SP를 만듭니다."},{"q":"공기업·공공기관 SP는 어떻게 확인하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/></svg>","options":["템플릿 치환이 필요하다","기관마다 이미 완성된 SP 파일을 바로 열람한다","확인할 방법이 없다","가입자만 볼 수 있다"],"answer":1,"explain":"공기업 30개·공공기관 254개는 기관마다 이미 완성된 SP 파일이 있어, 클릭하면 그 파일을 바로 열람할 수 있습니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"intermediate","title":"행정기관 AI 페이지와 접수 연동 민원","id":"ch_govagency","quiz":[{"q":"행정기관 AI 페이지에서 볼 수 없는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["작성된 문서","관계 법령","접수 연동 민원","다른 사람의 개인 민원 내용"],"answer":3,"explain":"개인의 민원 내용은 본인만 볼 수 있습니다."},{"q":"나비가 발급하는 접수번호는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["정부 공식 접수번호","나비 내부 접수번호","주민등록번호","결제 번호"],"answer":1,"explain":"공식 번호가 아니라 나비 내부 접수번호입니다."},{"q":"재량이나 법적 책임이 걸린 판단은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["AI가 단독 결정한다","담당 직원의 확인·승인을 거친다","신청자가 결정한다","무조건 반려된다"],"answer":1,"explain":"담당 직원의 확인·승인 단계를 둡니다."}],"body":"<h2>행정기관 AI 페이지와 접수 연동 민원</h2><p>K-정부에서 기관을 찾았다면, 행정기관 AI 페이지에서는 그 기관의 AI를 <strong>전문가 페이지와 같은 모양</strong>으로 만날 수 있습니다.</p><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 기관 페이지 열기</div><div class=\"step-desc\">행정기관 AI 페이지에서 기관을 고릅니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 작성된 문서와 관계 법령 보기</div><div class=\"step-desc\">그 기관 업무와 관련해 작성된 문서 목록과 근거가 되는 법령 목록을 볼 수 있습니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 접수 연동 민원 탭</div><div class=\"step-desc\">서버 접수와 연결된 민원이 모여 있어, 신청하면 접수번호까지 발급됩니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">접수번호와 직원 확인</div>나비가 발급하는 접수번호는 <strong>나비 내부 접수번호</strong>이며 정부의 공식 접수번호가 아닙니다. 재량이나 법적 책임이 걸린 판단은 담당 직원의 확인·승인을 거칩니다.</div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">조사가 진행 중입니다</div>제주시·서귀포시를 중심으로 부서별 업무와 근거 법령을 조사하고 있어, 기관·부서에 따라 아직 안내 수준에 머무는 업무가 있습니다. 폐지·개명된 법령은 점검을 거쳐 표시가 바뀔 수 있습니다.</div></div>","updated":"2026-10-24"},{"tier":"intermediate","title":"K-서비스 호출하기","id":"ch17","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></g></svg></div>\n<h2>K-서비스 호출하기</h2>\n<p>K-Law, K-Health, K-119처럼 정부·공공 성격의 AI 서비스를 K-서비스라고 부릅니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① K-서비스 목록 열기</div><div class=\"step-desc\">K-119·K-Law·K-Health·K-School·K-Tax·K-Market 등 다양한 서비스 탭이 나열됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 원하는 서비스 선택</div><div class=\"step-desc\">예를 들어 세금 문의는 K-Tax, 법률 업무 보조는 K-Law를 선택합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 바로 안내·처리</div><div class=\"step-desc\">공공 성격의 절차를 AI가 즉시 안내하거나 처리해줍니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">전문가 페르소나와 뭐가 다른가요?</div>전문가 페르소나(17장)는 개별 전문가 역할이고, K-서비스는 정부·공공기관 성격의 서비스라는 점이 다릅니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">K-Law를 쓸 때 알아 둘 점</div>K-Law의 주 이용자는 변호사이며, 결과는 참고용입니다. 인간 전문가의 확인이 필요합니다. 성능 수치를 읽는 법은 고급 과정의 \"K-Law 판결 예측\" 장에서 다룹니다.</div></div>","quiz":[{"q":"K-서비스의 성격은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/></svg>","options":["개인 전문가 역할","정부·공공기관 성격의 서비스","광고 플랫폼","게임"],"answer":1,"explain":"K-서비스는 K-Law, K-Health 등 정부·공공 성격의 AI 서비스입니다."},{"q":"세금 관련 문의에 적합한 K-서비스는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["K-119","K-Tax","K-School","K-Market"],"answer":1,"explain":"세금 관련 문의는 K-Tax를 이용합니다."},{"q":"K-서비스와 전문가 페르소나의 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"1\"/><line x1=\"9\" y1=\"8\" x2=\"9\" y2=\"8\"/><line x1=\"15\" y1=\"8\" x2=\"15\" y2=\"8\"/><line x1=\"9\" y1=\"13\" x2=\"9\" y2=\"13\"/><line x1=\"15\" y1=\"13\" x2=\"15\" y2=\"13\"/></svg>","options":["차이 없음","K-서비스는 공공 성격, 전문가 페르소나는 개별 전문가 역할","전문가 페르소나가 더 공공적","K-서비스는 유료만 가능"],"answer":1,"explain":"전문가 페르소나는 개별 전문가 역할, K-서비스는 정부·공공기관 성격이라는 차이가 있습니다."}],"placeholder":false,"updated":"2026-10-24"},{"tier":"intermediate","title":"K-서비스 전체 지도","id":"ch_kservicemap","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></g></svg></div><h2>K-서비스 전체 지도</h2><p>18장에서 K-Tax·K-Law·K-Health 몇 가지를 예시로 봤지만, 실제로는 <strong>스무 가지가 넘는 K-서비스</strong>가 있습니다. K-정부(17장 다음)가 \"기관\"을 찾는 지도라면, 이 지도는 \"기능\"을 찾는 지도입니다.</p><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">카테고리로 나뉘어 있습니다</div>생활(K-Health·K-School·K-Market), 행정(K-Law·K-Tax·K-Public·K-Police), 업무 실행(K-Plan·K-Compose·K-Execute·K-Deliver·K-Job·K-Mail), 감시·안전(K-Watch·K-119·K-Security), 물류·이동(K-Logistics·K-Traffic) 등으로 나뉘어 있습니다.</div></div><h3>기능 중심으로 찾는 법</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 하고 싶은 일을 먼저 떠올리기</div><div class=\"step-desc\">\"이메일 보내기\", \"이직 준비\", \"일정 여러 단계 계획\" 처럼 목적을 먼저 생각합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 해당 카테고리에서 찾기</div><div class=\"step-desc\">목적에 맞는 카테고리(생활/행정/업무 실행 등)를 열어 후보를 봅니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 안 찾아도 됩니다</div><div class=\"step-desc\">내 AI 비서에게 그냥 말해도 됩니다 — 5장에서 다뤘듯, 필요한 K-서비스를 비서가 알아서 찾아 연결해줄 때가 많습니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">몇몇 K-서비스는 서로 연결돼 있습니다</div>K-Plan(상위 계획)이 목표를 세우면 K-Compose·K-Execute·K-Deliver·K-Report 순서로 실제 실행을 이어받는 구조가 많습니다. 예를 들어 K-Job(구직 실행)이나 K-Mail(메일 발송)은 이 체인 위에서 동작합니다 — 다음 두 장에서 각각 자세히 다룹니다.</div></div>","quiz":[{"q":"K-정부와 K-서비스 전체 지도의 차이는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["차이 없음","K-정부는 기관을 찾는 지도, K-서비스 지도는 기능을 찾는 지도","K-서비스가 유료 전용","K-정부는 검색이 안 됨"],"answer":1,"explain":"K-정부는 '어느 기관인가'를, K-서비스 지도는 '어떤 기능이 필요한가'를 기준으로 찾는 지도입니다."},{"q":"K-서비스를 굳이 직접 찾지 않아도 되는 이유는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>","options":["K-서비스가 존재하지 않아서","내 AI 비서가 필요시 알아서 연결해줄 수 있어서","항상 유료라서","검색 기능이 없어서"],"answer":1,"explain":"5장에서 다뤘듯 내 AI 비서에게 그냥 요청하면 필요한 K-서비스를 대신 찾아 연결해줄 수 있습니다."},{"q":"K-Plan이 세운 목표를 실제로 실행하는 체인에 속하지 않는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["K-Compose","K-Execute","K-Deliver","K-Watch"],"answer":3,"explain":"K-Compose→K-Execute→K-Deliver→K-Report가 K-Plan의 실행 체인이며, K-Watch는 감시·안전 카테고리의 별개 서비스입니다."}]},{"tier":"intermediate","title":"K-Mail — 말로 메일 보내기","id":"ch_kmail","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"/><polyline points=\"22 6 12 13 2 6\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></g></svg></div><h2>K-Mail — 말로 메일 보내기</h2><p>나비 가입자는 각자 고유 메일 주소(<code>&lt;내 GUID&gt;@hondi.kr</code>)를 갖습니다. \"누구누구한테 메일 보내줘\"라고 말하면 K-Mail이 초안부터 발송까지 처리합니다.</p><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"/><polyline points=\"22 6 12 13 2 6\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">할 수 있는 일</div>즉시 발송뿐 아니라 예약 발송, 여러 명에게 각자 다른 맞춤 본문 보내기, 회신을 정해진 시각까지 모아 다이제스트로 정리하기, 주소록 자동 등록·검색까지 가능합니다.</div></div><h3>사용 흐름</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 대화로 요청</div><div class=\"step-desc\">\"OOO한테 회의 일정 물어보는 메일 보내줘\"처럼 자연어로 요청합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"/><polyline points=\"22 6 12 13 2 6\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 초안 확인 후 발송</div><div class=\"step-desc\">AI가 만든 초안을 확인하고, 즉시 또는 원하는 시각에 발송합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 주소록·회신 관리</div><div class=\"step-desc\">보낸 상대는 자동으로 주소록에 등록되고, 회신이 오면 다이제스트로 모아 보여줍니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">K-Mail끼리도 대화할 수 있습니다</div>11장에서 다룬 \"AI와 AI의 대화\"가 여기서도 적용됩니다 — 상대방도 K-Mail을 쓴다면, 사람이 며칠씩 주고받던 일정 조율을 K-Mail끼리 직접 여러 차례 주고받아 훨씬 빠르게 끝낼 수 있습니다.</div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">관리자용 공문 시스템과는 다릅니다</div>정부 공문을 다루는 gov-mail(hondi.org)은 관리자 전용으로 완전히 별개 시스템입니다 — K-Mail은 개인 사용자를 위한 메일 비서입니다.</div></div>","quiz":[{"q":"K-Mail로 메일을 보내는 기본적인 방법은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>","options":["메일 앱을 따로 설치","자연어로 요청하면 AI가 초안·발송 처리","직접 HTML 코드 작성","불가능함"],"answer":1,"explain":"'누구누구한테 메일 보내줘'처럼 자연어로 요청하면 K-Mail이 초안부터 발송까지 처리합니다."},{"q":"K-Mail로 보낸 상대는 어떻게 되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["기록되지 않음","자동으로 주소록에 등록됨","삭제됨","별도 승인 필요"],"answer":1,"explain":"메일을 보낸 상대는 자동으로 주소록에 등록되어 이후 검색·재사용할 수 있습니다."},{"q":"상대방도 K-Mail을 쓸 때 벌어지는 일은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg>","options":["아무 차이 없음","K-Mail끼리 직접 여러 차례 주고받으며 조율 속도가 빨라짐","오류가 발생함","메일이 차단됨"],"answer":1,"explain":"11장의 AI-AI 대화 원리처럼, K-Mail끼리 직접 조율해 사람이 며칠 걸리던 일을 빠르게 끝낼 수 있습니다."}]},{"tier":"intermediate","title":"K-Job — 구직 활동을 실행하는 AI","id":"ch_kjob","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></g></svg></div><h2>K-Job — 구직 활동을 실행하는 AI</h2><p>K-Job은 \"이직하고 싶다\"는 목표가 이미 구직 활동으로 확정된 뒤, 실제 지원서 작성·연습까지 실행하는 AI입니다. 설명만 하고 끝내지 않고 실제 초안·기록을 만들어냅니다.</p><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">K-Plan과의 관계</div>K-Plan은 \"이직이 지금 타당한 선택인지\"부터 따지는 상위 계획 AI이고, K-Job은 그 목표가 확정된 뒤의 실행 담당입니다 — K-Plan 없이 K-Job을 바로 불러도 동작합니다.</div></div><h3>사용 흐름</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 채용 공고 전달</div><div class=\"step-desc\">지원하고 싶은 공고나 요청을 K-Job에게 전달합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6z\"/><polyline points=\"22 6 12 13 2 6\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 지원서 초안·연습</div><div class=\"step-desc\">자기소개서·이력서 초안을 만들고, 필요하면 면접 연습까지 진행합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 결과를 기록하고 배웁니다</div><div class=\"step-desc\">서류·면접 결과가 PDV(13장)에 기록되면, 무엇이 잘못됐는지(문서 설계·표현·외부 변수) 자동으로 분석해 다음 지원에 반영합니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">내 경험이 다른 사람에게도 도움이 됩니다</div>이 분석에서 나온 교훈은 이름·회사명 등 개인 식별 정보를 뺀 채 패턴만 모아, 다른 사용자의 K-Job도 참고할 수 있는 공용 학습 자료로 쌓입니다.</div></div>","quiz":[{"q":"K-Job과 K-Plan의 관계는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/></svg>","options":["완전히 같은 서비스","K-Plan은 목표 타당성 검토, K-Job은 확정된 목표의 실행 담당","K-Job이 K-Plan의 상위 개념","서로 무관함"],"answer":1,"explain":"K-Plan 없이도 K-Job은 단독으로 동작하며, 이미 구직으로 확정된 목표를 실제로 실행합니다."},{"q":"서류·면접 결과가 기록되면 K-Job이 하는 일은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["아무것도 안 함","결과를 자동 분석해 다음 지원에 반영","기록을 삭제함","다른 서비스로 이관"],"answer":1,"explain":"결과가 PDV에 기록되면 문서 설계·표현·외부 변수 중 무엇이 문제였는지 자동 분석해 재발을 막습니다."},{"q":"K-Job의 학습 결과가 다른 사용자에게도 도움이 되는 방식은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["개인정보를 그대로 공유","이름·회사명을 뺀 비식별 패턴으로 공용 저장소에 축적","공유되지 않음","유료 판매"],"answer":1,"explain":"개인 식별 정보를 제외한 비식별화된 패턴만 집단 학습 저장소에 쌓여 다른 사용자의 K-Job도 참고할 수 있습니다."}]},{"tier":"intermediate","title":"여러 K-서비스, 한 번의 로그인으로","id":"ch_ksso","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></g></svg></div><h2>여러 K-서비스, 한 번의 로그인으로</h2><p>K-Law·K-Plan·K-Mail처럼 각자 전용 화면(klaw.hondi.net, plan.hondi.net, mail.hondi.net)을 가진 K-서비스들은, 한 번만 로그인하면 <strong>세션을 서로 공유</strong>합니다.</p><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 따로 로그인 안 해도 되나요?</div>공용 인증 모듈(k-service-auth-client.js)이 여러 K-서비스 사이의 로그인 상태를 공유합니다 — K-Law에서 이미 로그인했다면 K-Mail로 넘어가도 다시 인증할 필요가 없습니다.</div></div><h3>동작 방식</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 아무 K-서비스에서 먼저 로그인</div><div class=\"step-desc\">어느 K-서비스든 첫 화면은 로그인 없이 열리고, 실제 기능을 쓰려는 순간 인증을 요구합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 다른 K-서비스로 이동</div><div class=\"step-desc\">다른 K-서비스 화면으로 넘어가도 이미 인증된 상태가 그대로 유지됩니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 로그아웃도 함께</div><div class=\"step-desc\">한 곳에서 로그아웃하면 공유된 세션 전체가 함께 종료됩니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">모든 K-서비스가 대상은 아닙니다</div>이 공유 인증은 klaw.hondi.net·plan.hondi.net·mail.hondi.net처럼 전용 서브도메인을 가진 K-서비스 사이에 적용됩니다. 대시보드 안에서 곧바로 열리는 K-서비스는 애초에 대시보드 로그인을 그대로 씁니다.</div></div>","quiz":[{"q":"K-Law에서 로그인한 뒤 K-Mail로 이동하면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48\"/></svg>","options":["다시 로그인해야 함","이미 인증된 상태가 유지됨","자동으로 로그아웃됨","이동이 불가능함"],"answer":1,"explain":"공용 인증 모듈이 세션을 공유해 여러 K-서비스 사이를 다시 로그인 없이 오갈 수 있습니다."},{"q":"한 K-서비스에서 로그아웃하면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>","options":["그 서비스만 로그아웃되고 나머지는 유지","공유된 세션 전체가 함께 종료","아무 변화 없음","계정이 삭제됨"],"answer":1,"explain":"세션을 공유하는 구조라, 한 곳에서 로그아웃하면 공유된 세션 전체가 함께 끝납니다."},{"q":"이 통합 로그인이 적용되는 대상은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["나비의 모든 화면 예외 없이","전용 서브도메인을 가진 K-서비스들 사이","전문가 페르소나 채팅만","해당 없음"],"answer":1,"explain":"klaw.hondi.net·plan.hondi.net·mail.hondi.net처럼 전용 서브도메인을 가진 K-서비스 사이에 적용됩니다."}]},{"tier":"intermediate","title":"의견 보내기 — 제안·질문 페이지와 법률 검토 탭","id":"ch_suggest","quiz":[{"q":"제안·질문 게시판에는 어떤 글이 기록되나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["입력한 모든 글","대화로 의도를 확인한 제안·질문","관리자가 쓴 글만","기록되지 않는다"],"answer":1,"explain":"대화로 의도가 확인된 제안·질문만 기록됩니다."},{"q":"어떤 입력 방식을 고를지 모르겠다면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["\"자동 구분\"","쓸 수 없다","\"관리자\"","\"삭제\""],"answer":0,"explain":"자동 구분이 제안인지 질문인지 알아서 가려 줍니다."},{"q":"법률 검토 탭의 결과는 무엇을 대체할 수 있나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg>","options":["인간 변호사 자문을 완전히 대체한다","참고용이며 인간 변호사 자문을 대체할 수 없다","판결을 대신한다","세금을 대신 낸다"],"answer":1,"explain":"참고용이며 인간 변호사 자문을 대체할 수 없습니다."}],"body":"<h2>의견 보내기 — 제안·질문 페이지와 법률 검토 탭</h2><p>전문가 페이지 위쪽 버튼으로 <strong>제안·질문 페이지</strong>를 열 수 있습니다. 불편한 점, 바라는 기능, 궁금한 점을 대화로 남기는 곳입니다.</p><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 입력 방식 고르기</div><div class=\"step-desc\">\"자동 구분\", \"제안\", \"질문\" 중에서 고릅니다. 모르겠으면 자동 구분이면 됩니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② AI와 대화</div><div class=\"step-desc\">AI가 말씀하신 의도를 대화로 확인합니다. 질문에는 최신 개발 현황을 담은 저장소 요약을 바탕으로 답합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 게시판 확인</div><div class=\"step-desc\">대화로 의도가 확인된 제안·질문만 게시판에 기록되며, 최신 글이 위에 옵니다. 전체/제안/질문으로 걸러 볼 수 있습니다.</div></div></div></div><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">법률 검토 탭</div>전문가 페이지에서 \"법률 검토\" 모드로 전환하면, 해당 직역의 업무와 서류를 법령 관점에서 AI와 점검할 수 있습니다. 화면에는 <strong>참고용이며 인간 변호사 자문을 대체할 수 없다</strong>는 안내가 함께 표시됩니다.</div></div>","updated":"2026-10-24"},{"tier":"advanced","title":"지식 노동의 자동화 — 사람과 AI의 분업 체계","id":"ch18","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></g></svg></div>\n<h2>지식 노동의 자동화 — 사람과 AI의 분업 체계</h2>\n<p>반복적이고 정형화된 지식노동(문서 정리, 자료 조사, 1차 응대)은 AI가 처리하고, 판단과 책임이 필요한 부분은 사람이 맡습니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">AI가 맡는 일</div><div class=\"step-desc\">자료 취합, 초안 작성, 반복 질의응답, 서류 검토 1차 스크리닝.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">사람이 맡는 일</div><div class=\"step-desc\">최종 판단, 감정적 소통, 창의적 의사결정, 책임 있는 승인.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">효율은 어떻게 오르나요</div><div class=\"step-desc\">AI가 반복 작업을 덜어주면 사람은 더 가치 있는 일에 집중할 시간이 늘어납니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">AI가 사람을 대체하나요?</div>완전히 대체하기보다, 반복 작업을 넘겨받아 사람이 더 중요한 일에 집중하게 돕는 분업 구조에 가깝습니다.</div></div>\n","quiz":[{"q":"AI가 주로 맡는 지식노동은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"/><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v4\"/><line x1=\"8\" y1=\"16\" x2=\"8\" y2=\"16\"/><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"16\"/></svg>","options":["최종 책임 승인","반복적 자료 취합·초안 작성","감정적 상담","창의적 의사결정"],"answer":1,"explain":"정형화되고 반복적인 작업은 AI가 처리합니다."},{"q":"사람이 계속 맡아야 하는 영역은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>","options":["단순 반복 작업","최종 판단과 책임있는 승인","자료 취합","서류 스캔"],"answer":1,"explain":"판단과 책임이 필요한 영역은 여전히 사람의 몫입니다."},{"q":"이 분업 구조의 목적은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["사람을 완전히 대체","사람이 더 중요한 일에 집중하도록 돕는 것","AI 사용을 줄이는 것","무작위 배분"],"answer":1,"explain":"AI가 반복 작업을 맡아 사람이 가치 있는 일에 집중할 수 있게 합니다."}],"placeholder":false},{"tier":"advanced","title":"나비마켓 — AI 도구를 사고파는 오픈 마켓플레이스","id":"ch19","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></g></svg></div>\n<h2>나비마켓 — AI 도구를 사고파는 오픈 마켓플레이스</h2>\n<p>필요한 AI 도구를 사고파는 나비의 오픈 마켓플레이스입니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 도구 탐색</div><div class=\"step-desc\">필요한 AI 도구·SP를 검색하거나 카테고리별로 둘러봅니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"4\" width=\"22\" height=\"16\" rx=\"2\"/><line x1=\"1\" y1=\"10\" x2=\"23\" y2=\"10\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② GDC로 구매</div><div class=\"step-desc\">마음에 드는 도구를 GDC로 즉시 구매합니다(16장 참고).</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 판매도 가능</div><div class=\"step-desc\">내가 만든 AI 도구를 등록해 판매자가 될 수도 있습니다 — 20장부터 이어지는 재무·신용 체계가 여기서 시작됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">판매자가 되면 무엇이 달라지나요?</div>거래 실적이 쌓이고 구매자 리뷰를 받으면서 나비 온도(10장)가 오르내리기 시작합니다.</div></div>\n","quiz":[{"q":"나비마켓에서 거래되는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>","options":["중고 가전","AI 도구","부동산","자동차"],"answer":1,"explain":"나비마켓은 AI 도구를 사고파는 오픈 마켓플레이스입니다."},{"q":"나비마켓 결제 수단은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"4\" width=\"22\" height=\"16\" rx=\"2\"/><line x1=\"1\" y1=\"10\" x2=\"23\" y2=\"10\"/></svg>","options":["현금","GDC","포인트카드","상품권"],"answer":1,"explain":"GDC로 즉시 구매할 수 있습니다."},{"q":"나비마켓 판매자가 되면 영향을 받는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["나비 온도","전화번호","생년월일","아무 영향 없음"],"answer":0,"explain":"구매자 리뷰에 따라 나비 온도가 오르내리게 됩니다."}],"placeholder":false},{"tier":"advanced","title":"나비마켓 판매자의 재무제표 자동 생성","id":"ch20","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></g></svg></div>\n<h2>나비마켓 판매자의 재무제표 자동 생성</h2>\n<p>나비마켓에서 물건을 팔면, 거래 기록이 PDV에 쌓이고 이를 바탕으로 <strong>재무제표가 자동으로 작성</strong>됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 거래 기록 축적</div><div class=\"step-desc\">판매·매입 내역이 GDC 결제와 함께 자동 기록됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 재무제표 생성</div><div class=\"step-desc\">손익계산서·대차대조표·현금흐름표 세 가지가 자동으로 만들어집니다. 재판매용으로 사입한 상품은 재고자산으로 잡혔다가, 실제로 팔리는 시점에만 매출원가로 반영됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 신뢰의 근거가 됨</div><div class=\"step-desc\">이 재무제표가 21장 \"신용 평가\"의 기초 자료가 됩니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">영수증을 따로 정리해야 하나요?</div>아니요 — 7장에서 다룬 카메라로 영수증만 찍어 보내면 자동으로 반영됩니다.</div></div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">이 재무제표, 조작된 건 아닌지 확인할 수 있나요?</div>네 — 재무제표가 바뀔 때마다 그 내용의 해시가 Openhash(29장)에 함께 기록됩니다. 대시보드 손익계산서 탭의 “지금 검증” 버튼을 누르면, 지금 보이는 숫자가 그 기록된 해시와 실제로 일치하는지 바로 확인할 수 있습니다.</div></div>\n","quiz":[{"q":"나비마켓 판매자의 재무제표는 어떻게 만들어지나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["직접 엑셀 작성","거래 기록 기반 자동 생성","세무사에게 의뢰만 가능","만들 수 없음"],"answer":1,"explain":"GDC 거래 기록을 바탕으로 AI가 자동으로 재무제표를 생성합니다."},{"q":"영수증은 어떻게 반영하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg>","options":["직접 타이핑","카메라로 촬영해 전송","우편 발송","반영 불가"],"answer":1,"explain":"7장에서 다룬 카메라 기능으로 영수증을 찍으면 자동 반영됩니다."},{"q":"이 재무제표는 어디에 쓰이나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg>","options":["아무 데도 안 쓰임","신용 평가의 기초 자료","광고용","없음"],"answer":1,"explain":"다음 장인 신용 평가의 기초 자료로 활용됩니다."}],"placeholder":false},{"tier":"advanced","title":"구매자의 재무제표도 자동 생성됩니다","id":"ch_fs_buyer_symmetric","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></g></svg></div>\n<h2>구매자의 재무제표도 자동 생성됩니다</h2>\n<p>20장에서는 <strong>판매자</strong>의 재무제표가 거래 기록으로 자동 생성되는 걸 봤습니다. 지금은 <strong>구매자</strong> 쪽도 똑같이 자동으로 반영됩니다 — 나비마켓에서 물건을 샀다면, 그 지출이 내 재무제표의 매입(비용) 항목에 자동으로 잡힙니다.</p>\n<div class=\"md-container tonal-primary\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">모든 사업자는 팔기도, 사기도 합니다</div>재료를 사고 상품을 파는 게 정상적인 장사이듯, 나비마켓에서 활동하는 계정도 파는 쪽 기록만 있고 사는 쪽 기록이 없으면 재무제표가 반쪽짜리가 됩니다. 그래서 이제는 앞장의 PDV 거래명세서(양방향 기록)를 바탕으로, 구매·판매 양쪽 다 재무제표에 반영됩니다.</div>\n</div>\n<h3>재무제표 탭에서 확인하는 법</h3>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 손익계산서 열기</div><div class=\"step-desc\">대시보드의 \"재무제표\" 탭에서 손익계산서를 엽니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 매입 항목 확인</div><div class=\"step-desc\">내가 구매자로서 지출한 금액이 매입 항목에 자동으로 쌓여 있습니다 — 직접 입력할 필요가 없습니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><polyline points=\"9 12 11 14 15 10\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 필요하면 무결성 검증</div><div class=\"step-desc\">이 매입 내역도 ch_fsverify에서 다룬 것과 동일한 방식으로 Openhash에 기록되어, \"지금 검증\" 버튼으로 조작 여부를 확인할 수 있습니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\">\n  <div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div>\n  <div class=\"mc-body\"><div class=\"mc-title\">21장의 신용 평가에도 영향을 주나요?</div>네 — 지출(매입) 내역도 재무제표의 일부라, 21장에서 다룬 신용 평가에 함께 반영됩니다. 꾸준히 사고파는 활동 이력 자체가 신뢰의 근거가 됩니다.</div>\n</div>\n","quiz":[{"q":"구매자로서 물건을 사면 재무제표에 무엇이 잡히나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg>","options":["아무것도 안 잡힘","매입(비용) 항목","매출 항목","세금 항목만"],"answer":1,"explain":"구매자로서 지출한 금액은 손익계산서의 매입(비용) 항목에 자동으로 반영됩니다."},{"q":"이 매입 항목을 직접 입력해야 하나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["예, 매번 직접 입력","아니요, 거래 기록에서 자동 반영","세무사에게 요청해야 함","불가능함"],"answer":1,"explain":"PDV에 남은 거래 기록을 바탕으로 자동으로 재무제표에 반영되어, 직접 입력할 필요가 없습니다."},{"q":"구매자의 지출 내역이 영향을 주는 것은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>","options":["신용 평가","나비 온도의 시작값","가입 절차","없음"],"answer":0,"explain":"지출 내역도 재무제표의 일부로 21장에서 다룬 신용 평가에 함께 반영됩니다."}],"placeholder":false},{"tier":"advanced","title":"재무제표 무결성 검증 — 조작 여부 확인하기","id":"ch_fsverify","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#e6f4ea\"/><g transform=\"translate(162,42)\" stroke=\"#188038\" stroke-width=\"1.8\" fill=\"none\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><polyline points=\"9 12 11 14 15 10\"/></g></svg></div><h2>재무제표 무결성 검증 — 조작 여부 확인하기</h2><p>20장에서 자동 생성된 재무제표는 바뀔 때마다 그 내용의 해시(지문 같은 고유 값)가 Openhash(29장)에 함께 기록됩니다. 이 장에서는 \"지금 보이는 숫자가 정말 그 기록과 일치하는가\"를 직접 확인하는 방법을 다룹니다.</p><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><polyline points=\"9 12 11 14 15 10\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">왜 검증이 필요한가요?</div>재무제표는 21장의 신용 평가, 24장의 세금 계산처럼 중요한 판단의 근거가 됩니다. 그 숫자가 중간에 조작되지 않았다는 걸 스스로 확인할 수 있어야, 그 위에 쌓이는 모든 판단을 믿을 수 있습니다.</div></div><h3>대시보드에서 직접 검증하기</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h16v20l-4-2-4 2-4-2-4 2z\"/><line x1=\"8\" y1=\"7\" x2=\"16\" y2=\"7\"/><line x1=\"8\" y1=\"11\" x2=\"16\" y2=\"11\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 재무제표 탭 열기</div><div class=\"step-desc\">대시보드의 \"재무제표\" 탭에서 손익계산서·대차대조표·현금흐름표 중 확인하고 싶은 걸 엽니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><polyline points=\"9 12 11 14 15 10\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② \"지금 검증\" 버튼 누르기</div><div class=\"step-desc\">무결성 검증 카드의 버튼을 누르면, 지금 화면의 숫자로 해시를 다시 계산해 기록된 해시와 비교합니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 결과 확인</div><div class=\"step-desc\">\"데이터↔해시 일치\", \"앵커↔머클루트 일치\" 두 가지가 모두 \"예\"로 나오면 조작되지 않았다는 뜻입니다.</div></div></div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">\"아직 앵커링 전\"이라고 나온다면?</div>재무제표가 방금 바뀌었다면, Openhash에 기록되기까지 최대 10분 정도 걸릴 수 있습니다 — 오류가 아니라 정상적인 대기 상태입니다. 잠시 후 다시 확인해 보세요.</div></div><div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">검증에 실패하면 무슨 뜻인가요?</div>데이터와 해시가 일치하지 않거나 앵커 기록을 찾을 수 없다면, 화면에 보이는 재무제표가 실제 기록과 달라졌을 수 있다는 신호입니다 — 그 재무제표를 근거로 한 신용 평가·세금 계산을 그대로 신뢰하지 말고 다시 확인해야 합니다.</div></div>","quiz":[{"q":"재무제표 무결성 검증에서 확인하는 두 가지는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><polyline points=\"9 12 11 14 15 10\"/></svg>","options":["글자 크기와 색상","데이터↔해시 일치, 앵커↔머클루트 일치","가입 날짜와 온도","닉네임과 프로필 사진"],"answer":1,"explain":"화면의 데이터로 다시 계산한 해시가 기록된 해시와 일치하는지, 그 해시가 앵커(머클루트)와도 일치하는지 두 가지를 확인합니다."},{"q":"\"아직 앵커링 전\"이라는 결과가 나오면?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>","options":["데이터가 조작됨","방금 바뀐 재무제표가 기록되기까지 대기 중인 정상 상태","오류이므로 신고해야 함","계정이 잠김"],"answer":1,"explain":"Openhash 기록까지 최대 10분 정도 걸릴 수 있어, 방금 바뀐 데이터는 잠시 후 다시 확인하면 됩니다."},{"q":"검증에 실패했을 때 해야 할 일은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"M21 2l-9.6 9.6M15.5 7.5L18 5M18 5l2 2M18 5l3 3\"/></svg>","options":["무시하고 넘어간다","그 재무제표를 근거로 한 판단(신용 평가·세금 계산 등)을 다시 확인한다","앱을 재설치한다","계정을 삭제한다"],"answer":1,"explain":"검증 실패는 화면 데이터가 실제 기록과 달라졌을 수 있다는 신호이므로, 그 위에 쌓인 판단을 그대로 신뢰하면 안 됩니다."}]},{"tier":"advanced","title":"재무제표 기반 신용 평가","id":"ch21","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(42,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(162,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></g></svg></div>\n<h2>재무제표 기반 신용 평가</h2>\n<p>자동 생성된 재무제표와 나비 온도(10장)를 종합해 신용 등급이 산정됩니다.</p>\n<div class=\"step-list\">\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 재무 데이터 분석</div><div class=\"step-desc\">매출 안정성, 거래 빈도, 수익성을 AI가 분석합니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 나비 온도 반영</div><div class=\"step-desc\">거래 신뢰도(온도)도 신용 평가에 함께 반영됩니다.</div></div></div>\n<div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">③ 등급 산정</div><div class=\"step-desc\">종합 점수로 신용 등급이 매겨지고, 22장의 채권 이자율에 영향을 줍니다.</div></div></div>\n</div>\n<div class=\"md-container tonal-warn\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">기존 은행 신용평가와 다른 점</div>서류를 따로 제출할 필요 없이, 이미 쌓인 실제 거래 데이터를 근거로 평가한다는 점이 다릅니다.</div></div>\n","quiz":[{"q":"신용 평가에 반영되는 두 가지 요소는?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg>","options":["재무제표와 나비 온도","나이와 성별","거주지와 취미","없음"],"answer":0,"explain":"자동 생성된 재무제표와 나비 온도가 함께 반영됩니다."},{"q":"기존 은행 신용평가와 다른 점은?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>","options":["서류 제출 없이 실거래 데이터 기반 평가","더 오래 걸림","평가 안 함","동일함"],"answer":0,"explain":"실제 쌓인 거래 데이터를 근거로 자동 평가한다는 게 특징입니다."},{"q":"신용 등급은 다음 장의 무엇에 영향을 주나요?","icon":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/></svg>","options":["채권 이자율","나비 온도의 시작값","가입 절차","없음"],"answer":0,"explain":"신용 등급이 22장에서 다루는 채권 이자율 결정에 영향을 줍니다."}],"placeholder":false},{"tier":"advanced","title":"나비 온도와 신용 점수의 관계","id":"ch_temp_credit","body":"<div class=\"ch-hero\"><svg viewBox=\"0 0 240 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:240px;display:block;margin:0 auto\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"#fef7e0\"/><g transform=\"translate(42,42)\" stroke=\"#b06000\" stroke-width=\"1.8\" fill=\"none\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></g><circle cx=\"180\" cy=\"60\" r=\"50\" fill=\"#eaf3fc\"/><g transform=\"translate(162,42)\" stroke=\"#0c6cc3\" stroke-width=\"1.8\" fill=\"none\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></g></svg></div><h2>나비 온도와 신용 점수의 관계</h2><p>10장에서 다룬 나비 온도(36.5도에서 시작하는 거래 신뢰 지표)와, 21장에서 다룬 신용 평가는 서로 다른 지표지만 실제로는 함께 맞물려 움직입니다.</p><div class=\"md-container tonal-primary\"><div class=\"mc-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"mc-body\"><div class=\"mc-title\">온도는 \"사람들이 겪은 신뢰\", 재무제표는 \"숫자로 본 안정성\"</div>온도는 실제로 거래해본 다른 사용자들의 평가가 쌓인 결과이고, 재무제표는 매출·매입 같은 객관적 숫자입니다. 신용 평가는 이 둘을 함께 봐서, 숫자만으로는 안 보이는 \"이 판매자를 실제로 믿을 만한가\"까지 반영합니다.</div></div><h3>온도가 신용에 반영되는 흐름</h3><div class=\"step-list\"><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">① 거래·리뷰로 온도 변화</div><div class=\"step-desc\">20장의 나비마켓에서 거래하고 리뷰를 주고받을 때마다 온도가 오르내립니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/></svg></div><div class=\"step-body\"><div class=\"step-title\">② 재무제표와 함께 종합</div><div class=\"step-desc\">21장에서 다뤘듯, 이 온도가 재무제표 분석 결과와 함께 신용 등급 산정에 들어갑니다.</div></div></div><div class=\"step-row\"><div class=\"step-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-line
