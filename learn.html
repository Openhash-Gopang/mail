<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나비웹 학습</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--pri:#1A73E8;--pri-bg:#E8F0FE;--on:#202124;--on2:#5F6368;--line:#DADCE0;--bg:#fff;--card:#fff;--soft:#F8F9FA;--m:#188038;--p:#1A73E8;--l:#F9AB00;--n:#DADCE0;--warn-bg:#FEF7E0;--warn:#B06000}
@media (prefers-color-scheme:dark){:root{--pri:#8AB4F8;--pri-bg:#1F2D45;--on:#E8EAED;--on2:#9AA0A6;--line:#3C4043;--bg:#202124;--card:#292A2D;--soft:#2B2C2F;--m:#81C995;--p:#8AB4F8;--l:#FDD663;--n:#3C4043;--warn-bg:#3B3320;--warn:#FDD663}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',Roboto,-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--on);font-size:15px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:28px 24px 64px}
button{font:inherit;color:inherit;cursor:pointer}
.crumb{font-size:13px;color:var(--on2)}
.crumb a,.crumb button{color:var(--pri);background:none;border:0;padding:0;text-decoration:none}
h1{font-size:28px;line-height:1.3;font-weight:700;letter-spacing:-.01em;margin-top:8px}
.lead{margin-top:10px;color:var(--on2);font-size:16px;max-width:760px}
h2{font-size:18px;font-weight:600;margin:32px 0 6px}
.sub{font-size:13px;color:var(--on2)}
.tabs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-size:14px}
.tab[aria-selected=true]{background:var(--pri-bg);border-color:var(--pri);color:var(--pri);font-weight:600}
.grid{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:10px}
.badge{display:inline-block;font-size:12px;font-weight:600;color:var(--on2);background:var(--soft);border-radius:999px;padding:3px 10px}
.ct{font-size:18px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--on2);margin-top:14px;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.bar{display:flex;gap:2px}
.bar i{flex:1;min-width:3px;height:10px;border-radius:2px;background:var(--n)}
.bar i.M{background:var(--m)}.bar i.P{background:var(--p)}.bar i.L{background:var(--l)}
.btn{border:1px solid var(--pri);color:var(--pri);background:transparent;border-radius:8px;padding:8px 16px;font-weight:600;font-size:14px}
.btn.fill{background:var(--pri);color:#fff}
.btn.fill:hover{opacity:.92}
.btn.quiet{border-color:var(--line);color:var(--on)}
.add{border:2px dashed var(--line);background:var(--soft);align-items:center;justify-content:center;text-align:center;min-height:220px;color:var(--pri);font-size:16px;font-weight:600}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
.gate{font-size:13px;color:var(--on2)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.wk{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);font-size:13px}
.wk b{display:block;font-size:14px}
.wk .st{display:inline-block;margin-top:4px;font-size:12px;font-weight:600}
.wk.M{border-color:var(--m)}.wk.P{border-color:var(--p)}.wk.L{border-color:var(--l);background:var(--warn-bg)}
.wk.N{opacity:.75}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.yr{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
.yr>button{all:unset;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;width:100%;box-sizing:border-box;padding:18px 20px}
.yr .y{font-size:24px;font-weight:700;min-width:70px}
.yr .body{padding:0 20px 8px;border-top:1px solid var(--line)}
.pb{flex:0 0 110px;display:flex;align-items:center;gap:6px;font-size:13px}
.pb span.t{flex:1;height:8px;border-radius:4px;background:var(--n);display:block}
.pb span.t em{display:block;height:8px;border-radius:4px;background:var(--m)}
.mrow{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:14px}
.mrow .nm{flex:0 0 56px;font-weight:600}
.mrow .tr{flex:1;height:12px;border-radius:6px;background:var(--n);overflow:hidden}
.mrow .tr em{display:block;height:12px;background:var(--m)}
.mrow .v{flex:0 0 120px;text-align:right;color:var(--on2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
.ov[hidden]{display:none}
.dlg{background:var(--card);border-radius:20px;padding:24px;width:min(560px,calc(100% - 32px));max-height:90vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-size:14px}
.chip[aria-pressed=true]{background:var(--pri-bg);border-color:var(--pri);color:var(--pri);font-weight:600}
.lab{font-size:13px;font-weight:600;color:var(--on2);margin-top:16px}
textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--on);resize:vertical;min-height:64px}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--on2)}
body.embed .wrap{padding-top:16px}
@media (max-width:700px){h1{font-size:24px}.wrap{padding:20px 16px 48px}}
</style>
</head>
<body>
<script>if (/[?&]embed=mail/.test(location.search)) document.body.classList.add('embed');</script>
<div class="wrap" id="root"></div>
<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-label="과목 추가"><div class="dlg" id="dlg"></div></div>
<script>
'use strict';
// 나비웹 학습(2026-11-22) — '인프라 AI · 교육'의 학습 포털. 내 수업(과목 허브·과목 추가) · 과목 상세(주차별 마스터리) · 학습 기록(연도별).
// 지금은 예시 데이터와 이 브라우저의 저장 공간(localStorage)만 쓴다. 실제 학습 기록은 PDV 로 옮길 때 DATA 부분만 바꾼다.
// 마스터리: 주차 확인 문제를 통과하면 '통과', 며칠 뒤 다시 풀어서도 맞히면 '숙달'. 통과해야 다음 주차가 열린다(기준 80%·재확인 간격은 가칭).
var KEY = 'navi-learn-v1', GATE = 80;
var SUBJECTS = ['수학','물리','화학','생명과학','영어','국어','역사','코딩','경제학'];
var LEVELS = ['초등','중등','고등','대학','대학원'];
var ST = { M:'숙달', P:'통과', L:'연습 중', N:'시작 전' };
var EXAMPLE = [
  { id:'econ', name:'경제학 입문', subj:'경제학', level:'대학 · 교양', prof:'경제학 교수', seq:'N'.repeat(30), next:'1주차 · 희소성과 선택', example:true },
  { id:'calc', name:'미적분 기초', subj:'수학', level:'대학 · 수학', prof:'수학 교수', seq:'MMMPMMPL'+'N'.repeat(7), next:'8주차 · 미분의 응용', review:'3주차 극한 — 마지막 학습 21일 전', example:true }
];
var HIST = [ // 예시 데이터
  { y:'2026', lv:'대학 1학년', h:142, subs:[['미적분 기초','대학 · 수학','2026.09 ~ 진행 중',49,'7 / 15주',52,'ing'],['영어 독해','대학 · 영어','2026.03 ~ 2026.08',93,'12 / 12주',88,'done']] },
  { y:'2025', lv:'고등학교 3학년', h:480, subs:[['수학Ⅱ','고등 · 수학','2025.03 ~ 2025.11',210,'30 / 30주',91,'done'],['물리Ⅰ','고등 · 물리','2025.03 ~ 2025.11',150,'24 / 24주',84,'done'],['영어','고등 · 영어','2025.03 ~ 2025.11',120,'20 / 20주',86,'done']] },
  { y:'2024', lv:'고등학교 2학년', h:455, subs:[['수학Ⅰ','고등 · 수학','2024.03 ~ 2024.11',200,'28 / 28주',89,'done'],['화학Ⅰ','고등 · 화학','2024.03 ~ 2024.11',140,'22 / 22주',80,'done'],['영어','고등 · 영어','2024.03 ~ 2024.11',115,'18 / 18주',83,'done']] },
  { y:'2023', lv:'고등학교 1학년', h:210, subs:[['공통수학','고등 · 수학','2023.03 ~ 2023.11',120,'24 / 24주',85,'done'],['통합과학','고등 · 과학','2023.03 ~ 2023.11',90,'18 / 18주',79,'done']] }
];
var MAST = [['수학',79,'4개 과정'],['영어',86,'3개 과정'],['물리',84,'1개 과정'],['화학',80,'1개 과정'],['과학',79,'1개 과정']];
var WEEK_TOPICS = { econ:['희소성과 선택','수요와 공급','탄력성','소비자 이론'], calc:['극한','연속','미분 기초','미분 공식','합성함수 미분','음함수 미분','미분의 응용(1)','미분의 응용(2)','적분 맛보기'] };

var S = { view:'subjects', cur:null, open:'2026', added:[], addSubj:'수학', addLevel:'중등' };
try { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv && Array.isArray(sv.added)) S.added = sv.added.filter(function (a) { return a && typeof a.name === 'string'; }); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ added: S.added })); } catch (e) {} }
function all() { return EXAMPLE.concat(S.added); }
function find(id) { return all().filter(function (c) { return c.id === id; })[0]; }

function h(tag, attrs, kids) {
  var e = document.createElement(tag);
  for (var k in (attrs || {})) { var v = attrs[k]; if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.slice(0, 2) === 'on') e[k] = v; else if (v !== false && v != null) e.setAttribute(k, v); }
  [].concat(kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function bar(seq) { return h('div', { class:'bar', role:'img', 'aria-label':'주차별 마스터리 단계' }, seq.split('').map(function (c) { return h('i', { class:c }); })); }
function count(seq) { var n = { M:0, P:0, L:0, N:0 }; seq.split('').forEach(function (c) { n[c]++; }); return '숙달 ' + n.M + ' · 통과 ' + n.P + ' · 연습 중 ' + n.L + ' · 시작 전 ' + n.N + '주'; }
function legend() { return h('div', { class:'legend' }, [h('b', { text:'마스터리 단계' })].concat(['M','P','L','N'].map(function (k) { return h('span', {}, [h('span', { class:'sw', style:'background:var(--' + k.toLowerCase() + ')' }), ST[k]]); }))); }
function ask(text) { try { parent.postMessage({ type:'navi-learn-ask', text:text || '' }, location.origin); } catch (e) {} }
function go(v, id) { S.view = v; if (id !== undefined) S.cur = id; try { location.hash = v === 'subjects' ? '' : v; } catch (e) {} render(); try { window.scrollTo(0, 0); } catch (e) {} }

function head(crumbs, title, lead) {
  var c = h('div', { class:'crumb' }, []);
  crumbs.forEach(function (x, i) { if (i) c.appendChild(document.createTextNode(' / ')); c.appendChild(x.go ? h('button', { text:x.t, onclick:x.go }) : (x.cur ? h('b', { text:x.t }) : document.createTextNode(x.t))); });
  return [c, h('h1', { text:title }), lead ? h('p', { class:'lead', text:lead }) : null];
}
function tabs(active) {
  return h('div', { class:'tabs', role:'tablist' }, [['subjects','내 수업'],['history','학습 기록']].map(function (t) { return h('button', { class:'tab', role:'tab', 'aria-selected':String(active === t[0]), text:t[1], onclick:function () { go(t[0]); } }); }));
}

function viewSubjects() {
  var cards = all().map(function (c) {
    return h('div', { class:'card' }, [
      h('div', {}, [h('span', { class:'badge', text:c.level || '' })]),
      h('div', { class:'ct', text:c.name }),
      c.seq ? bar(c.seq) : null,
      c.seq ? h('div', { class:'sub', text:count(c.seq) }) : h('div', { class:'sub', text:'교수와 상담한 뒤 맞춤 커리큘럼이 만들어집니다.' }),
      c.next ? h('div', { class:'gate', text:'이어서 · ' + c.next }) : null,
      c.review ? h('div', { class:'note', text:'복습 권장 · ' + c.review }) : null,
      h('div', { class:'sub', text:'담당 · ' + c.prof }),
      h('button', { class:'btn', style:'margin-top:auto;align-self:flex-start', text:c.seq ? '이어서 학습 →' : '교수와 시작하기 →', onclick:function () { go('course', c.id); } })
    ]);
  });
  cards.push(h('button', { class:'card add', onclick:openAdd }, ['+ 과목 추가', h('span', { class:'sub', style:'font-weight:400', text:'수학·물리·영어 등 / 초등부터 대학원 수준까지' })]));
  return head([{ t:'인프라 AI' }, { t:'교육', cur:true }], '내 수업', '배우고 싶은 과목을 추가하고, 이어서 학습할 수업을 고르세요. 수준은 과목마다 따로 정할 수 있습니다.')
    .concat([tabs('subjects'), legend(),
      h('p', { class:'sub', style:'margin-top:6px;max-width:820px', text:'주차 확인 문제를 통과하면 \'통과\', 며칠 뒤 다시 풀어서도 맞히면 \'숙달\'이 됩니다. 통과해야 다음 주차가 열리고, 오래 지난 단원은 복습을 권해 드립니다.' }),
      h('div', { class:'grid' }, cards),
      h('div', { class:'foot', text:'경제학 입문·미적분 기초와 학습 기록은 예시 데이터입니다. 추가한 과목은 이 브라우저에만 저장됩니다.' })]);
}

function viewCourse() {
  var c = find(S.cur); if (!c) return viewSubjects();
  var kids = head([{ t:'내 수업', go:function () { go('subjects'); } }, { t:'교육' }, { t:c.name, cur:true }], c.name, c.level + ' · 담당 ' + c.prof);
  if (!c.seq) {
    kids.push(h('div', { class:'card', style:'margin-top:20px' }, [h('div', { class:'ct', text:'아직 커리큘럼이 없습니다' }), h('p', { class:'sub', text:'교수에게 지금 수준과 목표를 말하면, 학습자에게 맞춘 주차별 커리큘럼과 일정표를 만들어 줍니다.' }), h('button', { class:'btn fill', style:'align-self:flex-start', text:'교수에게 말하기', onclick:function () { ask(c.goal || (c.subj + ' 학습을 시작하고 싶어요')); } })]));
    return kids;
  }
  var i = c.seq.indexOf('L'); if (i < 0) i = c.seq.indexOf('N');
  var topics = WEEK_TOPICS[c.id] || [];
  kids.push(h('div', { class:'card', style:'margin-top:20px;background:var(--pri-bg);border-color:var(--pri)' }, [
    h('div', { class:'sub', text:'이어서 학습하기' }), h('div', { class:'ct', text:c.next || ((i + 1) + '주차') }),
    h('div', { class:'gate', text:(i + 1) + '주차 확인 문제를 ' + GATE + '% 이상 맞히면 ' + (i + 2) + '주차가 열립니다.' }),
    h('div', { style:'display:flex;gap:8px;flex-wrap:wrap' }, [h('button', { class:'btn fill', text:'학습 시작', onclick:function () { ask((i + 1) + '주차 학습을 시작할게요'); } }), h('button', { class:'btn quiet', text:'교수에게 묻기', onclick:function () { ask(''); } })])
  ]));
  if (c.review) kids.push(h('div', { class:'note', style:'margin-top:12px', text:'복습 권장 · ' + c.review }));
  kids.push(h('h2', { text:'주차별 마스터리' }), legend(), h('div', { class:'sub', style:'margin-top:6px', text:count(c.seq) }));
  var grid = h('div', { class:'weeks' });
  c.seq.split('').forEach(function (k, n) { grid.appendChild(h('div', { class:'wk ' + k }, [h('b', { text:(n + 1) + '주차' }), topics[n] || '', h('br'), h('span', { class:'st', style:'color:var(--' + k.toLowerCase() + ')', text:ST[k] })])); });
  kids.push(grid, h('div', { class:'foot', text:'주차 구성과 진도는 예시입니다. 실제 일정은 학습자에 맞춰 교수가 정합니다.' }));
  return kids;
}

function viewHistory() {
  var kids = head([{ t:'내 수업', go:function () { go('subjects'); } }, { t:'교육' }, { t:'학습 기록', cur:true }], '학습 기록', '언제, 어떤 과목을, 얼마나 학습했는지 연도별로 모았습니다. 초등부터 대학원까지 이어서 확인할 수 있습니다.');
  kids.push(tabs('history'));
  var ms = h('div', { class:'card', style:'margin-top:18px' }, [h('div', { class:'ct', text:'과목별 숙달도' }), h('div', { class:'sub', text:'여러 해에 걸쳐 학습한 같은 과목의 평균입니다. 숙달한 단원이 전체에서 차지하는 비율입니다.' })]);
  MAST.forEach(function (m) { ms.appendChild(h('div', { class:'mrow' }, [h('div', { class:'nm', text:m[0] }), h('div', { class:'tr' }, [h('em', { style:'width:' + m[1] + '%' })]), h('div', { class:'v', text:m[1] + '% · ' + m[2] })])); });
  kids.push(ms);
  var bars = h('div', { class:'card', style:'margin-top:14px' }, [h('div', { class:'ct', text:'연도별 학습 시간' })]);
  HIST.forEach(function (y) { bars.appendChild(h('div', { class:'mrow' }, [h('div', { class:'nm', text:y.y }), h('div', { class:'tr' }, [h('em', { style:'width:' + Math.round(y.h / 480 * 100) + '%;background:var(--p)' })]), h('div', { class:'v', text:y.h + '시간' })])); });
  kids.push(bars);
  HIST.forEach(function (y) {
    var open = S.open === y.y;
    var box = h('section', { class:'yr' }, [h('button', { 'aria-expanded':String(open), onclick:function () { S.open = open ? '' : y.y; render(); } }, [h('span', { class:'y', text:y.y }), h('span', { class:'badge', text:y.lv }), h('span', { class:'sub', style:'margin-left:auto', text:y.h + '시간 · ' + y.subs.length + '과목' }), h('span', { style:'color:var(--pri);font-weight:600;font-size:13px', text:open ? '접기' : '펼치기' })])]);
    if (open) box.appendChild(h('div', { class:'body' }, y.subs.map(function (s) {
      return h('div', { class:'row' }, [h('div', { style:'flex:1 1 200px;min-width:0' }, [h('b', { text:s[0] }), h('div', { class:'sub', text:s[1] + ' · ' + s[2] })]), h('div', { style:'flex:0 0 70px;font-size:14px', text:s[3] + '시간' }), h('div', { style:'flex:0 0 80px;font-size:14px', text:s[4] }), h('div', { class:'pb' }, [h('span', { class:'t' }, [h('em', { style:'width:' + s[5] + '%' })]), s[5] + '%']), h('span', { class:'badge', style:s[6] === 'ing' ? 'color:var(--pri);background:var(--pri-bg)' : '', text:s[6] === 'ing' ? '진행 중' : '완료' })]);
    })));
    kids.push(box);
  });
  kids.push(h('div', { class:'foot', text:'화면의 과목·시간·숙달도는 예시 데이터입니다. 점수는 학습 점검용 참고 지표입니다.' }));
  return kids;
}

function render() {
  var root = document.getElementById('root'); root.textContent = '';
  var kids = S.view === 'course' ? viewCourse() : S.view === 'history' ? viewHistory() : viewSubjects();
  kids.forEach(function (k) { if (k) root.appendChild(k); });
  try { parent.postMessage({ type:'navi-learn-height', h:document.documentElement.scrollHeight }, location.origin); } catch (e) {}
}

function chipRow(list, key) {
  return h('div', { class:'chips' }, list.map(function (n) { return h('button', { class:'chip', 'aria-pressed':String(S[key] === n), text:n, onclick:function () { S[key] = n; drawAdd(); } }); }));
}
function drawAdd() {
  var d = document.getElementById('dlg'); d.textContent = '';
  var goal = h('textarea', { id:'goal', placeholder:'예: 중학교 1학년 수학 일차방정식이 어려워요', maxlength:'200', 'aria-label':'지금 어려운 점이나 목표' });
  if (S.goalDraft) goal.value = S.goalDraft;
  goal.oninput = function () { S.goalDraft = goal.value; };
  [h('div', { style:'display:flex;justify-content:space-between;align-items:center' }, [h('b', { style:'font-size:20px', text:'과목 추가' }), h('button', { class:'btn quiet', 'aria-label':'닫기', text:'닫기', onclick:closeAdd })]),
   h('div', { class:'lab', text:'1. 과목' }), chipRow(SUBJECTS, 'addSubj'),
   h('div', { class:'lab', text:'2. 수준' }), chipRow(LEVELS, 'addLevel'),
   h('div', { class:'lab', text:'3. 지금 어려운 점이나 목표 (선택)' }), goal,
   h('div', { class:'note', style:'margin-top:16px;background:var(--pri-bg);color:var(--pri)', text:S.addSubj + ' 교수가 담당합니다. 고른 수준(' + S.addLevel + ')과 목표에 맞춰 커리큘럼과 일정을 만들어 드려요.' }),
   h('div', { style:'display:flex;justify-content:flex-end;gap:8px;margin-top:20px' }, [h('button', { class:'btn quiet', text:'취소', onclick:closeAdd }), h('button', { class:'btn fill', text:'과목 추가', onclick:commitAdd })])
  ].forEach(function (x) { d.appendChild(x); });
}
function openAdd() { S.goalDraft = ''; drawAdd(); document.getElementById('ov').hidden = false; }
function closeAdd() { document.getElementById('ov').hidden = true; }
function commitAdd() {
  var c = { id:'u' + Date.now(), name:S.addSubj + ' · ' + S.addLevel, subj:S.addSubj, level:S.addLevel + ' · ' + S.addSubj, prof:S.addSubj + ' 교수', seq:'', goal:(S.goalDraft || '').trim() };
  S.added.push(c); save(); closeAdd(); go('course', c.id);
  ask(c.goal || (S.addLevel + ' ' + S.addSubj + ' 학습을 시작하고 싶어요'));
}
document.getElementById('ov').addEventListener('click', function (e) { if (e.target.id === 'ov') closeAdd(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAdd(); });
window.addEventListener('message', function (e) { if (e.origin !== location.origin || !e.data) return; if (e.data.type === 'navi-learn-view' && (e.data.view === 'subjects' || e.data.view === 'history')) go(e.data.view); });
S.view = /history/.test(location.hash) ? 'history' : 'subjects';
render();
</script>
</body>
</html>
