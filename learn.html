<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나비웹 학습</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--pri:#1A73E8;--pri-bg:#E8F0FE;--on:#202124;--on2:#5F6368;--line:#DADCE0;--bg:#fff;--card:#fff;--soft:#F8F9FA;--m:#188038;--p:#1A73E8;--l:#F9AB00;--n:#DADCE0;--warn-bg:#FEF7E0;--warn:#B06000}
@media (prefers-color-scheme:dark){:root{--pri:#8AB4F8;--pri-bg:#1F2D45;--on:#E8EAED;--on2:#9AA0A6;--line:#3C4043;--bg:#202124;--card:#292A2D;--soft:#2B2C2F;--m:#81C995;--p:#8AB4F8;--l:#FDD663;--n:#3C4043;--warn-bg:#3B3320;--warn:#FDD663}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',Roboto,-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--on);font-size:15px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:28px 24px 64px}
button{font:inherit;color:inherit;cursor:pointer}
.crumb{font-size:13px;color:var(--on2)}
.crumb a,.crumb button{color:var(--pri);background:none;border:0;padding:0;text-decoration:none}
h1{font-size:28px;line-height:1.3;font-weight:700;letter-spacing:-.01em;margin-top:8px}
.lead{margin-top:10px;color:var(--on2);font-size:16px;max-width:760px}
h2{font-size:18px;font-weight:600;margin:32px 0 6px}
.sub{font-size:13px;color:var(--on2)}
.tabs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-size:14px}
.tab[aria-selected=true]{background:var(--pri-bg);border-color:var(--pri);color:var(--pri);font-weight:600}
.grid{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:10px}
.badge{display:inline-block;font-size:12px;font-weight:600;color:var(--on2);background:var(--soft);border-radius:999px;padding:3px 10px}
.ct{font-size:18px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--on2);margin-top:14px;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.bar{display:flex;gap:2px}
.bar i{flex:1;min-width:3px;height:10px;border-radius:2px;background:var(--n)}
.bar i.M{background:var(--m)}.bar i.P{background:var(--p)}.bar i.L{background:var(--l)}
.btn{border:1px solid var(--pri);color:var(--pri);background:transparent;border-radius:8px;padding:8px 16px;font-weight:600;font-size:14px}
.btn.fill{background:var(--pri);color:#fff}
.btn.fill:hover{opacity:.92}
.btn.quiet{border-color:var(--line);color:var(--on)}
.add{border:2px dashed var(--line);background:var(--soft);align-items:center;justify-content:center;text-align:center;min-height:220px;color:var(--pri);font-size:16px;font-weight:600}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
.gate{font-size:13px;color:var(--on2)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.wk{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);font-size:13px}
.wk b{display:block;font-size:14px}
.wk .st{display:inline-block;margin-top:4px;font-size:12px;font-weight:600}
.wk.M{border-color:var(--m)}.wk.P{border-color:var(--p)}.wk.L{border-color:var(--l);background:var(--warn-bg)}
.wk.N{opacity:.75}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.yr{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
.yr>button{all:unset;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;width:100%;box-sizing:border-box;padding:18px 20px}
.yr .y{font-size:24px;font-weight:700;min-width:70px}
.yr .body{padding:0 20px 8px;border-top:1px solid var(--line)}
.pb{flex:0 0 110px;display:flex;align-items:center;gap:6px;font-size:13px}
.pb span.t{flex:1;height:8px;border-radius:4px;background:var(--n);display:block}
.pb span.t em{display:block;height:8px;border-radius:4px;background:var(--m)}
.mrow{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:14px}
.mrow .nm{flex:0 0 56px;font-weight:600}
.mrow .tr{flex:1;height:12px;border-radius:6px;background:var(--n);overflow:hidden}
.mrow .tr em{display:block;height:12px;background:var(--m)}
.mrow .v{flex:0 0 120px;text-align:right;color:var(--on2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
.ov[hidden]{display:none}
.dlg{background:var(--card);border-radius:20px;padding:24px;width:min(560px,calc(100% - 32px));max-height:90vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-size:14px}
.chip[aria-pressed=true]{background:var(--pri-bg);border-color:var(--pri);color:var(--pri);font-weight:600}
.lab{font-size:13px;font-weight:600;color:var(--on2);margin-top:16px}
textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--on);resize:vertical;min-height:64px}
.q{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:12px;background:var(--card)}
.q .qt{font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px}
.opt[aria-pressed=true]{background:var(--pri-bg);border-color:var(--pri);color:var(--pri);font-weight:600}
.opt.ok{border-color:var(--m);background:var(--card);color:var(--on);font-weight:600}
.opt.no{border-color:#D93025;color:#D93025}
.ex{margin-top:8px;font-size:13px;color:var(--on2)}
button:disabled{opacity:.45;cursor:default}
.wk{text-align:left;width:100%}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--on2)}
body.embed .wrap{padding-top:16px}
@media (max-width:700px){h1{font-size:24px}.wrap{padding:20px 16px 48px}}
</style>
</head>

    1:[['희소성의 뜻으로 가장 알맞은 것은?',['자원이 무한해 모든 욕구를 채울 수 있는 상태','욕구에 비해 자원이 한정되어 선택이 필요한 상태','가격이 매우 비싼 상태','정부가 공급을 제한한 상태'],1,'희소성은 욕구에 비해 자원이 부족해 선택이 불가피한 상태입니다.'],

  calc:{

  goal.oninput = function () { S.goalDraft = goal.value; };
  [h('div', { style:'display:flex;justify-content:space-between;align-items:center' }, [h('b', { style:'font-size:20px', text:'과목 추가' }), h('button', { class:'btn quiet', 'aria-label':'닫기', text:'닫기', onclick:closeAdd })]),
   h('div', { class:'lab', text:'1. 과목' }), chipRow(SUBJECTS, 'addSubj'),
   h('div', { class:'lab', text:'2. 수준' }), chipRow(LEVELS, 'addLevel'),
   h('div', { class:'lab', text:'3. 지금 어려운 점이나 목표 (선택)' }), goal,
   h('div', { class:'note', style:'margin-top:16px;background:var(--pri-bg);color:var(--pri)', text:S.addSubj + ' 교수가 담당합니다. 고른 수준(' + S.addLevel + ')과 목표에 맞춰 커리큘럼과 일정을 만들어 드려요.' }),
   h('div', { style:'display:flex;justify-content:flex-end;gap:8px;margin-top:20px' }, [h('button', { class:'btn quiet', text:'취소', onclick:closeAdd }), h('button', { class:'btn fill', text:'과목 추가', onclick:commitAdd })])
  ].forEach(function (x) { d.appendChild(x); });
}
function openAdd() { S.goalDraft = ''; drawAdd(); document.getElementById('ov').hidden = false; }
function closeAdd() { document.getElementById('ov').hidden = true; }
function commitAdd() {
  var c = { id:'u' + Date.now(), name:S.addSubj + ' · ' + S.addLevel, subj:S.addSubj, level:S.addLevel + ' · ' + S.addSubj, prof:S.addSubj + ' 교수', seq:'', goal:(S.goalDraft || '').trim() };
  S.added.push(c); save(); closeAdd(); go('course', c.id);
  ask(c.goal || (S.addLevel + ' ' + S.addSubj + ' 학습을 시작하고 싶어요'));
}
document.getElementById('ov').addEventListener('click', function (e) { if (e.target.id === 'ov') closeAdd(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAdd(); });
function postState() {
  var cur = find(S.cur);
  var st = { view:S.view, cur:(cur && (S.view === 'course' || S.view === 'week' || S.view === 'quiz')) ? { id:cur.id, name:cur.name, week:(S.view === 'course' ? undefined : S.week) } : null,
    courses:all().map(function (c) { var q = seqOf(c); return { id:c.id, name:c.name, subj:c.subj, level:c.level, prof:c.prof, weeks:q.length, next:q ? nextIdx(q) + 1 : 0 }; }),
    reports:all().map(function (c) { var m = metricsOf(c); return { id:c.id, name:c.name, prof:c.prof, score:m.score, prog:m.prog, avg:m.avg, first:m.first, pace:m.pace, attempts:m.att, basis:m.basis, submitted:!!S.sub[c.id] }; }).filter(function (x) { return x.score != null; }),
    career:(function () { var r = careerOf(); return r.list.slice(0, 3).map(function (k) { return { name:k.n, fit:k.fit }; }); })() };
  try { parent.postMessage({ type:'navi-learn-state', state:st }, location.origin); } catch (e) {}
}
// 대화창(교육 SP)이 보낸 화면 조작 — 같은 출처의 부모 창에서 온 것만, 값은 다시 검증해서 쓴다. 결과는 navi-learn-result 로 알린다.
function reply(ok, msg) { try { parent.postMessage({ type:'navi-learn-result', ok:ok, msg:msg, view:S.view }, location.origin); } catch (e) {} }
function names() { return all().map(function (c) { return c.name; }).join(', '); }
function nav(a) {
  var d = a && typeof a['do'] === 'string' ? a['do'] : '';
  if (d === 'subjects') { go('subjects'); return reply(true, '내 수업 화면으로 이동했습니다.'); }
  if (d === 'history') { go('history'); return reply(true, '학습 기록 화면으로 이동했습니다.'); }
  if (d === 'report') { go('report'); return reply(true, '학습 보고서 화면으로 이동했습니다.'); }
  if (d === 'career') { go('career'); var cr = careerOf(); return reply(true, cr.list.length ? '진로 추천 화면으로 이동했습니다.' : '진로 추천 화면으로 이동했습니다. 제출된 보고서가 없어 먼저 학습 보고서를 제출해야 합니다.'); }
  if (d === 'submit') {
    var tg = a.subject ? [resolve(a.subject)].filter(Boolean) : all(); if (!tg.length) return reply(false, '“' + String(a.subject || '').slice(0, 20) + '” 과목을 찾지 못했습니다. 내 과목: ' + names());
    var ok = tg.filter(submitReport); go('report');
    return reply(ok.length > 0, ok.length ? ok.map(function (c) { return c.name; }).join(', ') + ' 보고서를 진로 지도 교수에게 제출했습니다.' : '제출할 보고서가 없습니다. 확인 문제를 풀어 학습 기록을 먼저 만들어 주세요.');
  }
  if (d === 'add') {
    var nm = String(a.subject || '').trim().slice(0, 12), lv = LEVELS.indexOf(a.level) >= 0 ? a.level : '';
    if (!nm) return reply(false, '추가할 과목 이름을 알려 주세요.');
    var dup = all().filter(function (c) { return c.subj === nm && (!lv || c.level.indexOf(lv) === 0); })[0];
    if (dup) { go('course', dup.id); return reply(true, '이미 있는 과목이라 ' + dup.name + ' 화면을 열었습니다.'); }
    var c = { id:'u' + Date.now(), name:nm + (lv ? ' · ' + lv : ''), subj:nm, level:(lv || '수준 미정') + ' · ' + nm, prof:nm + ' 교수', seq:'', goal:'' };
    S.added.push(c); save(); go('course', c.id); return reply(true, c.name + ' 과목을 추가했습니다. 교수와 상담해 커리큘럼을 만들 수 있습니다.');
  }
  if (d !== 'course' && d !== 'week' && d !== 'quiz') return reply(false, '지원하지 않는 요청입니다.');
  var co = resolve(a.subject);
  if (!co) return reply(false, '“' + String(a.subject || '').slice(0, 20) + '” 과목을 찾지 못했습니다. 내 과목: ' + names());
  if (d === 'course') { go('course', co.id); return reply(true, co.name + ' 과목 화면으로 이동했습니다.'); }
  var seq = seqOf(co); if (!seq) { go('course', co.id); return reply(false, co.name + '은 아직 커리큘럼이 없어 과목 화면을 열었습니다. 교수와 상담해 커리큘럼을 만들어 보세요.'); }
  var w = Number(a.week); if (!isFinite(w) || Math.floor(w) !== w || w < 1) return reply(false, '몇 주차인지 알려 주세요.');
  if (w > seq.length) { go('course', co.id); return reply(false, co.name + '은 총 ' + seq.length + '주차입니다. 과목 화면을 열었습니다.'); }
  openWeek(co, w, d);
  reply(true, co.name + ' ' + w + '주차 ' + (d === 'quiz' ? '확인 문제' : '학습') + ' 페이지로 이동했습니다.' + (d === 'quiz' && !bankOf(co, w) ? ' 이 주차의 예시 문제는 아직 없습니다.' : ''));
}
window.addEventListener('message', function (e) {
  if (e.origin !== location.origin || e.source !== parent || !e.data) return;
  if (e.data.type === 'navi-learn-view' && (e.data.view === 'subjects' || e.data.view === 'history' || e.data.view === 'report' || e.data.view === 'career')) go(e.data.view);
  else if (e.data.type === 'navi-learn-nav') nav(e.data);
});
S.view = /history/.test(location.hash) ? 'history' : /report/.test(location.hash) ? 'report' : /career/.test(location.hash) ? 'career' : 'subjects';
render();
</script>
</body>
</html>
