# 안내 영상 재생목록(YouTube) → guide-videos.json 자동 동기화 — 30분마다 확인해서 바뀌었을 때만 main 에 커밋한다.
name: guide-videos
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: guide-videos
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 재생목록 동기화
        run: node scripts/guide-videos-sync.mjs PLExMxaYxMDPE guide-videos.json
      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- guide-videos.json; then echo "변경 없음"; exit 0; fi
          git config user.name "naviweb-bot"; git config user.email "actions@users.noreply.github.com"
          git add guide-videos.json
          git commit -m "chore: 안내 영상 목록 자동 갱신"
          git pull --rebase origin main && git push origin HEAD:main
